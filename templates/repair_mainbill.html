<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repair Mainbill Tool - AREA SERVICE</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
        }
        .navbar { background: rgba(15, 23, 42, 0.95); padding: 15px 0; }
        .navbar-brand { font-weight: 800; font-size: 1.4rem; color: white !important; text-decoration: none;}
        
        .upload-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            padding: 40px;
            margin: 60px auto;
            max-width: 500px;
            text-align: center;
        }

        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            background: #f1f5f9;
            cursor: pointer;
            padding: 40px 20px;
            margin-bottom: 25px;
        }
        .drop-zone:hover { border-color: #2563eb; background: #eff6ff; }
    </style>
</head>
<body>

    <nav class="navbar shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fa-solid fa-droplet text-info me-2"></i>AREA SERVICE
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="upload-card">
            <i class="fa-solid fa-file-csv fa-3x text-primary mb-3"></i>
            <h3 class="fw-bold text-dark mb-2">Pembersih Mainbill</h3>
            <p class="text-muted small mb-4">Merapikan data agar bisa langsung masuk ke Access menggunakan pilihan pemisah Koma.</p>
            
            <div id="dropZone" class="drop-zone" onclick="document.getElementById('fileInput').click()">
                <i class="fa-solid fa-cloud-arrow-up fa-3x mb-3 text-secondary"></i>
                <h5 id="fileNameDisplay" class="fw-bold text-dark mb-1">Pilih File .TXT</h5>
                <input type="file" id="fileInput" accept=".txt" style="display:none">
            </div>

            <button onclick="processFile()" class="btn btn-primary rounded-pill btn-lg w-100 fw-bold shadow-sm">
                MULAI PERBAIKI
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.getElementById('fileInput').onchange = function() {
            if(this.files.length > 0) {
                document.getElementById('fileNameDisplay').innerHTML = `<i class="fa-solid fa-check text-success"></i> ${this.files[0].name}`;
            }
        };

        function processFile() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files[0]) {
                Swal.fire('Oops!', 'Pilih file terlebih dahulu.', 'warning');
                return;
            }

            Swal.fire({
                title: 'Sedang Memproses...',
                text: 'Mencopot tanda kutip dan merapikan kolom...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let text = e.target.result;
                    // Pecah data per baris (enter)
                    let lines = text.split(/\r?\n/);
                    
                    // Deteksi otomatis apakah file pakai koma atau titik koma
                    let delimiter = lines[0].includes(';') ? ';' : ',';
                    
                    let outputLines = [];
                    
                    // Kita periksa baris demi baris
                    for(let i = 0; i < lines.length; i++) {
                        let line = lines[i];
                        if(line.trim() === "") continue; // Lewati jika barisnya kosong
                        
                        // Pecah baris menjadi potongan-potongan kolom
                        let columns = line.split(delimiter);
                        let cleanColumns = [];
                        
                        // Kita bersihkan masing-masing kolom
                        for(let j = 0; j < columns.length; j++) {
                            let col = columns[j];
                            
                            // 1. Buang semua tanda kutip
                            col = col.replace(/"/g, "");
                            
                            // 2. Buang spasi kosong yang berlebihan di tulisan
                            col = col.trim();
                            
                            // 3. Buang akhiran .00 atau ,00 jika itu adalah angka
                            if(col.endsWith('.00')) {
                                col = col.substring(0, col.length - 3);
                            } else if(col.endsWith(',00')) {
                                col = col.substring(0, col.length - 3);
                            }
                            
                            cleanColumns.push(col);
                        }
                        
                        // Sambungkan kembali potongan tersebut hanya dengan KOMA
                        outputLines.push(cleanColumns.join(","));
                    }
                    
                    // Gabungkan semua baris menjadi satu teks utuh (dengan Enter khusus Windows)
                    let finalOutput = outputLines.join("\r\n");
                    
                    // Download sebagai file murni (Tanpa kode BOM agar Access tidak bingung)
                    const blob = new Blob([finalOutput], { type: 'text/plain' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    
                    a.href = url;
                    // Namanya akan ditambah _BERSIH agar mudah dicari
                    a.download = fileInput.files[0].name.replace('.txt', '') + "_BERSIH.txt";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);

                    Swal.fire('Selesai!', 'Silakan import file _BERSIH.txt ke Access, lalu pilih "Comma".', 'success');
                    
                } catch (err) {
                    Swal.fire('Gagal', 'Pastikan file yang dimasukkan adalah file teks dari sistem.', 'error');
                }
            };
            
            reader.readAsText(fileInput.files[0]);
        }
    </script>
</body>
</html>
