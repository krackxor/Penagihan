<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repair Mainbill Tool - AREA SERVICE</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8fafc; 
        }
        .navbar { background: rgba(15, 23, 42, 0.95); padding: 15px 0; }
        .navbar-brand { font-weight: 800; font-size: 1.4rem; color: white !important; text-decoration: none;}
        
        .upload-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            padding: 40px;
            margin: 60px auto;
            max-width: 500px;
            text-align: center;
        }

        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            background: #f1f5f9;
            cursor: pointer;
            padding: 40px 20px;
            margin-bottom: 25px;
        }
        .drop-zone:hover { border-color: #2563eb; background: #eff6ff; }
    </style>
</head>
<body>

    <nav class="navbar shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fa-solid fa-droplet text-info me-2"></i>AREA SERVICE
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="upload-card">
            <i class="fa-solid fa-file-csv fa-3x text-primary mb-3"></i>
            <h3 class="fw-bold text-dark mb-2">Pembersih Mainbill</h3>
            <p class="text-muted small mb-4">Format akan diubah menjadi mode Koma (Comma) murni persis seperti Book1.</p>
            
            <div id="dropZone" class="drop-zone" onclick="document.getElementById('fileInput').click()">
                <i class="fa-solid fa-cloud-arrow-up fa-3x mb-3 text-secondary"></i>
                <h5 id="fileNameDisplay" class="fw-bold text-dark mb-1">Pilih File .TXT</h5>
                <input type="file" id="fileInput" accept=".txt" style="display:none">
            </div>

            <button onclick="processFile()" class="btn btn-primary rounded-pill btn-lg w-100 fw-bold shadow-sm">
                MULAI PERBAIKI
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.getElementById('fileInput').onchange = function() {
            if(this.files.length > 0) {
                document.getElementById('fileNameDisplay').innerHTML = `<i class="fa-solid fa-check text-success"></i> ${this.files[0].name}`;
            }
        };

        function processFile() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files[0]) {
                Swal.fire('Oops!', 'Pilih file terlebih dahulu.', 'warning');
                return;
            }

            Swal.fire({
                title: 'Sedang Memproses...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            const reader = new FileReader();
            reader.onload = function(e) {
                let text = e.target.result;
                
                // JURUS SEDERHANA & AMPUH:
                
                // 1. Hancurkan semua tanda kutip (")
                text = text.replace(/"/g, "");

                // 2. Hapus .00 dan ,00
                text = text.replace(/\.00(?=[,;\r\n]|$)/g, "");
                text = text.replace(/,00(?=[,;\r\n]|$)/g, "");

                // 3. Paksa semua titik koma (;) menjadi koma (,)
                text = text.replace(/;/g, ",");

                // Download hasil akhirnya
                const blob = new Blob([text], { type: 'text/plain;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                
                a.href = url;
                a.download = fileInput.files[0].name.replace('.txt', '') + "_FINAL.txt";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                Swal.fire('Sukses!', 'Data sudah bersih dan menggunakan format Koma.', 'success');
            };
            
            reader.readAsText(fileInput.files[0]);
        }
    </script>
</body>
</html>
