<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repair Mainbill Tool - AREA SERVICE</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; }
        .navbar { background: rgba(15, 23, 42, 0.95); padding: 15px 0; }
        .navbar-brand { font-weight: 800; font-size: 1.4rem; color: white !important; text-decoration: none;}
        
        .upload-card {
            background: white; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            padding: 40px; margin: 60px auto; max-width: 550px; text-align: center;
        }

        .drop-zone {
            border: 2px dashed #cbd5e1; border-radius: 12px; background: #f1f5f9;
            cursor: pointer; padding: 40px 20px; margin-bottom: 25px; transition: 0.3s;
        }
        .drop-zone:hover { border-color: #2563eb; background: #eff6ff; }
    </style>
</head>
<body>

    <nav class="navbar shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fa-solid fa-droplet text-info me-2"></i>AREA SERVICE</a>
        </div>
    </nav>

    <div class="container">
        <div class="upload-card">
            <i class="fa-solid fa-database fa-3x text-primary mb-3"></i>
            <h3 class="fw-bold text-dark mb-2">Pembersih Mainbill PRO</h3>
            <p class="text-muted small mb-4">Menggunakan <b>PapaParse Engine</b>. Membaca data per-sel untuk menjamin kolom tidak meleset/kosong saat masuk ke MS Access (Mode Koma).</p>
            
            <div id="dropZone" class="drop-zone" onclick="document.getElementById('fileInput').click()">
                <i class="fa-solid fa-cloud-arrow-up fa-3x mb-3 text-secondary"></i>
                <h5 id="fileNameDisplay" class="fw-bold text-dark mb-1">Pilih File .TXT</h5>
                <input type="file" id="fileInput" accept=".txt" style="display:none">
            </div>

            <button onclick="processFile()" class="btn btn-primary rounded-pill btn-lg w-100 fw-bold shadow-sm">
                MULAI PERBAIKI
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <script>
        document.getElementById('fileInput').onchange = function() {
            if(this.files.length > 0) {
                document.getElementById('fileNameDisplay').innerHTML = `<i class="fa-solid fa-check text-success"></i> ${this.files[0].name}`;
            }
        };

        function processFile() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files[0]) {
                Swal.fire('Oops!', 'Pilih file terlebih dahulu.', 'warning');
                return;
            }

            Swal.fire({
                title: 'Sedang Memproses...',
                text: 'Menata ulang sel dan menghapus .00 secara presisi...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            // MESIN PAPAPARSE BEKERJA DI SINI
            Papa.parse(fileInput.files[0], {
                skipEmptyLines: true, // Otomatis buang baris kosong
                complete: function(results) {
                    let data = results.data;
                    
                    // 1. Loop per Baris
                    for (let i = 0; i < data.length; i++) {
                        
                        // 2. Loop per Kolom dalam baris tersebut
                        for (let j = 0; j < data[i].length; j++) {
                            if (typeof data[i][j] === 'string') {
                                let val = data[i][j].trim(); // Bersihkan spasi sisa
                                
                                // Hapus nilai .00 atau ,00 yang ada di akhir angka saja
                                val = val.replace(/\.00$/, "");
                                val = val.replace(/,00$/, "");
                                
                                data[i][j] = val; // Masukkan kembali ke kotaknya
                            }
                        }
                    }

                    // 3. Susun ulang semua kotak menjadi format KOMA (,) yang lurus murni
                    let finalCSV = Papa.unparse(data, {
                        quotes: false, // Hilangkan semua tanda kutip agar telanjang seperti Book1
                        delimiter: ",", // Gunakan Koma
                        newline: "\r\n"
                    });

                    // 4. Download file teksnya
                    const blob = new Blob([finalCSV], { type: 'text/plain;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    
                    a.href = url;
                    a.download = fileInput.files[0].name.replace(/\.[^/.]+$/, "") + "_CLEAN.txt";
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);

                    Swal.fire({
                        icon: 'success',
                        title: 'Sukses Besar!',
                        text: 'Kolom dijamin lurus! Silakan Import ke MS Access, pilih Delimited, lalu centang Comma.',
                        confirmButtonColor: '#0d6efd'
                    });
                },
                error: function(err) {
                    Swal.fire('Error', 'File gagal dibaca oleh sistem.', 'error');
                }
            });
        }
    </script>
</body>
</html>
