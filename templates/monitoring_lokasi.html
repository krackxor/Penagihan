{% extends "base.html" %}

{% block content %}
<div class="animate__animated animate__fadeIn">
    <div class="px-2 mb-4 d-flex justify-content-between align-items-center mt-3">
        <div>
            <h4 class="fw-bold mb-1 text-dark"><i class="fas fa-map-marked-alt me-2 text-danger"></i>Audit Lokasi Petugas</h4>
            <p class="text-muted small mb-0">Verifikasi Koordinat GPS Kunjungan Lapangan</p>
        </div>
        <div class="bg-dark text-white px-3 py-2 rounded-pill small fw-bold shadow-sm">
            <i class="fas fa-satellite me-1 text-info"></i> LIVE GPS
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-4 mx-2 bg-white">
        <div class="card-body p-3">
            <div class="row g-2">
                <div class="col-7">
                    <select id="filter-petugas" class="form-select border-0 bg-light rounded-3 shadow-none fw-bold" onchange="loadMonitoring()">
                        <option value="all">-- Semua Petugas --</option>
                        </select>
                </div>
                <div class="col-5">
                    <input type="month" id="filter-periode" class="form-control border-0 bg-light rounded-3 shadow-none fw-bold text-danger" 
                           onchange="loadMonitoring()">
                </div>
            </div>
        </div>
    </div>

    <div class="px-2">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" style="font-size: 0.75rem;">
                    <thead class="table-dark">
                        <tr>
                            <th class="py-3 ps-3">WAKTU / PETUGAS</th>
                            <th>PELANGGAN</th>
                            <th>STATUS</th>
                            <th class="text-center pe-3">LOKASI</th>
                        </tr>
                    </thead>
                    <tbody id="monitoring-content">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Set default periode ke bulan ini
        const now = new Date();
        const month = ("0" + (now.getMonth() + 1)).slice(-2);
        document.getElementById('filter-periode').value = `${now.getFullYear()}-${month}`;
        loadMonitoring();
    });

    async function loadMonitoring() {
        const petugas = document.getElementById('filter-petugas').value;
        const periodeInput = document.getElementById('filter-periode').value; // YYYY-MM
        const container = document.getElementById('monitoring-content');
        
        // Konversi YYYY-MM ke MM-YYYY untuk API
        const p = periodeInput.split('-');
        const periodeFormat = `${p[1]}-${p[0]}`;

        container.innerHTML = '<tr><td colspan="4" class="text-center py-5"><div class="spinner-border spinner-border-sm text-danger"></div></td></tr>';

        try {
            const res = await fetch(`/api/history/kunjungan?periode=${periodeFormat}`);
            const result = await res.json();
            const data = result.data;

            if (data.length === 0) {
                container.innerHTML = '<tr><td colspan="4" class="text-center py-5 text-muted">Belum ada laporan kunjungan periode ini.</td></tr>';
                return;
            }

            container.innerHTML = data.map(item => {
                // Link Google Maps
                const gmapsUrl = (item.latitude && item.latitude !== '0.0') 
                    ? `https://www.google.com/maps?q=${item.latitude},${item.longitude}` 
                    : null;

                return `
                <tr>
                    <td class="ps-3">
                        <div class="fw-bold text-dark">${item.waktu.split(' ')[1]}</div>
                        <div class="text-muted" style="font-size: 0.65rem;">${item.petugas_name}</div>
                    </td>
                    <td>
                        <div class="fw-bold text-uppercase">${item.nama}</div>
                        <div class="text-danger" style="font-size: 0.65rem;">ID: ${item.nomen}</div>
                    </td>
                    <td>
                        <span class="badge ${getStatusClass(item.keterangan)} rounded-pill" style="font-size: 0.6rem;">
                            ${item.keterangan}
                        </span>
                    </td>
                    <td class="text-center pe-3">
                        ${gmapsUrl ? 
                            `<a href="${gmapsUrl}" target="_blank" class="btn btn-sm btn-outline-primary rounded-pill px-3 fw-bold" style="font-size: 0.6rem;">
                                <i class="fas fa-map-marker-alt me-1"></i> LIHAT MAPS
                             </a>` : 
                            `<span class="text-muted small italic">No GPS Data</span>`
                        }
                    </td>
                </tr>`;
            }).join('');

        } catch (err) {
            container.innerHTML = '<tr><td colspan="4" class="text-center py-5 text-danger">Gagal memuat data monitoring.</td></tr>';
        }
    }

    function getStatusClass(status) {
        if (status === 'Sudah Bayar') return 'bg-success';
        if (status === 'Janji Bayar') return 'bg-warning text-dark';
        if (status === 'Rumah Kosong') return 'bg-info text-dark';
        return 'bg-danger';
    }
</script>

<style>
    .table thead th { border: none; letter-spacing: 0.5px; }
    .table tbody td { border-bottom: 1px solid #f8f9fa; padding: 12px 8px; }
</style>
{% endblock %}
