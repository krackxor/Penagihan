{% extends "base.html" %}

{% block content %}
<style>
    :root {
        --primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        --success-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }
    
    .table-premium thead th { 
        background: #1e293b; color: white; border: none; font-weight: 800; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px; vertical-align: middle;
    }
    .hover-row:hover { background-color: #f8fafc !important; }
    
    .btn-action { transition: all 0.3s; }
    .btn-action:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
    
    .fw-800 { font-weight: 800; }
</style>

<div class="px-2 pb-5 animate__animated animate__fadeIn">
    
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1 text-dark">
                <i class="fa-solid fa-map-location-dot me-2 text-primary"></i>Audit Geospasial
            </h4>
            <p class="text-muted small mb-0 fw-semibold">Verifikasi Integritas Lokasi Lapangan</p>
        </div>
        <div class="bg-white px-3 py-2 rounded-pill small fw-bold shadow-sm border animate__animated animate__pulse animate__infinite">
            <i class="fa-solid fa-satellite-dish me-2 text-success"></i> <span class="text-success">LIVE TELEMETRY</span>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-4 mx-2 bg-white border">
        <div class="card-body p-3">
            <div class="row g-2">
                <div class="col-7">
                    <label class="small fw-800 text-muted mb-1 text-uppercase">Personel</label>
                    <select id="filter-petugas" class="form-select border-0 bg-light rounded-3 shadow-none fw-bold text-dark" onchange="loadMonitoring()">
                        <option value="all">-- Semua Petugas --</option>
                    </select>
                </div>
                <div class="col-5">
                    <label class="small fw-800 text-muted mb-1 text-uppercase">Periode</label>
                    <input type="month" id="filter-periode" class="form-control border-0 bg-light rounded-3 shadow-none fw-bold text-primary" 
                           onchange="loadMonitoring()">
                </div>
            </div>
        </div>
    </div>

    <div class="px-2 pb-5">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden border">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 table-premium">
                    <thead class="sticky-top shadow-sm">
                        <tr>
                            <th class="py-3 ps-4 border-0">Timestamp / Pelaksana</th>
                            <th class="border-0">Entitas Pelanggan</th>
                            <th class="border-0 text-center">Klasifikasi Hasil</th>
                            <th class="text-center pe-4 border-0">Verifikasi</th>
                        </tr>
                    </thead>
                    <tbody id="monitoring-content">
                        <tr>
                            <td colspan="4" class="text-center py-5">
                                <div class="spinner-border text-primary spinner-border-sm me-2"></div>
                                <span class="fw-bold text-muted small">MENDEKRIPSI TELEMETRI...</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const now = new Date();
        const month = ("0" + (now.getMonth() + 1)).slice(-2);
        document.getElementById('filter-periode').value = `${now.getFullYear()}-${month}`;
        
        fetchPetugasList();
        loadMonitoring();
    });

    async function fetchPetugasList() {
        try {
            const res = await fetch('/api/ardebt/petugas');
            const list = await res.json();
            const select = document.getElementById('filter-petugas');
            list.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p; opt.textContent = p;
                select.appendChild(opt);
            });
        } catch (e) { }
    }

    async function loadMonitoring() {
        const petugas = document.getElementById('filter-petugas').value;
        const periodeInput = document.getElementById('filter-periode').value; 
        const container = document.getElementById('monitoring-content');
        
        const p = periodeInput.split('-');
        const periodeFormat = `${p[1]}-${p[0]}`;

        container.innerHTML = '<tr><td colspan="4" class="text-center py-5"><div class="spinner-border text-primary spinner-border-sm me-2"></div><span class="fw-bold text-muted small">MENDEKRIPSI TELEMETRI...</span></td></tr>';

        try {
            const res = await fetch(`/api/history/kunjungan?periode=${periodeFormat}`);
            const result = await res.json();
            let data = result.data;

            if (petugas !== 'all') {
                data = data.filter(i => i.petugas_name === petugas);
            }

            if (!data || data.length === 0) {
                container.innerHTML = '<tr><td colspan="4" class="text-center py-5 text-muted fw-bold italic opacity-50"><i class="fa-solid fa-satellite-dish d-block fa-3x mb-2"></i>TIDAK ADA DATA TELEMETRI.</td></tr>';
                return;
            }

            container.innerHTML = data.map(item => {
                const gmapsUrl = (item.latitude && item.latitude !== '0.0') 
                    ? `https://www.google.com/maps?q=${item.latitude},${item.longitude}` 
                    : null;
                
                const statusColor = item.latitude ? 'success' : 'danger';

                return `
                <tr class="animate__animated animate__fadeIn border-bottom hover-row">
                    <td class="ps-4 border-start border-4 border-${statusColor}">
                        <div class="fw-bold text-dark font-monospace" style="font-size: 0.75rem;">${item.waktu.split(' ')[1]} WIB</div>
                        <div class="text-muted text-uppercase fw-bold mt-1" style="font-size: 0.6rem;">
                             <i class="fa-solid fa-user-gear me-1 text-primary"></i>${item.petugas_name}
                        </div>
                    </td>
                    <td>
                        <div class="fw-bold text-uppercase text-dark small">${item.nama}</div>
                        <div class="text-primary fw-bold font-monospace" style="font-size: 0.6rem;">ID: ${item.nomen}</div>
                    </td>
                    <td class="text-center">
                        <span class="badge ${getStatusClass(item.keterangan)} rounded-pill px-3 py-1 fw-bold shadow-sm" style="font-size: 0.55rem;">
                            ${item.keterangan.toUpperCase()}
                        </span>
                    </td>
                    <td class="text-center pe-4">
                        ${gmapsUrl ? 
                            `<a href="${gmapsUrl}" target="_blank" class="btn btn-sm btn-primary rounded-pill px-3 fw-bold shadow-sm btn-action" 
                                style="font-size: 0.6rem; background: var(--primary-gradient); border:none;">
                                <i class="fa-solid fa-location-crosshairs me-1"></i> CEK POSISI
                             </a>` : 
                            `<span class="badge bg-light text-danger border border-danger fw-bold rounded-pill px-2 py-1" style="font-size: 0.55rem;">
                                <i class="fa-solid fa-signal-slash me-1"></i> LOST
                             </span>`
                        }
                    </td>
                </tr>`;
            }).join('');

        } catch (err) {
            container.innerHTML = '<tr><td colspan="4" class="text-center py-5 text-danger fw-bold">GAGAL MEMPROSES TELEMETRI.</td></tr>';
        }
    }

    function getStatusClass(status) {
        if (status === 'Sudah Bayar') return 'bg-success bg-opacity-10 text-success border border-success';
        if (status === 'Janji Bayar') return 'bg-warning bg-opacity-10 text-warning border border-warning';
        if (status === 'Rumah Kosong') return 'bg-secondary bg-opacity-10 text-secondary border border-secondary';
        return 'bg-danger bg-opacity-10 text-danger border border-danger';
    }
</script>
{% endblock %}
