{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
    /* KONTAINER UTAMA AGAR PETA MUNCUL */
    .map-wrapper {
        height: calc(100vh - 80px);
        width: 100%;
        position: relative;
        overflow: hidden;
        border-radius: 1rem;
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        border: 1px solid #e2e8f0;
    }

    #map {
        height: 100%;
        width: 100%;
        z-index: 1;
        background: #e5e7eb; /* Warna abu jika loading */
    }
    
    /* SIDEBAR LIST */
    .sidebar-list {
        background: #fff;
        height: 100%;
        overflow-y: auto;
        border-right: 1px solid #e2e8f0;
        z-index: 2;
        position: relative;
    }
    
    .customer-item {
        border-bottom: 1px solid #f1f5f9;
        cursor: pointer;
        transition: all 0.2s;
        padding: 1rem;
    }
    .customer-item:hover {
        background-color: #f0f9ff;
        border-left: 4px solid #2563eb;
    }
    
    /* PANEL EDIT SLIDE-IN */
    #editPanel {
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        transform: translateX(120%);
    }
    #editPanel.active { transform: translateX(0); }
    
    .legend-box {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(0,0,0,0.1);
    }
    
    .fw-800 { font-weight: 800; }
</style>

<div class="animate__animated animate__fadeIn p-3" style="height: 100vh;">
    <div class="row g-0 h-100 map-wrapper bg-white">
        
        <div class="col-md-3 sidebar-list d-flex flex-column shadow-sm">
            <div class="p-3 border-bottom bg-white sticky-top">
                <h6 class="fw-bold mb-3 text-dark"><i class="fa-solid fa-map-location-dot text-primary me-2"></i>GIS Area Utara</h6>
                
                <div class="input-group mb-3 shadow-sm">
                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
                    <input type="text" id="searchList" class="form-control bg-white border-start-0 shadow-none" 
                           placeholder="Cari Nama / ID..." onkeyup="filterList()">
                </div>
                
                <div class="d-flex gap-1 flex-wrap">
                    <span class="badge bg-primary flex-fill">VIP</span>
                    <span class="badge bg-danger flex-fill">Ekstrem</span>
                    <span class="badge bg-warning text-dark flex-fill">Drop</span>
                    <span class="badge bg-secondary flex-fill">Normal</span>
                </div>
            </div>
            
            <div class="flex-grow-1 overflow-auto custom-scrollbar" id="customerList">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary spinner-border-sm"></div>
                    <p class="mt-2 small text-muted fw-bold">Memuat Data...</p>
                </div>
            </div>
        </div>

        <div class="col-md-9 position-relative h-100">
            <div id="map"></div>
            
            <div class="position-absolute bottom-0 start-0 m-3 p-3 rounded-4 shadow-lg legend-box z-3" style="min-width: 180px;">
                <h6 class="fw-bold small mb-2 text-dark border-bottom pb-2">Legenda</h6>
                <ul class="list-unstyled small mb-0 fw-semibold" style="font-size: 0.7rem;">
                    <li class="mb-1"><span class="badge bg-primary p-1 rounded-circle me-2"> </span> VIP (> 75 M³)</li>
                    <li class="mb-1"><span class="badge bg-danger p-1 rounded-circle me-2"> </span> Ekstrem (Naik)</li>
                    <li class="mb-1"><span class="badge bg-warning p-1 rounded-circle me-2"> </span> Drop (Turun)</li>
                    <li><span class="badge bg-secondary p-1 rounded-circle me-2"> </span> Normal</li>
                </ul>
            </div>

            <div id="editPanel" class="position-absolute top-0 end-0 h-100 bg-white shadow-lg z-3 border-start p-4 d-flex flex-column" style="width: 340px;">
                <div class="d-flex justify-content-between align-items-start mb-4">
                    <div>
                        <h6 class="fw-bold text-dark mb-1" id="editNama">-</h6>
                        <span class="badge bg-light text-primary border font-monospace" id="editNomen">-</span>
                    </div>
                    <button onclick="cancelEdit()" class="btn btn-light rounded-circle shadow-sm btn-sm"><i class="fas fa-times"></i></button>
                </div>
                
                <div class="alert alert-info py-2 px-3 small mb-4 rounded-3 border-0 bg-info bg-opacity-10 text-info fw-bold">
                    <i class="fa-solid fa-arrows-up-down-left-right me-2"></i> Geser Pin Biru di Peta
                </div>

                <div class="flex-grow-1">
                    <label class="small fw-bold text-muted mb-2">Alamat Database</label>
                    <div class="p-3 bg-light rounded-3 border mb-3 small text-secondary fst-italic" id="editAlamat">
                        -
                    </div>
                </div>

                <div class="d-grid gap-2 mt-auto">
                    <button onclick="saveLocation()" class="btn btn-primary fw-bold py-2 rounded-pill shadow-sm">
                        <i class="fa-solid fa-floppy-disk me-2"></i> SIMPAN POSISI BARU
                    </button>
                    <button onclick="triggerAutoDetect()" class="btn btn-outline-dark fw-bold py-2 rounded-pill border-2">
                        <i class="fa-solid fa-wand-magic-sparkles me-2"></i> AUTO DETECT
                    </button>
                </div>
                <input type="hidden" id="rawAddressHidden">
            </div>
        </div>
    </div>
</div>

<script>
    let map, markers = [];
    let currentEditNomen = null;
    let editMarker = null; 
    let allCustomers = [];
    const formatIDR = (n) => new Intl.NumberFormat('id-ID').format(n);

    // Custom Icons Generator
    const createIcon = (color) => L.divIcon({
        className: 'custom-div-icon', 
        html: `<div style='background-color:${color};width:16px;height:16px;border-radius:50%;border:3px solid white;box-shadow:0 3px 6px rgba(0,0,0,0.4)'></div>`, 
        iconSize: [16, 16],
        iconAnchor: [8, 8]
    });

    const icons = {
        'NOMEN_VIP': createIcon('#2563eb'),   
        'EKSTREM': createIcon('#dc3545'),     
        'DROP': createIcon('#ffc107'),        
        'NORMAL': createIcon('#64748b'),      
        'EDIT': L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34]
        })
    };

    document.addEventListener('DOMContentLoaded', () => {
        initMap();
        loadData();
    });

    function initMap() {
        // 1. SET KOORDINAT JAKARTA UTARA (Koja/Tanjung Priok)
        // Koordinat: -6.121435, 106.90
        map = L.map('map', {zoomControl: false}).setView([-6.121435, 106.90], 13);
        
        // Layer Peta OSM Standar
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 19
        }).addTo(map);
        
        L.control.zoom({position: 'bottomright'}).addTo(map);
        
        // Refresh peta agar tidak abu-abu
        setTimeout(() => { map.invalidateSize(); }, 500);
    }

    async function loadData() {
        try {
            const res = await fetch('/api/map/data');
            const json = await res.json();
            
            if(json.status === 'success') {
                allCustomers = json.data;
                renderList(allCustomers);
                renderMarkers(allCustomers);
            }
        } catch(e) { console.error("Gagal load data:", e); }
    }

    function renderList(data) {
        const container = document.getElementById('customerList');
        // Render max 300 item agar browser tidak berat
        const displayData = data.length > 300 ? data.slice(0, 300) : data;

        if(displayData.length === 0) {
            container.innerHTML = '<div class="text-center py-5 small text-muted">Data tidak ditemukan.</div>';
            return;
        }

        container.innerHTML = displayData.map(c => {
            // Cek apakah punya koordinat valid (bukan 0, bukan null)
            const hasLoc = c.latitude && parseFloat(c.latitude) !== 0;
            
            let badgeClass = 'bg-secondary';
            let label = 'Normal';
            
            if(c.kategori === 'NOMEN_VIP') { badgeClass = 'bg-primary'; label = 'VIP'; }
            else if(c.kategori === 'EKSTREM') { badgeClass = 'bg-danger'; label = 'EKSTREM'; }
            else if(c.kategori === 'DROP') { badgeClass = 'bg-warning text-dark'; label = 'DROP'; }

            // Tombol Aksi: Jika punya lokasi -> Icon Target, Jika tidak -> Icon Plus (Tambah)
            const actionBtn = hasLoc 
                ? `<button class="btn btn-sm btn-light text-primary border rounded-circle shadow-sm" onclick="focusOnMap('${c.nomen}', event)"><i class="fa-solid fa-crosshairs"></i></button>`
                : `<button class="btn btn-sm btn-light text-secondary border rounded-circle shadow-sm" onclick="startTagging('${c.nomen}', event)"><i class="fa-solid fa-plus"></i></button>`;

            return `
                <div class="customer-item d-flex justify-content-between align-items-center" onclick="itemClick('${c.nomen}', ${hasLoc})">
                    <div class="flex-grow-1">
                        <div class="d-flex align-items-center mb-1">
                            <span class="badge ${badgeClass} rounded-pill me-2" style="font-size:0.5rem;">${label}</span>
                            <h6 class="fw-bold mb-0 text-truncate text-dark small" style="max-width: 140px;">${c.nama}</h6>
                        </div>
                        <div class="text-muted small text-truncate" style="font-size: 0.7rem; max-width: 180px;">
                            ${c.alamat || 'Alamat tidak tersedia'}
                        </div>
                    </div>
                    <div class="ms-2">${actionBtn}</div>
                </div>
            `;
        }).join('');
    }

    function renderMarkers(data) {
        // Hapus marker lama
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        
        data.forEach(c => {
            // 2. VALIDASI KOORDINAT: Hanya render jika Lat/Lng tidak 0 dan tidak null
            if(c.latitude && c.longitude && parseFloat(c.latitude) !== 0) {
                let icon = icons[c.kategori] || icons['NORMAL'];
                
                const m = L.marker([parseFloat(c.latitude), parseFloat(c.longitude)], {icon: icon})
                    .bindPopup(`
                        <div class='text-center p-2'>
                            <h6 class='fw-bold text-dark mb-1'>${c.nama}</h6>
                            <span class='badge bg-light text-dark border mb-2'>${c.kategori}</span>
                            <p class='small text-muted mb-1'>${c.alamat}</p>
                            <button onclick="startTagging('${c.nomen}')" class="btn btn-sm btn-outline-primary w-100 mt-2">Edit Lokasi</button>
                        </div>
                    `)
                    .addTo(map);
                markers.push(m);
            }
        });
    }

    // --- FUNGSI INTERAKSI ---
    
    // Klik Item di List
    function itemClick(nomen, hasLoc) {
        if(hasLoc) {
            focusOnMap(nomen);
        } else {
            startTagging(nomen);
        }
    }

    // 3. FUNGSI FOCUS ON MAP (AUTO ZOOM KE RUMAH)
    function focusOnMap(nomen, event) {
        if(event) event.stopPropagation(); // Mencegah klik ganda
        
        const c = allCustomers.find(x => x.nomen === nomen);
        
        if(c && c.latitude && parseFloat(c.latitude) !== 0) {
            // Terbang ke lokasi
            map.flyTo([parseFloat(c.latitude), parseFloat(c.longitude)], 18);
            
            // Buka Popup marker yang sesuai
            // Cari marker terdekat (opsional, untuk UX lebih baik)
        } else {
            Swal.fire({
                icon: 'info',
                title: 'Lokasi Belum Ada',
                text: 'Silakan tandai lokasi pelanggan ini secara manual.',
                confirmButtonText: 'Tandai Sekarang'
            }).then((result) => {
                if (result.isConfirmed) startTagging(nomen);
            });
        }
    }

    // --- FITUR EDIT ---
    function startTagging(nomen, event) {
        if(event) event.stopPropagation();
        
        const c = allCustomers.find(x => x.nomen === nomen);
        if(!c) return;
        currentEditNomen = nomen;
        
        document.getElementById('editNama').innerText = c.nama;
        document.getElementById('editNomen').innerText = nomen;
        document.getElementById('editAlamat').innerText = c.alamat;
        document.getElementById('rawAddressHidden').value = c.alamat;
        
        document.getElementById('editPanel').classList.add('active'); // Slide In
        
        // Ambil koordinat jika ada, jika tidak ambil tengah peta
        let lat = (c.latitude && parseFloat(c.latitude) !== 0) ? parseFloat(c.latitude) : map.getCenter().lat;
        let lng = (c.longitude && parseFloat(c.longitude) !== 0) ? parseFloat(c.longitude) : map.getCenter().lng;
        
        if(editMarker) map.removeLayer(editMarker);
        editMarker = L.marker([lat, lng], {draggable: true, icon: icons['EDIT']}).addTo(map);
        
        map.flyTo([lat, lng], 17);
        
        editMarker.on('dragend', function(event){
            var marker = event.target;
            var position = marker.getLatLng();
            map.panTo(new L.LatLng(position.lat, position.lng));
        });
    }

    function cancelEdit() {
        if(editMarker) map.removeLayer(editMarker);
        document.getElementById('editPanel').classList.remove('active'); // Slide Out
        currentEditNomen = null;
    }

    async function saveLocation() {
        if(!editMarker || !currentEditNomen) return;
        const { lat, lng } = editMarker.getLatLng();
        
        const fd = new FormData(); 
        fd.append('nomen', currentEditNomen); 
        fd.append('lat', lat); 
        fd.append('lng', lng);
        
        try {
            await fetch('/api/map/save-point', {method:'POST', body:fd});
            Swal.fire({icon:'success', title:'Lokasi Tersimpan', toast:true, position:'top-end', timer:2000, showConfirmButton:false});
            loadData(); 
            cancelEdit();
        } catch(e) {
            Swal.fire('Gagal', 'Gagal menyimpan lokasi', 'error');
        }
    }

    async function triggerAutoDetect() {
        let address = document.getElementById('rawAddressHidden').value;
        let cleanAddress = address.replace(/NO\.?\s?\d+/gi, '').replace(/RT.*?RW.*?/gi, '').replace(/BLOK.*?/gi, '').trim();
        const query = `${cleanAddress}, Jakarta Utara, Indonesia`; // Force Jakarta Utara
        
        Swal.fire({ title: 'Mencari...', didOpen: () => Swal.showLoading() });

        try {
            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
            const res = await fetch(url);
            const data = await res.json();

            if (data && data.length > 0) {
                let lat = parseFloat(data[0].lat);
                let lon = parseFloat(data[0].lon);
                
                if(editMarker) editMarker.setLatLng([lat, lon]);
                map.flyTo([lat, lon], 18);
                
                Swal.fire({ icon: 'success', title: 'Ketemu!', timer: 800, showConfirmButton: false });
            } else {
                Swal.fire({ icon: 'warning', title: 'Tidak Ditemukan', text: 'Alamat kurang spesifik. Geser pin manual.' });
            }
        } catch (e) { Swal.fire('Error', 'Gagal koneksi peta.', 'error'); }
    }

    function filterList() {
        const term = document.getElementById('searchList').value.toLowerCase();
        renderList(allCustomers.filter(c => c.nama.toLowerCase().includes(term) || c.nomen.includes(term)));
    }
</script>
{% endblock %}
