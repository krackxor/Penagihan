{% extends "base.html" %}

{% block content %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<div class="animate__animated animate__fadeIn">
    <div class="px-3 pt-4 mb-4 d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
            <h4 class="fw-bold mb-1 text-dark">
                <i class="fa-solid fa-crown me-2 text-warning"></i>Analisa Top 500 Belum Bayar
            </h4>
            <p class="text-muted small mb-0 fw-semibold">
                Periode Data: <span id="label-periode" class="text-primary fw-800">Memuat...</span>
            </p>
        </div>
        <div class="d-flex align-items-center gap-2">
            <input type="month" id="filter-periode" class="form-control form-control-sm border-0 shadow-sm fw-bold text-primary" 
                   style="width: 150px; cursor: pointer;" onchange="loadTop500()">
            
            <button class="btn btn-sm btn-white border shadow-sm rounded-circle p-2" onclick="loadTop500()" title="Refresh Data">
                <i class="fa-solid fa-sync text-primary" id="refresh-icon"></i>
            </button>

            <button class="btn btn-sm btn-success border shadow-sm rounded-circle p-2 ms-1" onclick="downloadExcel()" title="Export ke Excel">
                <i class="fa-solid fa-file-excel"></i>
            </button>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mx-3 mb-5 bg-white border">
        <div class="card-body p-0">
            
            <div class="p-3 border-bottom bg-light d-flex justify-content-between align-items-center rounded-top-4 flex-wrap gap-3">
                
                <ul class="nav nav-pills nav-sm" id="pills-tab" role="tablist">
                    <li class="nav-item me-2" role="presentation">
                        <button class="nav-link active rounded-pill px-4 fw-bold small shadow-sm" id="pills-34-tab" data-bs-toggle="pill" data-bs-target="#pills-34" type="button" role="tab">
                            <i class="fa-solid fa-building me-2"></i>RAYON 34 
                            <span class="badge bg-white text-primary ms-1" id="count-34">0</span>
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link rounded-pill px-4 fw-bold small shadow-sm" id="pills-35-tab" data-bs-toggle="pill" data-bs-target="#pills-35" type="button" role="tab">
                            <i class="fa-solid fa-city me-2"></i>RAYON 35 
                            <span class="badge bg-white text-info ms-1" id="count-35">0</span>
                        </button>
                    </li>
                </ul>

                <div class="input-group" style="width: 250px;">
                    <span class="input-group-text border-0 bg-white ps-3"><i class="fa-solid fa-search text-muted"></i></span>
                    <input type="text" id="searchBox" class="form-control border-0 shadow-none small fw-bold" placeholder="Cari IDPEL / Nama..." onkeyup="filterTable()">
                </div>
            </div>

            <div class="tab-content" id="pills-tabContent">
                
                <div class="tab-pane fade show active" id="pills-34" role="tabpanel">
                    <div class="table-responsive" style="max-height: 65vh;">
                        <table class="table table-hover align-middle mb-0" style="font-size: 0.75rem;">
                            <thead class="bg-primary text-white sticky-top" style="z-index: 1;">
                                <tr class="text-uppercase fw-800">
                                    <th class="ps-4 py-3" style="width: 50px;">#</th>
                                    <th style="width: 120px;">Zona & Petugas</th>
                                    <th>Identitas Pelanggan</th>
                                    <th class="text-end">Tagihan (IDR)</th>
                                    <th style="width: 30%;">Analisa Admin</th>
                                    <th class="text-center pe-4" style="width: 80px;">Input</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-34">
                                <tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="tab-pane fade" id="pills-35" role="tabpanel">
                    <div class="table-responsive" style="max-height: 65vh;">
                        <table class="table table-hover align-middle mb-0" style="font-size: 0.75rem;">
                            <thead class="bg-info text-white sticky-top" style="z-index: 1;">
                                <tr class="text-uppercase fw-800">
                                    <th class="ps-4 py-3" style="width: 50px;">#</th>
                                    <th style="width: 120px;">Zona & Petugas</th>
                                    <th>Identitas Pelanggan</th>
                                    <th class="text-end">Tagihan (IDR)</th>
                                    <th style="width: 30%;">Analisa Admin</th>
                                    <th class="text-center pe-4" style="width: 80px;">Input</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-35">
                                <tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-info"></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalAnalisa" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header border-0 bg-light">
                <h6 class="modal-title fw-800"><i class="fa-solid fa-pen-nib me-2 text-primary"></i>Input Analisa</h6>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <input type="hidden" id="modal-nomen">
                <div class="mb-3 text-center p-3 bg-light rounded-3 border border-dashed">
                    <h5 class="fw-bold mb-1 text-dark" id="modal-nama">-</h5>
                    <div class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25" id="modal-sub">-</div>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">Hasil Analisa / Keterangan</label>
                    <textarea id="modal-keterangan" class="form-control rounded-3 shadow-none fw-semibold border-2" rows="4" placeholder="Contoh: Rumah kosong, Janji bayar tgl 20, Sudah lunas via Tokopedia..."></textarea>
                </div>
                <button onclick="saveAnalisa()" class="btn btn-primary w-100 rounded-pill fw-800 py-2 shadow-sm transition-btn">
                    SIMPAN DATA
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let modalInstance; 
    let allData34 = [];
    let allData35 = [];
    const formatIDR = (n) => new Intl.NumberFormat('id-ID').format(n);

    document.addEventListener('DOMContentLoaded', () => {
        const modalEl = document.getElementById('modalAnalisa');
        if (modalEl) {
            if (typeof bootstrap !== 'undefined') {
                modalInstance = new bootstrap.Modal(modalEl);
            }
        }
        loadTop500();
    });

    async function loadTop500() {
        const icon = document.getElementById('refresh-icon');
        const picker = document.getElementById('filter-periode').value;
        icon.classList.add('fa-spin');
        
        try {
            let url = '/api/analisa/top500';
            if (picker) {
                url += `?periode=${picker}`;
            }

            const res = await fetch(url);
            const result = await res.json();
            
            if(result.status === 'success') {
                allData34 = result.data_34; 
                allData35 = result.data_35;

                document.getElementById('label-periode').innerText = result.periode;
                document.getElementById('count-34').innerText = allData34.length;
                document.getElementById('count-35').innerText = allData35.length;

                renderTable('tbody-34', allData34);
                renderTable('tbody-35', allData35);
            } else {
                Swal.fire('Akses Ditolak', result.message, 'error');
            }
        } catch(e) {
            console.error(e);
            const errHTML = `<tr><td colspan="6" class="text-center text-danger py-4 fw-bold">Gagal memuat data. Periksa koneksi server.</td></tr>`;
            document.getElementById('tbody-34').innerHTML = errHTML;
            document.getElementById('tbody-35').innerHTML = errHTML;
        } finally {
            setTimeout(() => icon.classList.remove('fa-spin'), 600);
        }
    }

    // ✅ 3. FUNGSI DOWNLOAD EXCEL
    function downloadExcel() {
        if (allData34.length === 0 && allData35.length === 0) {
            Swal.fire('Data Kosong', 'Tidak ada data untuk diekspor', 'info');
            return;
        }

        // Helper untuk memformat data agar rapi di Excel
        const formatData = (data) => data.map((item, index) => ({
            "No": index + 1,
            "ID Pelanggan": item.nomen,
            "Nama Pelanggan": item.nama,
            "Alamat": item.alamat,
            "Rayon": item.rayon,
            "Zona (PCEZ)": item.pcez,
            "Petugas Rute": item.petugas_rute,
            "Tagihan (Rp)": item.nominal,
            "Kubikasi": item.kubik,
            "Hasil Analisa": item.analisa,
            "Auditor": item.auditor
        }));

        // Buat Workbook Baru
        const wb = XLSX.utils.book_new();

        // Buat Sheet Rayon 34 (Jika ada datanya)
        if (allData34.length > 0) {
            const ws34 = XLSX.utils.json_to_sheet(formatData(allData34));
            XLSX.utils.book_append_sheet(wb, ws34, "Rayon 34");
        }

        // Buat Sheet Rayon 35 (Jika ada datanya)
        if (allData35.length > 0) {
            const ws35 = XLSX.utils.json_to_sheet(formatData(allData35));
            XLSX.utils.book_append_sheet(wb, ws35, "Rayon 35");
        }

        // Tentukan Nama File
        const periode = document.getElementById('label-periode').innerText || 'Data';
        const fileName = `Analisa_Pareto_${periode}.xlsx`;

        // Download
        XLSX.writeFile(wb, fileName);
    }

    function renderTable(tbodyId, data) {
        const tbody = document.getElementById(tbodyId);
        if(data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-5 text-muted fw-bold">Data Top 500 Kosong / Lunas Semua! 🎉</td></tr>`;
            return;
        }

        tbody.innerHTML = data.map((item, index) => {
            const hasAnalisa = item.analisa !== '-';
            const rowBg = hasAnalisa ? 'bg-success bg-opacity-10' : '';
            
            const analisaDisplay = hasAnalisa 
                ? `<div class="d-flex flex-column">
                     <span class="fw-bold text-dark" style="font-size: 0.7rem;">${item.analisa}</span>
                     <span class="text-muted fst-italic mt-1" style="font-size: 0.6rem;"><i class="fa-solid fa-user-check me-1"></i>${item.auditor}</span>
                   </div>` 
                : `<span class="badge bg-secondary bg-opacity-10 text-muted border border-secondary border-opacity-25" style="font-size: 0.6rem;">BELUM ADA CEK</span>`;

            return `
                <tr class="${rowBg} transition-row">
                    <td class="ps-4 fw-800 text-muted text-center">${index + 1}</td>
                    <td>
                        <span class="badge bg-white text-dark border px-2 fw-800">${item.pcez}</span>
                        <div class="small text-primary mt-1 fw-bold text-truncate" style="font-size: 0.65rem; max-width: 100px;">
                            ${item.petugas_rute}
                        </div>
                    </td>
                    <td>
                        <div class="fw-800 text-dark" style="font-size: 0.75rem;">${item.nama}</div>
                        <div class="small text-muted font-monospace">${item.nomen}</div>
                        <div class="small text-muted opacity-75 text-truncate" style="max-width: 200px; font-size: 0.65rem;">${item.alamat}</div>
                    </td>
                    <td class="text-end fw-800 text-danger" style="font-size: 0.85rem;">
                        Rp ${formatIDR(item.nominal)}
                    </td>
                    <td class="align-middle border-start border-end bg-white bg-opacity-50">
                        ${analisaDisplay}
                    </td>
                    <td class="text-center pe-4">
                        <button class="btn btn-sm btn-white border shadow-sm rounded-circle p-2 hover-scale" 
                                onclick="openModal('${item.nomen}', '${item.nama.replace(/'/g, "\\'")}', '${formatIDR(item.nominal)}', '${item.analisa.replace(/'/g, "\\'")}')">
                            <i class="fa-solid fa-pen-to-square text-primary"></i>
                        </button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function filterTable() {
        const term = document.getElementById('searchBox').value.toLowerCase();
        
        const filtered34 = allData34.filter(d => 
            d.nama.toLowerCase().includes(term) || d.nomen.includes(term) || d.alamat.toLowerCase().includes(term)
        );
        renderTable('tbody-34', filtered34);

        const filtered35 = allData35.filter(d => 
            d.nama.toLowerCase().includes(term) || d.nomen.includes(term) || d.alamat.toLowerCase().includes(term)
        );
        renderTable('tbody-35', filtered35);
    }

    // Modal Logic
    function openModal(nomen, nama, nominal, ket) {
        document.getElementById('modal-nomen').value = nomen;
        document.getElementById('modal-nama').innerText = nama;
        document.getElementById('modal-sub').innerText = `${nomen} • Rp ${nominal}`;
        document.getElementById('modal-keterangan').value = ket === '-' ? '' : ket;
        
        if (modalInstance) {
            modalInstance.show();
        } else {
            alert("Sistem belum siap sepenuhnya, coba refresh halaman.");
        }
    }

    async function saveAnalisa() {
        const nomen = document.getElementById('modal-nomen').value;
        const ket = document.getElementById('modal-keterangan').value;
        
        if(!ket.trim()) { 
            Swal.fire({ icon: 'warning', title: 'Data Kosong', text: 'Keterangan analisa wajib diisi.' }); 
            return; 
        }

        const formData = new FormData();
        formData.append('nomen', nomen);
        formData.append('keterangan', ket);

        try {
            const res = await fetch('/api/analisa/update', { method: 'POST', body: formData });
            const result = await res.json();
            
            if(result.status === 'success') {
                Swal.fire({ icon: 'success', title: 'Berhasil Disimpan', timer: 800, showConfirmButton: false });
                if(modalInstance) modalInstance.hide();
                loadTop500(); 
            } else {
                Swal.fire('Gagal', result.message, 'error');
            }
        } catch(e) {
            Swal.fire('Error', 'Gagal terhubung ke server', 'error');
        }
    }
</script>

<style>
    .fw-800 { font-weight: 800; }
    .table td { vertical-align: middle; border-color: #f1f5f9; transition: background 0.2s; }
    .transition-row:hover { background-color: #f8fafc !important; }
    .hover-scale { transition: transform 0.2s; }
    .hover-scale:hover { transform: scale(1.15); }
    
    /* Tab Styling */
    .nav-pills .nav-link.active { background-color: #0f172a; color: white; }
    .nav-pills .nav-link { background-color: #e2e8f0; color: #64748b; }
    
    /* Scrollbar */
    .table-responsive::-webkit-scrollbar { width: 4px; height: 4px; }
    .table-responsive::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
</style>
{% endblock %}
