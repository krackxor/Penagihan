{% extends "base.html" %}

{% block content %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<div class="container-fluid py-4 animate__animated animate__fadeIn" style="background: #f8fafc; min-height: 100vh;">
    
    <div class="container mb-4">
        <div class="row align-items-center g-3">
            <div class="col-12 col-md-6">
                <h3 class="fw-bold text-dark mb-1">
                    <i class="fas fa-crown me-2 text-warning"></i>Analisa Pareto (Top 500)
                </h3>
                <p class="text-muted small mb-0">
                    Periode Data: <span id="label-periode" class="text-primary fw-bold">Memuat...</span>
                </p>
            </div>
            <div class="col-12 col-md-6 d-flex justify-content-md-end gap-2">
                <input type="month" id="filter-periode" class="form-control form-control-sm border-0 shadow-sm fw-bold text-primary" 
                       style="width: 160px; cursor: pointer;" onchange="loadTop500()">
                
                <button class="btn btn-sm btn-light border shadow-sm rounded-circle p-2" onclick="loadTop500()" title="Refresh Data">
                    <i class="fas fa-sync-alt text-primary" id="refresh-icon"></i>
                </button>

                <button class="btn btn-sm btn-success border shadow-sm rounded-circle p-2" onclick="downloadExcel()" title="Export ke Excel">
                    <i class="fas fa-file-excel"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="card border-0 shadow-sm rounded-4 bg-white overflow-hidden">
            
            <div class="p-3 border-bottom bg-light d-flex justify-content-between align-items-center flex-wrap gap-3">
                <ul class="nav nav-pills nav-custom" id="pills-tab" role="tablist">
                    <li class="nav-item me-2">
                        <button class="nav-link active rounded-pill px-4 fw-bold small shadow-sm" id="pills-34-tab" data-bs-toggle="pill" data-bs-target="#pills-34" type="button">
                            <i class="fas fa-building me-2"></i>RAYON 34 
                            <span class="badge bg-white text-primary ms-1 shadow-sm" id="count-34">0</span>
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link rounded-pill px-4 fw-bold small shadow-sm" id="pills-35-tab" data-bs-toggle="pill" data-bs-target="#pills-35" type="button">
                            <i class="fas fa-city me-2"></i>RAYON 35 
                            <span class="badge bg-white text-info ms-1 shadow-sm" id="count-35">0</span>
                        </button>
                    </li>
                </ul>

                <div class="search-box position-relative" style="width: 250px;">
                    <i class="fas fa-search position-absolute text-muted" style="left: 15px; top: 50%; transform: translateY(-50%);"></i>
                    <input type="text" id="searchBox" class="form-control border-0 shadow-sm ps-5 rounded-pill small fw-bold" placeholder="Cari Pelanggan..." onkeyup="filterTable()">
                </div>
            </div>

            <div class="card-body p-0">
                <div class="tab-content" id="pills-tabContent">
                    
                    <div class="tab-pane fade show active" id="pills-34">
                        <div class="table-responsive" style="max-height: 60vh;">
                            <table class="table table-hover align-middle mb-0" style="font-size: 0.8rem;">
                                <thead class="bg-primary text-white sticky-top">
                                    <tr class="text-uppercase fw-bold small">
                                        <th class="ps-4 py-3" style="width: 50px;">#</th>
                                        <th style="width: 140px;">Zona</th>
                                        <th>Identitas Pelanggan</th>
                                        <th class="text-end">Tagihan</th>
                                        <th style="width: 30%;">Analisa</th>
                                        <th class="text-center pe-4" style="width: 60px;">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="tbody-34">
                                    <tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="tab-pane fade" id="pills-35">
                        <div class="table-responsive" style="max-height: 60vh;">
                            <table class="table table-hover align-middle mb-0" style="font-size: 0.8rem;">
                                <thead class="bg-info text-white sticky-top">
                                    <tr class="text-uppercase fw-bold small">
                                        <th class="ps-4 py-3" style="width: 50px;">#</th>
                                        <th style="width: 140px;">Zona</th>
                                        <th>Identitas Pelanggan</th>
                                        <th class="text-end">Tagihan</th>
                                        <th style="width: 30%;">Analisa</th>
                                        <th class="text-center pe-4" style="width: 60px;">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="tbody-35">
                                    <tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-info"></div></td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalAnalisa" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header border-0 bg-light px-4 pt-4">
                <h6 class="modal-title fw-bold"><i class="fas fa-edit me-2 text-primary"></i>Update Analisa</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <input type="hidden" id="modal-nomen">
                <div class="mb-4 text-center p-3 bg-light rounded-4 border border-dashed">
                    <h5 class="fw-bold mb-1 text-dark" id="modal-nama">-</h5>
                    <div class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25" id="modal-sub">-</div>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold text-muted">Keterangan Hasil Kunjungan</label>
                    <textarea id="modal-keterangan" class="form-control rounded-3 shadow-sm border p-3" rows="4" placeholder="Tulis hasil analisa lapangan di sini..."></textarea>
                </div>
                <button onclick="saveAnalisa()" class="btn btn-primary w-100 rounded-pill fw-bold py-3 shadow-lg">
                    <i class="fas fa-save me-2"></i> SIMPAN PERUBAHAN
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    .nav-custom .nav-link.active { background-color: #0f172a; color: white; }
    .nav-custom .nav-link { background-color: #e2e8f0; color: #64748b; }
    .table-responsive::-webkit-scrollbar { width: 6px; height: 6px; }
    .table-responsive::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .btn-light { background: #fff; border-color: #e2e8f0; }
    .btn-light:hover { background: #f8fafc; }
</style>

<script>
    let modalInstance; 
    let allData34 = [];
    let allData35 = [];
    const formatIDR = (n) => new Intl.NumberFormat('id-ID').format(n);

    document.addEventListener('DOMContentLoaded', () => {
        const modalEl = document.getElementById('modalAnalisa');
        if (modalEl) modalInstance = new bootstrap.Modal(modalEl);
        loadTop500();
    });

    async function loadTop500() {
        const icon = document.getElementById('refresh-icon');
        const picker = document.getElementById('filter-periode').value;
        icon.classList.add('fa-spin');
        
        try {
            let url = '/api/analisa/top500';
            if (picker) url += `?periode=${picker}`;

            const res = await fetch(url);
            const result = await res.json();
            
            if(result.status === 'success') {
                allData34 = result.data_34; 
                allData35 = result.data_35;

                document.getElementById('label-periode').innerText = result.periode;
                document.getElementById('count-34').innerText = allData34.length;
                document.getElementById('count-35').innerText = allData35.length;

                renderTable('tbody-34', allData34);
                renderTable('tbody-35', allData35);
            } else {
                Swal.fire('Gagal', result.message, 'error');
            }
        } catch(e) {
            console.error(e);
            const errHTML = `<tr><td colspan="6" class="text-center text-muted py-4 small">Gagal memuat data.</td></tr>`;
            document.getElementById('tbody-34').innerHTML = errHTML;
            document.getElementById('tbody-35').innerHTML = errHTML;
        } finally {
            setTimeout(() => icon.classList.remove('fa-spin'), 600);
        }
    }

    // EXPORT EXCEL
    function downloadExcel() {
        if (allData34.length === 0 && allData35.length === 0) {
            Swal.fire('Data Kosong', 'Tidak ada data untuk diekspor', 'info');
            return;
        }

        const formatData = (data) => data.map((item, index) => ({
            "No": index + 1,
            "ID Pelanggan": item.nomen,
            "Nama Pelanggan": item.nama,
            "Alamat": item.alamat,
            "Rayon": item.rayon,
            "Zona (PCEZ)": item.pcez,
            "Petugas": item.petugas_rute,
            "Tagihan (Rp)": item.nominal,
            "Kubikasi": item.kubik,
            "Analisa": item.analisa,
            "Auditor": item.auditor
        }));

        const wb = XLSX.utils.book_new();
        if (allData34.length > 0) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(formatData(allData34)), "Rayon 34");
        if (allData35.length > 0) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(formatData(allData35)), "Rayon 35");

        XLSX.writeFile(wb, `Analisa_Pareto_${document.getElementById('label-periode').innerText}.xlsx`);
    }

    function renderTable(tbodyId, data) {
        const tbody = document.getElementById(tbodyId);
        if(data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-5 text-muted small">Data Bersih / Lunas Semua! 🎉</td></tr>`;
            return;
        }

        tbody.innerHTML = data.map((item, index) => {
            const hasAnalisa = item.analisa !== '-';
            const rowBg = hasAnalisa ? 'bg-success bg-opacity-10' : '';
            
            const analisaDisplay = hasAnalisa 
                ? `<div class="d-flex flex-column">
                     <span class="fw-bold text-dark" style="font-size: 0.75rem;">${item.analisa}</span>
                     <span class="text-muted small mt-1" style="font-size: 0.65rem;"><i class="fas fa-user-check me-1"></i>${item.auditor}</span>
                   </div>` 
                : `<span class="badge bg-light text-muted border" style="font-size: 0.65rem;">BELUM ADA CEK</span>`;

            return `
                <tr class="${rowBg}">
                    <td class="ps-4 fw-bold text-muted text-center small">${index + 1}</td>
                    <td>
                        <span class="badge bg-white text-dark border fw-bold">${item.pcez}</span>
                        <div class="small text-primary mt-1 fw-bold text-truncate" style="font-size: 0.65rem; max-width: 100px;">
                            ${item.petugas_rute}
                        </div>
                    </td>
                    <td>
                        <div class="fw-bold text-dark" style="font-size: 0.8rem;">${item.nama}</div>
                        <div class="small text-muted font-monospace">${item.nomen}</div>
                        <div class="small text-muted text-truncate" style="max-width: 200px; font-size: 0.7rem;">${item.alamat}</div>
                    </td>
                    <td class="text-end fw-bold text-danger" style="font-size: 0.85rem;">
                        Rp ${formatIDR(item.nominal)}
                    </td>
                    <td class="align-middle border-start border-end bg-white bg-opacity-50">
                        ${analisaDisplay}
                    </td>
                    <td class="text-center pe-4">
                        <button class="btn btn-sm btn-white border shadow-sm rounded-circle p-2" 
                                onclick="openModal('${item.nomen}', '${item.nama.replace(/'/g, "\\'")}', '${formatIDR(item.nominal)}', '${item.analisa.replace(/'/g, "\\'")}')">
                            <i class="fas fa-pencil-alt text-primary"></i>
                        </button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function filterTable() {
        const term = document.getElementById('searchBox').value.toLowerCase();
        const filterFn = d => d.nama.toLowerCase().includes(term) || d.nomen.includes(term) || d.alamat.toLowerCase().includes(term);
        
        renderTable('tbody-34', allData34.filter(filterFn));
        renderTable('tbody-35', allData35.filter(filterFn));
    }

    function openModal(nomen, nama, nominal, ket) {
        document.getElementById('modal-nomen').value = nomen;
        document.getElementById('modal-nama').innerText = nama;
        document.getElementById('modal-sub').innerText = `${nomen} • Rp ${nominal}`;
        document.getElementById('modal-keterangan').value = ket === '-' ? '' : ket;
        if (modalInstance) modalInstance.show();
    }

    async function saveAnalisa() {
        const nomen = document.getElementById('modal-nomen').value;
        const ket = document.getElementById('modal-keterangan').value;
        
        if(!ket.trim()) { 
            Swal.fire({ icon: 'warning', title: 'Data Kosong', text: 'Keterangan analisa wajib diisi.' }); 
            return; 
        }

        const formData = new FormData();
        formData.append('nomen', nomen);
        formData.append('keterangan', ket);

        try {
            const res = await fetch('/api/analisa/update', { method: 'POST', body: formData });
            const result = await res.json();
            
            if(result.status === 'success') {
                Swal.fire({ icon: 'success', title: 'Tersimpan', timer: 800, showConfirmButton: false });
                modalInstance.hide();
                loadTop500(); 
            } else {
                Swal.fire('Gagal', result.message, 'error');
            }
        } catch(e) {
            Swal.fire('Error', 'Gagal terhubung ke server', 'error');
        }
    }
</script>
{% endblock %}
