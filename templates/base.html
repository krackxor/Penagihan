<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sinergi Area Service{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f6;
        }
        .navbar {
            background-color: #0056b3; /* Biru Profesional */
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 1px;
        }
        .nav-link {
            font-weight: 500;
            margin-right: 15px;
            transition: all 0.3s;
        }
        .nav-link:hover {
            color: #ffc107 !important; /* Kuning saat hover */
        }
        .main-container {
            min-height: 85vh;
            padding-top: 30px;
            padding-bottom: 50px;
        }
        .footer {
            background: #ffffff;
            border-top: 1px solid #dee2e6;
            padding: 20px 0;
            color: #6c757d;
            font-size: 0.9rem;
        }
        /* Custom Button */
        .btn-primary {
            background-color: #0056b3;
            border: none;
        }
        .btn-primary:hover {
            background-color: #004494;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-droplet me-2"></i>1 SINERGI
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/monitoring?ab=AB Sunter">
                            <i class="fas fa-chart-line me-1"></i> Monitoring
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/monitoring/top-500">
                            <i class="fas fa-trophy me-1"></i> Top 500
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/lapor">
                            <i class="fas fa-camera me-1"></i> Lapor Lapangan
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/upload">
                            <i class="fas fa-cloud-upload-alt me-1"></i> Admin Upload
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container main-container">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer text-center">
        <div class="container">
            <p class="mb-0">© 2026 <strong>Sinergi Area Service</strong> - PAM Jaya. All Rights Reserved.</p>
            <small>Sistem Terintegrasi Monitoring & Penagihan Lapangan</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        // Logika aktifkan link navbar sesuai halaman
        document.querySelectorAll('.nav-link').forEach(link => {
            if (link.href === window.location.href) {
                link.classList.add('active');
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
