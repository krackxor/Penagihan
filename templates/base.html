<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sunter Pro - Penagihan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary-gradient: linear-gradient(135deg, #0d6efd 0%, #003d99 100%); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f4f7fe; color: #2d3748; overflow-x: hidden; }
        .navbar { background: rgba(255, 255, 255, 0.9) !important; backdrop-filter: blur(10px); border-bottom: 1px solid #e2e8f0; }
        .navbar-brand { font-weight: 800; letter-spacing: -1px; color: #0d6efd !important; }
        .btn-menu-toggle { border: none; background: #edf2f7; border-radius: 10px; width: 40px; height: 40px; transition: 0.3s; }
        .btn-menu-toggle:active { transform: scale(0.9); background: #e2e8f0; }
        .main-content { padding-bottom: 80px; }
    </style>
</head>
<body>
    <nav class="navbar sticky-top mb-3">
        <div class="container-fluid px-3">
            <button class="btn-menu-toggle shadow-sm" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu">
                <i class="fas fa-bars text-primary"></i>
            </button>
            <a class="navbar-brand mx-auto" href="/">
                <i class="fas fa-bolt me-1"></i> SUNTER PRO
            </a>
            <div style="width: 40px;"></div> </div>
    </nav>

    {% include 'menu.html' %}

    <div class="container-fluid main-content">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
