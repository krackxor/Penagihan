{% extends "base.html" %}

{% block content %}
<style>
    :root {
        --primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        --dark-overlay: linear-gradient(to top, rgba(15, 23, 42, 0.9) 0%, transparent 100%);
    }
    
    .card-hover { transition: transform 0.3s ease, box-shadow 0.3s ease; cursor: pointer; }
    .card-hover:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(37, 99, 235, 0.15) !important; }
    
    .img-wrapper { position: relative; overflow: hidden; border-radius: 12px 12px 0 0; }
    .img-wrapper img { transition: transform 0.5s ease; width: 100%; height: 100%; object-fit: cover; }
    .card-hover:hover img { transform: scale(1.1); }
    
    .shadow-inner { box-shadow: inset 0 -60px 60px -20px rgba(0,0,0,0.6); }
    
    .fw-800 { font-weight: 800; }
</style>

<div class="px-2 pb-5 animate__animated animate__fadeIn">
    
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-end flex-wrap gap-3">
        <div>
            <h4 class="fw-bold mb-1 text-dark">
                <i class="fa-solid fa-images me-2 text-primary"></i>Arsip Visual
            </h4>
            <p class="text-muted small mb-0 fw-semibold">
                {% if session['role'] == 'admin' %}
                    <i class="fa-solid fa-shield-halved me-1 text-success"></i> Audit Lintas Wilayah
                {% else %}
                    <i class="fa-solid fa-route me-1 text-primary"></i> Repositori Saya
                {% endif %}
            </p>
        </div>
        
        <div class="d-flex gap-2">
            <input type="month" id="filter-periode" 
                   class="form-control form-control-sm border-0 shadow-sm rounded-pill px-3 fw-bold text-primary" 
                   style="width: 150px; cursor: pointer;" onchange="loadGaleri()">
            
            <button class="btn btn-white shadow-sm rounded-circle p-2 border" onclick="loadGaleri()" id="btn-refresh">
                <i class="fa-solid fa-arrows-rotate text-primary"></i>
            </button>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-4 bg-white border">
        <div class="card-body p-2">
            <div class="input-group">
                <span class="input-group-text bg-white border-0 ps-3"><i class="fas fa-search text-muted"></i></span>
                <input type="text" id="searchGaleri" class="form-control border-0 shadow-none fw-bold small" 
                       placeholder="Cari Nama Pelanggan / IDPEL / Petugas..." onkeyup="filterGaleri()">
            </div>
        </div>
    </div>

    <div id="galeri-container" class="row g-3">
        <div class="text-center py-5 col-12">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted small fw-bold">Memuat foto lapangan...</p>
        </div>
    </div>
</div>

<div class="modal fade" id="modalZoom" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-transparent border-0 shadow-none">
            <div class="modal-body p-0 text-center position-relative">
                <button type="button" class="btn btn-light rounded-circle position-absolute top-0 end-0 m-3 shadow-lg border-0 z-3" 
                        data-bs-dismiss="modal" style="width: 40px; height: 40px;">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                
                <div class="zoom-card shadow-lg rounded-4 overflow-hidden bg-dark border border-white border-opacity-10 position-relative">
                    <img src="" id="img-zoom" class="img-fluid w-100" style="max-height: 80vh; object-fit: contain; background: #000;">
                    
                    <div id="zoom-caption" class="p-4 text-start w-100 position-absolute bottom-0 start-0" 
                         style="background: var(--dark-overlay);">
                        </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let galeriData = []; 
    const ROLE = "{{ session['role'] }}";

    document.addEventListener('DOMContentLoaded', () => {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        document.getElementById('filter-periode').value = `${year}-${month}`;
        
        loadGaleri();
    });

    async function loadGaleri() {
        const btn = document.getElementById('btn-refresh');
        const icon = btn.querySelector('i');
        const container = document.getElementById('galeri-container');
        const rawPeriode = document.getElementById('filter-periode').value;
        
        if (!rawPeriode) return;
        
        icon.classList.add('fa-spin'); 

        // Format YYYY-MM ke MM-YYYY (Format Backend)
        const parts = rawPeriode.split('-');
        const formattedPeriode = `${parts[1]}-${parts[0]}`;
        
        try {
            const res = await fetch(`/api/history/kunjungan?periode=${formattedPeriode}`);
            const result = await res.json();
            
            // Filter hanya yang punya foto valid
            galeriData = (result.data || []).filter(item => item.foto_path && item.foto_path !== '-');
            
            if (galeriData.length === 0) {
                container.innerHTML = `
                    <div class="text-center mt-5 py-5 col-12 animate__animated animate__fadeIn">
                        <div class="bg-light rounded-circle d-inline-flex p-4 mb-3">
                            <i class="fa-regular fa-images fa-3x text-secondary opacity-50"></i>
                        </div>
                        <p class="text-muted small fw-bold">Belum ada dokumentasi pada periode ini.</p>
                    </div>`;
                return;
            }

            renderGaleri(galeriData);
        } catch (e) {
            console.error("Galeri Sync Error", e);
            container.innerHTML = '<div class="alert alert-danger mx-2 small col-12 text-center rounded-4">Gagal memuat galeri.</div>';
        } finally {
            setTimeout(() => icon.classList.remove('fa-spin'), 600);
        }
    }

    function renderGaleri(data) {
        const container = document.getElementById('galeri-container');
        container.innerHTML = data.map((item, index) => {
            const fotoUrl = `/static/uploads/kunjungan/${item.foto_path}`;
            const labelJam = item.waktu ? item.waktu.split(' ')[1].substring(0, 5) : '--:--';

            return `
            <div class="col-6 col-md-4 col-lg-3 mb-2 galeri-item animate__animated animate__fadeInUp" 
                 data-search="${item.nomen} ${item.nama} ${item.keterangan} ${item.petugas_name}" 
                 style="animation-delay: ${index * 0.05}s">
                
                <div class="card border-0 shadow-sm rounded-4 h-100 bg-white card-hover" 
                     onclick="zoomImage('${fotoUrl}', '${item.nama.replace(/'/g, "\\'")}', '${item.petugas_name}', '${item.keterangan.replace(/'/g, "\\'")}', '${item.waktu}', '${item.nomen}')">
                    
                    <div class="img-wrapper bg-light" style="height: 160px;">
                        <img src="${fotoUrl}" loading="lazy" onerror="this.src='https://placehold.co/400x600/f1f5f9/94a3b8?text=No+Image'">
                        <div class="position-absolute top-0 end-0 m-2">
                            <span class="badge bg-dark bg-opacity-50 backdrop-blur shadow-sm">${labelJam}</span>
                        </div>
                    </div>
                    
                    <div class="card-body p-3">
                        <h6 class="fw-800 mb-1 text-truncate text-dark small text-uppercase">${item.nama}</h6>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 rounded-pill px-2 py-1" style="font-size: 0.6rem;">
                                <i class="fa-solid fa-user me-1"></i>${item.petugas_name.split(' ')[0]}
                            </span>
                            <small class="text-muted fw-bold" style="font-size: 0.6rem;">${item.nomen}</small>
                        </div>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function filterGaleri() {
        const query = document.getElementById('searchGaleri').value.toLowerCase();
        document.querySelectorAll('.galeri-item').forEach(item => {
            const text = item.getAttribute('data-search').toLowerCase();
            item.style.display = text.includes(query) ? 'block' : 'none';
        });
    }

    function zoomImage(src, nama, petugas, ket, waktu, idpel) {
        document.getElementById('img-zoom').src = src;
        document.getElementById('zoom-caption').innerHTML = `
            <div class="d-flex justify-content-between align-items-end text-white">
                <div>
                    <h5 class="fw-bold mb-1 text-uppercase text-shadow">${nama}</h5>
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <span class="badge bg-primary border border-light border-opacity-25">${idpel}</span>
                        <span class="small opacity-75"><i class="fa-regular fa-clock me-1"></i>${waktu}</span>
                    </div>
                    <div class="d-flex align-items-center small fw-bold text-info">
                        <i class="fa-solid fa-camera me-2"></i>Petugas: ${petugas.toUpperCase()}
                    </div>
                </div>
                <div class="text-end">
                    <span class="badge bg-light text-dark fw-bold px-3 py-2 shadow-sm text-uppercase">${ket}</span>
                </div>
            </div>
        `;
        const modal = new bootstrap.Modal(document.getElementById('modalZoom'));
        modal.show();
    }
</script>
{% endblock %}
