{% extends "base.html" %}
{% block content %}
<div class="px-2 pb-5 animate__animated animate__fadeIn">
    <div class="pt-4 mb-4">
        <h4 class="fw-bold mb-1 text-dark">Galeri Lapangan 📸</h4>
        <p class="text-muted small">Dokumentasi hasil kunjungan petugas</p>
    </div>

    <div id="galeri-container" class="row g-2">
        <div class="text-center py-5">
            <div class="spinner-border text-primary"></div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalZoom" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-transparent border-0">
            <div class="modal-body p-0 text-center">
                <img src="" id="img-zoom" class="img-fluid rounded-4 shadow-lg">
                <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal"></button>
            </div>
        </div>
    </div>
</div>

<script>
    async function loadGaleri() {
        const container = document.getElementById('galeri-container');
        try {
            const res = await fetch('/api/belum-bayar/galeri');
            const data = await res.json();
            
            if (data.length === 0) {
                container.innerHTML = '<div class="text-center mt-5 text-muted">Belum ada dokumentasi foto.</div>';
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="col-6 col-md-4 mb-2">
                    <div class="card border-0 shadow-sm rounded-4 overflow-hidden position-relative h-100 bg-white" 
                         onclick="zoomImage('/static/uploads/kunjungan/${item.foto_path}')">
                        <img src="/static/uploads/kunjungan/${item.foto_path}" 
                             class="card-img-top" 
                             style="height: 150px; object-fit: cover;"
                             onerror="this.src='https://placehold.co/400x400?text=Foto+Tidak+Ada'">
                        <div class="card-body p-2">
                            <h6 class="fw-bold mb-0 text-truncate" style="font-size: 0.75rem;">${item.nama}</h6>
                            <div class="d-flex justify-content-between align-items-center mt-1">
                                <small class="text-primary fw-bold" style="font-size: 0.65rem;">${item.petugas_name}</small>
                                <small class="text-muted" style="font-size: 0.6rem;">${item.waktu.split(' ')[0]}</small>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            container.innerHTML = '<p class="text-danger">Gagal memuat galeri.</p>';
        }
    }

    function zoomImage(src) {
        document.getElementById('img-zoom').src = src;
        new bootstrap.Modal(document.getElementById('modalZoom')).show();
    }

    document.addEventListener('DOMContentLoaded', loadGaleri);
</script>

<style>
    .card-img-top { transition: transform 0.3s ease; }
    .card:active .card-img-top { transform: scale(1.05); }
    #img-zoom { max-height: 85vh; border: 3px solid white; }
</style>
{% endblock %}
