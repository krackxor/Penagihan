{% extends "base.html" %}
{% block content %}
<div class="px-2 pb-5 animate__animated animate__fadeIn">
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-end">
        <div>
            <h4 class="fw-bold mb-1 text-dark">Galeri Lapangan 📸</h4>
            <p class="text-muted small mb-0">
                {% if session['role'] == 'admin' %}
                    Audit dokumentasi seluruh petugas
                {% else %}
                    Dokumentasi hasil kunjungan Anda
                {% endif %}
            </p>
        </div>
        <button class="btn btn-sm btn-light rounded-pill shadow-sm px-3" onclick="loadGaleri()">
            <i class="fas fa-sync-alt text-primary"></i>
        </button>
    </div>

    <div class="mb-3 px-1">
        <div class="input-group bg-white rounded-4 shadow-sm border-0">
            <span class="input-group-text border-0 bg-transparent ps-3"><i class="fas fa-search text-muted"></i></span>
            <input type="text" id="searchGaleri" class="form-control border-0 py-2 shadow-none" 
                   placeholder="Cari Nama Pelanggan..." onkeyup="filterGaleri()">
        </div>
    </div>

    <div id="galeri-container" class="row g-2">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted small">Sinkronisasi galeri...</p>
        </div>
    </div>
</div>

<div class="modal fade" id="modalZoom" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-transparent border-0">
            <div class="modal-body p-0 text-center position-relative">
                <img src="" id="img-zoom" class="img-fluid rounded-4 shadow-lg">
                <div id="zoom-caption" class="position-absolute bottom-0 start-0 end-0 p-3 text-white rounded-bottom-4" 
                     style="background: linear-gradient(transparent, rgba(0,0,0,0.9));">
                </div>
                <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal"></button>
            </div>
        </div>
    </div>
</div>

<script>
    let galeriData = [];
    const ROLE = "{{ session['role'] }}";
    const PETUGAS_ID = "{{ session['petugas_id'] }}";

    async function loadGaleri() {
        const container = document.getElementById('galeri-container');
        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';
        
        try {
            // Sinergi: Mengambil data dari endpoint riwayat kunjungan (yang sudah difilter di backend berdasarkan role)
            const res = await fetch('/api/history/kunjungan');
            const result = await res.json();
            
            // Filter hanya data yang benar-benar memiliki file foto
            galeriData = (result.data || []).filter(item => item.foto_path && item.foto_path !== '-');
            
            if (galeriData.length === 0) {
                container.innerHTML = `
                    <div class="text-center mt-5 py-5 animate__animated animate__fadeIn">
                        <i class="fas fa-camera-retro fa-3x text-light mb-3"></i>
                        <p class="text-muted small">Belum ada foto dokumentasi<br>yang tersimpan.</p>
                    </div>`;
                return;
            }

            renderGaleri(galeriData);
        } catch (e) {
            container.innerHTML = '<div class="alert alert-danger mx-2 small">Gagal sinkronisasi galeri.</div>';
        }
    }

    function renderGaleri(data) {
        const container = document.getElementById('galeri-container');
        container.innerHTML = data.map((item, index) => `
            <div class="col-6 col-md-4 mb-2 galeri-item" 
                 data-search="${item.nama} ${item.petugas_name}" 
                 style="animation-delay: ${index * 0.05}s">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden position-relative h-100 bg-white" 
                     onclick="zoomImage('/static/uploads/kunjungan/${item.foto_path}', '${item.nama} - ${item.keterangan}')">
                    <div class="position-relative">
                        <img src="/static/uploads/kunjungan/${item.foto_path}" 
                             class="card-img-top lazy-img" 
                             style="height: 150px; object-fit: cover;"
                             loading="lazy"
                             onerror="this.src='https://placehold.co/400x600?text=Foto+Tidak+Ada'">
                        <div class="position-absolute top-0 end-0 m-2">
                             <span class="badge bg-dark bg-opacity-50 rounded-pill" style="font-size: 0.6rem;">
                                <i class="fas fa-expand"></i>
                             </span>
                        </div>
                    </div>
                    <div class="card-body p-2">
                        <h6 class="fw-bold mb-0 text-truncate text-dark" style="font-size: 0.7rem;">${item.nama}</h6>
                        <div class="d-flex justify-content-between align-items-center mt-1">
                            <small class="text-primary fw-bold" style="font-size: 0.6rem;">
                                <i class="fas fa-user me-1"></i>${item.petugas_name.split(' ')[0]}
                            </small>
                            <small class="text-muted" style="font-size: 0.55rem;">
                                ${new Date(item.waktu).toLocaleDateString('id-ID')}
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function filterGaleri() {
        const query = document.getElementById('searchGaleri').value.toLowerCase();
        document.querySelectorAll('.galeri-item').forEach(item => {
            const text = item.getAttribute('data-search').toLowerCase();
            item.style.display = text.includes(query) ? 'block' : 'none';
        });
    }

    function zoomImage(src, caption) {
        document.getElementById('img-zoom').src = src;
        document.getElementById('zoom-caption').innerText = caption;
        new bootstrap.Modal(document.getElementById('modalZoom')).show();
    }

    document.addEventListener('DOMContentLoaded', loadGaleri);
</script>

<style>
    .card { transition: transform 0.2s ease, box-shadow 0.2s ease; cursor: pointer; border: 1px solid #f1f5f9 !important; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.08) !important; }
    .card:active { transform: scale(0.97); }
    
    #img-zoom { 
        max-height: 85vh; 
        border: 5px solid white; 
        background-color: #000;
    }
    
    .lazy-img { transition: opacity 0.4s; }
    
    .galeri-item {
        animation: fadeInUp 0.4s ease backwards;
    }
    
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Penyesuaian Grid Mobile */
    @media (max-width: 576px) {
        .card-img-top { height: 130px !important; }
    }
</style>
{% endblock %}
