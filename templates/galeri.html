{% extends "base.html" %}
{% block content %}
<div class="px-2 pb-5 animate__animated animate__fadeIn">
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-end">
        <div>
            <h4 class="fw-bold mb-1 text-dark">
                <i class="fa-solid fa-images me-2 text-primary"></i>Arsip Visual Lapangan
            </h4>
            <p class="text-muted small mb-0">
                {% if session['role'] == 'admin' %}
                    <i class="fa-solid fa-shield-halved me-1"></i> Audit dokumentasi operasional lintas rute
                {% else %}
                    <i class="fa-solid fa-route me-1"></i> Repositori rute {{ session['petugas_id'] }}
                {% endif %}
            </p>
        </div>
        <button class="btn btn-white shadow-sm rounded-circle p-2 border animate__animated animate__rotateIn" 
                onclick="loadGaleri()" id="btn-refresh">
            <i class="fa-solid fa-arrows-rotate text-primary"></i>
        </button>
    </div>

    <div class="row g-2 mb-3 px-1">
        <div class="col-5">
            <div class="position-relative">
                <input type="month" id="filter-periode" 
                       class="form-control border-0 shadow-sm rounded-4 py-2 small fw-800 text-primary" 
                       onchange="loadGaleri()">
            </div>
        </div>
        <div class="col-7">
            <div class="input-group bg-white rounded-4 shadow-sm border-0 border-start border-primary border-4 overflow-hidden">
                <span class="input-group-text border-0 bg-transparent ps-3">
                    <i class="fa-solid fa-magnifying-glass text-muted small"></i>
                </span>
                <input type="text" id="searchGaleri" class="form-control border-0 py-2 shadow-none small fw-semibold" 
                       placeholder="Cari Nama/IDPEL..." onkeyup="filterGaleri()">
            </div>
        </div>
    </div>

    <div id="galeri-container" class="row g-2">
        <div class="text-center py-5 col-12">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted small fw-bold">Sinkronisasi pangkalan data visual...</p>
        </div>
    </div>
</div>

<div class="modal fade" id="modalZoom" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-transparent border-0 shadow-none">
            <div class="modal-body p-0 text-center position-relative">
                <div class="zoom-card shadow-lg rounded-5 overflow-hidden bg-dark border border-white border-opacity-10">
                    <img src="" id="img-zoom" class="img-fluid w-100">
                    <div id="zoom-caption" class="p-4 text-white text-start shadow-inner" 
                         style="background: linear-gradient(transparent, rgba(15, 23, 42, 0.95)); position: absolute; bottom: 0; width: 100%;">
                    </div>
                </div>
                <button type="button" class="btn btn-white rounded-circle position-absolute top-0 end-0 m-3 shadow-lg border-0" 
                        data-bs-dismiss="modal" style="width: 40px; height: 40px;">
                    <i class="fa-solid fa-xmark fa-lg"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let galeriData = []; 
    const ROLE = "{{ session['role'] }}";

    document.addEventListener('DOMContentLoaded', () => {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        document.getElementById('filter-periode').value = `${year}-${month}`;
        loadGaleri();
    });

    async function loadGaleri() {
        const btn = document.getElementById('btn-refresh');
        const icon = btn.querySelector('i');
        const container = document.getElementById('galeri-container');
        const rawPeriode = document.getElementById('filter-periode').value;
        
        if (!rawPeriode) return;
        icon.classList.add('fa-spin'); 

        const parts = rawPeriode.split('-');
        const formattedPeriode = `${parts[1]}-${parts[0]}`;
        
        try {
            const res = await fetch(`/api/history/kunjungan?periode=${formattedPeriode}`);
            const result = await res.json();
            
            galeriData = (result.data || []).filter(item => item.foto_path && item.foto_path !== '-');
            
            if (galeriData.length === 0) {
                container.innerHTML = `
                    <div class="text-center mt-5 py-5 col-12 animate__animated animate__fadeIn">
                        <i class="fa-solid fa-cloud-moon fa-4x text-light mb-3 opacity-50"></i>
                        <p class="text-muted small fw-800">Tidak ditemukan dokumentasi visual<br>pada periode ${formattedPeriode}.</p>
                    </div>`;
                return;
            }

            renderGaleri(galeriData);
        } catch (e) {
            console.error("Critical: Galeri Sync Failed", e);
            container.innerHTML = '<div class="alert alert-danger mx-2 small col-12 text-center rounded-4">Gagal menyambungkan ke server dokumentasi.</div>';
        } finally {
            setTimeout(() => icon.classList.remove('fa-spin'), 600);
        }
    }

    function renderGaleri(data) {
        const container = document.getElementById('galeri-container');
        container.innerHTML = data.map((item, index) => {
            const fotoUrl = `/static/uploads/kunjungan/${item.foto_path}`;
            // Ambil Jam saja dari format "DD/MM/YY HH:MM WIB"
            const labelJam = item.waktu ? item.waktu.split(' ')[1].substring(0, 5) : '--:--';

            return `
            <div class="col-6 col-md-4 mb-2 galeri-item animate__animated animate__zoomIn" 
                 data-search="${item.nomen} ${item.nama} ${item.keterangan} ${item.petugas_name}" 
                 style="animation-delay: ${index * 0.02}s">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden position-relative h-100 bg-white" 
                     onclick="zoomImage('${fotoUrl}', '${item.nama.replace(/'/g, "\\'")}', '${item.petugas_name}', '${item.keterangan}', '${item.waktu}', '${item.nomen}')">
                    <div class="img-wrapper" style="height: 150px; background: #f1f5f9; overflow: hidden;">
                        <img src="${fotoUrl}" 
                             class="w-100 h-100 object-fit-cover transition-img"
                             loading="lazy" 
                             onerror="this.src='https://placehold.co/400x600/f1f5f9/94a3b8?text=Image+Not+Found'">
                    </div>
                    <div class="card-body p-2 px-3">
                        <h6 class="fw-800 mb-0 text-truncate text-dark small text-uppercase" style="letter-spacing: 0.2px; font-size: 0.65rem;">${item.nama}</h6>
                        <div class="d-flex justify-content-between align-items-center mt-1">
                            <span class="badge bg-primary bg-opacity-10 text-primary border-0 fw-800" style="font-size: 0.55rem;">
                                <i class="fa-solid fa-user-circle me-1"></i>${item.petugas_name.split(' ')[0]}
                            </span>
                            <small class="text-muted fw-bold" style="font-size: 0.55rem;"><i class="fa-regular fa-clock me-1"></i>${labelJam}</small>
                        </div>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function filterGaleri() {
        const query = document.getElementById('searchGaleri').value.toLowerCase();
        document.querySelectorAll('.galeri-item').forEach(item => {
            const text = item.getAttribute('data-search').toLowerCase();
            item.style.display = text.includes(query) ? 'block' : 'none';
        });
    }

    function zoomImage(src, nama, petugas, ket, waktu, idpel) {
        document.getElementById('img-zoom').src = src;
        document.getElementById('zoom-caption').innerHTML = `
            <div class="d-flex justify-content-between align-items-end">
                <div>
                    <small class="text-uppercase fw-800 text-info" style="font-size: 0.6rem; letter-spacing: 1.2px;">Entitas Pelanggan</small>
                    <h6 class="fw-bold text-white mb-0 text-uppercase" style="letter-spacing: 0.5px;">${nama}</h6>
                    <small class="text-white-50 fw-bold">IDPEL: ${idpel}</small>
                </div>
                <div class="text-end">
                    <span class="badge bg-primary rounded-pill px-3 py-2 mb-2 shadow-sm" style="font-size: 0.65rem;">${ket}</span>
                    <div class="small text-white-50 fw-bold" style="font-size: 0.6rem;"><i class="fa-regular fa-calendar-check me-1"></i>${waktu}</div>
                </div>
            </div>
            <div class="mt-3 pt-2 border-top border-white border-opacity-10 d-flex align-items-center">
                <i class="fa-solid fa-circle-user fa-lg text-info me-2"></i>
                <div class="small fw-800 text-white">PELAKSANA: <span class="text-info">${petugas.toUpperCase()}</span></div>
            </div>
        `;
        const modal = new bootstrap.Modal(document.getElementById('modalZoom'));
        modal.show();
    }
</script>

<style>
    .fw-800 { font-weight: 800; }
    .btn-white { background: white; border: 1px solid #e2e8f0; }
    .card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; border: 1px solid transparent !important; }
    .card:hover { transform: translateY(-5px); border-color: #2563eb !important; box-shadow: 0 15px 30px rgba(37, 99, 235, 0.15) !important; }
    .transition-img { transition: transform 0.6s ease; }
    .card:hover .transition-img { transform: scale(1.1); }
    .zoom-card { border: 1px solid rgba(255,255,255,0.1); background-color: #0f172a; }
    #img-zoom { max-height: 70vh; object-fit: contain; }
    .shadow-inner { box-shadow: inset 0 -50px 100px rgba(0,0,0,0.5); }
    .object-fit-cover { object-fit: cover; }

    @media (max-width: 576px) {
        .img-wrapper { height: 120px !important; }
        #img-zoom { max-height: 60vh; }
    }
</style>
{% endblock %}
