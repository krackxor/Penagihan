{% extends "base.html" %}
{% block content %}
<div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 1080;">
    <div id="statusToast" class="toast align-items-center text-white bg-dark border-0 rounded-4 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                <i class="fas fa-bell me-2 text-warning"></i> <span id="toastMessage">Memproses data...</span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<div class="px-2 pb-5 animate__animated animate__fadeIn">
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1 text-dark">Monitoring Janji Bayar 📅</h4>
            <p class="text-muted small mb-0">Komitmen penagihan lapangan</p>
        </div>
        <input type="month" id="filter-janji" 
               class="form-control form-control-sm border-0 shadow-sm rounded-pill px-3" 
               style="width: 150px; font-size: 0.75rem;" 
               onchange="loadJanjiBayar()">
    </div>

    <div id="summary-janji" class="px-1 mb-3"></div>

    <div id="list-janji-container">
        <div class="text-center py-5">
            <div class="spinner-border text-primary"></div>
            <p class="text-muted small mt-2">Menyinkronkan komitmen...</p>
        </div>
    </div>
</div>

<script>
    // Fungsi untuk menampilkan notifikasi (Toast)
    function showNotify(msg, type = 'dark') {
        const toastEl = document.getElementById('statusToast');
        const msgEl = document.getElementById('toastMessage');
        msgEl.innerText = msg;
        toastEl.className = `toast align-items-center text-white bg-${type} border-0 rounded-4 shadow-lg`;
        const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
        toast.show();
    }

    function initPicker() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        document.getElementById('filter-janji').value = `${year}-${month}`;
    }

    async function loadJanjiBayar() {
        const pickerValue = document.getElementById('filter-janji').value;
        const container = document.getElementById('list-janji-container');
        const summary = document.getElementById('summary-janji');
        
        if (!pickerValue) return;
        
        const [year, month] = pickerValue.split('-');
        const periode = `${month}-${year}`;

        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';

        try {
            const res = await fetch(`/api/performance/reminders?periode=${periode}`);
            const result = await res.json();
            
            // Mengambil array data dari APIResponse (asumsi data ada di result atau result.data)
            const data = Array.isArray(result) ? result : (result.data || []);
            
            if (data.length === 0) {
                summary.innerHTML = '';
                container.innerHTML = `
                    <div class="text-center mt-5 py-5 animate__animated animate__fadeIn">
                        <i class="fas fa-calendar-check fa-3x text-light mb-3"></i>
                        <p class="text-muted">Tidak ada janji bayar untuk periode ini.</p>
                    </div>`;
                showNotify("Data kosong untuk periode ini", "info");
                return;
            }

            // Hitung total nominal janji bayar
            const totalNominal = data.reduce((acc, curr) => acc + (Number(curr.nominal) || 0), 0);
            summary.innerHTML = `
                <div class="bg-white rounded-3 p-2 shadow-sm d-flex justify-content-between px-3 border-start border-warning border-3">
                    <small class="text-muted">Total Komitmen</small>
                    <small class="fw-bold text-dark">Rp ${totalNominal.toLocaleString('id-ID')}</small>
                </div>`;

            container.innerHTML = data.map((item, idx) => {
                const dateObj = new Date(item.janji_bayar_dt);
                const tglFormat = dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                const waLink = item.no_hp ? `https://wa.me/${item.no_hp.replace(/[^0-9]/g, '')}` : '#';

                return `
                <div class="card border-0 shadow-sm rounded-4 mb-3 border-start border-warning border-4 animate__animated animate__fadeInUp" style="animation-delay: ${idx * 0.05}s">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div class="pe-2">
                                <span class="badge bg-warning-subtle text-warning mb-1" style="font-size: 9px;">
                                    <i class="fas fa-clock me-1"></i>${tglFormat}
                                </span>
                                <h6 class="fw-bold mb-0 text-dark">${item.nama}</h6>
                                <small class="text-muted" style="font-size: 11px;">IDPEL: ${item.nomen}</small>
                            </div>
                            <div class="text-end">
                                <small class="text-muted d-block" style="font-size: 9px;">NOMINAL</small>
                                <span class="fw-bold text-danger">Rp ${(Number(item.nominal) || 0).toLocaleString('id-ID')}</span>
                            </div>
                        </div>
                        <div class="bg-light p-2 rounded-3 mt-2 small border">
                            <div class="mb-1 d-flex justify-content-between">
                                <span><i class="fas fa-user-circle me-1"></i> Petugas:</span>
                                <span class="fw-bold">${item.petugas_name}</span>
                            </div>
                            <div class="text-muted" style="font-size: 11px;">
                                <i class="fas fa-comment-dots me-1"></i> "${item.catatan || 'Tanpa catatan tambahan'}"
                            </div>
                        </div>
                        <div class="mt-3">
                            <a href="${waLink}" target="_blank"
                               class="btn btn-success w-100 btn-sm rounded-3 fw-bold py-2 shadow-sm ${!item.no_hp ? 'disabled opacity-50' : ''}">
                                <i class="fab fa-whatsapp me-1"></i> HUBUNGI PELANGGAN
                            </a>
                        </div>
                    </div>
                </div>`;
            }).join('');

            showNotify(`Berhasil memuat ${data.length} komitmen bayar`, "success");

        } catch (e) {
            container.innerHTML = '<div class="alert alert-danger mx-2 rounded-4">Koneksi API bermasalah.</div>';
            showNotify("Gagal sinkronisasi data", "danger");
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        initPicker();
        loadJanjiBayar();
    });
</script>

<style>
    .border-warning { border-color: #f59e0b !important; }
    .bg-warning-subtle { background-color: #fffbeb !important; color: #b45309 !important; border: 1px solid #fef3c7; }
    .opacity-20 { opacity: 0.2; }
    .toast-container { z-index: 2000; }
</style>
{% endblock %}
