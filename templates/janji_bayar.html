{% extends "base.html" %}
{% block content %}
<div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 1080;">
    <div id="statusToast" class="toast align-items-center text-white bg-dark border-0 rounded-4 shadow-lg" role="alert">
        <div class="d-flex">
            <div class="toast-body">
                <i class="fas fa-bell me-2 text-warning"></i> <span id="toastMessage">Memproses data...</span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<div class="px-2 pb-5 animate__animated animate__fadeIn">
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1 text-dark">Janji Bayar 📅</h4>
            <p class="text-muted small mb-0">
                {% if session['role'] == 'admin' %} Dashboard komitmen global tim {% else %} Jadwal kunjungan ulang Anda {% endif %}
            </p>
        </div>
        <div class="d-flex flex-column align-items-end">
            <input type="month" id="filter-janji" 
                   class="form-control form-control-sm border-0 shadow-sm rounded-pill px-3" 
                   style="width: 150px; font-size: 0.75rem;" 
                   onchange="loadJanjiBayar()">
        </div>
    </div>

    <div id="summary-janji" class="px-1 mb-3"></div>

    <div id="list-janji-container">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted small mt-2">Menyinkronkan data komitmen...</p>
        </div>
    </div>
</div>

<script>
    const USER_ROLE = "{{ session['role'] }}";
    const PETUGAS_ID = "{{ session['petugas_id'] }}";

    function showNotify(msg, type = 'dark') {
        const toastEl = document.getElementById('statusToast');
        const msgEl = document.getElementById('toastMessage');
        msgEl.innerText = msg;
        toastEl.className = `toast align-items-center text-white bg-${type} border-0 rounded-4 shadow-lg`;
        const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
        toast.show();
    }

    function initPicker() {
        const now = new Date();
        document.getElementById('filter-janji').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    }

    async function loadJanjiBayar() {
        const pickerValue = document.getElementById('filter-janji').value;
        const container = document.getElementById('list-janji-container');
        const summary = document.getElementById('summary-janji');
        
        if (!pickerValue) return;
        const [year, month] = pickerValue.split('-');
        const periode = `${month}-${year}`;

        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary border-width-2"></div></div>';

        try {
            // Sinergi: Mengambil data janji bayar yang sudah divalidasi backend terhadap status pelunasan terbaru
            const res = await fetch(`/api/performance/reminders?periode=${periode}`);
            const data = await res.json();
            
            if (!data || data.length === 0) {
                summary.innerHTML = '';
                container.innerHTML = `
                    <div class="text-center mt-5 py-5 animate__animated animate__fadeIn">
                        <i class="fas fa-calendar-check fa-3x text-light mb-3 opacity-25"></i>
                        <p class="text-muted small">Tidak ada jadwal janji bayar<br>untuk periode terpilih.</p>
                    </div>`;
                return;
            }

            const totalNominal = data.reduce((acc, curr) => acc + (Number(curr.nominal) || 0), 0);
            summary.innerHTML = `
                <div class="bg-white rounded-4 p-3 shadow-sm d-flex justify-content-between align-items-center mx-1 border-start border-warning border-4">
                    <div>
                        <small class="text-muted d-block" style="font-size: 0.65rem;">KOMITMEN TERDATA</small>
                        <span class="fw-bold text-dark h5 mb-0">${data.length} Pelanggan</span>
                    </div>
                    <div class="text-end">
                        <small class="text-muted d-block" style="font-size: 0.65rem;">POTENSI RUPIAH</small>
                        <span class="fw-bold text-primary h5 mb-0">Rp ${totalNominal.toLocaleString('id-ID')}</span>
                    </div>
                </div>`;

            container.innerHTML = data.map((item, idx) => {
                const dateObj = new Date(item.tanggal_janji);
                const tglFormat = dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                const waLink = item.no_hp ? `https://wa.me/${item.no_hp.replace(/[^0-9]/g, '')}` : '#';
                
                // SINERGI: Logika warna dan status berdasarkan pelunasan
                const isLunas = item.status_bayar === 'LUNAS';
                const statusBadge = isLunas ? 'bg-success' : 'bg-warning-subtle text-warning';
                const statusIcon = isLunas ? 'fa-check-double' : 'fa-handshake-simple';
                const labelStatus = isLunas ? 'SUDAH LUNAS' : `JANJI: ${tglFormat}`;

                return `
                <div class="card border-0 shadow-sm rounded-4 mb-3 mx-1 border-start border-4 ${isLunas ? 'border-success' : 'border-warning'} animate__animated animate__fadeInUp" style="animation-delay: ${idx * 0.05}s">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div class="pe-2">
                                <span class="badge ${statusBadge} mb-2 rounded-pill px-2 py-1" style="font-size: 9px;">
                                    <i class="fas ${statusIcon} me-1"></i>${labelStatus}
                                </span>
                                <h6 class="fw-bold mb-1 ${isLunas ? 'text-muted text-decoration-line-through' : 'text-dark'} text-uppercase" style="font-size: 0.85rem;">${item.nama}</h6>
                                <small class="text-muted font-monospace" style="font-size: 10px;">IDPEL: ${item.nomen}</small>
                            </div>
                            <div class="text-end">
                                <small class="text-muted d-block" style="font-size: 8px;">TAGIHAN</small>
                                <span class="fw-bold ${isLunas ? 'text-success' : 'text-danger'}" style="font-size: 1rem;">Rp ${(Number(item.nominal) || 0).toLocaleString('id-ID')}</span>
                            </div>
                        </div>

                        <div class="bg-light p-2 rounded-3 mb-3 border border-light">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <small class="text-muted" style="font-size: 10px;"><i class="fas fa-user-edit me-1"></i>Petugas Pelapor:</small>
                                <small class="fw-bold text-dark" style="font-size: 10px;">${item.petugas_name}</small>
                            </div>
                            <div class="text-muted bg-white p-2 rounded-2 mt-1 border" style="font-size: 11px; font-style: italic;">
                                <i class="fas fa-quote-left me-1 opacity-25"></i>${item.catatan || 'Tanpa catatan tambahan'}<i class="fas fa-quote-right ms-1 opacity-25"></i>
                            </div>
                        </div>

                        <div class="d-grid">
                            <a href="${waLink}" target="_blank"
                               class="btn ${isLunas ? 'btn-outline-success border-2' : 'btn-success'} rounded-pill fw-bold py-2 shadow-sm ${!item.no_hp ? 'disabled opacity-50' : ''}">
                                <i class="fab fa-whatsapp me-2"></i> ${isLunas ? 'KONFIRMASI PELUNASAN' : 'FOLLOW UP PELANGGAN'}
                            </a>
                        </div>
                    </div>
                </div>`;
            }).join('');

            showNotify(`Sinkronisasi ${data.length} komitmen berhasil`, "success");

        } catch (e) {
            console.error("Janji Bayar Error:", e);
            container.innerHTML = '<div class="alert alert-danger mx-2 rounded-4 small">❌ Gagal memuat data. Periksa koneksi API Anda.</div>';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        initPicker();
        loadJanjiBayar();
    });
</script>

<style>
    .border-warning { border-color: #ffc107 !important; }
    .border-success { border-color: #198754 !important; }
    .bg-warning-subtle { background-color: #fff9e6 !important; color: #856404 !important; border: 1px solid #ffeeba; }
    .spinner-border.border-width-2 { border-width: 0.15em; }
    .card { transition: transform 0.2s; }
    .card:active { transform: scale(0.98); }
</style>
{% endblock %}
