{% extends "base.html" %}

{% block content %}
<div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 1080;">
    <div id="statusToast" class="toast align-items-center text-white bg-dark border-0 rounded-4 shadow-lg" role="alert">
        <div class="d-flex">
            <div class="toast-body">
                <i class="fa-solid fa-satellite-dish me-2 text-warning animate__animated animate__pulse animate__infinite"></i> 
                <span id="toastMessage" class="fw-bold small">Menghubungkan...</span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<div class="px-2 pb-5 animate__animated animate__fadeIn">
    
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1 text-dark">
                <i class="fa-solid fa-calendar-check me-2 text-primary"></i>Komitmen Bayar
            </h4>
            <p class="text-muted small mb-0 fw-semibold">Monitoring Jadwal & Realisasi Janji</p>
        </div>
        
        <div class="d-flex flex-column align-items-end">
            <input type="month" id="filter-janji" 
                   class="form-control form-control-sm border-0 shadow-sm rounded-pill px-3 fw-bold text-primary" 
                   style="width: 150px; cursor: pointer;" 
                   onchange="loadJanjiBayar()">
        </div>
    </div>

    <div id="summary-janji" class="mb-4"></div>

    <div id="list-janji-container">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted small mt-2 fw-bold">Memuat jadwal...</p>
        </div>
    </div>
</div>

<script>
    const USER_ROLE = "{{ session['role'] }}";
    const PETUGAS_ID = "{{ session['petugas_id'] }}";

    function showNotify(msg, type = 'dark') {
        const toastEl = document.getElementById('statusToast');
        const msgEl = document.getElementById('toastMessage');
        msgEl.innerText = msg;
        toastEl.className = `toast align-items-center text-white bg-${type} border-0 rounded-4 shadow-lg`;
        const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
        toast.show();
    }

    function initPicker() {
        const now = new Date();
        document.getElementById('filter-janji').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    }

    async function loadJanjiBayar() {
        const pickerValue = document.getElementById('filter-janji').value;
        const container = document.getElementById('list-janji-container');
        const summary = document.getElementById('summary-janji');
        
        if (!pickerValue) return;
        const [year, month] = pickerValue.split('-');
        const periode = `${month}-${year}`;

        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';

        try {
            const res = await fetch(`/api/performance/reminders?periode=${periode}`);
            const data = await res.json();
            
            if (!data || data.length === 0) {
                summary.innerHTML = '';
                container.innerHTML = `
                    <div class="text-center mt-5 py-5 text-muted">
                        <i class="fa-regular fa-calendar-xmark fa-3x mb-3 opacity-50"></i>
                        <p class="small fw-bold">Tidak ada jadwal janji bayar pada periode ini.</p>
                    </div>`;
                return;
            }

            const totalNominal = data.reduce((acc, curr) => acc + (Number(curr.nominal) || 0), 0);
            
            summary.innerHTML = `
                <div class="card border-0 shadow-sm rounded-4 bg-white border-start border-4 border-primary">
                    <div class="card-body p-3 d-flex justify-content-between align-items-center">
                        <div>
                            <small class="text-muted d-block text-uppercase fw-bold" style="font-size: 0.6rem; letter-spacing:1px;">Total Jadwal</small>
                            <span class="fw-800 text-dark h4 mb-0">${data.length} <small class="fw-bold h6 text-muted">Unit</small></span>
                        </div>
                        <div class="text-end">
                            <small class="text-muted d-block text-uppercase fw-bold" style="font-size: 0.6rem; letter-spacing:1px;">Potensi Tagihan</small>
                            <span class="fw-800 text-primary h4 mb-0">Rp ${totalNominal.toLocaleString('id-ID')}</span>
                        </div>
                    </div>
                </div>`;

            container.innerHTML = data.map((item, idx) => {
                const dateObj = new Date(item.tanggal_janji);
                const tglFormat = dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                const waLink = item.no_hp ? `https://wa.me/${item.no_hp.replace(/[^0-9]/g, '')}` : '#';
                
                const isLunas = item.status_bayar === 'LUNAS';
                const statusBadge = isLunas 
                    ? 'bg-success bg-opacity-10 text-success border border-success' 
                    : 'bg-warning bg-opacity-10 text-warning border border-warning';
                const statusIcon = isLunas ? 'fa-check-circle' : 'fa-clock';
                const labelStatus = isLunas ? 'SUDAH LUNAS' : `JATUH TEMPO: ${tglFormat}`;

                return `
                <div class="card border-0 shadow-sm rounded-4 mb-3 card-hover bg-white animate__animated animate__fadeInUp" style="animation-delay: ${idx * 0.05}s">
                    <div class="card-body p-3">
                        
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="badge ${statusBadge} rounded-pill px-3 py-1 fw-bold" style="font-size: 0.6rem;">
                                <i class="fa-solid ${statusIcon} me-1"></i>${labelStatus}
                            </span>
                            <small class="fw-bold text-muted font-monospace" style="font-size: 0.65rem;">${item.nomen}</small>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div>
                                <h6 class="fw-800 mb-0 text-dark text-uppercase small ${isLunas ? 'text-decoration-line-through text-muted' : ''}">${item.nama}</h6>
                                <small class="text-muted fw-bold" style="font-size: 0.65rem;">
                                    <i class="fa-solid fa-user-gear me-1 text-primary"></i>${item.petugas_name}
                                </small>
                            </div>
                            <div class="text-end">
                                <span class="d-block fw-800 ${isLunas ? 'text-success' : 'text-danger'}" style="font-size: 1rem;">
                                    Rp ${(Number(item.nominal) || 0).toLocaleString('id-ID')}
                                </span>
                            </div>
                        </div>

                        <div class="bg-light p-2 rounded-3 mb-3 border border-light">
                            <p class="mb-0 small text-muted fst-italic text-truncate" title="${item.catatan}">
                                <i class="fa-solid fa-quote-left me-2 text-secondary opacity-50"></i>${item.catatan || 'Tidak ada catatan khusus.'}
                            </p>
                        </div>

                        <div class="d-grid">
                            <a href="${waLink}" target="_blank" 
                               class="btn ${isLunas ? 'btn-outline-success' : 'btn-primary'} rounded-pill fw-bold py-2 shadow-sm ${!item.no_hp ? 'disabled' : ''}">
                                <i class="fa-brands fa-whatsapp fa-lg me-2"></i> ${isLunas ? 'KIRIM BUKTI LUNAS' : 'TAGIH SEKARANG'}
                            </a>
                        </div>

                    </div>
                </div>`;
            }).join('');

            showNotify(`Berhasil memuat ${data.length} jadwal komitmen`, "success");

        } catch (e) {
            console.error("Error:", e);
            container.innerHTML = '<div class="alert alert-danger mx-2 rounded-4 text-center small fw-bold">Gagal memuat data jadwal.</div>';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        initPicker();
        loadJanjiBayar();
    });
</script>

<style>
    .fw-800 { font-weight: 800; }
    .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; cursor: default; }
    .card-hover:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(37, 99, 235, 0.1) !important; border-color: #2563eb !important; }
    .btn-primary { background: #2563eb; border: none; transition: 0.3s; }
    .btn-primary:hover { background: #1e40af; transform: scale(1.02); }
</style>
{% endblock %}
