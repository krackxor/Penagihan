{% extends "base.html" %}
{% block content %}
<div class="px-2 pb-5 animate__animated animate__fadeIn">
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1 text-dark">Monitoring Janji Bayar 📅</h4>
            <p class="text-muted small mb-0">Daftar komitmen bayar per periode</p>
        </div>
        <input type="month" id="filter-janji" 
               class="form-control form-control-sm border-0 shadow-sm rounded-pill px-3" 
               style="width: 150px; font-size: 0.75rem;" 
               onchange="loadJanjiBayar()">
    </div>

    <div id="list-janji-container">
        <div class="text-center py-5">
            <div class="spinner-border text-primary"></div>
        </div>
    </div>
</div>

<script>
    // Set default value ke bulan berjalan saat ini
    function initPicker() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        document.getElementById('filter-janji').value = `${year}-${month}`;
    }

    async function loadJanjiBayar() {
        const pickerValue = document.getElementById('filter-janji').value;
        const container = document.getElementById('list-janji-container');
        
        if (!pickerValue) return;
        
        // Ubah YYYY-MM menjadi MM-YYYY untuk API
        const [year, month] = pickerValue.split('-');
        const periode = `${month}-${year}`;

        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';

        try {
            const res = await fetch(`/api/performance/reminders?periode=${periode}`);
            const data = await res.json();
            
            if (data.length === 0) {
                container.innerHTML = `
                    <div class="text-center mt-5">
                        <i class="fas fa-calendar-day fa-3x text-muted mb-3 opacity-20"></i>
                        <p class="text-muted">Tidak ada data janji bayar di bulan ini.</p>
                    </div>`;
                return;
            }

            container.innerHTML = data.map(item => {
                // Format tanggal janji agar lebih enak dibaca
                const dateObj = new Date(item.janji_bayar_dt);
                const tglFormat = dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

                return `
                <div class="card border-0 shadow-sm rounded-4 mb-3 border-start border-warning border-4">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div>
                                <small class="text-warning fw-bold text-uppercase" style="font-size: 9px;">Janji: ${tglFormat}</small>
                                <h6 class="fw-bold mb-0 text-dark mt-1">${item.nama}</h6>
                                <small class="text-muted" style="font-size: 11px;">IDPEL: ${item.nomen}</small>
                            </div>
                            <div class="text-end">
                                <span class="fw-bold text-danger d-block">Rp ${Number(item.nominal).toLocaleString('id-ID')}</span>
                            </div>
                        </div>
                        <div class="bg-light p-2 rounded-3 mt-2 small">
                            <div class="mb-1"><strong><i class="fas fa-user-tie me-1"></i> Petugas:</strong> ${item.petugas_name}</div>
                            <div><strong><i class="fas fa-sticky-note me-1"></i> Note:</strong> <i>${item.catatan || 'Tidak ada catatan'}</i></div>
                        </div>
                        <div class="row g-2 mt-2">
                            <div class="col-12">
                                <a href="https://wa.me/${item.no_hp ? item.no_hp.replace(/[^0-9]/g, '') : ''}" 
                                   class="btn btn-success w-100 btn-sm rounded-3 fw-bold py-2 shadow-sm ${!item.no_hp ? 'disabled' : ''}">
                                    <i class="fab fa-whatsapp me-1"></i> HUBUNGI SEKARANG
                                </a>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        } catch (e) {
            container.innerHTML = '<div class="alert alert-danger">Koneksi API bermasalah.</div>';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        initPicker();
        loadJanjiBayar();
    });
</script>

<style>
    .border-warning { border-color: #f59e0b !important; }
    .bg-warning-subtle { background-color: #fef3c7; color: #92400e; }
</style>
{% endblock %}
