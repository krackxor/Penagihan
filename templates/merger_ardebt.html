<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Merge TXT Mainbill PRO</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        body{
            background:#f1f5f9;
            font-family:Arial, sans-serif;
        }

        .card-box{
            background:white;
            border-radius:20px;
            padding:40px;
            margin-top:40px;
            box-shadow:0 10px 30px rgba(0,0,0,0.05);
        }

        .drop-zone{
            border:2px dashed #cbd5e1;
            border-radius:16px;
            background:#f8fafc;
            padding:50px;
            text-align:center;
            cursor:pointer;
            transition:0.3s;
        }

        .drop-zone:hover{
            background:#eff6ff;
            border-color:#2563eb;
        }

        .log-box{
            background:#0f172a;
            color:#22c55e;
            padding:15px;
            border-radius:12px;
            height:250px;
            overflow:auto;
            font-size:13px;
            margin-top:20px;
        }

        .summary-card{
            border-radius:16px;
            padding:20px;
            background:white;
            box-shadow:0 5px 15px rgba(0,0,0,0.05);
        }

        table{
            font-size:13px;
        }

    </style>
</head>
<body>

<div class="container">

    <div class="card-box">

        <div class="text-center mb-4">

            <i class="fa-solid fa-database fa-3x text-primary mb-3"></i>

            <h2 class="fw-bold">
                Merge TXT Mainbill PRO
            </h2>

            <p class="text-muted">
                Gabungkan banyak file TXT jadi 1 file tanpa duplicate header.
            </p>

        </div>

        <div class="drop-zone"
             onclick="document.getElementById('files').click()">

            <i class="fa-solid fa-cloud-arrow-up fa-3x mb-3 text-secondary"></i>

            <h5>
                Upload Banyak File TXT
            </h5>

            <p class="text-muted mb-0">
                Bisa 7 file atau lebih
            </p>

            <input
                type="file"
                id="files"
                accept=".txt,.csv"
                multiple
                hidden>

        </div>

        <div class="row mt-4">

            <div class="col-md-3">
                <div class="summary-card">
                    <small class="text-muted">Total File</small>
                    <h3 id="totalFiles">0</h3>
                </div>
            </div>

            <div class="col-md-3">
                <div class="summary-card">
                    <small class="text-muted">Total Rows</small>
                    <h3 id="totalRows">0</h3>
                </div>
            </div>

            <div class="col-md-3">
                <div class="summary-card">
                    <small class="text-muted">Header Dihapus</small>
                    <h3 id="headerRemoved">0</h3>
                </div>
            </div>

            <div class="col-md-3">
                <div class="summary-card">
                    <small class="text-muted">Ukuran Total</small>
                    <h3 id="totalSize">0 MB</h3>
                </div>
            </div>

        </div>

        <button
            onclick="mergeFiles()"
            class="btn btn-primary btn-lg w-100 mt-4 fw-bold">

            <i class="fa-solid fa-wand-magic-sparkles me-2"></i>
            GABUNGKAN FILE
        </button>

        <div class="log-box mt-4" id="logs">
            SYSTEM READY...
        </div>

        <div class="table-responsive mt-4">

            <table class="table table-bordered table-hover">

                <thead class="table-primary">

                    <tr>
                        <th>File</th>
                        <th>Rows</th>
                        <th>Size</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody id="previewTable"></tbody>

            </table>

        </div>

    </div>

</div>

<script>

const HEADER =
`"LOADRDP";"PROCESS_PERIODE";"BILL_ID";"THN_BILL";"NOMEN";"BILL_PERIODE";"BILL_AMT";"WATER";"BEB";"SEW";"MATERAI";"TAX";"DENDA"`;


let selectedFiles = [];

document
.getElementById('files')
.addEventListener('change', function(e){

    selectedFiles = [...e.target.files];

    renderPreview();

});


function log(message){

    const logs = document.getElementById('logs');

    logs.innerHTML += `<br>> ${message}`;

    logs.scrollTop = logs.scrollHeight;

}


function renderPreview(){

    const tbody =
        document.getElementById('previewTable');

    tbody.innerHTML = '';

    let totalSize = 0;

    selectedFiles.forEach(file=>{

        totalSize += file.size;

        tbody.innerHTML += `
            <tr>
                <td>${file.name}</td>
                <td>-</td>
                <td>${(file.size / 1024 / 1024).toFixed(2)} MB</td>
                <td>
                    <span class="badge bg-success">
                        READY
                    </span>
                </td>
            </tr>
        `;
    });

    document.getElementById('totalFiles').innerText =
        selectedFiles.length;

    document.getElementById('totalSize').innerText =
        (totalSize / 1024 / 1024).toFixed(2) + ' MB';

}


async function mergeFiles(){

    if(selectedFiles.length === 0){

        alert('Pilih file dulu');

        return;

    }

    log('START MERGE PROCESS...');

    let mergedData = [];

    let totalRows = 0;

    let headerRemoved = 0;

    /*
    HEADER 1X SAJA
    */
    mergedData.push(HEADER);

    for(let i=0;i<selectedFiles.length;i++){

        const file = selectedFiles[i];

        log(`MEMBACA: ${file.name}`);

        const text =
            await file.text();

        /*
        Pecah per baris
        */
        let lines =
            text.split(/\r?\n/);

        /*
        Buang kosong
        */
        lines =
            lines.filter(line =>
                line.trim() !== ''
            );

        log(`TOTAL LINE: ${lines.length}`);

        /*
        Loop line
        */
        for(let x=0;x<lines.length;x++){

            let line =
                lines[x].trim();

            /*
            Buang HEADER DUPLIKAT
            */
            if(
                line
                .replace(/\s/g,'')
                .toUpperCase()
                ===
                HEADER
                .replace(/\s/g,'')
                .toUpperCase()
            ){

                headerRemoved++;

                continue;
            }

            /*
            Skip line kosong
            */
            if(line === ''){

                continue;

            }

            mergedData.push(line);

            totalRows++;

        }

        log(`SELESAI: ${file.name}`);

    }

    /*
    EXPORT
    */
    const finalText =
        mergedData.join('\r\n');

    const blob = new Blob(
        ["\uFEFF" + finalText],
        {
            type:'text/plain;charset=utf-8;'
        }
    );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement('a');

    a.href = url;

    a.download =
        'MERGED_MAINBILL.txt';

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    URL.revokeObjectURL(url);

    /*
    SUMMARY
    */
    document.getElementById('totalRows').innerText =
        totalRows.toLocaleString();

    document.getElementById('headerRemoved').innerText =
        headerRemoved.toLocaleString();

    log('MERGE SUCCESS');
    log(`TOTAL ROWS: ${totalRows}`);
    log(`HEADER REMOVED: ${headerRemoved}`);

    alert('BERHASIL DIGABUNGKAN');

}

</script>

</body>
</html>
