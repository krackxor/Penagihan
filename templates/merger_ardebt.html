<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabung File Ardebt - AREA SERVICE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { background: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; color: #334155; }
        
        .navbar { background: rgba(15, 23, 42, 0.95); padding: 15px 0; }
        .navbar-brand { font-weight: 800; font-size: 1.4rem; color: white !important; text-decoration: none;}

        .card-box {
            background: white; border-radius: 20px; padding: 40px;
            margin-top: 40px; margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .drop-zone {
            border: 2px dashed #cbd5e1; border-radius: 16px; background: #f8fafc;
            padding: 50px 20px; text-align: center; cursor: pointer; transition: 0.3s;
        }
        .drop-zone:hover { background: #eff6ff; border-color: #2563eb; }

        .log-box {
            background: #0f172a; color: #22c55e; padding: 15px; border-radius: 12px;
            height: 250px; overflow: auto; margin-top: 20px; white-space: pre-wrap;
            font-size: 13px; font-family: monospace;
        }

        .progress { height: 30px; border-radius: 50px; overflow: hidden; background-color: #e2e8f0; }
        .progress-bar { font-weight: bold; background-color: #2563eb; transition: width 0.2s ease; }

        .summary-card {
            border-radius: 16px; padding: 20px; background: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); height: 100%; border: 1px solid #f1f5f9;
            text-align: center;
        }
        .summary-card h3 { font-weight: 800; color: #0f172a; margin-top: 5px; font-size: 1.5rem;}
        table { font-size: 13px; }
    </style>
</head>
<body>

<nav class="navbar shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">
            <i class="fa-solid fa-droplet text-info me-2"></i>AREA SERVICE
        </a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <a href="{{ url_for('index') }}" class="btn btn-outline-light rounded-pill px-4 fw-bold btn-sm">
                <i class="fa-solid fa-arrow-left me-2"></i>KEMBALI
            </a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card-box">
        <div class="text-center mb-4">
            <i class="fa-solid fa-object-group fa-3x text-primary mb-3"></i>
            <h3 class="fw-bold text-dark mb-2">Gabung File Ardebt</h3>
            <p class="text-muted small">Gabungkan banyak file TXT menjadi satu file dengan cepat dan rapi.</p>
        </div>

        <div class="drop-zone" onclick="document.getElementById('files').click()">
            <i class="fa-solid fa-file-arrow-up fa-3x mb-3 text-secondary"></i>
            <h5 class="fw-bold text-dark mb-1">Pilih File TXT</h5>
            <p class="text-muted small mb-0">Bisa langsung pilih banyak file sekaligus.</p>
            <input type="file" id="files" accept=".txt,.csv" multiple hidden>
        </div>

        <div class="row mt-4 g-3">
            <div class="col-6 col-md-3">
                <div class="summary-card">
                    <small class="text-muted fw-bold">Total File</small>
                    <h3 id="totalFiles">0</h3>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="summary-card">
                    <small class="text-muted fw-bold">Total Ukuran</small>
                    <h3 id="totalSize">0 MB</h3>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="summary-card">
                    <small class="text-muted fw-bold">Total Baris</small>
                    <h3 id="totalRowsTxt">0</h3>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="summary-card">
                    <small class="text-muted fw-bold">Judul Dihapus</small>
                    <h3 id="headerRemovedTxt">0</h3>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <div class="d-flex justify-content-between mb-2">
                <span class="fw-bold text-dark">Proses Gabung</span>
                <span id="progressText" class="fw-bold text-primary">0%</span>
            </div>
            <div class="progress">
                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width:0%">0%</div>
            </div>
        </div>

        <button id="mergeBtn" class="btn btn-primary btn-lg w-100 mt-4 fw-bold shadow-sm" style="border-radius: 12px; padding: 15px;">
            <i class="fa-solid fa-play me-2"></i> GABUNGKAN FILE
        </button>

        <button id="downloadBtn" class="btn btn-success btn-lg w-100 mt-3 fw-bold shadow-sm" style="display:none; border-radius: 12px; padding: 15px;">
            <i class="fa-solid fa-download me-2"></i> DOWNLOAD HASIL
        </button>

        <div id="logs" class="log-box">Sistem siap.</div>

        <div class="table-responsive mt-4">
            <table class="table table-bordered table-hover">
                <thead class="table-primary">
                    <tr>
                        <th>Nama File</th>
                        <th>Ukuran</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="previewTable"></tbody>
            </table>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    const filesInput = document.getElementById('files');
    const mergeBtn = document.getElementById('mergeBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const logs = document.getElementById('logs');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const previewTable = document.getElementById('previewTable');
    
    // Potong file per 20MB biar aman di memori
    const CHUNK_SIZE = 20 * 1024 * 1024; 
    let finalBlobUrl = null;

    // Header mutlak untuk Ardebt
    const HEADER_MUTLAK = `"LOADRDP";"PROCESS_PERIODE";"BILL_ID";"THN_BILL";"NOMEN";"BILL_PERIODE";"BILL_AMT";"WATER";"BEB";"SEW";"MATERAI";"TAX";"DENDA"`;

    function log(message) {
        logs.innerHTML += '\n> ' + message;
        logs.scrollTop = logs.scrollHeight;
    }

    function updateProgress(percent) {
        percent = Math.floor(percent);
        if (percent > 100) percent = 100;
        progressBar.style.width = percent + '%';
        progressBar.innerText = percent + '%';
        progressText.innerText = percent + '%';
    }

    filesInput.addEventListener('change', () => {
        previewTable.innerHTML = '';
        let total = 0;

        Array.from(filesInput.files).forEach(file => {
            total += file.size;
            previewTable.innerHTML += `
                <tr>
                    <td>${file.name}</td>
                    <td>${(file.size / 1024 / 1024).toFixed(2)} MB</td>
                    <td><span class="badge bg-secondary">Menunggu</span></td>
                </tr>
            `;
        });

        document.getElementById('totalFiles').innerText = filesInput.files.length;
        document.getElementById('totalSize').innerText = (total / 1024 / 1024).toFixed(2) + ' MB';
    });

    mergeBtn.onclick = async () => {
        const files = filesInput.files;
        if (files.length === 0) {
            Swal.fire({
                icon: 'warning',
                title: 'Info',
                text: 'Pilih file-nya dulu ya.'
            });
            return;
        }

        downloadBtn.style.display = 'none';
        mergeBtn.disabled = true;
        updateProgress(0);

        log('=================================');
        log('Mulai menggabungkan file...');
        log('Menyiapkan header otomatis...');
        log('=================================');

        let outputBlobs = [new Blob([HEADER_MUTLAK + "\r\n"])]; 
        
        let totalRows = 0;
        let headerRemoved = 0;

        let totalSizeAllFiles = 0;
        for (let f of files) totalSizeAllFiles += f.size;
        let processedSize = 0;

        for (let i = 0; i < files.length; i++) {
            let file = files[i];
            log(`\nMembaca file: ${file.name}`);
            previewTable.rows[i].cells[2].innerHTML = '<span class="badge bg-warning text-dark">Proses</span>';

            let offset = 0;
            let leftover = ""; 

            while (offset < file.size) {
                let slice = file.slice(offset, offset + CHUNK_SIZE);
                let text = await slice.text();
                
                let lines = (leftover + text).split(/\r?\n/);
                leftover = lines.pop(); 

                let validLines = [];

                for (let j = 0; j < lines.length; j++) {
                    let line = lines[j].trim();
                    if (line === "") continue;

                    // Buang header bawaan dari file asli
                    if (line.toUpperCase().includes("LOADRDP") || line.toUpperCase().includes("PROCESS_PERIODE")) {
                        headerRemoved++;
                        continue;
                    }

                    validLines.push(line);
                    totalRows++;
                }

                if (validLines.length > 0) {
                    outputBlobs.push(new Blob([validLines.join("\r\n") + "\r\n"]));
                }

                offset += CHUNK_SIZE;
                processedSize += slice.size;
                updateProgress((processedSize / totalSizeAllFiles) * 100);
            }

            // Sisa teks di akhir file
            if (leftover.trim() !== "") {
                if (leftover.toUpperCase().includes("LOADRDP") || leftover.toUpperCase().includes("PROCESS_PERIODE")) {
                    headerRemoved++;
                } else {
                    outputBlobs.push(new Blob([leftover.trim() + "\r\n"]));
                    totalRows++;
                }
            }

            previewTable.rows[i].cells[2].innerHTML = '<span class="badge bg-success">Selesai</span>';
        }

        log('\n=================================');
        log('Menyatukan semua data...');
        
        let finalBlob = new Blob(outputBlobs, { type: "text/plain;charset=utf-8" });
        if (finalBlobUrl) URL.revokeObjectURL(finalBlobUrl);
        finalBlobUrl = URL.createObjectURL(finalBlob);
        
        downloadBtn.onclick = () => {
            const a = document.createElement("a");
            a.href = finalBlobUrl;
            a.download = `Hasil_Gabung_Ardebt_(${files.length}_File).txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        document.getElementById('totalRowsTxt').innerText = totalRows.toLocaleString();
        document.getElementById('headerRemovedTxt').innerText = headerRemoved.toLocaleString();
        downloadBtn.style.display = 'block';
        mergeBtn.disabled = false;
        
        log(`Selesai.`);
        log(`Total baris: ${totalRows.toLocaleString()}`);
        log(`Judul yang dihapus: ${headerRemoved.toLocaleString()}`);
        
        Swal.fire({
            icon: 'success',
            title: 'Selesai',
            text: 'File sudah digabung dan siap didownload.'
        });
    };
</script>

</body>
</html>
