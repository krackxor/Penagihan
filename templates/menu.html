{% extends "base.html" %}
{% block content %}
<div class="container py-2 animate__animated animate__fadeIn">
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm bg-primary text-white">
                <div class="card-body p-3">
                    <div class="small opacity-75 mb-1 text-uppercase fw-bold" style="font-size: 0.65rem;">Kunjungan Hari Ini</div>
                    <h3 class="fw-bold mb-0" id="stat-kunjungan">0</h3>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm bg-success text-white">
                <div class="card-body p-3">
                    <div class="small opacity-75 mb-1 text-uppercase fw-bold" style="font-size: 0.65rem;">Sudah Bayar</div>
                    <h3 class="fw-bold mb-0" id="stat-bayar">0</h3>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm bg-warning text-dark">
                <div class="card-body p-3">
                    <div class="small opacity-75 mb-1 text-uppercase fw-bold" style="font-size: 0.65rem;">Total Pelanggan</div>
                    <h3 class="fw-bold mb-0" id="stat-pelanggan">0</h3>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card border-0 shadow-sm bg-white border-start border-4 border-info">
                <div class="card-body p-3">
                    <div class="small text-muted mb-1 text-uppercase fw-bold" style="font-size: 0.65rem;">Efektivitas</div>
                    <h3 class="fw-bold mb-0 text-info" id="stat-efektivitas">0%</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white border-0 py-3">
                    <h6 class="fw-bold mb-0"><i class="fas fa-chart-bar me-2 text-primary"></i>Produktivitas Petugas (%)</h6>
                </div>
                <div class="card-body">
                    <canvas id="chartPerforma" style="max-height: 300px;"></canvas>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-white border-0 py-3 d-flex justify-content-between align-items-center">
                    <h6 class="fw-bold mb-0"><i class="fas fa-trophy me-2 text-warning"></i>Leaderboard</h6>
                    <a href="/history" class="small text-decoration-none">Lihat Semua</a>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light small">
                            <tr>
                                <th class="ps-3">Petugas</th>
                                <th class="text-center">Kunj.</th>
                                <th class="text-end pe-3">Skor</th>
                            </tr>
                        </thead>
                        <tbody id="table-leaderboard" class="border-top-0">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
async function loadDashboardData() {
    try {
        // 1. Ambil Statistik Global
        const resStats = await fetch('/api/performance/stats-global');
        const stats = await resStats.json();
        
        document.getElementById('stat-kunjungan').innerText = stats.kunjungan_hari_ini;
        document.getElementById('stat-bayar').innerText = stats.bayar_bulan_ini;
        document.getElementById('stat-pelanggan').innerText = stats.total_pelanggan;
        
        const efektivitas = stats.total_pelanggan > 0 ? ((stats.bayar_bulan_ini / stats.total_pelanggan) * 100).toFixed(1) : 0;
        document.getElementById('stat-efektivitas').innerText = efektivitas + '%';

        // 2. Ambil Data Leaderboard & Grafik
        const resLeader = await fetch('/api/performance/leaderboard');
        const leaders = await resLeader.json();

        // Render Tabel
        let tableHtml = '';
        leaders.forEach(l => {
            tableHtml += `
                <tr>
                    <td class="ps-3 fw-bold small">${l.petugas}</td>
                    <td class="text-center small">${l.total_dikunjungi}</td>
                    <td class="text-end pe-3">
                        <span class="badge bg-primary-subtle text-primary">${l.performa}%</span>
                    </td>
                </tr>`;
        });
        document.getElementById('table-leaderboard').innerHTML = tableHtml;

        // Render Grafik
        const ctx = document.getElementById('chartPerforma').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: leaders.map(l => l.petugas),
                datasets: [{
                    label: 'Performa %',
                    data: leaders.map(l => l.performa),
                    backgroundColor: 'rgba(13, 110, 253, 0.8)',
                    borderRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, max: 100 } }
            }
        });

    } catch (e) {
        console.error("Gagal memuat dashboard:", e);
    }
}

document.addEventListener('DOMContentLoaded', loadDashboardData);
</script>
{% endblock %}
