<script>
    // Fungsi untuk mengupdate angka sisa target di menu
    async function updateMenuBadge() {
        try {
            const res = await fetch('/api/performance/full-stats');
            const data = await res.json();
            const badge = document.getElementById('badge-menu-target');
            if (data.global && data.global.sisa_target !== undefined) {
                badge.innerText = data.global.sisa_target.toLocaleString();
            }
        } catch (e) {
            console.warn("Gagal update badge menu");
        }
    }
    
    document.addEventListener('DOMContentLoaded', updateMenuBadge);
</script>
