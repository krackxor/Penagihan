{% extends "base.html" %}

{% block content %}
<div class="px-2 pb-5 animate__animated animate__fadeIn">
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1">WA Blast Tagihan 🚀</h4>
            <p class="text-muted small mb-0">Manajemen pengiriman otomatis</p>
        </div>
        <div id="status-koneksi">
            <span class="badge bg-success-subtle text-success rounded-pill px-3 py-2 border border-success-subtle">
                <i class="fas fa-circle me-1 animate__animated animate__flash animate__infinite" style="font-size: 0.5rem;"></i> WA Connected
            </span>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-3">
        <div class="card-body p-3">
            <div class="d-flex align-items-center mb-3">
                <div class="bg-primary-subtle text-primary rounded-3 p-2 me-2">
                    <i class="fas fa-cog"></i>
                </div>
                <h6 class="fw-bold mb-0 small">Konfigurasi Pesan</h6>
            </div>
            
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Target Penerima</label>
                <select id="target-filter" class="form-select border-0 bg-light rounded-3 shadow-none py-2">
                    <option value="all">Semua Belum Bayar (MC)</option>
                    <option value="janji">Hanya Janji Bayar</option>
                    <option value="tunggakan">Tunggakan > 3 Bulan</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Template Pesan</label>
                <textarea id="msg-template" class="form-control border-0 bg-light rounded-3 small py-3 shadow-none" rows="6" placeholder="Tulis pesan di sini...">
Halo Bapak/Ibu *{nama}*,
Kami dari Tim Billing Sunter ingin menginformasikan tagihan dengan Nomen: *{nomen}*.
Total tagihan Anda: *Rp {nominal}*.

Mohon segera melakukan pembayaran. Abaikan jika sudah lunas. Terima kasih.</textarea>
                <div class="mt-2 d-flex flex-wrap gap-1">
                    <span class="badge bg-white text-muted border" style="font-size: 0.65rem;">{nama}</span>
                    <span class="badge bg-white text-muted border" style="font-size: 0.65rem;">{nomen}</span>
                    <span class="badge bg-white text-muted border" style="font-size: 0.65rem;">{nominal}</span>
                </div>
            </div>

            <button onclick="previewBlast()" class="btn btn-primary w-100 rounded-3 fw-bold py-2 shadow-sm">
                <i class="fas fa-tasks me-2"></i> ANALISIS TARGET
            </button>
        </div>
    </div>

    <div id="preview-section" class="d-none animate__animated animate__fadeInUp">
        <div class="card border-0 shadow-sm rounded-4 mb-3 border-start border-warning border-4">
            <div class="card-body p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h2 class="fw-bold mb-0 text-dark" id="target-count">0</h2>
                        <small class="text-muted fw-bold" style="font-size: 0.7rem;">KONTAK TERDETEKSI</small>
                    </div>
                    <button onclick="startBlast()" id="btn-start" class="btn btn-success rounded-pill px-4 fw-bold shadow-sm py-2">
                        KIRIM <i class="fas fa-paper-plane ms-2"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-lg rounded-4 bg-dark overflow-hidden">
            <div class="card-header bg-transparent border-0 pt-3 px-3 d-flex justify-content-between align-items-center">
                <h6 class="text-white-50 fw-bold mb-0 small" style="letter-spacing: 1px;">WA-BLAST TERMINAL</h6>
                <div id="blast-percent-text" class="text-success fw-bold small">0%</div>
            </div>
            <div class="card-body pt-2">
                <div class="progress mb-3 bg-secondary bg-opacity-25" style="height: 6px; border-radius: 10px;">
                    <div id="blast-progress" class="progress-bar bg-success progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                </div>
                <div id="log-list" class="small text-white-50 overflow-auto rounded-3 p-2 bg-black bg-opacity-25" style="max-height: 180px; font-family: 'Courier New', Courier, monospace; line-height: 1.5;">
                    <span class="text-warning">> Waiting for process...</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let targetList = [];

async function previewBlast() {
    const logList = document.getElementById('log-list');
    
    // UI Feedback
    Swal.fire({
        title: 'Mencari Kontak...',
        didOpen: () => { Swal.showLoading(); },
        timer: 1000,
        showConfirmButton: false
    });

    try {
        // Mengambil data dari endpoint yang sudah ada
        const res = await fetch(`/api/belum-bayar`); 
        targetList = await res.json();
        
        document.getElementById('target-count').innerText = targetList.length;
        document.getElementById('preview-section').classList.remove('d-none');
        logList.innerHTML = `<div class="text-success fw-bold">> [SYSTEM] Terdeteksi ${targetList.length} kontak siap dikirim.</div>`;
    } catch (e) {
        Swal.fire('Error', 'Gagal memuat daftar target', 'error');
    }
}

async function startBlast() {
    const btn = document.getElementById('btn-start');
    const logList = document.getElementById('log-list');
    const progressBar = document.getElementById('blast-progress');
    const progressText = document.getElementById('blast-percent-text');
    const template = document.getElementById('msg-template').value;

    const confirm = await Swal.fire({
        title: 'Mulai Blast?',
        text: `Sistem akan mengirim pesan ke ${targetList.length} kontak.`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'Ya, Kirim Sekarang',
        borderRadius: '1rem'
    });

    if (!confirm.isConfirmed) return;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>PROSES...';

    for (let i = 0; i < targetList.length; i++) {
        const item = targetList[i];
        
        // Logika Replace Variable
        let message = template
            .replace(/{nama}/g, item.nama)
            .replace(/{nomen}/g, item.idpel || item.nomen)
            .replace(/{nominal}/g, Number(item.total_tagihan || item.nominal).toLocaleString('id-ID'));

        // Simulasi Update Log (Frontend Only)
        const logEntry = document.createElement('div');
        logEntry.classList.add('mb-1');
        logEntry.innerHTML = `<span class="text-info">[${i+1}/${targetList.length}]</span> Mengirim ke ${item.nama}...`;
        logList.prepend(logEntry);

        // Update Progress UI
        const percent = Math.round(((i + 1) / targetList.length) * 100);
        progressBar.style.width = percent + '%';
        progressText.innerText = percent + '%';

        // Jeda 3 detik (Anti-Spam)
        await new Promise(resolve => setTimeout(resolve, 3000));
        
        logEntry.innerHTML += ' <span class="text-success fw-bold">OK</span>';
    }

    Swal.fire({
        icon: 'success',
        title: 'Blast Selesai!',
        text: 'Semua pesan telah masuk antrean pengiriman.',
        confirmButtonColor: '#198754'
    });
    
    btn.innerHTML = '<i class="fas fa-check-circle me-1"></i> SELESAI';
    btn.classList.replace('btn-success', 'btn-outline-success');
}
</script>

<style>
    .bg-success-subtle { background-color: #e1f7ec; }
    .bg-primary-subtle { background-color: #e7f1ff; }
    #log-list::-webkit-scrollbar { width: 4px; }
    #log-list::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
</style>
{% endblock %}
