{% extends "base.html" %}

{% block content %}
<div class="animate__animated animate__fadeIn px-2 pb-5">
    <div class="pt-4 mb-4 text-center">
        <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
            <i class="fab fa-whatsapp fa-2x"></i>
        </div>
        <h4 class="fw-bold mb-1">WhatsApp Blast</h4>
        <p class="text-muted small">Kirim pengingat tagihan ke pelanggan MC</p>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-3">
        <div class="card-body p-3">
            <div class="row align-items-center">
                <div class="col-7">
                    <select id="filter-pcez" class="form-select border-0 bg-light rounded-3 shadow-none small">
                        <option value="all">Semua Wilayah (PCEZ)</option>
                    </select>
                </div>
                <div class="col-5 text-end">
                    <span class="badge bg-danger rounded-pill px-3 py-2" id="count-target">0 Target</span>
                </div>
            </div>
        </div>
    </div>

    <div id="blast-container">
        <div class="text-center py-5">
            <div class="spinner-border text-primary spinner-border-sm"></div>
            <p class="text-muted small mt-2">Mencari data yang belum lunas...</p>
        </div>
    </div>
</div>

<script>
    const container = document.getElementById('blast-container');
    const filterPcez = document.getElementById('filter-pcez');
    const countTarget = document.getElementById('count-target');

    // Format Rupiah
    const toIDR = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);

    // Load Daftar Wilayah untuk Filter
    async function loadPcezList() {
        const res = await fetch('/api/performance/full-stats');
        const data = await res.json();
        // Logika sederhana mengambil PCEZ unik dari data list jika diperlukan, 
        // sementara kita load data blast langsung.
    }

    // Load Data Blast (Hanya yang belum lunas)
    async function loadBlastData() {
        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';
        
        try {
            // Menggunakan API yang sama dengan belum-bayar karena filternya identik (MC & Belum Lunas)
            const res = await fetch(`/api/belum-bayar/list?petugas=all`);
            const data = await res.json();
            
            countTarget.innerText = `${data.length} Target`;

            if (data.length === 0) {
                container.innerHTML = '<div class="text-center py-5 text-muted small">Semua sudah lunas. Tidak ada pesan yang perlu dikirim.</div>';
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="card border-0 shadow-sm rounded-4 mb-2">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <div style="max-width: 70%;">
                                <div class="fw-bold text-dark text-truncate">${item.nama}</div>
                                <div class="small text-muted">${item.nomen} | ${item.pcez}</div>
                                <div class="fw-bold text-danger small">${toIDR(item.total)}</div>
                            </div>
                            <button class="btn btn-success rounded-circle shadow-sm" onclick="sendWhatsApp('${item.nama}', '${item.nomen}', '${item.total}', '${item.no_hp}')" style="width: 45px; height: 45px;">
                                <i class="fab fa-whatsapp fa-lg"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            container.innerHTML = `<div class="alert alert-danger small">${e.message}</div>`;
        }
    }

    // Fungsi Kirim Pesan WA
    function sendWhatsApp(nama, nomen, total, hp) {
        if (!hp || hp === 'None' || hp === '') {
            Swal.fire({
                title: 'No HP Kosong',
                text: 'Silakan update nomor HP pelanggan terlebih dahulu di menu Daftar Penagihan.',
                icon: 'warning',
                confirmButtonColor: '#0d6efd'
            });
            return;
        }

        const pesan = `Halo Bapak/Ibu *${nama}*,\n\nKami dari *Petugas Penagihan Sunter*.\nIngin menginformasikan mengenai tagihan air Anda dengan nomor *${nomen}* sebesar *${toIDR(total)}*.\n\nMohon segera melakukan pembayaran melalui kanal resmi kami. Jika sudah membayar, abaikan pesan ini.\n\nTerima kasih.`;
        
        const cleanHp = hp.startsWith('0') ? '62' + hp.substring(1) : hp;
        const waUrl = `https://api.whatsapp.com/send?phone=${cleanHp}&text=${encodeURIComponent(pesan)}`;
        
        window.open(waUrl, '_blank');
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadBlastData();
    });
</script>

<style>
    .bg-primary-subtle { background-color: #e7f0ff; }
    .btn-success { background-color: #25d366; border: none; }
    .btn-success:hover { background-color: #1ebe57; }
</style>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
{% endblock %}
