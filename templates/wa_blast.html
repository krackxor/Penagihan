{% extends "base.html" %}
{% block content %}
<div class="px-2 pb-5 animate__animated animate__fadeIn">
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1">WA Blast Tagihan 🚀</h4>
            <p class="text-muted small mb-0">Manajemen pengiriman pesan tagihan otomatis</p>
        </div>
        <div id="status-koneksi">
            <span class="badge bg-success-subtle text-success rounded-pill px-3 py-2">
                <i class="fas fa-link me-1"></i> WA Connected
            </span>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-3">
        <div class="card-body p-3">
            <h6 class="fw-bold mb-3 small"><i class="fas fa-cog me-2 text-primary"></i>Konfigurasi Pesan</h6>
            
            <div class="mb-3">
                <label class="form-label small fw-bold">Pilih Kelompok Target</label>
                <select id="target-filter" class="form-select border-0 bg-light rounded-3">
                    <option value="all">Semua Belum Bayar (MC)</option>
                    <option value="janji">Hanya Janji Bayar</option>
                    <option value="tunggakan">Tunggakan > 3 Bulan (Ardebt)</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Template Pesan</label>
                <textarea id="msg-template" class="form-control border-0 bg-light rounded-3 small" rows="5">
Halo Bapak/Ibu *{nama}*,
Kami dari Tim Billing Sunter ingin menginformasikan tagihan air dengan Nomen: *{nomen}*.
Total tagihan Anda bulan ini sebesar: *Rp {nominal}*.

Mohon segera melakukan pembayaran. Abaikan jika sudah membayar. Terima kasih.
                </textarea>
                <div class="mt-2">
                    <span class="badge bg-secondary-subtle text-secondary" style="font-size: 0.6rem;">{nama}</span>
                    <span class="badge bg-secondary-subtle text-secondary" style="font-size: 0.6rem;">{nomen}</span>
                    <span class="badge bg-secondary-subtle text-secondary" style="font-size: 0.6rem;">{nominal}</span>
                </div>
            </div>

            <button onclick="previewBlast()" class="btn btn-primary w-100 rounded-3 fw-bold py-2">
                <i class="fas fa-search me-2"></i> CEK JUMLAH TARGET
            </button>
        </div>
    </div>

    <div id="preview-section" class="d-none">
        <div class="card border-0 shadow-sm rounded-4 mb-3 border-start border-warning border-4">
            <div class="card-body p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h2 class="fw-bold mb-0" id="target-count">0</h2>
                        <small class="text-muted">Kontak siap dikirim</small>
                    </div>
                    <button onclick="startBlast()" id="btn-start" class="btn btn-success rounded-pill px-4 fw-bold">
                        KIRIM SEKARANG <i class="fas fa-paper-plane ms-2"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4 bg-dark">
            <div class="card-header bg-transparent border-0 pt-3 px-3">
                <h6 class="text-white fw-bold mb-0 small">Log Pengiriman</h6>
            </div>
            <div class="card-body">
                <div class="progress mb-3 bg-secondary" style="height: 5px;">
                    <div id="blast-progress" class="progress-bar bg-success" role="progressbar" style="width: 0%"></div>
                </div>
                <div id="log-list" class="small text-white-50 overflow-auto" style="max-height: 150px; font-family: monospace;">
                    > Menunggu perintah...
                </div>
            </div>
        </div>
    </div>
</div>



<script>
let targetList = [];

async function previewBlast() {
    const target = document.getElementById('target-filter').value;
    const logList = document.getElementById('log-list');
    
    // Simulasi Fetch Data Target dari API MC/Ardebt
    // Di backend, Anda harus membuat rute /api/wa-blast/preview
    const res = await fetch(`/api/belum-bayar/list?limit=1000`); 
    targetList = await res.json();
    
    document.getElementById('target-count').innerText = targetList.length;
    document.getElementById('preview-section').classList.remove('d-none');
    logList.innerHTML = `> Terdeteksi ${targetList.length} target. Siap kirim.`;
}

async function startBlast() {
    const btn = document.getElementById('btn-start');
    const logList = document.getElementById('log-list');
    const progressBar = document.getElementById('blast-progress');
    const template = document.getElementById('msg-template').value;

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Mengirim...';

    for (let i = 0; i < targetList.length; i++) {
        const item = targetList[i];
        
        // Logika Pengiriman dengan Jeda (Anti-Spam)
        // Kirim request ke API WA Gateway Anda
        let message = template
            .replace('{nama}', item.nama)
            .replace('{nomen}', item.nomen)
            .replace('{nominal}', item.nominal.toLocaleString());

        // Update Log
        const logEntry = document.createElement('div');
        logEntry.innerText = `> [${i+1}/${targetList.length}] Mengirim ke ${item.nama}...`;
        logList.prepend(logEntry);

        // Update Progress
        const percent = ((i + 1) / targetList.length) * 100;
        progressBar.style.width = percent + '%';

        // Jeda 3-5 detik agar tidak diblokir WhatsApp
        await new Promise(resolve => setTimeout(resolve, 3000));
        
        logEntry.innerText += " ✅ Berhasil";
        logEntry.classList.add('text-success');
    }

    Swal.fire('Selesai!', 'Semua pesan berhasil dikirim.', 'success');
    btn.innerHTML = 'KIRIM SELESAI';
}
</script>
{% endblock %}
