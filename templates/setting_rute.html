{% extends "base.html" %}
{% block content %}
<div class="container py-4 animate__animated animate__fadeIn">
    <div class="mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1">Pengaturan Mapping Rute 🗺️</h4>
            <p class="text-muted small mb-0">Hubungkan Kode PCEZ dengan Petugas Lapangan</p>
        </div>
        <button class="btn btn-outline-primary btn-sm rounded-pill px-3" onclick="loadRute()">
            <i class="fas fa-sync-alt me-1"></i> Refresh
        </button>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-3 bg-primary text-white d-none" id="mass-toolbar">
        <div class="card-body p-3 d-flex justify-content-between align-items-center">
            <span class="small fw-bold"><i class="fas fa-check-double me-2"></i><span id="selected-count">0</span> Rute Terpilih</span>
            <div class="d-flex gap-2">
                <select id="mass-petugas" class="form-select form-select-sm border-0 rounded-3 shadow-none" style="width: 150px;">
                    <option value="">-- Pilih Petugas --</option>
                </select>
                <button class="btn btn-light btn-sm fw-bold px-3 rounded-3" onclick="processMassUpdate()">Update</button>
                <button class="btn btn-close btn-close-white" onclick="cancelSelection()"></button>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="p-3 bg-white border-bottom">
            <div class="input-group bg-light rounded-3 px-2">
                <span class="input-group-text border-0 bg-transparent text-muted"><i class="fas fa-search"></i></span>
                <input type="text" id="searchRute" class="form-control border-0 bg-transparent py-2 shadow-none" 
                       placeholder="Cari Kode PCEZ atau Nama Petugas..." onkeyup="filterRute()">
            </div>
        </div>
        <div class="table-responsive" style="max-height: 70vh;">
            <table class="table align-middle mb-0 table-hover">
                <thead class="bg-light sticky-top">
                    <tr class="small text-uppercase fw-bold text-muted">
                        <th class="ps-3" style="width: 40px;">
                            <input type="checkbox" class="form-check-input" id="check-all" onclick="toggleAll()">
                        </th>
                        <th>Kode PCEZ</th>
                        <th>Petugas Lapangan</th>
                        <th>Admin WA</th>
                        <th class="text-center">Jml Pel</th>
                        <th class="text-end pe-3">Aksi</th>
                    </tr>
                </thead>
                <tbody id="ruteTableBody">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="modalEditRute" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow-lg">
            <div class="modal-header border-0 bg-light p-3">
                <h6 class="modal-title fw-bold">Edit Mapping Rute</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <input type="hidden" id="edit-pcez">
                <div class="mb-3">
                    <label class="small fw-bold mb-1">Kode PCEZ</label>
                    <input type="text" id="display-pcez" class="form-control bg-light border-0 fw-bold" readonly>
                </div>
                <div class="mb-3">
                    <label class="small fw-bold mb-1">Petugas Lapangan</label>
                    <input type="text" id="edit-petugas" class="form-control rounded-3 text-uppercase" placeholder="Nama Petugas di Excel">
                </div>
                <div class="mb-4">
                    <label class="small fw-bold mb-1">Nomor WhatsApp Admin</label>
                    <input type="tel" id="edit-no-admin" class="form-control rounded-3" placeholder="628123456789">
                    <small class="text-muted" style="font-size: 0.65rem;">Gunakan format 62 tanpa tanda + atau spasi.</small>
                </div>
                <button class="btn btn-primary w-100 py-2 rounded-3 fw-bold shadow-sm" onclick="saveSingleRute()">
                    <i class="fas fa-save me-1"></i> SIMPAN PERUBAHAN
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let ruteData = [];
    const editModal = new bootstrap.Modal(document.getElementById('modalEditRute'));

    async function loadRute() {
        const body = document.getElementById('ruteTableBody');
        body.innerHTML = '<tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>';
        
        try {
            const res = await fetch('/api/rute/list');
            ruteData = await res.json();
            renderRute(ruteData);
            loadOfficerOptions();
        } catch (e) {
            body.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-danger">Gagal memuat data rute.</td></tr>';
        }
    }

    function renderRute(data) {
        const body = document.getElementById('ruteTableBody');
        body.innerHTML = data.map((item, idx) => `
            <tr class="animate__animated animate__fadeInUp" style="animation-delay: ${idx * 0.01}s">
                <td class="ps-3">
                    <input type="checkbox" class="form-check-input row-checkbox" value="${item.pcez}" onchange="updateSelection()">
                </td>
                <td class="fw-bold text-dark">${item.pcez}</td>
                <td>
                    <span class="badge ${item.petugas ? 'bg-primary-subtle text-primary' : 'bg-danger-subtle text-danger'} rounded-pill px-3">
                        ${item.petugas || 'Belum Diatur'}
                    </span>
                </td>
                <td class="small text-muted">${item.no_admin || '-'}</td>
                <td class="text-center fw-bold small">${item.jml_pelanggan}</td>
                <td class="text-end pe-3">
                    <button class="btn btn-sm btn-light rounded-circle shadow-sm" onclick="openEdit('${item.pcez}', '${item.petugas}', '${item.no_admin}')">
                        <i class="fas fa-pen text-primary"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    async function loadOfficerOptions() {
        const res = await fetch('/api/belum-bayar/petugas-tabs');
        const list = await res.json();
        const select = document.getElementById('mass-petugas');
        select.innerHTML = '<option value="">-- Pilih Petugas --</option>' + 
                          list.map(n => `<option value="${n}">${n}</option>`).join('');
    }

    function openEdit(pcez, petugas, no_admin) {
        document.getElementById('edit-pcez').value = pcez;
        document.getElementById('display-pcez').value = pcez;
        document.getElementById('edit-petugas').value = petugas === 'null' ? '' : petugas;
        document.getElementById('edit-no-admin').value = no_admin === 'null' ? '' : no_admin;
        editModal.show();
    }

    async function saveSingleRute() {
        const formData = new FormData();
        formData.append('pcez', document.getElementById('edit-pcez').value);
        formData.append('petugas', document.getElementById('edit-petugas').value);
        formData.append('no_admin', document.getElementById('edit-no-admin').value);

        const res = await fetch('/api/rute/save', { method: 'POST', body: formData });
        if (res.ok) {
            Swal.fire({ icon: 'success', title: 'Berhasil', showConfirmButton: false, timer: 1000 });
            editModal.hide();
            loadRute();
        }
    }

    function updateSelection() {
        const checked = document.querySelectorAll('.row-checkbox:checked');
        const toolbar = document.getElementById('mass-toolbar');
        document.getElementById('selected-count').innerText = checked.length;
        toolbar.classList.toggle('d-none', checked.length === 0);
    }

    async function processMassUpdate() {
        const pcez_list = Array.from(document.querySelectorAll('.row-checkbox:checked')).map(cb => cb.value);
        const petugas = document.getElementById('mass-petugas').value;
        
        if (!petugas) return Swal.fire('Error', 'Pilih petugas tujuan dulu!', 'warning');

        const res = await fetch('/api/rute/mass-update', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ pcez_list, petugas })
        });

        if (res.ok) {
            Swal.fire('Updated', `${pcez_list.length} rute berhasil dipindah ke ${petugas}`, 'success');
            cancelSelection();
            loadRute();
        }
    }

    function toggleAll() {
        const isChecked = document.getElementById('check-all').checked;
        document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = isChecked);
        updateSelection();
    }

    function cancelSelection() {
        document.getElementById('check-all').checked = false;
        document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = false);
        updateSelection();
    }

    function filterRute() {
        const query = document.getElementById('searchRute').value.toLowerCase();
        document.querySelectorAll('#ruteTableBody tr').forEach(tr => {
            tr.style.display = tr.innerText.toLowerCase().includes(query) ? '' : 'none';
        });
    }

    document.addEventListener('DOMContentLoaded', loadRute);
</script>

<style>
    .table thead th { background: #f8fafc; border-bottom: 2px solid #edf2f7; font-size: 0.65rem; }
    .table tbody td { border-bottom: 1px solid #f1f5f9; font-size: 0.75rem; }
    .bg-primary-subtle { background-color: #e0f2fe !important; }
    .bg-danger-subtle { background-color: #fee2e2 !important; }
    #mass-toolbar { position: sticky; top: 70px; z-index: 1010; }
    .form-check-input:checked { background-color: #0d6efd; border-color: #0d6efd; }
</style>
{% endblock %}
