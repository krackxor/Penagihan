{% extends "base.html" %}
{% block content %}
<div class="animate__animated animate__fadeIn px-2 pb-5">
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1 text-dark">Manajemen Rute 🗺️</h4>
            <p class="text-muted small mb-0">Atur penugasan rute PCEZ ke petugas</p>
        </div>
        <a href="/upload" class="btn btn-outline-primary btn-sm rounded-pill px-3 fw-bold shadow-sm">
            <i class="fas fa-file-upload me-1"></i> Upload
        </a>
    </div>

    <div class="mb-3">
        <div class="input-group bg-white shadow-sm rounded-4 border overflow-hidden px-3">
            <span class="input-group-text bg-transparent border-0"><i class="fas fa-search text-muted"></i></span>
            <input type="text" id="searchRute" class="form-control border-0 py-2 shadow-none" placeholder="Cari Kode PCEZ atau Petugas..." onkeyup="filterRute()">
        </div>
    </div>

    <div id="rute-container">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted small">Sinkronisasi rute...</p>
        </div>
    </div>
</div>

<script>
    async function loadRuteManager() {
        const container = document.getElementById('rute-container');
        
        try {
            const res = await fetch('/api/rute/list');
            const data = await res.json();

            if(data.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5 bg-white rounded-4 shadow-sm mx-1 border">
                        <i class="fas fa-map-marked-alt fa-3x text-light mb-3"></i>
                        <p class="text-muted mb-0 px-4">Data rute masih kosong.<br>Silakan upload file MC terlebih dahulu.</p>
                    </div>`;
                return;
            }

            container.innerHTML = data.map(item => {
                const isAssigned = item.petugas && item.petugas.trim() !== "";
                const inputId = `input-${item.pcez.replace(/[^a-zA-Z0-9]/g, '-')}`;
                
                return `
                <div class="card border-0 shadow-sm rounded-4 mb-3 rute-card animate__animated animate__fadeInUp" 
                     data-search="${item.pcez} ${item.petugas || ''}">
                    <div class="card-body p-3">
                        <div class="row align-items-center g-3">
                            <div class="col-4">
                                <div class="p-2 rounded-3 text-center border ${isAssigned ? 'bg-primary-subtle border-primary-subtle text-primary' : 'bg-danger-subtle border-danger-subtle text-danger'}">
                                    <small class="d-block text-uppercase fw-bold" style="font-size: 0.65rem;">KODE PCEZ</small>
                                    <span class="fw-bold">${item.pcez}</span>
                                </div>
                            </div>
                            
                            <div class="col-8">
                                <label class="small text-muted mb-1 fw-bold" style="font-size: 0.65rem;">NAMA PETUGAS</label>
                                <div class="input-group">
                                    <input type="text" 
                                           id="${inputId}" 
                                           class="form-control border-0 bg-light rounded-start-3 fw-bold py-2 shadow-none" 
                                           value="${item.petugas || ''}" 
                                           placeholder="Belum ada..."
                                           style="text-transform: uppercase; font-size: 0.85rem;">
                                    <button class="btn btn-primary px-3 rounded-end-3" onclick="updatePetugas('${item.pcez}', '${inputId}')">
                                        <i class="fas fa-save"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        } catch (error) {
            container.innerHTML = '<div class="alert alert-danger rounded-4">Gagal memuat data rute.</div>';
        }
    }

    async function updatePetugas(pcez, inputId) {
        const inputEl = document.getElementById(inputId);
        const namaPetugas = inputEl.value;
        
        // Visual Loading State
        const originalBtnHtml = event.currentTarget.innerHTML;
        const btn = event.currentTarget;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
        btn.disabled = true;

        const formData = new FormData();
        formData.append('pcez', pcez);
        formData.append('petugas', namaPetugas);

        try {
            const res = await fetch('/api/rute/save', { method: 'POST', body: formData });
            const result = await res.json();
            
            if(result.status === 'success') {
                // Highlight Success
                inputEl.classList.add('bg-success', 'text-white');
                setTimeout(() => inputEl.classList.remove('bg-success', 'text-white'), 800);
                
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'success',
                    title: 'Rute Updated',
                    showConfirmButton: false,
                    timer: 1500
                });
            }
        } catch (e) {
            Swal.fire('Error', 'Gagal menyimpan perubahan', 'error');
        } finally {
            btn.innerHTML = originalBtnHtml;
            btn.disabled = false;
        }
    }

    function filterRute() {
        const val = document.getElementById('searchRute').value.toLowerCase();
        const cards = document.querySelectorAll('.rute-card');
        cards.forEach(card => {
            const matches = card.dataset.search.toLowerCase().includes(val);
            card.style.display = matches ? 'block' : 'none';
        });
    }

    document.addEventListener('DOMContentLoaded', loadRuteManager);
</script>

<style>
    .bg-primary-subtle { background-color: #e7f1ff; }
    .bg-danger-subtle { background-color: #ffeef0; }
    .text-primary { color: #0d6efd !important; }
    .text-danger { color: #dc3545 !important; }
    .form-control:focus { background-color: #f8f9fa !important; }
</style>
{% endblock %}
