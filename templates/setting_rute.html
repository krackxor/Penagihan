{% extends "base.html" %}
{% block content %}
<div class="px-2 pb-5 animate__animated animate__fadeIn">
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1">Manajemen Petugas</h4>
            <p class="text-muted small mb-0">Edit rute hasil upload atau input manual</p>
        </div>
        <a href="/upload" class="btn btn-primary btn-sm rounded-pill px-3">
            <i class="fas fa-file-upload me-1"></i> Upload Massal
        </a>
    </div>

    <div class="mb-3">
        <input type="text" id="searchRute" class="form-control border-0 shadow-sm rounded-4 py-2" placeholder="Cari Kode PCEZ atau Nama Petugas..." onkeyup="filterRute()">
    </div>

    <div id="rute-container">
        </div>
</div>

<script>
    async function loadRuteManager() {
        const container = document.getElementById('rute-container');
        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';
        
        const res = await fetch('/api/rute/list');
        const data = await res.json();

        if(data.length === 0) {
            container.innerHTML = '<div class="alert alert-warning rounded-4 text-center">Belum ada data MC. Silakan upload file MC terlebih dahulu.</div>';
            return;
        }

        container.innerHTML = data.map(item => `
            <div class="card border-0 shadow-sm rounded-4 mb-2 rute-card" data-search="${item.pcez} ${item.petugas || ''}">
                <div class="card-body p-3">
                    <div class="row align-items-center g-2">
                        <div class="col-4">
                            <span class="badge ${item.petugas ? 'bg-primary-subtle text-primary' : 'bg-danger-subtle text-danger'} border w-100 py-2">
                                ${item.pcez}
                            </span>
                        </div>
                        <div class="col-8">
                            <div class="input-group input-group-sm">
                                <input type="text" 
                                       id="input-${item.pcez.replace('/', '-')}" 
                                       class="form-control border-0 bg-light fw-bold" 
                                       value="${item.petugas || ''}" 
                                       placeholder="Nama Petugas..."
                                       style="text-transform: uppercase;">
                                <button class="btn btn-primary" onclick="updatePetugas('${item.pcez}')">
                                    <i class="fas fa-save"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    async function updatePetugas(pcez) {
        const inputId = `input-${pcez.replace('/', '-')}`;
        const namaPetugas = document.getElementById(inputId).value;
        const formData = new FormData();
        formData.append('pcez', pcez);
        formData.append('petugas', namaPetugas);

        const res = await fetch('/api/rute/save', { method: 'POST', body: formData });
        const result = await res.json();
        
        if(result.status === 'success') {
            const inputEl = document.getElementById(inputId);
            inputEl.classList.add('bg-success', 'text-white');
            setTimeout(() => inputEl.classList.remove('bg-success', 'text-white'), 1000);
            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Tersimpan', showConfirmButton: false, timer: 1000 });
        }
    }

    function filterRute() {
        const val = document.getElementById('searchRute').value.toLowerCase();
        document.querySelectorAll('.rute-card').forEach(card => {
            card.style.display = card.dataset.search.toLowerCase().includes(val) ? 'block' : 'none';
        });
    }

    document.addEventListener('DOMContentLoaded', loadRuteManager);
</script>
{% endblock %}
