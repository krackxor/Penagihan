{% extends "base.html" %}
{% block content %}
<div class="animate__animated animate__fadeIn">
    <div class="px-2 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1">Tagihan Berekor 🐉</h4>
            <p class="text-muted small mb-0">Tunggakan Ardebt (Link MC Nomen Valid)</p>
        </div>
        <div class="bg-danger text-white px-3 py-1 rounded-pill small fw-bold shadow-sm">
            ARDEBT
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-3 mx-2">
        <div class="card-body p-3">
            <div class="row g-2">
                <div class="col-6">
                    <label class="small fw-bold text-muted mb-1">Petugas (Rute)</label>
                    <select id="filter-petugas" class="form-select border-0 bg-light rounded-3 shadow-none" onchange="loadArdebt()">
                        <option value="all">Semua Petugas</option>
                    </select>
                </div>
                <div class="col-6 text-end d-flex align-items-end justify-content-end">
                    <button class="btn btn-danger rounded-3 w-100 fw-bold" onclick="loadArdebt()">
                        <i class="fas fa-sync-alt me-1"></i> Sync Data
                    </button>
                </div>
                <div class="col-12 mt-2">
                    <div class="input-group bg-light rounded-3 px-2 border">
                        <span class="input-group-text border-0 bg-transparent"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" id="searchBar" class="form-control border-0 bg-transparent py-2 shadow-none" placeholder="Cari Nama, IDPEL, atau Rute..." onkeyup="liveSearch()">
                    </div>
                    <small class="text-muted mt-1 d-block" style="font-size: 10px;">* Data bersumber dari file Ardebt yang dicocokkan dengan data Master Pelanggan.</small>
                </div>
            </div>
        </div>
    </div>

    <div id="summary-area" class="px-2 mb-3"></div>

    <div id="list-container" class="px-2">
        <div class="text-center py-5">
            <div class="spinner-border text-danger" role="status"></div>
            <p class="mt-2 text-muted">Mencari data tunggakan Ardebt...</p>
        </div>
    </div>
</div>

<div class="modal fade" id="modalKunjungan" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <form id="formKunjungan">
                <div class="modal-header border-0 pb-0">
                    <h5 class="fw-bold"><i class="fas fa-pen-nib me-2 text-danger"></i>Laporan Ardebt</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modal-idpel">
                    <input type="hidden" id="modal-nominal-val">
                    
                    <div class="bg-danger-subtle p-3 rounded-4 mb-3 border border-danger-subtle">
                        <small class="text-danger fw-bold d-block mb-1">DATA TUNGGAKAN BEREKOR</small>
                        <h6 id="modal-nama" class="fw-bold mb-0"></h6>
                        <small id="modal-info-tambahan" class="text-muted"></small>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Hasil Kunjungan</label>
                        <select id="modal-hasil" class="form-select rounded-3 bg-light border-0" required>
                            <option value="">-- Pilih Hasil --</option>
                            <option value="Sudah Bayar">Sudah Bayar</option>
                            <option value="Janji Bayar">Janji Bayar</option>
                            <option value="Rumah Kosong">Rumah Kosong</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Nomor HP</label>
                        <input type="tel" id="modal-no-hp" class="form-control rounded-3 bg-light border-0" placeholder="0812...">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Catatan</label>
                        <textarea id="modal-keterangan" class="form-control rounded-3 bg-light border-0" rows="3" placeholder="Keterangan tambahan..."></textarea>
                    </div>

                    <div class="mb-0">
                        <label class="form-label small fw-bold">Foto Bukti (Auto-Watermark)</label>
                        <input type="file" id="modal-foto" class="form-control rounded-3 bg-light border-0" accept="image/*" capture="camera">
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="submit" class="btn btn-danger w-100 rounded-3 py-2 fw-bold shadow">
                        SIMPAN & SHARE WA <i class="fas fa-paper-plane ms-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    let rawData = [];
    let modalKunjungan;

    document.addEventListener('DOMContentLoaded', () => {
        modalKunjungan = new bootstrap.Modal(document.getElementById('modalKunjungan'));
        loadPetugasDropdown();
        loadArdebt();

        document.getElementById('formKunjungan').addEventListener('submit', async (e) => {
            e.preventDefault();
            await simpanLaporan();
        });
    });

    async function loadPetugasDropdown() {
        const res = await fetch('/api/belum-bayar/petugas-tabs');
        const list = await res.json();
        const select = document.getElementById('filter-petugas');
        list.forEach(n => {
            if(![...select.options].some(o => o.value === n)) {
                select.innerHTML += `<option value="${n}">${n}</option>`;
            }
        });
    }

    async function loadArdebt() {
        const petugas = document.getElementById('filter-petugas').value;
        const container = document.getElementById('list-container');
        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-danger"></div></div>';

        try {
            // URL menggunakan endpoint khusus Ardebt yang melink ke MC
            const res = await fetch(`/api/ardebt?petugas=${encodeURIComponent(petugas)}`);
            const responseData = await res.json();
            
            // Backend menggunakan APIResponse format { success: true, data: [...] }
            rawData = responseData.data || [];
            renderCards(rawData);
            updateSummary(rawData);
        } catch (err) {
            container.innerHTML = '<div class="alert alert-danger mx-2">Gagal memuat data tunggakan.</div>';
        }
    }

    function renderCards(data) {
        const container = document.getElementById('list-container');
        if (data.length === 0) {
            container.innerHTML = '<div class="text-center mt-5"><i class="fas fa-check-double fa-3x text-success mb-3"></i><p class="fw-bold">Hore! Tidak ada tunggakan berekor.</p></div>';
            return;
        }

        container.innerHTML = data.map(item => `
            <div class="card border-0 shadow-sm rounded-4 mb-3 customer-card animate__animated animate__fadeInUp" 
                 data-search="${item.nama} ${item.nomen} ${item.pcez} ${item.nama_petugas || ''}">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-danger text-white rounded-pill px-2" style="font-size: 10px;">
                           <i class="fas fa-calendar-alt me-1"></i> ${item.jumlah_ekor} BULAN TUNGGAKAN
                        </span>
                        <span class="badge bg-light text-dark border rounded-pill px-2" style="font-size: 10px;">IDPEL: ${item.nomen}</span>
                    </div>
                    <h6 class="fw-bold mb-1 text-dark">${item.nama || 'Pelanggan'}</h6>
                    <p class="text-muted small mb-3">
                        <i class="fas fa-route me-1 text-danger"></i> Rute: ${item.pcez || '000/00'} 
                        ${item.nama_petugas ? ` | <i class="fas fa-user-check me-1"></i> ${item.nama_petugas}` : ''}
                    </p>
                    
                    <div class="d-flex justify-content-between align-items-center border-top pt-3">
                        <div>
                            <small class="d-block text-muted" style="font-size: 10px;">TOTAL RUPIAH</small>
                            <span class="fw-bold text-danger h6">Rp ${Number(item.total_tunggakan).toLocaleString('id-ID')}</span>
                        </div>
                        <button class="btn btn-danger rounded-3 px-4 fw-bold shadow-sm" 
                                onclick="openModal('${item.nomen}', '${item.nama}', 'Rp ${Number(item.total_tunggakan).toLocaleString('id-ID')}', '${item.jumlah_ekor} Bulan')">
                            LAPOR
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function liveSearch() {
        const query = document.getElementById('searchBar').value.toLowerCase();
        document.querySelectorAll('.customer-card').forEach(card => {
            card.style.display = card.dataset.search.toLowerCase().includes(query) ? 'block' : 'none';
        });
    }

    function updateSummary(data) {
        const totalNominal = data.reduce((acc, curr) => acc + Number(curr.total_tunggakan), 0);
        document.getElementById('summary-area').innerHTML = `
            <div class="d-flex justify-content-between small px-1">
                <span class="text-muted">Total: <b>${data.length} Nomen</b></span>
                <span class="text-muted">Nilai: <b class="text-danger">Rp ${totalNominal.toLocaleString('id-ID')}</b></span>
            </div>
        `;
    }

    function openModal(nomen, nama, nominal, ekor) {
        document.getElementById('modal-idpel').value = nomen;
        document.getElementById('modal-nama').innerText = nama || 'Pelanggan';
        document.getElementById('modal-nominal-val').value = nominal;
        document.getElementById('modal-info-tambahan').innerText = `Tunggakan: ${ekor}`;
        document.getElementById('formKunjungan').reset();
        modalKunjungan.show();
    }

    async function simpanLaporan() {
        Swal.fire({ title: 'Menyimpan laporan...', didOpen: () => { Swal.showLoading(); } });
        
        const idpel = document.getElementById('modal-idpel').value;
        const nama = document.getElementById('modal-nama').innerText;
        const nominalStr = document.getElementById('modal-nominal-val').value;
        const hasil = document.getElementById('modal-hasil').value;
        const no_hp = document.getElementById('modal-no-hp').value;
        const catatan = document.getElementById('modal-keterangan').value;

        const formData = new FormData();
        formData.append('idpel', idpel);
        formData.append('nama_pelanggan', nama);
        formData.append('nominal_display', nominalStr);
        formData.append('hasil', hasil);
        formData.append('no_hp', no_hp);
        formData.append('keterangan', catatan);
        
        const foto = document.getElementById('modal-foto').files[0];
        if (foto) formData.append('foto', foto);

        try {
            const res = await fetch('/api/belum-bayar/lapor', { method: 'POST', body: formData });
            const dataRes = await res.json();

            if (res.ok) {
                const domain = window.location.origin;
                const urlFoto = dataRes.filename ? `${domain}/static/uploads/kunjungan/${dataRes.filename}` : '-';

                const textWA = `*⚡ LAPORAN ARDEBT (TAGIHAN BEREKOR) ⚡*%0A` +
                               `-------------------------------------------%0A` +
                               `📌 *STATUS:* _${hasil.toUpperCase()}_%0A` +
                               `📋 *Data Pelanggan:*%0A` +
                               `• NOMEN : ${idpel}%0A` +
                               `• Nama  : ${nama}%0A%0A` +
                               `• Total Tunggakan: *${nominalStr}*%0A` +                            
                               `📝 *Catatan:* _${catatan || '-'}_%0A` +
                               `📷 *Bukti:* ${urlFoto}%0A%0A` +
                               `_Powered by Area Service_`;

                Swal.fire({
                    icon: 'success', title: 'Berhasil!',
                    confirmButtonText: 'Kirim WA <i class="fab fa-whatsapp"></i>', confirmButtonColor: '#25D366'
                }).then(() => {
                    window.open(`https://wa.me/?text=${textWA}`, '_blank');
                    modalKunjungan.hide();
                    loadArdebt();
                });
            }
        } catch (err) { Swal.fire('Error', 'Cek koneksi internet.', 'error'); }
    }
</script>
{% endblock %}
