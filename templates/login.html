<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Autentikasi Sesi - Area Service</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary-dark: #0f172a;
            --accent-blue: #2563eb;
            --card-bg: rgba(30, 41, 59, 0.7);
            --input-focus: #3b82f6;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--primary-dark);
            /* Animasi gradient halus untuk kesan profesional */
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 3rem 2.2rem;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        /* Dekorasi cahaya di belakang card */
        .login-card::before {
            content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, transparent, rgba(37, 99, 235, 0.3), transparent);
            z-index: -1; border-radius: 37px;
        }

        .brand-logo {
            width: 80px; height: 80px;
            background: white;
            color: var(--accent-blue);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4);
            transform: rotate(-5deg);
            transition: 0.3s;
        }
        
        .brand-logo:hover { transform: rotate(0deg) scale(1.05); }

        .form-label { 
            font-size: 0.65rem; 
            font-weight: 800; 
            color: #94a3b8; 
            text-transform: uppercase;
            letter-spacing: 1.5px; 
            margin-bottom: 0.6rem;
            margin-left: 4px;
        }

        .input-group { 
            background: rgba(15, 23, 42, 0.6); 
            border-radius: 18px; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 2px;
        }
        
        .input-group:focus-within { 
            border-color: var(--input-focus); 
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            background: rgba(15, 23, 42, 0.9);
        }

        .input-group-text { 
            background: transparent; 
            border: none; 
            color: #475569; 
            padding-left: 20px;
            font-size: 1.1rem;
        }

        .form-control {
            background: transparent;
            border: none;
            color: white;
            padding: 0.95rem 1rem 0.95rem 8px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .form-control:focus { background: transparent; color: white; box-shadow: none; }
        .form-control::placeholder { color: #475569; font-weight: 400; }

        .btn-login {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: none;
            border-radius: 18px;
            padding: 1.1rem;
            font-weight: 800;
            color: white;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-top: 1.5rem;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(37, 99, 235, 0.4);
            filter: brightness(1.1);
        }

        .btn-login:active { transform: scale(0.98); }

        .help-link {
            text-decoration: none;
            font-size: 0.75rem;
            color: var(--accent-blue);
            font-weight: 700;
            transition: 0.3s;
        }

        .help-link:hover { color: #60a5fa; text-shadow: 0 0 10px rgba(96, 165, 250, 0.3); }

        .version-text { 
            font-size: 0.65rem; 
            color: #475569; 
            margin-top: 2.5rem; 
            font-weight: 700;
            letter-spacing: 1px; 
        }
        
        /* Loader Pulse */
        .spinner-border-sm { width: 1.2rem; height: 1.2rem; border-width: 0.15em; }
    </style>
</head>
<body>

<div class="container px-4">
    <div class="login-card animate__animated animate__zoomIn">
        <div class="text-center mb-5">
            <div class="brand-logo animate__animated animate__fadeInDown animate__delay-1s">
                <i class="fa-solid fa-bolt-lightning fa-2xl"></i>
            </div>
            <h4 class="text-white fw-800 mb-0" style="letter-spacing: -1px; font-size: 1.6rem;">AREA SERVICE</h4>
            <div class="d-flex justify-content-center mt-2">
                <span class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 py-2 px-3" style="font-size: 0.6rem; letter-spacing: 1.5px; border-radius: 10px;">
                    <i class="fa-solid fa-shield-halved me-1"></i> SECURE GATEWAY V12.8
                </span>
            </div>
        </div>

        <form id="loginForm">
            <div class="mb-4">
                <label class="form-label">Username Kredensial</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user-gear"></i></span>
                    <input type="text" id="username" class="form-control" placeholder="ID Personel / Admin" required autocomplete="username">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Kunci Enkripsi (Password)</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <div class="text-end mb-4">
                <a href="https://wa.me/628123456789?text=Halo%20Admin,%20saya%20petugas%20mengalami%20kendala%20login" target="_blank" class="help-link">
                    <i class="fa-solid fa-circle-question me-1"></i>Bantuan Akses?
                </a>
            </div>

            <button type="submit" class="btn btn-primary btn-login w-100 shadow-sm" id="btnSubmit">
                Masuk Sistem <i class="fa-solid fa-right-to-bracket ms-2"></i>
            </button>
        </form>

        <div class="text-center version-text">
            <div class="text-uppercase mb-1">Integrated Operation System</div>
            <div class="opacity-50">© 2026 Area Service Management Enterprise</div>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('btnSubmit');
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // Feedback Visual
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>MENGOTORISASI...';

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const result = await response.json();

            if (response.ok) {
                Swal.fire({
                    icon: 'success',
                    title: 'Otorisasi Berhasil',
                    text: `Selamat bertugas kembali, ${username.toUpperCase()}`,
                    timer: 1800,
                    showConfirmButton: false,
                    background: '#1e293b',
                    color: '#fff',
                    customClass: { popup: 'rounded-5 border border-primary' }
                }).then(() => {
                    window.location.href = result.data.redirect;
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Akses Ditolak',
                    text: result.message || 'Kredensial tidak valid dalam database kami.',
                    confirmButtonColor: '#2563eb',
                    background: '#1e293b',
                    color: '#fff',
                    customClass: { popup: 'rounded-5' }
                });
                btn.disabled = false;
                btn.innerHTML = 'Masuk Sistem <i class="fa-solid fa-right-to-bracket ms-2"></i>';
            }
        } catch (error) {
            Swal.fire({
                icon: 'error',
                title: 'Jaringan Terputus',
                text: 'Gagal sinkronisasi dengan server data.',
                confirmButtonColor: '#ef4444'
            });
            btn.disabled = false;
            btn.innerHTML = 'Masuk Sistem <i class="fa-solid fa-right-to-bracket ms-2"></i>';
        }
    });

    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        if (params.has('logout')) {
            const Toast = Swal.mixin({
                toast: true, position: 'top', showConfirmButton: false, timer: 3000, timerProgressBar: true
            });
            Toast.fire({ icon: 'info', title: 'Sesi enkripsi ditutup secara aman.' });
        }
    };
</script>

</body>
</html>
