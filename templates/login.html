<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Autentikasi Sesi - Area Service</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary-dark: #0f172a;
            --accent-blue: #2563eb;
            --card-bg: rgba(30, 41, 59, 0.75);
        }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--primary-dark);
            background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 2.5rem 2rem;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .brand-logo {
            width: 72px; height: 72px;
            background: white;
            color: var(--accent-blue);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.3);
        }

        .form-label { font-size: 0.7rem; font-weight: 700; color: rgba(255,255,255,0.5); letter-spacing: 1px; margin-left: 5px; }

        .input-group { 
            background: rgba(15, 23, 42, 0.8); 
            border-radius: 16px; 
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .input-group:focus-within { border-color: var(--accent-blue); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2); }

        .input-group-text { background: transparent; border: none; color: rgba(255,255,255,0.3); padding-left: 18px; }

        .form-control {
            background: transparent;
            border: none;
            color: white;
            padding: 0.9rem 1rem 0.9rem 5px;
            font-size: 0.95rem;
        }

        .form-control:focus { background: transparent; color: white; box-shadow: none; }
        .form-control::placeholder { color: rgba(255,255,255,0.15); }

        .btn-login {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: none;
            border-radius: 16px;
            padding: 1rem;
            font-weight: 700;
            color: white;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.4);
            filter: brightness(1.1);
        }

        .help-link {
            text-decoration: none;
            font-size: 0.75rem;
            color: var(--accent-blue);
            font-weight: 600;
            opacity: 0.8;
            transition: 0.2s;
        }

        .help-link:hover { opacity: 1; text-decoration: underline; }

        .version-text { font-size: 0.65rem; color: rgba(255,255,255,0.3); margin-top: 2rem; letter-spacing: 0.5px; }
    </style>
</head>
<body>

<div class="container px-4">
    <div class="login-card animate__animated animate__fadeInUp">
        <div class="text-center mb-4">
            <div class="brand-logo animate__animated animate__bounceIn">
                <i class="fas fa-tint fa-2x"></i>
            </div>
            <h4 class="text-white fw-800 mb-0" style="letter-spacing: -0.5px;">AREA SERVICE</h4>
            <span class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 mt-2" style="font-size: 0.55rem; letter-spacing: 1.5px; text-transform: uppercase;">Secure Gateway v7.4</span>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label text-uppercase">Kredensial Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user-shield"></i></span>
                    <input type="text" id="username" class="form-control" placeholder="ID Personel / Administrator" required autocomplete="username">
                </div>
            </div>

            <div class="mb-2">
                <label class="form-label text-uppercase">Kunci Akses (Password)</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-fingerprint"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <div class="text-end mb-4">
                <a href="https://wa.me/628123456789?text=Halo%20Admin%20Area%20Service,%20saya%20petugas%20mengalami%20kendala%20login" target="_blank" class="help-link">Bantuan Akses?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-login w-100 shadow-sm" id="btnSubmit">
                AUTENTIKASI SESI <i class="fas fa-sign-in-alt ms-2"></i>
            </button>
        </form>

        <div class="text-center version-text">
            <div class="fw-bold">INTEGRATED OPERATION SYSTEM</div>
            <div class="opacity-50 mt-1">© 2026 Area Service Management</div>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('btnSubmit');
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // Feedback Visual Transmisi Data
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>VERIFIKASI DATA...';

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const result = await response.json();

            if (response.ok) {
                // Notifikasi Otorisasi Berhasil
                Swal.fire({
                    icon: 'success',
                    title: 'Otorisasi Berhasil',
                    text: `Selamat bertugas, ${username.toUpperCase()}`,
                    timer: 1500,
                    showConfirmButton: false,
                    background: '#1e293b',
                    color: '#fff',
                    customClass: { popup: 'rounded-4' }
                }).then(() => {
                    window.location.href = result.data.redirect;
                });
            } else {
                // Notifikasi Penolakan Akses
                Swal.fire({
                    icon: 'error',
                    title: 'Akses Ditolak',
                    text: result.message || 'Kredensial tidak terdaftar dalam sistem Area Service.',
                    confirmButtonColor: '#2563eb',
                    background: '#1e293b',
                    color: '#fff',
                    customClass: { popup: 'rounded-4' }
                });
                btn.disabled = false;
                btn.innerHTML = 'AUTENTIKASI SESI <i class="fas fa-sign-in-alt ms-2"></i>';
            }
        } catch (error) {
            Swal.fire({
                icon: 'error',
                title: 'Gangguan Jaringan',
                text: 'Gagal terhubung ke pusat data Area Service. Periksa koneksi internet Anda.',
                confirmButtonColor: '#ef4444'
            });
            btn.disabled = false;
            btn.innerHTML = 'AUTENTIKASI SESI <i class="fas fa-sign-in-alt ms-2"></i>';
        }
    });

    // Deteksi Terminasi Sesi dari URL
    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        if (params.has('logout')) {
            const Toast = Swal.mixin({
                toast: true, position: 'top', showConfirmButton: false, timer: 3000, timerProgressBar: true
            });
            Toast.fire({ icon: 'info', title: 'Sesi telah ditutup secara aman.' });
        }
    };
</script>

</body>
</html>
