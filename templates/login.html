<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sunter Pro Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary-bg: #0f172a;
            --accent-blue: #3b82f6;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--primary-bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .brand-logo {
            width: 64px;
            height: 64px;
            background: white;
            color: var(--accent-blue);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }
        .form-control {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 12px;
            padding: 0.75rem 1rem;
        }
        .form-control:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: var(--accent-blue);
            color: white;
            box-shadow: none;
        }
        .btn-login {
            background: var(--accent-blue);
            border: none;
            border-radius: 12px;
            padding: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
        }
        .role-badge {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
        }
        /* Sinergi: Link bantuan petugas */
        .help-link {
            text-decoration: none;
            font-size: 0.75rem;
            color: var(--accent-blue);
            transition: 0.2s;
        }
        .help-link:hover { color: white; }
    </style>
</head>
<body>

<div class="container px-4">
    <div class="login-card animate__animated animate__fadeIn">
        <div class="text-center">
            <div class="brand-logo">
                <i class="fas fa-bolt-lightning fa-2x"></i>
            </div>
            <h4 class="text-white fw-800 mb-1">SUNTER PRO</h4>
            <p class="role-badge mb-4">Water Billing Management System</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="text-white-50 small mb-2 fw-medium">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-white-50" style="border-color: rgba(255,255,255,0.1)">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" id="username" class="form-control border-start-0" placeholder="Masukkan username" required>
                </div>
            </div>

            <div class="mb-2">
                <label class="text-white-50 small mb-2 fw-medium">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0 text-white-50" style="border-color: rgba(255,255,255,0.1)">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" id="password" class="form-control border-start-0" placeholder="••••••••" required>
                </div>
            </div>

            <div class="text-end mb-4">
                <a href="https://wa.me/628123456789?text=Halo%20Admin,%20saya%20petugas%20lupa%20password%20SunterPro" class="help-link">Lupa Password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-login w-100 mb-3">
                MASUK KE SISTEM <i class="fas fa-arrow-right ms-2"></i>
            </button>
        </form>

        <div class="text-center">
            <p class="text-white-50 small mb-0">V2.5.0 Build 2026</p>
            <p class="text-white-50 x-small" style="font-size: 0.6rem; opacity: 0.3;">Sinergi Login Level 3 Active</p>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // Tampilkan loading (Fungsi Lama Dipertahankan)
        Swal.fire({
            title: 'Otentikasi...',
            text: 'Memeriksa kredensial rute petugas',
            allowOutsideClick: false,
            didOpen: () => Swal.showLoading()
        });

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const result = await response.json();

            if (response.ok) {
                // SINERGI: Pesan sukses dinamis berdasarkan role yang dikirim server
                Swal.fire({
                    icon: 'success',
                    title: 'Berhasil!',
                    text: `Selamat datang ${result.data.role}, ${username}`,
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    // Redirect sesuai instruksi server (Admin ke Dashboard, Petugas ke Tagihan)
                    window.location.href = result.data.redirect;
                });
            } else {
                // FUNGSI LAMA: Handle Error
                Swal.fire({
                    icon: 'error',
                    title: 'Akses Ditolak',
                    text: result.message || 'Username atau Password salah!',
                    confirmButtonColor: '#3b82f6'
                });
            }
        } catch (error) {
            Swal.fire('Error', 'Gagal menghubungi server pusat', 'error');
        }
    });
</script>

</body>
</html>
