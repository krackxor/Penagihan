{% extends "base.html" %}
{% block content %}
<div class="px-2 pb-5">
    <div class="sticky-top bg-white pt-3 shadow-sm" style="z-index: 1020; margin: 0 -15px; padding: 0 15px;">
        <div class="d-flex justify-content-between mb-2">
            <h6 class="fw-bold">Target Penagihan</h6>
            <span class="badge bg-primary" id="progText">0/0</span>
        </div>
        <div class="d-flex gap-2 overflow-auto no-scrollbar pb-3" id="petugasTabs">
            <button class="btn btn-primary rounded-pill px-4 btn-tab active" onclick="filterTab('all', this)">Semua</button>
        </div>
        <input type="text" id="searchInput" class="form-control rounded-4 mb-3 border-0 bg-light p-3" placeholder="Cari Pelanggan...">
    </div>

    <div id="listContainer" class="mt-3"></div>
</div>

<div class="modal fade" id="modalLapor" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered mx-3">
        <div class="modal-content border-0 rounded-4 shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h5 class="fw-bold">Laporan Lapangan</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="formLapor">
                <div class="modal-body">
                    <input type="hidden" id="modal-nomen" name="nomen">
                    
                    <div class="mb-3">
                        <label class="small fw-bold">NOMOR HP BARU</label>
                        <input type="number" class="form-control p-3 bg-light border-0" name="no_hp" id="modal-no-hp" placeholder="08xx">
                    </div>

                    <div class="mb-3">
                        <label class="small fw-bold">HASIL KUNJUNGAN</label>
                        <select class="form-select p-3 bg-light border-0" name="keterangan" required>
                            <option value="Janji Bayar">Janji Bayar</option>
                            <option value="Rumah Kosong">Rumah Kosong</option>
                            <option value="Sudah Bayar">Sudah Bayar</option>
                            <option value="Pasang Stiker">Pasang Stiker</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="small fw-bold">AMBIL FOTO (WIB + GPS + NOMEN)</label>
                        <input type="file" id="fileFoto" name="foto" accept="image/*" capture="camera" class="form-control" onchange="preview(this)">
                        <img id="imgPrev" class="img-fluid rounded-4 mt-2 d-none shadow-sm">
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="submit" id="btnSubmit" class="btn btn-primary w-100 py-3 rounded-4 fw-bold">SIMPAN & KIRIM WA</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
let selPetugas = 'all';

function preview(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => { 
            const img = document.getElementById('imgPrev');
            img.src = e.target.result;
            img.classList.remove('d-none');
        };
        reader.readAsDataURL(input.files[0]);
    }
}

async function loadData() {
    const search = document.getElementById('searchInput').value;
    const res = await fetch(`/api/belum-bayar/list?petugas=${selPetugas === 'all' ? '' : selPetugas}&search=${search}`);
    const data = await res.json();
    
    // Hitung Progres Harian
    const doneCount = data.filter(i => i.is_visited > 0).length;
    document.getElementById('progText').innerText = `${doneCount}/${data.length}`;

    document.getElementById('listContainer').innerHTML = data.map(item => {
        const isDone = item.is_visited > 0;
        const cardClass = isDone ? 'border-success opacity-75' : 'border-primary';
        const btnClass = isDone ? 'btn-success' : 'btn-primary';
        const statusBadge = isDone ? '<span class="badge bg-success float-end">Selesai</span>' : '';

        return `
            <div class="card border-0 shadow-sm mb-3 rounded-4 border-start ${cardClass} border-5">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <small class="text-muted d-block">${item.nomen} ${statusBadge}</small>
                            <h6 class="fw-bold mb-0">${item.nama}</h6>
                        </div>
                        <span class="${isDone ? 'text-success' : 'text-danger'} fw-bold">
                            Rp ${item.total.toLocaleString()}
                        </span>
                    </div>
                    <div class="mt-3">
                        <button class="btn ${btnClass} w-100 rounded-pill fw-bold" 
                            onclick="openLapor('${item.nomen}','${item.no_hp || ''}')">
                            ${isDone ? '<i class="fas fa-check-circle me-1"></i> UPDATE LAPORAN' : 'LAPOR KUNJUNGAN'}
                        </button>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

function openLapor(nomen, nohp) {
    document.getElementById('modal-nomen').value = nomen;
    document.getElementById('modal-no-hp').value = nohp;
    document.getElementById('imgPrev').classList.add('d-none');
    document.getElementById('formLapor').reset();
    new bootstrap.Modal(document.getElementById('modalLapor')).show();
}

document.getElementById('formLapor').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    fd.append('petugas', selPetugas === 'all' ? 'ADMIN' : selPetugas);

    Swal.fire({ title: 'Memproses...', text: 'Mengunci GPS & Watermark', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(async (pos) => {
            fd.append('lat', pos.coords.latitude);
            fd.append('lng', pos.coords.longitude);
            submitForm(fd);
        }, () => {
            fd.append('lat', '0'); fd.append('lng', '0');
            submitForm(fd);
        }, { timeout: 5000 });
    } else {
        submitForm(fd);
    }
};

async function submitForm(fd) {
    const res = await fetch('/api/belum-bayar/simpan-kunjungan', { method: 'POST', body: fd });
    const result = await res.json();
    if (res.ok) {
        Swal.fire({ 
            icon: 'success', 
            title: 'Berhasil!', 
            text: 'Kirim laporan ke WhatsApp?' , 
            showCancelButton: true, 
            confirmButtonText: 'Kirim WA',
            cancelButtonText: 'Tutup'
        }).then((r) => {
            if (r.isConfirmed) window.open(`https://wa.me/?text=${encodeURIComponent(result.wa_text)}`, '_blank');
            loadData();
            bootstrap.Modal.getInstance(document.getElementById('modalLapor')).hide();
        });
    } else {
        Swal.fire('Error', result.message, 'error');
    }
}

function filterTab(name, btn) {
    selPetugas = name;
    document.querySelectorAll('.btn-tab').forEach(b => {
        b.classList.remove('btn-primary');
        b.classList.add('btn-outline-secondary');
    });
    btn.classList.remove('btn-outline-secondary');
    btn.classList.add('btn-primary');
    loadData();
}

document.getElementById('searchInput').oninput = loadData;

window.onload = async () => {
    const res = await fetch('/api/belum-bayar/petugas-tabs');
    const tabs = await res.json();
    const tabContainer = document.getElementById('petugasTabs');
    tabs.forEach(name => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-outline-secondary rounded-pill px-4 btn-tab';
        btn.innerText = name;
        btn.onclick = () => filterTab(name, btn);
        tabContainer.appendChild(btn);
    });
    loadData();
};
</script>
{% endblock %}
