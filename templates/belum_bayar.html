{% extends "base.html" %}
{% block content %}
<div class="animate__animated animate__fadeIn">
    <div class="px-2 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1">Penagihan Lapangan 📋</h4>
            <p class="text-muted small mb-0">Prioritas 20 Data per Petugas (Current)</p>
        </div>
        <input type="month" id="filter-periode" 
               class="form-control form-control-sm border-0 shadow-sm rounded-pill px-3" 
               style="width: 140px; font-size: 0.75rem;" 
               onchange="loadData()">
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-3 mx-2">
        <div class="card-body p-3">
            <div class="row g-2">
                <div class="col-8">
                    <label class="small fw-bold text-muted mb-1">Pilih Petugas</label>
                    <select id="filter-petugas" class="form-select border-0 bg-light rounded-3 shadow-none" onchange="loadData()">
                        <option value="all">Semua Petugas</option>
                    </select>
                </div>
                <div class="col-4 d-flex align-items-end">
                    <button class="btn btn-primary rounded-3 w-100 fw-bold shadow-sm" onclick="loadData()">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <div class="col-12 mt-2">
                    <div class="input-group bg-light rounded-3 px-2 border">
                        <span class="input-group-text border-0 bg-transparent"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" id="searchBar" class="form-control border-0 bg-transparent py-2 shadow-none" 
                               placeholder="Cari Nama atau IDPEL..." onkeyup="debounceSearch()">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="summary-area" class="px-2 mb-3"></div>

    <div id="list-container" class="px-2 pb-5">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted small">Sinkronisasi rute...</p>
        </div>
    </div>
</div>

<div class="modal fade" id="modalKunjungan" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
            <form id="formKunjungan">
                <div class="modal-header border-0 bg-primary text-white p-3">
                    <h6 class="modal-title fw-bold"><i class="fas fa-camera me-2"></i>Laporan Lapangan (Current)</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modal-idpel" name="idpel">
                    <input type="hidden" id="modal-nominal-val" name="nominal_display">
                    <input type="hidden" id="modal-nomet-hidden">
                    <input type="hidden" id="modal-vol-hidden">
                    <input type="hidden" id="modal-rayon-hidden">
                    <input type="hidden" id="modal-nama-hidden">

                    <div class="bg-primary-subtle p-3 rounded-4 mb-3 border border-primary-subtle">
                        <h6 id="modal-nama" class="fw-bold mb-1 text-primary text-uppercase"></h6>
                        <div class="d-flex justify-content-between">
                            <small id="modal-sub-nomet" class="text-muted fw-bold"></small>
                            <small id="modal-sub-vol" class="text-muted fw-bold"></small>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Kontak Pelanggan (Hanya Catatan) *</label>
                        <div class="input-group">
                            <span class="input-group-text border-0 bg-light"><i class="fas fa-phone"></i></span>
                            <input type="tel" id="modal-no-hp" name="no_hp" class="form-control rounded-3 border-primary-subtle" placeholder="0812..." required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Hasil Kunjungan *</label>
                        <select id="modal-hasil" name="hasil" class="form-select rounded-3 bg-light border-0" required onchange="toggleJanjiInput()">
                            <option value="">-- Pilih Hasil --</option>
                            <option value="Sudah Bayar">Sudah Bayar</option>
                            <option value="Janji Bayar">Janji Bayar</option>
                            <option value="Rumah Kosong">Rumah Kosong</option>
                            <option value="Tutup Bor">Tutup Bor / Segel</option>
                            <option value="Lainnya">Lainnya / Kendala</option>
                        </select>
                    </div>

                    <div class="mb-3 d-none" id="group-janji">
                        <label class="form-label small fw-bold text-danger">Tanggal Janji Bayar</label>
                        <input type="date" id="modal-janji-dt" name="janji_bayar_dt" class="form-control rounded-3 bg-light border-0">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Catatan Petugas</label>
                        <textarea id="modal-keterangan" name="keterangan" class="form-control rounded-3 bg-light border-0" rows="2" placeholder="Tulis catatan tambahan..."></textarea>
                    </div>

                    <div class="mb-0">
                        <label class="form-label small fw-bold">Lampiran Foto Bukti *</label>
                        <input type="file" id="modal-foto" name="foto" class="form-control rounded-3" accept="image/*" capture="camera" required>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow">
                        SIMPAN & BAGIKAN LAPORAN <i class="fab fa-whatsapp ms-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    let modalKunjungan;
    let searchTimeout;
    const formatIDR = (n) => new Intl.NumberFormat('id-ID').format(n);

    document.addEventListener('DOMContentLoaded', () => {
        modalKunjungan = new bootstrap.Modal(document.getElementById('modalKunjungan'));
        initCalendar(); 
        loadPetugasDropdown();
        loadData();

        document.getElementById('formKunjungan').addEventListener('submit', async (e) => {
            e.preventDefault();
            await simpanLaporan();
        });
    });

    function initCalendar() {
        const now = new Date();
        document.getElementById('filter-periode').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    }

    function toggleJanjiInput() {
        const isJanji = document.getElementById('modal-hasil').value === 'Janji Bayar';
        document.getElementById('group-janji').classList.toggle('d-none', !isJanji);
        document.getElementById('modal-janji-dt').required = isJanji;
    }

    async function loadPetugasDropdown() {
        const res = await fetch('/api/belum-bayar/petugas-tabs');
        const list = await res.json();
        const select = document.getElementById('filter-petugas');
        list.forEach(n => {
            const opt = document.createElement('option');
            opt.value = n; opt.innerText = n;
            select.appendChild(opt);
        });
    }

    function debounceSearch() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => loadData(), 500);
    }

    async function loadData() {
        const petugas = document.getElementById('filter-petugas').value;
        const rawPeriode = document.getElementById('filter-periode').value;
        const search = document.getElementById('searchBar').value;
        const [year, month] = rawPeriode.split('-');
        const periode = `${month}-${year}`;

        const container = document.getElementById('list-container');
        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';

        try {
            const url = `/api/belum-bayar?petugas=${encodeURIComponent(petugas)}&periode=${periode}&search=${encodeURIComponent(search)}`;
            const res = await fetch(url);
            const data = await res.json();
            renderCards(data);
            updateSummary(data);
        } catch (err) {
            container.innerHTML = '<div class="alert alert-danger mx-2 rounded-4">Gagal memuat data.</div>';
        }
    }

    function renderCards(data) {
        const container = document.getElementById('list-container');
        if (!data.length) {
            container.innerHTML = '<div class="text-center mt-5"><p class="text-muted">Data tidak ditemukan.</p></div>';
            return;
        }

        container.innerHTML = data.map((item, index) => `
            <div class="card border-0 shadow-sm rounded-4 mb-3 animate__animated animate__fadeInUp">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge bg-primary-subtle text-primary rounded-pill" style="font-size: 10px;">ID: ${item.nomen}</span>
                        <span class="badge bg-dark text-white rounded-pill" style="font-size: 10px;">Vol: ${item.volume || 0} m³</span>
                    </div>
                    <h6 class="fw-bold mb-1 text-dark text-uppercase">${item.nama}</h6>
                    <div class="row g-0 small text-muted mb-3">
                        <div class="col-6"><i class="fas fa-tachometer-alt me-1"></i>${item.nomet || '-'}</div>
                        <div class="col-6 text-end"><i class="fas fa-route me-1"></i>${item.pcez || '-'}</div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center border-top pt-3">
                        <div>
                            <small class="d-block text-muted" style="font-size: 9px;">TAGIHAN</small>
                            <span class="fw-bold text-primary h6">Rp ${Number(item.nominal).toLocaleString('id-ID')}</span>
                        </div>
                        <button class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm" 
                                onclick="openModal('${item.nomen}', '${item.nama}', '${item.nominal}', '${item.nomet}', '${item.volume}', '${item.rayon}')">
                            LAPOR
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function updateSummary(data) {
        const total = data.reduce((acc, curr) => acc + Number(curr.nominal), 0);
        document.getElementById('summary-area').innerHTML = `
            <div class="bg-light rounded-3 p-2 d-flex justify-content-between small px-3 mx-1">
                <span class="text-muted">Jatah: <b>${data.length} Data</b></span>
                <span class="text-primary fw-bold">Rp ${total.toLocaleString('id-ID')}</span>
            </div>
        `;
    }

    function openModal(nomen, nama, nominal, nomet, vol, rayon) {
        document.getElementById('modal-idpel').value = nomen;
        document.getElementById('modal-nominal-val').value = nominal;
        document.getElementById('modal-nama').innerText = nama;
        document.getElementById('modal-sub-nomet').innerText = `MET: ${nomet}`;
        document.getElementById('modal-sub-vol').innerText = `VOL: ${vol} m³`;
        
        document.getElementById('modal-nama-hidden').value = nama;
        document.getElementById('modal-nomet-hidden').value = nomet || '-';
        document.getElementById('modal-vol-hidden').value = vol;
        document.getElementById('modal-rayon-hidden').value = rayon || '-';

        document.getElementById('formKunjungan').reset();
        toggleJanjiInput();
        modalKunjungan.show();
    }

    async function simpanLaporan() {
        Swal.fire({ title: 'Memproses...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        
        const formData = new FormData(document.getElementById('formKunjungan'));
        formData.append('petugas_name', document.getElementById('filter-petugas').value);
        formData.append('nama_pelanggan', document.getElementById('modal-nama').innerText);

        try {
            const res = await fetch('/api/history/simpan-kunjungan', { method: 'POST', body: formData });
            const result = await res.json();
            
            if (res.ok) {
                Swal.fire('Berhasil', 'Menyiapkan Laporan WA...', 'success').then(() => {
                    executeShareWA(result.wa_data);
                    modalKunjungan.hide();
                    loadData();
                });
            } else {
                Swal.fire('Gagal', result.message || 'Coba lagi', 'error');
            }
        } catch (err) {
            Swal.fire('Error', 'Periksa koneksi', 'error');
        }
    }

    function executeShareWA(wa) {
        const waktu = new Date().toLocaleString('id-ID');

        // TEMPLATE LAPORAN KOMPLIT (Bisa dibagikan ke mana saja)
        const pesanShare = 
            `*[LAPORAN KUNJUNGAN LAPANGAN]* 📡%0A` +
            `-------------------------------------------%0A` +
            `👤 *Petugas:* ${wa.petugas}%0A` +
            `🏠 *Konsumen:* ${wa.nama}%0A` +
            `🆔 *IDPEL:* ${wa.nomen}%0A` +
            `📟 *NOMET:* ${wa.nomet}%0A` +
            `📍 *Rayon:* ${wa.rayon}%0A%0A` +
            `*HASIL KUNJUNGAN:*%0A` +
            `📌 Status: *${wa.status}*%0A` +
            `📝 Catatan: ${wa.catatan}%0A%0A` +
            `*RINCIAN TAGIHAN:*%0A` +
            `🧾 Current: Rp ${formatIDR(wa.mc)}%0A` +
            `💸 Ardebt: Rp ${formatIDR(wa.ardebt)}%0A` +
            `💰 *TOTAL: Rp ${formatIDR(wa.total)}*%0A` +
            `💧 *VOL:* ${wa.vol} m³%0A%0A` +
            `📸 *Bukti Foto:*%0A` +
            `${window.location.origin}/static/uploads/kunjungan/${wa.foto_path}%0A%0A` +
            `*Waktu:* ${waktu}%0A` +
            `-------------------------------------------`;

        // INI KUNCINYA: Membuka WA tanpa nomor tujuan (Agar muncul daftar kontak/grup)
        window.open(`https://api.whatsapp.com/send?text=${pesanShare}`, '_blank');
    }
</script>
{% endblock %}
