{% extends "base.html" %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="card shadow mb-4">
        <div class="card-header py-3 d-flex justify-content-between align-items-center bg-primary text-white">
            <h6 class="m-0 font-weight-bold">Daftar Pelanggan Belum Bayar</h6>
            <div class="d-flex gap-2">
                <select id="filter-petugas" class="form-select form-select-sm" style="width: 200px;" onchange="loadData()">
                    <option value="all">-- Semua Petugas --</option>
                </select>
                <button class="btn btn-light btn-sm" onclick="loadData()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
        </div>
        <div class="card-body">
            <div id="petugas-status" class="alert alert-info d-none"></div>
            <div class="table-responsive">
                <table class="table table-bordered table-hover" id="tableBelumBayar" width="100%" cellspacing="0">
                    <thead class="table-light">
                        <tr>
                            <th>ID Pel</th>
                            <th>Nama</th>
                            <th>Alamat</th>
                            <th>Tarif/Daya</th>
                            <th>Total Tagihan</th>
                            <th>Petugas</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="list-belum-bayar">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalKunjungan" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="formKunjungan">
                <div class="modal-header">
                    <h5 class="modal-title">Input Laporan Kunjungan</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modal-idpel">
                    <div class="mb-3">
                        <label class="form-label">Nama Pelanggan</label>
                        <input type="text" id="modal-nama" class="form-control" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Hasil Kunjungan</label>
                        <select id="modal-hasil" class="form-select" required>
                            <option value="">-- Pilih Hasil --</option>
                            <option value="Janji Bayar">Janji Bayar</option>
                            <option value="Rumah Kosong">Rumah Kosong</option>
                            <option value="Sudah Bayar">Sudah Bayar</option>
                            <option value="Ganti Meter">Ganti Meter</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Keterangan</label>
                        <textarea id="modal-keterangan" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Foto Bukti (Opsional)</label>
                        <input type="file" id="modal-foto" class="form-control" accept="image/*">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                    <button type="submit" class="btn btn-primary">Simpan Laporan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Deklarasi variabel global
    let modalKunjungan;

    // Pastikan DOM dan Bootstrap JS sudah dimuat
    document.addEventListener('DOMContentLoaded', function() {
        const modalEl = document.getElementById('modalKunjungan');
        if (modalEl) {
            modalKunjungan = new bootstrap.Modal(modalEl);
        }
        
        loadPetugasDropdown();
        loadData();

        // Handle submit form
        document.getElementById('formKunjungan').addEventListener('submit', async (e) => {
            e.preventDefault();
            await simpanLaporan();
        });
    });

    async function loadPetugasDropdown() {
        try {
            const res = await fetch('/api/belum-bayar/petugas-tabs');
            const list = await res.json();
            const select = document.getElementById('filter-petugas');
            
            // Clear except "Semua Petugas"
            select.innerHTML = '<option value="all">-- Semua Petugas --</option>';
            
            if (list && list.length > 0) {
                list.forEach(nama => {
                    const opt = document.createElement('option');
                    opt.value = nama;
                    opt.textContent = nama;
                    select.appendChild(opt);
                });
            }
        } catch (err) {
            console.error('Gagal load petugas:', err);
        }
    }

    async function loadData() {
        const petugas = document.getElementById('filter-petugas').value;
        const tbody = document.getElementById('list-belum-bayar');
        tbody.innerHTML = '<tr><td colspan="7" class="text-center">Memuat data...</td></tr>';

        try {
            const url = petugas === 'all' ? '/api/belum-bayar' : `/api/belum-bayar?petugas=${encodeURIComponent(petugas)}`;
            const res = await fetch(url);
            const data = await res.json();

            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center">Tidak ada data pelanggan belum bayar.</td></tr>';
                return;
            }

            data.forEach(item => {
                const row = `
                    <tr>
                        <td>${item.idpel}</td>
                        <td>${item.nama}</td>
                        <td>${item.alamat}</td>
                        <td>${item.tarif}/${item.daya}</td>
                        <td class="text-end">Rp ${Number(item.total_tagihan).toLocaleString('id-ID')}</td>
                        <td><span class="badge bg-secondary">${item.petugas || '-'}</span></td>
                        <td>
                            <button class="btn btn-primary btn-sm" onclick="openModal('${item.idpel}', '${item.nama}')">
                                <i class="fas fa-edit"></i> Lapor
                            </button>
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger">Gagal memuat data.</td></tr>';
        }
    }

    function openModal(idpel, nama) {
        document.getElementById('modal-idpel').value = idpel;
        document.getElementById('modal-nama').value = nama;
        document.getElementById('modal-hasil').value = '';
        document.getElementById('modal-keterangan').value = '';
        document.getElementById('modal-foto').value = '';
        modalKunjungan.show();
    }

    async function simpanLaporan() {
        const idpel = document.getElementById('modal-idpel').value;
        const formData = new FormData();
        formData.append('idpel', idpel);
        formData.append('hasil', document.getElementById('modal-hasil').value);
        formData.append('keterangan', document.getElementById('modal-keterangan').value);
        
        const foto = document.getElementById('modal-foto').files[0];
        if (foto) formData.append('foto', foto);

        try {
            const res = await fetch('/api/belum-bayar/lapor', {
                method: 'POST',
                body: formData
            });

            if (res.ok) {
                alert('Laporan berhasil disimpan');
                modalKunjungan.hide();
                loadData();
            } else {
                alert('Gagal menyimpan laporan');
            }
        } catch (err) {
            alert('Terjadi kesalahan jaringan');
        }
    }
</script>
{% endblock %}
