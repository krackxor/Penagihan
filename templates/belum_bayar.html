{% extends "base.html" %}
{% block content %}
<div class="px-2">
    <div class="mb-4">
        <h5 class="fw-bold">Tugas Hari Ini</h5>
        <div id="stats" class="text-muted small">Memuat daftar tugas...</div>
    </div>

    <div id="list-container" class="row g-2">
        </div>
</div>

<script>
async function loadList() {
    try {
        const res = await fetch('/api/belum-bayar/list');
        const data = await res.json();
        document.getElementById('stats').innerText = `${data.length} pelanggan perlu dikunjungi`;
        
        let html = '';
        data.forEach(item => {
            const total = (item.bill_cureent + item.bill_tunggakan).toLocaleString('id-ID');
            html += `
            <div class="col-12 mb-2">
                <div class="card border-0">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div>
                                <h6 class="fw-bold mb-1">${item.nama}</h6>
                                <span class="badge bg-light text-secondary font-monospace">${item.nomen}</span>
                            </div>
                            <div class="text-end">
                                <div class="fw-bold text-danger">Rp ${total}</div>
                                <small class="text-muted" style="font-size:0.7rem">${item.pcez}</small>
                            </div>
                        </div>
                        <hr class="my-3 opacity-5">
                        <div class="row g-2">
                            <div class="col-6">
                                <button onclick="openModal('${item.nomen}')" class="btn btn-light w-100 fw-bold py-2 border">
                                    <i class="fas fa-camera me-1"></i> Lapor
                                </button>
                            </div>
                            <div class="col-6">
                                <a href="https://wa.me/${item.no_hp}" target="_blank" class="btn btn-success w-100 fw-bold py-2">
                                    <i class="fab fa-whatsapp me-1"></i> WA
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        });
        document.getElementById('list-container').innerHTML = html || '<div class="text-center p-5 text-muted">Semua tagihan sudah terbayar!</div>';
    } catch (e) { console.error(e); }
}
document.addEventListener('DOMContentLoaded', loadList);
</script>
{% endblock %}
