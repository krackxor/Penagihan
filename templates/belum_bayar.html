{% extends "base.html" %}
{% block content %}
<div class="animate__animated animate__fadeIn">
    <div class="px-2 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1 text-dark"><i class="fas fa-hand-holding-dollar me-2 text-primary"></i>Penagihan Berjalan</h4>
            <p class="text-muted small mb-0">Prioritas Kolektibilitas &ge; 300rb (High Value)</p>
        </div>
        <div class="d-flex flex-column align-items-end">
            <input type="month" id="filter-periode" 
                   class="form-control form-control-sm border-0 shadow-sm rounded-pill px-3 mb-1" 
                   style="width: 140px; font-size: 0.75rem;" 
                   onchange="loadData()">
            <span class="badge bg-danger rounded-pill shadow-sm" style="font-size: 0.55rem; letter-spacing: 0.5px;">PRIORITAS UTAMA</span>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-3 mx-2 bg-white">
        <div class="card-body p-3">
            <div class="row g-2">
                <div class="col-8">
                    <label class="small fw-bold text-muted mb-1">Delegasi Wilayah Petugas</label>
                    <select id="filter-petugas" class="form-select border-0 bg-light rounded-3 shadow-none fw-bold text-primary" onchange="loadData()">
                        {% if session['role'] == 'petugas' %}
                            <option value="{{ session['petugas_id'] }}">{{ session['petugas_id'] }} (Personel Aktif)</option>
                        {% else %}
                            <option value="all">-- Seluruh Personel --</option>
                        {% endif %}
                    </select>
                </div>
                <div class="col-4 d-flex align-items-end">
                    <button class="btn btn-primary rounded-3 w-100 fw-bold shadow-sm" onclick="loadData()">
                        <i class="fas fa-sync-alt me-1"></i> SYNC
                    </button>
                </div>
                <div class="col-12 mt-2">
                    <div class="input-group bg-light rounded-3 px-2 border border-light">
                        <span class="input-group-text border-0 bg-transparent text-muted"><i class="fas fa-search"></i></span>
                        <input type="text" id="searchBar" class="form-control border-0 bg-transparent py-2 shadow-none" 
                               placeholder="Cari Entitas Berdasarkan Nama atau IDPEL..." onkeyup="debounceSearch()">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="summary-area" class="px-2 mb-3"></div>

    <div id="list-container" class="px-2 pb-5">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted small">Sinkronisasi parameter rute operasional...</p>
        </div>
    </div>
</div>

<div class="modal fade" id="modalKunjungan" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
            <form id="formKunjungan">
                <div class="modal-header border-0 bg-primary text-white p-3">
                    <h6 class="modal-title fw-bold"><i class="fas fa-file-signature me-2"></i>Laporan Kunjungan Operasional</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modal-idpel" name="idpel">
                    <input type="hidden" id="modal-nominal-val" name="nominal_display">
                    <input type="hidden" id="modal-nama-hidden">
                    <input type="hidden" id="modal-rayon-hidden">

                    <div class="bg-primary-subtle p-3 rounded-4 mb-3 border border-primary-subtle">
                        <small class="text-primary fw-bold text-uppercase d-block mb-1" style="font-size: 0.6rem; letter-spacing: 0.5px;">Profil Konsumen</small>
                        <h6 id="modal-nama" class="fw-bold mb-1 text-dark text-uppercase"></h6>
                        <div class="d-flex justify-content-between">
                            <small id="modal-sub-nomet" class="text-muted fw-bold" style="font-size: 0.7rem;"></small>
                            <small id="modal-sub-vol" class="text-primary fw-bold" style="font-size: 0.7rem;"></small>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-dark">Kontak Komunikasi (WhatsApp) *</label>
                        <div class="input-group">
                            <span class="input-group-text border-0 bg-light"><i class="fas fa-phone-alt"></i></span>
                            <input type="tel" id="modal-no-hp" name="no_hp" class="form-control rounded-3" placeholder="Masukkan nomor HP aktif" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-dark">Klasifikasi Hasil Lapangan *</label>
                        <select id="modal-hasil" name="hasil" class="form-select rounded-3 bg-light border-0 fw-bold" required onchange="toggleJanjiInput()">
                            <option value="">-- Pilih Hasil Koordinasi --</option>
                            <option value="Sudah Bayar">✅ Terverifikasi Lunas</option>
                            <option value="Janji Bayar">🤝 Komitmen Pembayaran</option>
                            <option value="Rumah Kosong">🏠 Tidak Bertemu Penghuni</option>
                            <option value="Tutup Bor">🚫 Rekomendasi Segel/Tutup</option>
                            <option value="Lainnya">⚠️ Kendala Teknis/Lainnya</option>
                        </select>
                    </div>

                    <div class="mb-3 d-none animate__animated animate__headShake" id="group-janji">
                        <label class="form-label small fw-bold text-danger">Target Tanggal Komitmen</label>
                        <input type="date" id="modal-janji-dt" name="janji_bayar_dt" class="form-control rounded-3 border-danger-subtle bg-danger bg-opacity-10 text-danger fw-bold">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-dark">Narasi Temuan Petugas</label>
                        <textarea id="modal-keterangan" name="keterangan" class="form-control rounded-3 bg-light border-0" rows="2" placeholder="Detail informasi temuan di lokasi..."></textarea>
                    </div>

                    <div class="mb-0">
                        <label class="form-label small fw-bold text-dark">Dokumentasi Visual (Kamera) *</label>
                        <input type="file" id="modal-foto" name="foto" class="form-control rounded-3" accept="image/*" capture="camera" required>
                        <small class="text-muted" style="font-size: 0.6rem;">Telemetri GPS akan disematkan otomatis pada berkas foto.</small>
                    </div>
                </div>
                <div class="modal-footer border-0 p-3 pt-0">
                    <button type="submit" class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow">
                        TRANSMISI DATA & LAPOR WHATSAPP <i class="fab fa-whatsapp ms-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    let modalKunjungan;
    let searchTimeout;
    const formatIDR = (n) => new Intl.NumberFormat('id-ID').format(n);

    document.addEventListener('DOMContentLoaded', () => {
        modalKunjungan = new bootstrap.Modal(document.getElementById('modalKunjungan'));
        initCalendar(); 
        
        if ("{{ session['role'] }}" === 'admin') {
            loadPetugasDropdown();
        } else {
            document.getElementById('filter-petugas').disabled = true;
        }
        
        loadData();

        document.getElementById('formKunjungan').addEventListener('submit', async (e) => {
            e.preventDefault();
            await simpanLaporan();
        });
    });

    function initCalendar() {
        const now = new Date();
        document.getElementById('filter-periode').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    }

    function toggleJanjiInput() {
        const isJanji = document.getElementById('modal-hasil').value === 'Janji Bayar';
        const group = document.getElementById('group-janji');
        group.classList.toggle('d-none', !isJanji);
        document.getElementById('modal-janji-dt').required = isJanji;
    }

    async function loadPetugasDropdown() {
        try {
            const res = await fetch('/api/belum-bayar/petugas-tabs');
            const list = await res.json();
            const select = document.getElementById('filter-petugas');
            list.forEach(n => {
                if (n && n !== "{{ session['petugas_id'] }}") {
                    const opt = document.createElement('option');
                    opt.value = n; opt.innerText = n;
                    select.appendChild(opt);
                }
            });
        } catch(e) { console.error("Dropdown synchronization failure"); }
    }

    function debounceSearch() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => loadData(), 500);
    }

    async function loadData() {
        const petugas = document.getElementById('filter-petugas').value;
        const rawPeriode = document.getElementById('filter-periode').value;
        const search = document.getElementById('searchBar').value;
        const [year, month] = rawPeriode.split('-');
        const periode = `${month}-${year}`;

        const container = document.getElementById('list-container');
        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div><p class="small text-muted mt-2">Sinkronisasi data...</p></div>';

        try {
            const url = `/api/belum-bayar?petugas=${encodeURIComponent(petugas)}&periode=${periode}&search=${encodeURIComponent(search)}`;
            const res = await fetch(url);
            const data = await res.json();
            renderCards(data);
            updateSummary(data);
        } catch (err) {
            container.innerHTML = '<div class="alert alert-danger mx-2 rounded-4 small text-center">Kegagalan transmisi server.</div>';
        }
    }

    function renderCards(data) {
        const container = document.getElementById('list-container');
        if (!data || !data.length) {
            container.innerHTML = '<div class="text-center mt-5 py-5"><i class="fas fa-search-dollar fa-3x text-light mb-3"></i><p class="text-muted small">Tidak ditemukan entitas tagihan prioritas.</p></div>';
            return;
        }

        container.innerHTML = data.map((item) => `
            <div class="card border-0 shadow-sm rounded-4 mb-3 animate__animated animate__fadeInUp bg-white">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge bg-primary-subtle text-primary rounded-pill px-2 py-1 fw-bold" style="font-size: 9px;">IDPEL: ${item.nomen}</span>
                        <span class="badge bg-danger text-white rounded-pill px-2 py-1" style="font-size: 9px;">OPERASIONAL</span>
                    </div>
                    <h6 class="fw-bold mb-1 text-dark text-uppercase small" style="letter-spacing: 0.3px;">${item.nama}</h6>
                    <div class="row g-0 small text-muted mb-3" style="font-size: 0.7rem;">
                        <div class="col-6"><i class="fas fa-map-pin me-1"></i>Wilayah: ${item.pcez || '-'}</div>
                        <div class="col-6 text-end"><i class="fas fa-tachometer-alt me-1"></i>Rayon: ${item.rayon || '-'}</div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center border-top pt-3">
                        <div>
                            <small class="d-block text-muted fw-bold" style="font-size: 8px; letter-spacing: 0.5px;">ESTIMASI TAGIHAN</small>
                            <span class="fw-bold text-primary" style="font-size: 1.1rem;">Rp ${formatIDR(item.nominal)}</span>
                        </div>
                        <button class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm" 
                                onclick="openModal('${item.nomen}', '${item.nama.replace(/'/g, "\\'")}', '${item.nominal}', '${item.nomet}', '${item.volume}', '${item.rayon}')">
                            VISIT <i class="fas fa-chevron-right ms-1"></i>
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function updateSummary(data) {
        const total = data.reduce((acc, curr) => acc + Number(curr.nominal), 0);
        document.getElementById('summary-area').innerHTML = `
            <div class="bg-primary shadow-sm rounded-4 p-3 d-flex justify-content-between align-items-center mx-1 text-white animate__animated animate__fadeIn">
                <div>
                    <div class="opacity-75 mb-0 text-uppercase" style="font-size: 0.6rem; letter-spacing: 0.5px;">Target Operasional</div>
                    <div class="fw-bold h5 mb-0">${data.length} <small style="font-size: 0.6rem;">UNIT</small></div>
                </div>
                <div class="text-end">
                    <div class="opacity-75 mb-0 text-uppercase" style="font-size: 0.6rem; letter-spacing: 0.5px;">Potensi Recovery</div>
                    <div class="fw-bold h5 mb-0">Rp ${formatIDR(total)}</div>
                </div>
            </div>
        `;
    }

    function openModal(nomen, nama, nominal, nomet, vol, rayon) {
        document.getElementById('modal-idpel').value = nomen;
        document.getElementById('modal-nominal-val').value = nominal;
        document.getElementById('modal-nama').innerText = nama;
        document.getElementById('modal-sub-nomet').innerText = `IDPEL: ${nomen}`;
        document.getElementById('modal-sub-vol').innerText = `TAGIHAN: Rp ${formatIDR(nominal)}`;
        
        document.getElementById('modal-nama-hidden').value = nama;
        document.getElementById('modal-rayon-hidden').value = rayon || '-';

        document.getElementById('formKunjungan').reset();
        toggleJanjiInput();
        modalKunjungan.show();
    }

    async function simpanLaporan() {
        Swal.fire({ 
            title: 'Memproses Laporan...', 
            text: 'Enkripsi data dan validasi geo-tagging',
            allowOutsideClick: false, 
            didOpen: () => Swal.showLoading() 
        });
        
        const formData = new FormData(document.getElementById('formKunjungan'));
        formData.append('petugas_name', document.getElementById('filter-petugas').value);
        formData.append('nama_pelanggan', document.getElementById('modal-nama-hidden').value);
        // Menangkap nomor HP inputan user untuk template WA
        const inputNoHp = document.getElementById('modal-no-hp').value;

        try {
            const res = await fetch('/api/history/simpan-kunjungan', { method: 'POST', body: formData });
            const result = await res.json();
            
            if (res.ok) {
                Swal.fire({
                    icon: 'success',
                    title: 'Laporan Terkirim',
                    text: 'Snapshot operasional berhasil dikunci ke sistem.',
                    confirmButtonText: 'Kirim Notifikasi WA'
                }).then(() => {
                    if (result.wa_data) {
                        result.wa_data.no_hp_konsumen = inputNoHp; // Injeksi nomor kontak ke template
                        executeShareWA(result.wa_data);
                    }
                    modalKunjungan.hide();
                    loadData();
                });
            } else {
                Swal.fire('Kegagalan Transmisi', result.message, 'error');
            }
        } catch (err) {
            Swal.fire('Error Database', 'Gagal sinkronisasi ke pangkalan data.', 'error');
        }
    }

    function executeShareWA(wa) {
        const waktu = new Date().toLocaleString('id-ID');
        const pesanShare = 
            `*🚨 LAPORAN OPERASIONAL - AREA SERVICE*%0A` +
            `-------------------------------------------%0A` +
            `👤 *Petugas:* ${wa.petugas}%0A` +
            `🏠 *Entitas Konsumen:* ${wa.nama}%0A` +
            `🆔 *IDPEL:* ${wa.nomen}%0A` +
            `📞 *No Kontak:* ${wa.no_hp_konsumen || '-'}%0A` +
            `📍 *Rayon:* ${wa.rayon}%0A%0A` +
            `*HASIL KOORDINASI:*%0A` +
            `🏁 *Status:* *${wa.status.toUpperCase()}*%0A` +
            `📝 *Analisis:* ${wa.catatan || '-'}%0A%0A` +
            `*DATA FINANSIAL:*%0A` +
            `🧾 Tagihan: Rp ${formatIDR(wa.mc)}%0A` +
            `💰 *PIUTANG TERTAGIH: Rp ${formatIDR(wa.total)}*%0A%0A` +
            `📸 *DOKUMENTASI VISUAL:*%0A` +
            `${window.location.origin}/static/uploads/kunjungan/${wa.foto_path}%0A%0A` +
            `📅 *Waktu Transmisi:* ${waktu}%0A` +
            `_Dashboard Area Service Integritas_`;

        window.open(`https://api.whatsapp.com/send?text=${pesanShare}`, '_blank');
    }
</script>

<style>
    .bg-primary-subtle { background-color: #eff6ff !important; }
    .btn-primary { background: #2563eb; border: none; transition: 0.3s; }
    .btn-primary:hover { background: #1e40af; transform: translateY(-1px); }
    .spinner-border { width: 1.5rem; height: 1.5rem; }
    .form-select:disabled { background-color: #f8fafc; color: #2563eb; font-weight: bold; opacity: 1; }
    .card { transition: all 0.2s ease; border: 1px solid transparent !important; }
    .card:active { transform: scale(0.98); }
</style>
{% endblock %}
