{% extends "base.html" %}

{% block content %}
<div class="px-2 pb-5">
    <div class="pt-4 mb-3 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-0">Daftar Penagihan</h4>
            <p class="text-muted small mb-0">Target pengerjaan Master Catat (MC)</p>
        </div>
        <div class="text-end">
            <span class="badge bg-primary rounded-pill px-3" id="count-badge">0 Data</span>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-3">
        <div class="card-body p-2">
            <div class="row g-2">
                <div class="col-5">
                    <select id="filter-petugas" class="form-select border-0 bg-light rounded-3 shadow-none" style="font-size: 0.85rem;">
                        <option value="all">Semua Petugas</option>
                    </select>
                </div>
                <div class="col-7">
                    <div class="input-group bg-light rounded-3">
                        <span class="input-group-text border-0 bg-transparent text-muted"><i class="fas fa-search"></i></span>
                        <input type="text" id="search-input" class="form-control border-0 bg-transparent shadow-none" placeholder="Cari Nomen / Nama..." style="font-size: 0.85rem;">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="list-container">
        <div id="loader" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-2 small">Sinkronisasi data MC vs MB...</p>
        </div>
    </div>
</div>

<div class="modal fade" id="modalKunjungan" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4">
            <form id="form-kunjungan">
                <div class="modal-header border-0">
                    <h6 class="modal-title fw-bold">Input Hasil Kunjungan</h6>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body py-0">
                    <div class="p-3 bg-light rounded-4 mb-3">
                        <div class="small text-muted mb-1">Pelanggan:</div>
                        <div id="m-nama" class="fw-bold text-primary"></div>
                        <div id="m-nomen" class="small fw-bold"></div>
                        <div id="m-tagihan" class="text-danger fw-bold mt-1"></div>
                    </div>

                    <input type="hidden" name="nomen" id="in-nomen">
                    <input type="hidden" name="lat" id="in-lat">
                    <input type="hidden" name="lng" id="in-lng">

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Hasil Kunjungan</label>
                        <select name="keterangan" class="form-select rounded-3 bg-light border-0" required>
                            <option value="">-- Pilih Hasil --</option>
                            <option value="Sudah Bayar">Sudah Bayar (Lunas)</option>
                            <option value="Janji Bayar">Janji Bayar</option>
                            <option value="Rumah Kosong">Rumah Kosong (RKS)</option>
                            <option value="Pindah/Tidak Ditemukan">Pindah/Tidak Ditemukan</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Foto Bukti (GPS)</label>
                        <input type="file" name="foto" class="form-control rounded-3 bg-light border-0" accept="image/*" capture="camera" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Update No. HP (Opsional)</label>
                        <input type="number" name="no_hp" id="in-hp" class="form-control rounded-3 bg-light border-0" placeholder="0812...">
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="submit" id="btn-submit" class="btn btn-primary w-100 rounded-3 fw-bold py-2">SIMPAN & KIRIM LAPORAN</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const listContainer = document.getElementById('list-container');
    const filterPetugas = document.getElementById('filter-petugas');
    const searchInput = document.getElementById('search-input');
    const modalKunjungan = new bootstrap.Modal(document.getElementById('modalKunjungan'));

    // Format Rupiah
    const toIDR = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);

    // Load Daftar Petugas untuk Filter
    async function loadPetugas() {
        const res = await fetch('/api/belum-bayar/petugas-tabs');
        const data = await res.json();
        data.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p; opt.textContent = p;
            filterPetugas.appendChild(opt);
        });
    }

    // Load Data Pelanggan (MC as Induk)
    async function loadData() {
        listContainer.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';
        const p = filterPetugas.value;
        const s = searchInput.value;
        
        try {
            const res = await fetch(`/api/belum-bayar/list?petugas=${p}&search=${s}`);
            const data = await res.json();
            
            document.getElementById('count-badge').innerText = `${data.length} Data`;

            if (data.length === 0) {
                listContainer.innerHTML = '<div class="text-center py-5 text-muted small">Semua tagihan sudah lunas atau data tidak ditemukan.</div>';
                return;
            }

            listContainer.innerHTML = data.map(item => `
                <div class="card border-0 shadow-sm rounded-4 mb-2 item-card ${item.is_visited > 0 ? 'opacity-50' : ''}" 
                     onclick="openKunjungan('${item.nomen}', '${item.nama}', '${item.total}', '${item.no_hp || ''}')">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between">
                            <div>
                                <div class="small text-muted" style="font-size: 0.7rem;">NOMEN: ${item.nomen}</div>
                                <div class="fw-bold text-dark">${item.nama}</div>
                                <div class="small text-primary fw-bold">${item.pcez} - BLOK ${item.block}</div>
                            </div>
                            <div class="text-end">
                                <div class="fw-bold text-danger">${toIDR(item.total)}</div>
                                ${item.is_visited > 0 ? '<span class="badge bg-success small" style="font-size: 0.6rem;">TERKUNJUNGI</span>' : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            listContainer.innerHTML = `<div class="alert alert-danger small">${e.message}</div>`;
        }
    }

    // Modal Handle
    function openKunjungan(nomen, nama, total, hp) {
        document.getElementById('m-nama').innerText = nama;
        document.getElementById('m-nomen').innerText = 'ID: ' + nomen;
        document.getElementById('m-tagihan').innerText = 'Tagihan: ' + toIDR(total);
        document.getElementById('in-nomen').value = nomen;
        document.getElementById('in-hp').value = hp;
        
        // Dapatkan GPS
        navigator.geolocation.getCurrentPosition(pos => {
            document.getElementById('in-lat').value = pos.coords.latitude;
            document.getElementById('in-lng').value = pos.coords.longitude;
        });

        modalKunjungan.show();
    }

    // Simpan Data & Kirim WA
    document.getElementById('form-kunjungan').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-submit');
        btn.disabled = true;
        btn.innerText = 'MENGIRIM...';

        const formData = new FormData(e.target);
        // Tambahkan petugas yang dipilih sebagai pelapor
        formData.append('petugas', filterPetugas.value === 'all' ? 'ADMIN' : filterPetugas.value);

        try {
            const res = await fetch('/api/belum-bayar/simpan-kunjungan', { method: 'POST', body: formData });
            const data = await res.json();
            
            if (data.status === 'success') {
                // Berbagi ke WhatsApp
                const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(data.wa_text)}`;
                window.open(waUrl, '_blank');
                modalKunjungan.hide();
                loadData();
            }
        } catch (err) {
            alert('Error: ' + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = 'SIMPAN & KIRIM LAPORAN';
        }
    };

    // Event Listeners
    filterPetugas.onchange = loadData;
    searchInput.onkeyup = _.debounce(loadData, 500); // Pastikan library lodash/debounce terpasang di base.html

    document.addEventListener('DOMContentLoaded', () => {
        loadPetugas();
        loadData();
    });
</script>

<style>
    .item-card { cursor: pointer; transition: transform 0.2s; }
    .item-card:active { transform: scale(0.98); background-color: #f8f9fa; }
</style>
{% endblock %}
