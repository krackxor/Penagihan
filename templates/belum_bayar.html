{% extends "base.html" %}
{% block content %}
<div class="animate__animated animate__fadeIn">
    <div class="px-2 mb-4">
        <h4 class="fw-bold mb-1">Daftar Tagihan 📋</h4>
        <p class="text-muted small">Kelola penagihan pelanggan di lapangan</p>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-3 mx-2">
        <div class="card-body p-3">
            <div class="row g-2">
                <div class="col-6">
                    <label class="small fw-bold text-muted mb-1">Petugas</label>
                    <select id="filter-petugas" class="form-select border-0 bg-light rounded-3 shadow-none" onchange="loadData()">
                        <option value="all">Semua</option>
                    </select>
                </div>
                <div class="col-6 text-end d-flex align-items-end justify-content-end">
                    <button class="btn btn-primary rounded-3 w-100 fw-bold" onclick="loadData()">
                        <i class="fas fa-sync-alt me-1"></i> Sync
                    </button>
                </div>
                <div class="col-12 mt-2">
                    <div class="input-group bg-light rounded-3 px-2 border">
                        <span class="input-group-text border-0 bg-transparent"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" id="searchBar" class="form-control border-0 bg-transparent py-2 shadow-none" placeholder="Cari Nama / IDPEL..." onkeyup="liveSearch()">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="summary-area" class="px-2 mb-3"></div>

    <div id="list-container" class="px-2">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Mengambil data terbaru...</p>
        </div>
    </div>
</div>

<div class="modal fade" id="modalKunjungan" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <form id="formKunjungan">
                <div class="modal-header border-0 pb-0">
                    <h5 class="fw-bold"><i class="fas fa-pen-nib me-2"></i>Laporan Lapangan</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modal-idpel">
                    <div class="bg-primary-subtle p-3 rounded-4 mb-3 border border-primary-subtle">
                        <small class="text-primary fw-bold d-block mb-1">DATA PELANGGAN</small>
                        <h6 id="modal-nama" class="fw-bold mb-0"></h6>
                        <small id="modal-info-tambahan" class="text-muted"></small>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Hasil Kunjungan</label>
                        <select id="modal-hasil" class="form-select rounded-3 bg-light border-0" required>
                            <option value="">-- Pilih Hasil --</option>
                            <option value="Sudah Bayar">Sudah Bayar</option>
                            <option value="Janji Bayar">Janji Bayar</option>
                            <option value="Rumah Kosong">Rumah Kosong</option>
                            <option value="Lainnya">Lainnya</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Catatan Tambahan</label>
                        <textarea id="modal-keterangan" class="form-control rounded-3 bg-light border-0" rows="3" placeholder="Contoh: Janji bayar tgl 15..."></textarea>
                    </div>

                    <div class="mb-0">
                        <label class="form-label small fw-bold">Foto Bukti</label>
                        <input type="file" id="modal-foto" class="form-control rounded-3 bg-light border-0" accept="image/*" capture="camera">
                        <p class="text-muted mt-1" style="font-size: 10px;">* Klik untuk mengambil foto dari kamera</p>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="submit" class="btn btn-primary w-100 rounded-3 py-2 fw-bold shadow">
                        SIMPAN LAPORAN <i class="fas fa-paper-plane ms-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    let rawData = [];
    let modalKunjungan;

    document.addEventListener('DOMContentLoaded', () => {
        modalKunjungan = new bootstrap.Modal(document.getElementById('modalKunjungan'));
        loadPetugasDropdown();
        loadData();
    });

    async function loadPetugasDropdown() {
        const res = await fetch('/api/belum-bayar/petugas-tabs');
        const list = await res.json();
        const select = document.getElementById('filter-petugas');
        list.forEach(n => select.innerHTML += `<option value="${n}">${n}</option>`);
    }

    async function loadData() {
        const petugas = document.getElementById('filter-petugas').value;
        const container = document.getElementById('list-container');
        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';

        try {
            const url = petugas === 'all' ? '/api/belum-bayar' : `/api/belum-bayar?petugas=${encodeURIComponent(petugas)}`;
            const res = await fetch(url);
            rawData = await res.json();
            renderCards(rawData);
            updateSummary(rawData);
        } catch (err) {
            container.innerHTML = '<div class="alert alert-danger mx-2 rounded-4">Koneksi terputus. Coba lagi.</div>';
        }
    }

    function renderCards(data) {
        const container = document.getElementById('list-container');
        if (data.length === 0) {
            container.innerHTML = '<div class="text-center mt-5"><i class="fas fa-check-circle fa-3x text-success mb-3"></i><p class="fw-bold">Semua Tagihan Beres!</p></div>';
            return;
        }

        container.innerHTML = data.map(item => `
            <div class="card border-0 shadow-sm rounded-4 mb-3 customer-card animate__animated animate__fadeInUp" 
                 data-search="${item.nama} ${item.idpel}">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-primary-subtle text-primary rounded-pill px-3">${item.idpel}</span>
                        <small class="text-muted fw-bold">${item.tarif}/${item.daya}</small>
                    </div>
                    <h6 class="fw-bold mb-1 text-dark">${item.nama}</h6>
                    <p class="text-muted small mb-3 text-truncate" style="max-width: 250px;">
                        <i class="fas fa-map-marker-alt me-1 text-danger"></i> ${item.alamat}
                    </p>
                    
                    <div class="d-flex justify-content-between align-items-center border-top pt-3 mt-2">
                        <div>
                            <small class="d-block text-muted" style="font-size: 10px;">TAGIHAN</small>
                            <span class="fw-bold text-success h6">Rp ${Number(item.total_tagihan).toLocaleString('id-ID')}</span>
                        </div>
                        <button class="btn btn-primary rounded-3 px-4 fw-bold shadow-sm" 
                                onclick="openModal('${item.idpel}', '${item.nama}', '${item.tarif}/${item.daya}')">
                            LAPOR
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function liveSearch() {
        const query = document.getElementById('searchBar').value.toLowerCase();
        const cards = document.querySelectorAll('.customer-card');
        cards.forEach(card => {
            card.style.display = card.dataset.search.toLowerCase().includes(query) ? 'block' : 'none';
        });
    }

    function updateSummary(data) {
        const totalNominal = data.reduce((acc, curr) => acc + Number(curr.total_tagihan), 0);
        document.getElementById('summary-area').innerHTML = `
            <div class="d-flex justify-content-between small px-1">
                <span class="text-muted">Total: <b>${data.length} Pelanggan</b></span>
                <span class="text-muted">Nilai: <b>Rp ${totalNominal.toLocaleString('id-ID')}</b></span>
            </div>
        `;
    }

    function openModal(idpel, nama, info) {
        document.getElementById('modal-idpel').value = idpel;
        document.getElementById('modal-nama').innerText = nama;
        document.getElementById('modal-info-tambahan').innerText = info;
        document.getElementById('formKunjungan').reset();
        modalKunjungan.show();
    }

    async function simpanLaporan() {
        Swal.fire({ title: 'Menyimpan...', didOpen: () => { Swal.showLoading(); } });
        
        const formData = new FormData();
        formData.append('idpel', document.getElementById('modal-idpel').value);
        formData.append('hasil', document.getElementById('modal-hasil').value);
        formData.append('keterangan', document.getElementById('modal-keterangan').value);
        
        const foto = document.getElementById('modal-foto').files[0];
        if (foto) formData.append('foto', foto);

        try {
            const res = await fetch('/api/belum-bayar/lapor', { method: 'POST', body: formData });
            if (res.ok) {
                Swal.fire('Berhasil!', 'Laporan tersimpan.', 'success');
                modalKunjungan.hide();
                loadData();
            } else {
                Swal.fire('Gagal', 'Terjadi kesalahan sistem.', 'error');
            }
        } catch (err) {
            Swal.fire('Error', 'Cek koneksi internet Anda.', 'error');
        }
    }
</script>
{% endblock %}
