{% extends "base.html" %}

{% block content %}
<div class="px-2 pb-5">
    <div class="pt-4 mb-3 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-0">Tugas Penagihan</h4>
            <p class="text-muted small mb-0">Target harian (Sisa Belum Dikerjakan)</p>
        </div>
        <span class="badge bg-primary rounded-pill px-3" id="count-badge">0</span>
    </div>

    <select id="filter-petugas" class="form-select border-0 bg-light rounded-3 mb-3 shadow-none" onchange="loadData()">
        <option value="all">-- Pilih Petugas --</option>
    </select>

    <div id="list-container">
        <div class="text-center py-5 text-muted">Silakan pilih petugas...</div>
    </div>
</div>

<div class="modal fade" id="modalKunjungan" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4">
            <form id="form-kunjungan">
                <div class="modal-header border-0">
                    <h6 class="modal-title fw-bold">Input Hasil Lapangan</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body py-0">
                    <div class="p-3 bg-light rounded-4 mb-3">
                        <div id="m-nama" class="fw-bold text-primary"></div>
                        <div id="m-nomen" class="small text-muted"></div>
                    </div>

                    <input type="hidden" name="nomen" id="in-nomen">
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Hasil Kunjungan</label>
                        <select name="keterangan" id="select-keterangan" class="form-select border-0 bg-light" required onchange="toggleJanjiDate()">
                            <option value="">-- Pilih Hasil --</option>
                            <option value="Sudah Bayar">Sudah Bayar</option>
                            <option value="Janji Bayar">Janji Bayar</option>
                            <option value="Rumah Kosong">Rumah Kosong</option>
                        </select>
                    </div>

                    <div class="mb-3 d-none" id="div-janji">
                        <label class="form-label small fw-bold text-danger">Tanggal Janji Bayar</label>
                        <input type="date" name="janji_bayar_dt" class="form-control border-0 bg-light">
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="submit" class="btn btn-primary w-100 rounded-3 py-2 fw-bold">SIMPAN LAPORAN</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const listContainer = document.getElementById('list-container');
    const modalKunjungan = new bootstrap.Modal(document.getElementById('modalKunjungan'));

    function toggleJanjiDate() {
        const status = document.getElementById('select-keterangan').value;
        document.getElementById('div-janji').classList.toggle('d-none', status !== 'Janji Bayar');
    }

    async function loadData() {
        const petugas = document.getElementById('filter-petugas').value;
        if(petugas === 'all') return;

        listContainer.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';
        
        const res = await fetch(`/api/belum-bayar/list?petugas=${petugas}`);
        const data = await res.json();
        
        document.getElementById('count-badge').innerText = data.length;

        if (data.length === 0) {
            listContainer.innerHTML = '<div class="alert alert-success rounded-4 text-center">Tugas selesai! Tidak ada sisa tagihan.</div>';
            return;
        }

        listContainer.innerHTML = data.map(item => `
            <div class="card border-0 shadow-sm rounded-4 mb-2 item-card" onclick="openKunjungan('${item.nomen}', '${item.nama}')">
                <div class="card-body p-3 d-flex justify-content-between align-items-center">
                    <div>
                        <div class="fw-bold text-dark">${item.nama}</div>
                        <div class="small text-muted">${item.nomen} | BLOK ${item.block}</div>
                    </div>
                    <div class="text-end">
                        <div class="fw-bold text-danger">Rp ${item.nominal.toLocaleString()}</div>
                        <span class="badge bg-light text-primary border">${item.pcez}</span>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function openKunjungan(nomen, nama) {
        document.getElementById('m-nama').innerText = nama;
        document.getElementById('m-nomen').innerText = nomen;
        document.getElementById('in-nomen').value = nomen;
        document.getElementById('select-keterangan').value = '';
        document.getElementById('div-janji').classList.add('d-none');
        modalKunjungan.show();
    }

    document.getElementById('form-kunjungan').onsubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        formData.append('petugas', document.getElementById('filter-petugas').value);

        const res = await fetch('/api/belum-bayar/simpan-kunjungan', { method: 'POST', body: formData });
        if ((await res.json()).status === 'success') {
            modalKunjungan.hide();
            loadData(); // Langsung hilang dari daftar setelah simpan
        }
    };

    // Load Petugas on Start
    document.addEventListener('DOMContentLoaded', async () => {
        const res = await fetch('/api/belum-bayar/petugas-tabs');
        const data = await res.json();
        const select = document.getElementById('filter-petugas');
        data.forEach(p => select.innerHTML += `<option value="${p}">${p}</option>`);
    });
</script>
{% endblock %}
