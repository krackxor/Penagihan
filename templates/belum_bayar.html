{% extends "base.html" %}
{% block content %}
<div class="px-2 pb-5">
    <div class="sticky-top bg-white pt-3 shadow-sm" style="z-index: 1020; margin: 0 -15px; padding: 0 15px;">
        <div class="d-flex gap-2 overflow-auto no-scrollbar pb-3" id="petugasTabs">
            <button class="btn btn-primary rounded-pill px-4 btn-tab active" onclick="filterByPetugas('all', this)">Semua</button>
        </div>
        <div class="input-group mb-3 rounded-4 border overflow-hidden shadow-sm">
            <span class="input-group-text border-0 bg-white"><i class="fas fa-search text-muted"></i></span>
            <input type="text" id="searchInput" class="form-control border-0" placeholder="Cari Pelanggan...">
        </div>
    </div>

    <div id="listContainer" class="mt-3"></div>
</div>

<div class="modal fade" id="modalLapor" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h5 class="fw-bold">Laporan Kunjungan</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="formLapor" enctype="multipart/form-data">
                <div class="modal-body">
                    <input type="hidden" id="modal-nomen" name="nomen">
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">NOMOR HP PELANGGAN</label>
                        <input type="number" class="form-control rounded-3 p-3 bg-light border-0" name="no_hp" id="modal-no-hp" placeholder="08xxx">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">HASIL LAPANGAN</label>
                        <select class="form-select rounded-3 p-3 bg-light border-0" name="keterangan" required>
                            <option value="">-- Pilih Hasil --</option>
                            <option value="Janji Bayar">Janji Bayar</option>
                            <option value="Rumah Kosong">Rumah Kosong</option>
                            <option value="Sudah Bayar">Sudah Bayar</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">FOTO BUKTI</label>
                        <div class="text-center p-3 border-2 border-dashed rounded-4 mb-2" onclick="document.getElementById('fileFoto').click()" style="cursor:pointer; background:#f8f9fa;">
                            <i class="fas fa-camera fa-2x text-primary mb-2"></i>
                            <p class="small text-muted mb-0">Klik untuk Ambil Foto</p>
                        </div>
                        <input type="file" id="fileFoto" name="foto" accept="image/*" capture="camera" class="d-none" onchange="previewImg(this)">
                        <img id="imgPreview" class="img-fluid rounded-4 d-none shadow-sm">
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="submit" class="btn btn-primary w-100 py-3 rounded-4 fw-bold">Kirim Laporan</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
let selPetugas = 'all';

function previewImg(input) {
    const preview = document.getElementById('imgPreview');
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
            preview.src = e.target.result;
            preview.classList.remove('d-none');
        };
        reader.readAsDataURL(input.files[0]);
    }
}

async function initPage() {
    const resTabs = await fetch('/api/belum-bayar/petugas-tabs');
    const tabs = await resTabs.json();
    const container = document.getElementById('petugasTabs');
    tabs.forEach(name => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-outline-secondary rounded-pill px-4 btn-tab';
        btn.innerText = name;
        btn.onclick = () => filterByPetugas(name, btn);
        container.appendChild(btn);
    });
    loadData();
}

function filterByPetugas(name, btn) {
    selPetugas = name;
    document.querySelectorAll('.btn-tab').forEach(b => b.classList.replace('btn-primary', 'btn-outline-secondary'));
    btn.classList.replace('btn-outline-secondary', 'btn-primary');
    loadData();
}

async function loadData() {
    const search = document.getElementById('searchInput').value;
    const pParam = selPetugas === 'all' ? '' : selPetugas;
    const res = await fetch(`/api/belum-bayar/list?petugas=${pParam}&search=${search}`);
    const data = await res.json();
    
    document.getElementById('listContainer').innerHTML = data.map(item => `
        <div class="card border-0 shadow-sm mb-3 rounded-4">
            <div class="card-body p-3">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <h6 class="fw-bold mb-0">${item.nama}</h6>
                    <span class="badge bg-light text-primary border">${item.pcez} / B${item.block}</span>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                    <span class="fw-bold text-danger">Rp ${item.total_tagihan.toLocaleString()}</span>
                    <button class="btn btn-primary btn-sm rounded-pill px-4" onclick="openLapor('${item.nomen}', '${item.no_hp || ''}')">Lapor</button>
                </div>
            </div>
        </div>
    `).join('');
}

function openLapor(nomen, nohp) {
    document.getElementById('modal-nomen').value = nomen;
    document.getElementById('modal-no-hp').value = nohp;
    document.getElementById('imgPreview').classList.add('d-none');
    document.getElementById('formLapor').reset();
    new bootstrap.Modal(document.getElementById('modalLapor')).show();
}

document.getElementById('formLapor').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    fd.append('petugas', selPetugas === 'all' ? 'ADMIN' : selPetugas);

    Swal.fire({ title: 'Mengirim...', didOpen: () => Swal.showLoading() });

    const res = await fetch('/api/belum-bayar/simpan-kunjungan', { method: 'POST', body: fd });
    if (res.ok) {
        Swal.fire('Berhasil!', 'Laporan dan No HP disimpan.', 'success');
        loadData();
        bootstrap.Modal.getInstance(document.getElementById('modalLapor')).hide();
    }
};

document.getElementById('searchInput').oninput = loadData;
window.onload = initPage;
</script>
{% endblock %}
