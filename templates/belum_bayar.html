{% extends "base.html" %}
{% block content %}
<div class="animate__animated animate__fadeIn px-2 pb-5">
    
    <div class="card border-0 bg-primary text-white rounded-4 mb-3 shadow">
        <div class="card-body p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="mb-0 fw-bold small">PROGRES TARGET HARIAN</h6>
                <span class="badge bg-white text-primary" id="progText">0/10</span>
            </div>
            <div class="progress bg-white bg-opacity-25" style="height: 8px;">
                <div id="progBar" class="progress-bar bg-white" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <div class="sticky-top bg-white pt-2 shadow-sm" style="z-index: 1020; margin: 0 -15px; padding: 0 15px;">
        <div class="d-flex gap-2 overflow-auto no-scrollbar pb-3" id="petugasTabs">
            <button class="btn btn-primary rounded-pill px-4 btn-tab active" onclick="filterPetugas('all', this)">Semua</button>
            </div>
        
        <div class="input-group mb-3 rounded-4 border overflow-hidden">
            <span class="input-group-text border-0 bg-white"><i class="fas fa-search"></i></span>
            <input type="text" id="searchInput" class="form-control border-0" placeholder="Cari Pelanggan...">
        </div>
    </div>

    <div id="listContainer" class="mt-3">
        <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
    </div>
</div>

<style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .btn-tab { white-space: nowrap; font-size: 0.8rem; font-weight: 600; }
    .customer-card { border-radius: 15px !important; border-left: 5px solid #0061ff !important; }
</style>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
let selPetugas = 'all';

async function initPage() {
    // 1. Ambil Tab Petugas
    try {
        const res = await fetch('/api/belum-bayar/petugas-tabs');
        const tabs = await res.json();
        const container = document.getElementById('petugasTabs');
        
        tabs.forEach(name => {
            const btn = document.createElement('button');
            btn.className = 'btn btn-outline-secondary rounded-pill px-4 btn-tab';
            btn.innerText = name;
            btn.onclick = () => filterPetugas(name, btn);
            container.appendChild(btn);
        });
    } catch (e) { console.error("Gagal load tabs"); }

    loadData();
}

function filterPetugas(name, btn) {
    selPetugas = name;
    document.querySelectorAll('.btn-tab').forEach(b => {
        b.classList.replace('btn-primary', 'btn-outline-secondary');
        b.classList.remove('active');
    });
    btn.classList.replace('btn-outline-secondary', 'btn-primary');
    btn.classList.add('active');
    loadData();
}

async function loadData() {
    const container = document.getElementById('listContainer');
    const search = document.getElementById('searchInput').value;
    const pParam = selPetugas === 'all' ? '' : selPetugas;

    // Load Stats
    const resS = await fetch(`/api/belum-bayar/stats-harian?petugas=${pParam}`);
    const stats = await resS.json();
    document.getElementById('progText').innerText = `${stats.done}/${stats.target}`;
    document.getElementById('progBar').style.width = (stats.done/stats.target*100) + '%';

    // Load List
    const res = await fetch(`/api/belum-bayar/list?petugas=${pParam}&search=${search}`);
    const data = await res.json();
    
    container.innerHTML = data.length ? data.map(item => `
        <div class="card border-0 shadow-sm mb-3 customer-card">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start">
                    <h6 class="fw-bold mb-1">${item.nama}</h6>
                    <span class="badge bg-light text-primary border">${item.pcez} / BLOK ${item.block}</span>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-2">
                    <span class="fw-bold text-danger">Rp ${item.total_tagihan.toLocaleString()}</span>
                    <button class="btn btn-primary btn-sm rounded-pill px-3" onclick="lapor('${item.nomen}')">Lapor</button>
                </div>
            </div>
        </div>
    `).join('') : '<p class="text-center text-muted py-5">Tidak ada data untuk rute ini.</p>';
}

function lapor(nomen) {
    Swal.fire({
        title: 'Hasil Kunjungan',
        input: 'select',
        inputOptions: {
            'Janji Bayar': 'Janji Bayar',
            'Rumah Kosong': 'Rumah Kosong',
            'Sudah Bayar': 'Sudah Bayar'
        },
        showCancelButton: true,
        confirmButtonText: 'Kirim'
    }).then(async (result) => {
        if (result.isConfirmed) {
            const fd = new FormData();
            fd.append('nomen', nomen);
            fd.append('petugas', selPetugas === 'all' ? 'ADMIN' : selPetugas);
            fd.append('keterangan', result.value);
            
            await fetch('/api/belum-bayar/simpan-kunjungan', { method: 'POST', body: fd });
            Swal.fire('Tersimpan!', '', 'success');
            loadData();
        }
    });
}

document.getElementById('searchInput').oninput = loadData;
window.onload = initPage;
</script>
{% endblock %}
