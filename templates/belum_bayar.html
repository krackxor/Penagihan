{% extends "base.html" %}
{% block content %}
<div class="px-2 pb-5">
    <div class="pt-4 mb-3 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-0">Tugas Lapangan</h4>
            <small class="text-muted">Kelola penagihan harian</small>
        </div>
        <span class="badge bg-primary rounded-pill px-3" id="count-badge">0</span>
    </div>

    <div class="mb-3">
        <label class="small fw-bold mb-1">Pilih Nama Petugas:</label>
        <select id="filter-petugas" class="form-select border-0 bg-light rounded-3 shadow-none py-2" onchange="loadData()">
            <option value="all">-- Semua Petugas --</option>
        </select>
    </div>

    <div id="list-container"></div>
</div>

<div class="modal fade" id="modalKunjungan" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow-lg">
            <form id="form-kunjungan">
                <div class="modal-header border-0 pb-0">
                    <h6 class="modal-title fw-bold text-primary"><i class="fas fa-edit me-2"></i>Form Laporan Kerja</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="p-3 bg-primary-subtle rounded-4 mb-3">
                        <div id="m-nama" class="fw-bold text-primary h6 mb-1"></div>
                        <div id="m-nomen" class="small text-muted"></div>
                        <input type="hidden" name="nomen" id="in-nomen">
                        <input type="hidden" name="nominal_val" id="in-nominal">
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="small fw-bold">Nomor HP Pelanggan *</label>
                            <input type="number" name="no_hp" class="form-control bg-light border-0" placeholder="08..." required>
                        </div>
                        <div class="col-6">
                            <label class="small fw-bold">Foto Bukti (Watermark) *</label>
                            <input type="file" name="foto" class="form-control bg-light border-0" accept="image/*" capture="camera" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="small fw-bold">Hasil Kunjungan *</label>
                        <select name="keterangan" id="sel-status" class="form-select bg-light border-0" required onchange="toggleJanji()">
                            <option value="">-- Pilih Status Lapangan --</option>
                            <option value="Segera Bayar Hari Ini">Segera Bayar Hari Ini</option>
                            <option value="Janji Bayar">Janji Bayar</option>
                            <option value="Ajukan Cicilan">Ajukan Cicilan</option>
                            <option value="Proses Cicilan">Proses Cicilan</option>
                            <option value="Proses Rebill">Proses Rebill</option>
                            <option value="Rumah Kosong (RKS)">Rumah Kosong (RKS)</option>
                        </select>
                    </div>

                    <div id="div-janji" class="mb-3 d-none">
                        <label class="small fw-bold text-danger">Atur Tanggal Janji Bayar *</label>
                        <input type="date" name="janji_bayar_dt" class="form-control border-danger bg-danger-subtle">
                    </div>

                    <div class="mb-3">
                        <label class="small fw-bold">Keterangan Tambahan *</label>
                        <textarea name="catatan" class="form-control bg-light border-0" rows="2" placeholder="Tulis rincian hasil lapangan..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 rounded-3 py-3 fw-bold shadow">
                        SIMPAN & SHARE WHATSAPP <i class="fab fa-whatsapp ms-2"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const modalKunjungan = new bootstrap.Modal(document.getElementById('modalKunjungan'));

    async function loadPetugas() {
        const res = await fetch('/api/belum-bayar/petugas-tabs');
        const data = await res.json();
        const select = document.getElementById('filter-petugas');
        data.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p; opt.innerText = p;
            select.appendChild(opt);
        });
    }

    async function loadData() {
        const p = document.getElementById('filter-petugas').value;
        const res = await fetch(`/api/belum-bayar/list?petugas=${p}`);
        const data = await res.json();
        document.getElementById('count-badge').innerText = data.length;
        document.getElementById('list-container').innerHTML = data.map(i => `
            <div class="card border-0 shadow-sm rounded-4 mb-2" onclick="openForm('${i.nomen}', '${i.nama}', '${i.nominal}')">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="fw-bold">${i.nama}</div>
                            <small class="text-muted">${i.nomen} | PCEZ: ${i.pcez}</small><br>
                            <span class="badge bg-info-subtle text-info mt-1"><i class="fas fa-user me-1"></i>${i.nama_petugas || 'Belum Diatur'}</span>
                        </div>
                        <div class="text-end">
                            <div class="fw-bold text-danger">Rp ${i.nominal.toLocaleString()}</div>
                            <span class="btn btn-sm btn-primary rounded-pill px-3 mt-1" style="font-size:0.7rem">Input</span>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function openForm(nomen, nama, nominal) {
        document.getElementById('m-nama').innerText = nama;
        document.getElementById('m-nomen').innerText = nomen;
        document.getElementById('in-nomen').value = nomen;
        document.getElementById('in-nominal').value = nominal;
        modalKunjungan.show();
    }

    function toggleJanji() {
        const s = document.getElementById('sel-status').value;
        const div = document.getElementById('div-janji');
        div.classList.toggle('d-none', s !== 'Janji Bayar');
        div.querySelector('input').required = (s === 'Janji Bayar');
    }

    document.getElementById('form-kunjungan').onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const petugas = document.getElementById('filter-petugas').value;
        
        if(petugas === 'all') {
            Swal.fire('Perhatian', 'Pilih nama petugas Anda di bagian filter atas dahulu!', 'warning');
            return;
        }

        fd.append('petugas', petugas);
        fd.append('nama_pelanggan', document.getElementById('m-nama').innerText);

        Swal.fire({ title: 'Memproses Watermark...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        try {
            const res = await fetch('/api/belum-bayar/simpan-kunjungan', { method: 'POST', body: fd });
            const result = await res.json();

            if (result.status === 'success') {
                const urlFoto = `${window.location.origin}/uploads/kunjungan/${result.filename}`;
                let wa = `*📌 LAPORAN BILING TERVERIFIKASI*%0A` +
                         `_Sunter Pro - Official Report_%0A%0A` +
                         `👷 *Petugas:* ${petugas}%0A` +
                         `🏠 *Pelanggan:* ${document.getElementById('m-nama').innerText}%0A` +
                         `🆔 *Nomen:* ${fd.get('nomen')}%0A` +
                         `📱 *HP Pel:* ${fd.get('no_hp')}%0A` +
                         `📝 *Hasil:* *${fd.get('keterangan').toUpperCase()}*%0A` +
                         (fd.get('janji_bayar_dt') ? `📅 *Janji Bayar:* ${fd.get('janji_bayar_dt')}%0A` : '') +
                         `💬 *Catatan:* ${fd.get('catatan')}%0A%0A` +
                         `📸 *BUKTI FOTO WATERMARK:*%0A${urlFoto}%0A%0A` +
                         `⏰ *Waktu:* ${new Date().toLocaleString()}%0A` +
                         `------------------------------------------%0A` +
                         `© _Khoirul Anwar System - Sunter Pro_`;
                
                Swal.fire('Tersimpan!', 'Laporan & Watermark Berhasil.', 'success').then(() => {
                    window.open(`https://wa.me/?text=${wa}`, '_blank');
                    location.reload();
                });
            }
        } catch(err) { Swal.fire('Error', 'Gagal simpan data', 'error'); }
    };

    document.addEventListener('DOMContentLoaded', () => { loadPetugas(); loadData(); });
</script>
{% endblock %}
