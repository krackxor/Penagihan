{% extends "base.html" %}
{% block content %}
<div class="px-2 pb-5">
    <div class="sticky-top bg-white pt-3 shadow-sm" style="z-index: 1020; margin: 0 -15px; padding: 0 15px;">
        <div class="d-flex justify-content-between mb-2">
            <h6 class="fw-bold">Target 10 Pelanggan</h6>
            <span class="badge bg-primary" id="progText">0/10</span>
        </div>
        <div class="d-flex gap-2 overflow-auto no-scrollbar pb-3" id="petugasTabs">
            <button class="btn btn-primary rounded-pill px-4 btn-tab active" onclick="filterTab('all', this)">Semua</button>
        </div>
        <input type="text" id="searchInput" class="form-control rounded-4 mb-3 border-0 bg-light" placeholder="Cari...">
    </div>

    <div id="listContainer" class="mt-3"></div>
</div>

<div class="modal fade" id="modalLapor" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered mx-3">
        <div class="modal-content border-0 rounded-4 shadow">
            <form id="formLapor">
                <div class="modal-body">
                    <input type="hidden" id="modal-nomen" name="nomen">
                    <div class="mb-3">
                        <label class="small fw-bold">UPDATE NO HP</label>
                        <input type="number" class="form-control p-3 bg-light border-0" name="no_hp" id="modal-no-hp">
                    </div>
                    <div class="mb-3">
                        <label class="small fw-bold">HASIL LAPANGAN</label>
                        <select class="form-select p-3 bg-light border-0" name="keterangan" required>
                            <option value="Janji Bayar">Janji Bayar</option>
                            <option value="Rumah Kosong">Rumah Kosong</option>
                            <option value="Sudah Bayar">Sudah Bayar</option>
                        </select>
                    </div>
                    <div class="mb-3 text-center">
                        <label class="d-block small fw-bold text-start mb-2">FOTO BUKTI (OTOMATIS WATERMARK)</label>
                        <div class="p-4 border-2 border-dashed rounded-4 bg-light" onclick="document.getElementById('fileFoto').click()">
                            <i class="fas fa-camera fa-2x text-primary"></i>
                            <p class="mb-0 small mt-1">Klik Ambil Foto</p>
                        </div>
                        <input type="file" id="fileFoto" name="foto" accept="image/*" capture="camera" class="d-none" onchange="previewImg(this)">
                        <img id="imgPrev" class="img-fluid rounded-4 mt-2 d-none">
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="submit" class="btn btn-primary w-100 py-3 rounded-4 fw-bold">SIMPAN & KIRIM WA</button>
                </div>
            </form>
        </div>
    </div>
</div>



<script>
let selPetugas = 'all';

function previewImg(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => { 
            document.getElementById('imgPrev').src = e.target.result;
            document.getElementById('imgPrev').classList.remove('d-none');
        };
        reader.readAsDataURL(input.files[0]);
    }
}

async function loadData() {
    const res = await fetch(`/api/belum-bayar/list?petugas=${selPetugas === 'all' ? '' : selPetugas}&search=${document.getElementById('searchInput').value}`);
    const data = await res.json();
    document.getElementById('listContainer').innerHTML = data.map(item => `
        <div class="card border-0 shadow-sm mb-3 rounded-4 border-start border-primary border-5">
            <div class="card-body p-3">
                <div class="d-flex justify-content-between">
                    <h6 class="fw-bold">${item.nama}</h6>
                    <span class="text-danger fw-bold">Rp ${item.total.toLocaleString()}</span>
                </div>
                <div class="d-flex gap-2 mt-2">
                    <button class="btn btn-primary w-100 rounded-pill" onclick="openLapor('${item.nomen}','${item.no_hp || ''}')">LAPOR KUNJUNGAN</button>
                </div>
            </div>
        </div>
    `).join('');
}

function openLapor(nomen, nohp) {
    document.getElementById('modal-nomen').value = nomen;
    document.getElementById('modal-no-hp').value = nohp;
    document.getElementById('imgPrev').classList.add('d-none');
    new bootstrap.Modal(document.getElementById('modalLapor')).show();
}

document.getElementById('formLapor').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    fd.append('petugas', selPetugas === 'all' ? 'ADMIN' : selPetugas);

    Swal.fire({ title: 'Mencari GPS...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

    // AMBIL LOKASI GPS ASLI DARI HP
    navigator.geolocation.getCurrentPosition(async (pos) => {
        fd.append('lat', pos.coords.latitude);
        fd.append('lng', pos.coords.longitude);

        const res = await fetch('/api/belum-bayar/simpan-kunjungan', { method: 'POST', body: fd });
        const result = await res.json();
        
        if (res.ok) {
            Swal.fire('Berhasil!', 'Data tersimpan dengan Watermark GPS.', 'success')
            .then(() => window.open(`https://wa.me/?text=${encodeURIComponent(result.wa_text)}`, '_blank'));
            loadData();
            bootstrap.Modal.getInstance(document.getElementById('modalLapor')).hide();
        }
    }, () => {
        Swal.fire('Gagal!', 'GPS Wajib Aktif untuk melapor!', 'error');
    });
};

window.onload = async () => {
    const res = await fetch('/api/belum-bayar/petugas-tabs');
    const tabs = await res.json();
    tabs.forEach(name => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-outline-secondary rounded-pill px-4 btn-tab';
        btn.innerText = name;
        btn.onclick = () => {
            selPetugas = name;
            document.querySelectorAll('.btn-tab').forEach(b => b.classList.replace('btn-primary', 'btn-outline-secondary'));
            btn.classList.replace('btn-outline-secondary', 'btn-primary');
            loadData();
        };
        document.getElementById('petugasTabs').appendChild(btn);
    });
    loadData();
};
</script>
{% endblock %}
