{% extends "base.html" %}
{% block content %}
<div class="px-2 pb-5">
    <div class="sticky-top bg-white pt-3 shadow-sm" style="z-index: 1020; margin: 0 -15px; padding: 0 15px;">
        <div class="d-flex justify-content-between align-items-center mb-2 px-1">
            <h6 class="fw-bold mb-0">Target 10 Pelanggan</h6>
            <span class="badge bg-primary rounded-pill" id="progText">0/10</span>
        </div>
        <div class="d-flex gap-2 overflow-auto no-scrollbar pb-3" id="petugasTabs">
            <button class="btn btn-primary rounded-pill px-4 btn-tab active" onclick="filterByPetugas('all', this)">Semua</button>
        </div>
        <div class="input-group mb-3 rounded-4 border overflow-hidden">
            <span class="input-group-text border-0 bg-white"><i class="fas fa-search"></i></span>
            <input type="text" id="searchInput" class="form-control border-0" placeholder="Cari Pelanggan / Blok...">
        </div>
    </div>

    <div id="listContainer" class="mt-3"></div>
</div>

<div class="modal fade" id="modalLapor" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered mx-3">
        <div class="modal-content border-0 rounded-4 shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h5 class="fw-bold">Input Laporan</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="formLapor">
                <div class="modal-body">
                    <input type="hidden" id="modal-nomen" name="nomen">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">NO HP PELANGGAN</label>
                        <input type="number" class="form-control rounded-3 bg-light border-0 p-3" name="no_hp" id="modal-no-hp">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">KETERANGAN</label>
                        <select class="form-select rounded-3 bg-light border-0 p-3" name="keterangan" required>
                            <option value="">-- Pilih Hasil --</option>
                            <option value="Janji Bayar">Janji Bayar</option>
                            <option value="Rumah Kosong">Rumah Kosong</option>
                            <option value="Sudah Bayar">Sudah Bayar</option>
                            <option value="Pasang Stiker">Pasang Stiker</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">FOTO BUKTI</label>
                        <input type="file" id="fileFoto" name="foto" accept="image/*" capture="camera" class="form-control rounded-3" onchange="preview(this)">
                        <img id="imgPrev" class="img-fluid rounded-4 mt-2 d-none">
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="submit" class="btn btn-primary w-100 py-3 rounded-4 fw-bold shadow">SIMPAN & KIRIM WA</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
let selPetugas = 'all';

function preview(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = document.getElementById('imgPrev');
            img.src = e.target.result;
            img.classList.remove('d-none');
        };
        reader.readAsDataURL(input.files[0]);
    }
}

async function initPage() {
    const res = await fetch('/api/belum-bayar/petugas-tabs');
    const tabs = await res.json();
    const container = document.getElementById('petugasTabs');
    tabs.forEach(name => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-outline-secondary rounded-pill px-4 btn-tab';
        btn.innerText = name;
        btn.onclick = () => filterByPetugas(name, btn);
        container.appendChild(btn);
    });
    loadData();
}

function filterByPetugas(name, btn) {
    selPetugas = name;
    document.querySelectorAll('.btn-tab').forEach(b => b.classList.replace('btn-primary', 'btn-outline-secondary'));
    btn.classList.replace('btn-outline-secondary', 'btn-primary');
    loadData();
}

async function loadData() {
    const search = document.getElementById('searchInput').value;
    const pParam = selPetugas === 'all' ? '' : selPetugas;
    
    // Progres
    const resS = await fetch(`/api/belum-bayar/stats-harian?petugas=${pParam}`);
    const stats = await resS.json();
    document.getElementById('progText').innerText = `${stats.done}/10`;

    // Data
    const res = await fetch(`/api/belum-bayar/list?petugas=${pParam}&search=${search}`);
    const data = await res.json();
    document.getElementById('listContainer').innerHTML = data.map(item => `
        <div class="card border-0 shadow-sm mb-3 rounded-4 border-start border-primary border-5">
            <div class="card-body p-3">
                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <span class="badge bg-light text-primary border mb-1">${item.pcez} | B${item.block}</span>
                        <h6 class="fw-bold mb-0">${item.nama}</h6>
                        <small class="text-muted">${item.nomen}</small>
                    </div>
                    <span class="fw-bold text-danger">Rp ${item.total_tagihan.toLocaleString()}</span>
                </div>
                <div class="d-flex gap-2 mt-3">
                    <a href="https://wa.me/${item.no_hp}" class="btn btn-outline-success rounded-pill px-3"><i class="fab fa-whatsapp"></i></a>
                    <button class="btn btn-primary flex-grow-1 rounded-pill fw-bold" onclick="openLapor('${item.nomen}','${item.no_hp || ''}')">LAPOR</button>
                </div>
            </div>
        </div>
    `).join('');
}

function openLapor(nomen, nohp) {
    document.getElementById('modal-nomen').value = nomen;
    document.getElementById('modal-no-hp').value = nohp;
    document.getElementById('imgPrev').classList.add('d-none');
    document.getElementById('formLapor').reset();
    new bootstrap.Modal(document.getElementById('modalLapor')).show();
}

document.getElementById('formLapor').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    fd.append('petugas', selPetugas === 'all' ? 'ADMIN' : selPetugas);

    Swal.fire({ title: 'Menyimpan...', didOpen: () => Swal.showLoading() });

    const res = await fetch('/api/belum-bayar/simpan-kunjungan', { method: 'POST', body: fd });
    const result = await res.json();

    if (res.ok) {
        Swal.fire({
            icon: 'success',
            title: 'Berhasil!',
            text: 'Teruskan laporan ke WhatsApp?',
            showCancelButton: true,
            confirmButtonText: 'Kirim WA'
        }).then((r) => {
            if (r.isConfirmed) {
                window.open(`https://wa.me/?text=${encodeURIComponent(result.wa_text)}`, '_blank');
            }
            loadData();
            bootstrap.Modal.getInstance(document.getElementById('modalLapor')).hide();
        });
    }
};

document.getElementById('searchInput').oninput = loadData;
window.onload = initPage;
</script>
{% endblock %}
