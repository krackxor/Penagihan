{% extends "base.html" %}

{% block content %}
<div class="px-2 pb-5 animate__animated animate__fadeIn">
    <div class="pt-4 mb-3 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-0">Tugas Penagihan</h4>
            <p class="text-muted small mb-0">Target harian yang belum dikunjungi</p>
        </div>
        <span class="badge bg-primary rounded-pill px-3" id="count-badge">0</span>
    </div>

    <div class="mb-3">
        <label class="form-label small fw-bold">Pilih Petugas :</label>
        <select id="filter-petugas" class="form-select border-0 bg-light rounded-3 shadow-none py-2" onchange="loadData()">
            <option value="all">-- Semua Petugas --</option>
            </select>
    </div>

    <div id="list-container">
        <div class="text-center py-5 text-muted">
            <div class="spinner-border text-primary mb-2"></div>
            <p>Memuat data...</p>
        </div>
    </div>
</div>

<div class="modal fade" id="modalKunjungan" tabindex="-1">...</div>

<script>
    const listContainer = document.getElementById('list-container');
    const filterPetugas = document.getElementById('filter-petugas');

    // 1. FUNGSI UNTUK MENGISI DROPDOWN PETUGAS SECARA OTOMATIS
    async function loadPetugasList() {
        try {
            const res = await fetch('/api/belum-bayar/petugas-tabs');
            const petugas = await res.json();
            
            // Tambahkan nama-nama petugas ke dropdown
            petugas.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.innerText = p;
                filterPetugas.appendChild(opt);
            });
        } catch (e) {
            console.error("Gagal memuat daftar petugas:", e);
        }
    }

    // 2. FUNGSI UNTUK MEMUAT DATA TAGIHAN
    async function loadData() {
        const petugas = filterPetugas.value;
        listContainer.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';
        
        try {
            const res = await fetch(`/api/belum-bayar/list?petugas=${petugas}`);
            const data = await res.json();
            
            document.getElementById('count-badge').innerText = data.length;

            if (data.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-5">
                        <i class="fas fa-check-circle text-success mb-3" style="font-size: 3rem;"></i>
                        <p class="text-muted">Tidak ada tagihan untuk petugas ini.</p>
                    </div>`;
                return;
            }

            // TAMPILAN LIST DENGAN NAMA PETUGAS
            listContainer.innerHTML = data.map(item => `
                <div class="card border-0 shadow-sm rounded-4 mb-3 border-start border-4 ${item.nama_petugas ? 'border-primary' : 'border-danger'}" 
                     onclick="openKunjungan('${item.nomen}', '${item.nama}')">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between">
                            <div class="flex-grow-1">
                                <div class="fw-bold text-dark mb-1">${item.nama}</div>
                                <div class="small text-muted mb-2">${item.nomen} | BLOK ${item.block}</div>
                                <span class="badge bg-info-subtle text-info border-0 rounded-pill px-2" style="font-size: 0.65rem;">
                                    <i class="fas fa-user me-1"></i> ${item.nama_petugas || 'Petugas Belum Diatur'}
                                </span>
                            </div>
                            <div class="text-end">
                                <div class="fw-bold text-danger">Rp ${item.nominal.toLocaleString()}</div>
                                <div class="badge bg-light text-primary border mt-2">${item.pcez}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            listContainer.innerHTML = `<div class="alert alert-danger">Error: ${e.message}</div>`;
        }
    }

    // Jalankan saat halaman dibuka
    document.addEventListener('DOMContentLoaded', () => {
        loadPetugasList();
        loadData();
    });
</script>
{% endblock %}
