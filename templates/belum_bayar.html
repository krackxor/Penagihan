{% extends "base.html" %}
{% block content %}
<div class="animate__animated animate__fadeIn">
    <div class="px-2 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1 text-dark"><i class="fas fa-hand-holding-dollar me-2 text-warning"></i>Penagihan Berjalan</h4>
            <p class="text-muted small mb-0">Prioritas Kolektibilitas (Belum Bayar)</p>
        </div>
        <div class="d-flex flex-column align-items-end">
            <input type="month" id="filter-periode" 
                   class="form-control form-control-sm border-0 shadow-sm rounded-pill px-3 mb-1" 
                   style="width: 140px; font-size: 0.75rem;" 
                   onchange="loadData()">
            <span class="badge bg-warning text-dark rounded-pill shadow-sm" style="font-size: 0.55rem; letter-spacing: 0.5px;">TARGET HARIAN</span>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-3 mx-2 bg-white">
        <div class="card-body p-3">
            <div class="row g-2">
                <div class="col-8">
                    <label class="small fw-bold text-muted mb-1">Delegasi Wilayah Petugas</label>
                    <select id="filter-petugas" class="form-select border-0 bg-light rounded-3 shadow-none fw-bold text-primary" onchange="loadData()">
                        {% if session['role'] == 'petugas' %}
                            <option value="{{ session['petugas_id'] }}">{{ session['petugas_id'] }} (Personel Aktif)</option>
                        {% else %}
                            <option value="all">-- Seluruh Personel --</option>
                        {% endif %}
                    </select>
                </div>
                <div class="col-4 d-flex align-items-end">
                    <button class="btn btn-warning rounded-3 w-100 fw-bold shadow-sm text-dark" onclick="loadData()">
                        <i class="fas fa-sync-alt me-1"></i> SYNC
                    </button>
                </div>
                <div class="col-12 mt-2">
                    <div class="input-group bg-light rounded-3 px-2 border border-light">
                        <span class="input-group-text border-0 bg-transparent text-muted"><i class="fas fa-search"></i></span>
                        <input type="text" id="searchBar" class="form-control border-0 bg-transparent py-2 shadow-none" 
                               placeholder="Cari Entitas Berdasarkan Nama atau IDPEL..." onkeyup="debounceSearch()">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="audit-progress-area" class="px-2 mb-3">
        <div class="card border-0 shadow-sm rounded-4 bg-white p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <small class="fw-bold text-muted"><i class="fas fa-tasks me-1"></i> PROGRES AUDIT HARIAN</small>
                <small id="progress-text" class="fw-bold text-warning">0%</small>
            </div>
            <div class="progress rounded-pill" style="height: 10px;">
                <div id="progress-bar" class="progress-bar bg-warning progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
            </div>
            <div class="d-flex justify-content-between mt-2">
                <small id="stat-target" class="text-muted" style="font-size: 0.65rem;">Target: 0</small>
                <small id="stat-realisasi" class="text-muted" style="font-size: 0.65rem;">Realisasi: 0</small>
            </div>
        </div>
    </div>

    <div id="summary-area" class="px-2 mb-3"></div>

    <div id="list-container" class="px-2 pb-5">
        <div class="text-center py-5">
            <div class="spinner-border text-warning" role="status"></div>
            <p class="mt-2 text-muted small">Sinkronisasi parameter rute operasional...</p>
        </div>
    </div>
</div>

<div class="modal fade" id="modalKunjungan" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
            <form id="formKunjungan">
                <div class="modal-header border-0 bg-warning text-dark p-3">
                    <h6 class="modal-title fw-bold"><i class="fas fa-camera-retro me-2"></i>Snapshot Audit Lapangan</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modal-idpel" name="idpel">
                    <input type="hidden" id="modal-nominal-val" name="nominal_display">
                    <input type="hidden" id="modal-nama-hidden">
                    <input type="hidden" id="modal-rayon-hidden">

                    <div class="bg-warning bg-opacity-10 p-3 rounded-4 mb-3 border border-warning-subtle">
                        <small class="text-warning fw-bold text-uppercase d-block mb-1" style="font-size: 0.6rem; letter-spacing: 0.5px;">Profil Konsumen</small>
                        <h6 id="modal-nama" class="fw-bold mb-1 text-dark text-uppercase"></h6>
                        <div class="d-flex justify-content-between">
                            <small id="modal-sub-nomet" class="text-muted fw-bold" style="font-size: 0.7rem;"></small>
                            <small id="modal-sub-vol" class="text-warning fw-bold" style="font-size: 0.7rem;"></small>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-dark">Kontak WhatsApp *</label>
                        <div class="input-group">
                            <span class="input-group-text border-0 bg-light"><i class="fas fa-phone-alt"></i></span>
                            <input type="tel" id="modal-no-hp" name="no_hp" class="form-control rounded-3" placeholder="628..." required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-dark">Hasil Koordinasi *</label>
                        <select id="modal-hasil" name="hasil" class="form-select rounded-3 bg-light border-0 fw-bold" required onchange="toggleJanjiInput()">
                            <option value="">-- Pilih Hasil --</option>
                            <option value="Sudah Bayar">✅ Terverifikasi Lunas</option>
                            <option value="Janji Bayar">🤝 Komitmen Pembayaran</option>
                            <option value="Rumah Kosong">🏠 Tidak Bertemu Penghuni</option>
                            <option value="Tutup Bor">🚫 Rekomendasi Segel</option>
                            <option value="Lainnya">⚠️ Lainnya</option>
                        </select>
                    </div>

                    <div class="mb-3 d-none animate__animated animate__headShake" id="group-janji">
                        <label class="form-label small fw-bold text-danger">Tanggal Komitmen</label>
                        <input type="date" id="modal-janji-dt" name="janji_bayar_dt" class="form-control rounded-3 border-danger-subtle bg-danger bg-opacity-10 text-danger fw-bold">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-dark">Catatan Temuan</label>
                        <textarea id="modal-keterangan" name="keterangan" class="form-control rounded-3 bg-light border-0" rows="2"></textarea>
                    </div>

                    <div class="mb-0">
                        <label class="form-label small fw-bold text-dark">Dokumentasi Kamera *</label>
                        <input type="file" id="modal-foto" name="foto" class="form-control rounded-3" accept="image/*" capture="camera" required>
                    </div>
                </div>
                <div class="modal-footer border-0 p-3 pt-0">
                    <button type="submit" class="btn btn-warning w-100 rounded-pill py-3 fw-bold shadow text-dark">
                        TRANSMISI SNAPSHOT <i class="fas fa-check-circle ms-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    let modalKunjungan;
    let searchTimeout;
    const formatIDR = (n) => new Intl.NumberFormat('id-ID').format(n);

    document.addEventListener('DOMContentLoaded', () => {
        modalKunjungan = new bootstrap.Modal(document.getElementById('modalKunjungan'));
        initCalendar(); 
        if ("{{ session['role'] }}" === 'admin') loadPetugasDropdown();
        loadData();

        document.getElementById('formKunjungan').addEventListener('submit', async (e) => {
            e.preventDefault();
            await simpanLaporan();
        });
    });

    function initCalendar() {
        const now = new Date();
        document.getElementById('filter-periode').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    }

    function toggleJanjiInput() {
        const isJanji = document.getElementById('modal-hasil').value === 'Janji Bayar';
        document.getElementById('group-janji').classList.toggle('d-none', !isJanji);
    }

    async function loadPetugasDropdown() {
        try {
            const res = await fetch('/api/belum-bayar/petugas-tabs');
            const list = await res.json();
            const select = document.getElementById('filter-petugas');
            list.forEach(n => {
                if (n && n !== "{{ session['petugas_id'] }}") {
                    const opt = document.createElement('option');
                    opt.value = n; opt.innerText = n;
                    select.appendChild(opt);
                }
            });
        } catch(e) { console.error("Dropdown sync failure"); }
    }

    function debounceSearch() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => loadData(), 500);
    }

    async function loadData() {
        const petugas = document.getElementById('filter-petugas').value;
        const rawPeriode = document.getElementById('filter-periode').value;
        const search = document.getElementById('searchBar').value;
        const [year, month] = rawPeriode.split('-');
        const periode = `${month}-${year}`;

        const container = document.getElementById('list-container');
        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-warning"></div></div>';

        try {
            const res = await fetch(`/api/belum-bayar?petugas=${encodeURIComponent(petugas)}&periode=${periode}&search=${encodeURIComponent(search)}`);
            const data = await res.json();
            renderCards(data);
            updateSummary(data);
            loadAuditProgress(); // Load audit stats
        } catch (err) {
            container.innerHTML = '<div class="alert alert-danger mx-2 rounded-4 small text-center">Kegagalan transmisi server.</div>';
        }
    }

    async function loadAuditProgress() {
        try {
            const res = await fetch('/api/belum-bayar/progress');
            const data = await res.json();
            document.getElementById('progress-bar').style.width = `${data.percentage}%`;
            document.getElementById('progress-text').innerText = `${data.percentage}%`;
            document.getElementById('stat-target').innerText = `Target: ${data.total_target}`;
            document.getElementById('stat-realisasi').innerText = `Realisasi: ${data.total_realisasi}`;
        } catch(e) { console.error("Progress sync failed"); }
    }

    function renderCards(data) {
        const container = document.getElementById('list-container');
        if (!data || !data.length) {
            container.innerHTML = '<div class="text-center mt-5 py-5"><p class="text-muted small">Tidak ditemukan entitas tagihan.</p></div>';
            return;
        }

        container.innerHTML = data.map((item) => `
            <div class="card border-0 shadow-sm rounded-4 mb-3 bg-white">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge bg-warning bg-opacity-10 text-warning rounded-pill px-2 py-1 fw-bold" style="font-size: 9px;">IDPEL: ${item.nomen}</span>
                        <span class="badge bg-light text-muted rounded-pill px-2 py-1" style="font-size: 9px;">BELUM BAYAR</span>
                    </div>
                    <h6 class="fw-bold mb-1 text-dark text-uppercase small">${item.nama}</h6>
                    <div class="row g-0 small text-muted mb-3" style="font-size: 0.7rem;">
                        <div class="col-6"><i class="fas fa-map-pin me-1"></i>${item.pcez || '-'}</div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center border-top pt-3">
                        <div>
                            <small class="d-block text-muted fw-bold" style="font-size: 8px;">TAGIHAN</small>
                            <span class="fw-bold text-dark" style="font-size: 1.1rem;">Rp ${formatIDR(item.nominal)}</span>
                        </div>
                        <button class="btn btn-warning rounded-pill px-4 fw-bold shadow-sm text-dark" 
                                onclick="openModal('${item.nomen}', '${item.nama.replace(/'/g, "\\'")}', '${item.nominal}', '${item.nomet}', '${item.rayon}')">
                            VISIT <i class="fas fa-camera ms-1"></i>
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function updateSummary(data) {
        const total = data.reduce((acc, curr) => acc + Number(curr.nominal), 0);
        document.getElementById('summary-area').innerHTML = `
            <div class="bg-dark shadow-sm rounded-4 p-3 d-flex justify-content-between align-items-center mx-1 text-white">
                <div>
                    <div class="opacity-75 mb-0 text-uppercase" style="font-size: 0.6rem;">Target Sisa</div>
                    <div class="fw-bold h5 mb-0">${data.length} <small style="font-size: 0.6rem;">UNIT</small></div>
                </div>
                <div class="text-end">
                    <div class="opacity-75 mb-0 text-uppercase" style="font-size: 0.6rem;">Potensi Recovery</div>
                    <div class="fw-bold h5 mb-0">Rp ${formatIDR(total)}</div>
                </div>
            </div>
        `;
    }

    function openModal(nomen, nama, nominal, nomet, rayon) {
        document.getElementById('modal-idpel').value = nomen;
        document.getElementById('modal-nominal-val').value = nominal;
        document.getElementById('modal-nama').innerText = nama;
        document.getElementById('modal-sub-idpel').innerText = `IDPEL: ${nomen}`;
        document.getElementById('modal-sub-vol').innerText = `TAGIHAN: Rp ${formatIDR(nominal)}`;
        document.getElementById('modal-nama-hidden').value = nama;
        document.getElementById('formKunjungan').reset();
        modalKunjungan.show();
    }

    async function simpanLaporan() {
        Swal.fire({ title: 'Mengunci Snapshot...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        const formData = new FormData(document.getElementById('formKunjungan'));
        formData.append('petugas_name', document.getElementById('filter-petugas').value);
        formData.append('nama_pelanggan', document.getElementById('modal-nama-hidden').value);

        try {
            const res = await fetch('/api/belum-bayar/lapor', { method: 'POST', body: formData });
            if (res.ok) {
                Swal.fire('Berhasil', 'Snapshot audit berhasil dikunci.', 'success').then(() => {
                    modalKunjungan.hide();
                    loadData();
                });
            } else {
                Swal.fire('Gagal', 'Gagal kirim data.', 'error');
            }
        } catch (err) { Swal.fire('Error', 'Kesalahan koneksi.', 'error'); }
    }
</script>

<style>
    .bg-warning-subtle { background-color: #fffbeb !important; }
    .btn-warning { background: #f59e0b; border: none; transition: 0.3s; }
    .card { transition: all 0.2s ease; border: 1px solid #f1f5f9 !important; }
    .progress-bar-animated { animation: progress-bar-stripes 1s linear infinite; }
</style>
{% endblock %}
