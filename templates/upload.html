{% extends "base.html" %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h5 class="fw-bold mb-0 text-primary"><i class="fas fa-cloud-upload-alt me-2"></i>Upload Data Penagihan</h5>
                </div>
                <div class="card-body p-4">
                    <form id="uploadForm" enctype="multipart/form-data">
                        <div class="mb-4">
                            <label class="form-label small fw-bold text-uppercase text-secondary">Jenis Data</label>
                            <select name="file_type" id="file_type" class="form-select form-select-lg" required>
                                <option value="" selected disabled>-- Pilih Tipe File --</option>
                                <option value="mc">Master Pelanggan (MC) - Induk</option>
                                <option value="ardebt">Data Tunggakan (Ardebt)</option>
                                <option value="collection">Collection Harian</option>
                                <option value="mainbill">Mainbill</option>
                                <option value="sbrs">SBRS (Pembacaan)</option>
                            </select>
                            <div class="form-text mt-2" id="info-sop">
                                <i class="fas fa-info-circle me-1"></i> SOP: Data MC harus diunggah pertama kali setiap periode.
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-uppercase text-secondary">Pilih File (Excel/CSV)</label>
                            <input type="file" name="file" class="form-control" accept=".xlsx, .xls, .csv" required>
                        </div>

                        <button type="submit" id="btnUpload" class="btn btn-primary w-100 py-3 fw-bold">
                            <i class="fas fa-upload me-2"></i>MULAI PROSES UPLOAD
                        </button>
                    </form>

                    <div id="uploadStatus" class="mt-4 d-none">
                        <div class="alert alert-info d-flex align-items-center">
                            <div class="spinner-border spinner-border-sm me-3"></div>
                            <span id="statusText">Sedang memproses data...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
document.getElementById('uploadForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnUpload');
    const statusDiv = document.getElementById('uploadStatus');
    const statusText = document.getElementById('statusText');
    
    btn.disabled = true;
    statusDiv.classList.remove('d-none');
    
    const formData = new FormData(e.target);
    
    try {
        const response = await fetch('/api/upload', {
            method: 'POST',
            body: formData
        });
        
        const result = await response.json();
        
        if (response.ok) {
            Swal.fire({
                icon: 'success',
                title: 'Berhasil!',
                text: result.message,
                confirmButtonColor: '#0d6efd'
            }).then(() => {
                window.location.href = '/history';
            });
        } else {
            Swal.fire({
                icon: 'error',
                title: 'Gagal Upload',
                text: result.error || 'Terjadi kesalahan sistem'
            });
        }
    } catch (err) {
        Swal.fire({
            icon: 'error',
            title: 'Koneksi Bermasalah',
            text: 'Gagal menghubungi server.'
        });
    } finally {
        btn.disabled = false;
        statusDiv.classList.add('d-none');
    }
};
</script>
{% endblock %}
