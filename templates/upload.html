{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-7">
        <div class="card border-0 shadow-lg">
            <div class="card-body p-5 text-center">
                <div class="mb-4 text-primary">
                    <i class="fas fa-microchip fa-4x"></i>
                </div>
                <h3 class="fw-bold">Smart Sync V18</h3>
                <p class="text-muted">Unggah file CID, MC, MB, atau Daily. Sistem akan mendeteksinya secara otomatis.</p>
                
                <hr class="my-4 op-25">

                <form hx-post="/api/import/smart-upload" 
                      hx-encoding="multipart/form-data" 
                      hx-target="#upload-container" 
                      hx-swap="innerHTML"
                      class="text-start">
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold small">PILIH FILE (.TXT / .CSV)</label>
                        <div class="input-group">
                            <input type="file" name="file_main" class="form-control form-control-lg" required>
                            <button type="submit" class="btn btn-primary px-4 fw-bold">
                                <i class="fas fa-bolt me-2"></i> MULAI PROSES
                            </button>
                        </div>
                    </div>
                </form>

                <div id="upload-container">
                    <div class="text-muted small mt-2">
                        <i class="fas fa-info-circle me-1"></i> Gunakan pemisah Titik Koma (;)
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .bounce-in { animation: bounceIn 0.6s ease; }
    @keyframes bounceIn {
        0% { opacity: 0; transform: scale(0.9); }
        100% { opacity: 1; transform: scale(1); }
    }
</style>
{% endblock %}
