{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-10">
        <div class="card p-4">
            <div class="d-flex align-items-center mb-4">
                <div class="bg-primary bg-opacity-10 p-3 rounded-circle me-3">
                    <i class="fas fa-cloud-upload-alt text-primary fa-2x"></i>
                </div>
                <div>
                    <h4 class="mb-0 fw-bold">Sinkronisasi Data Massal</h4>
                    <p class="text-muted mb-0 small">Unggah file (.txt / .csv) untuk memperbarui sistem</p>
                </div>
            </div>

            <div class="row g-4">
                <div class="col-md-6">
                    <div class="border p-3 rounded bg-light">
                        <label class="form-label fw-bold small text-uppercase">1. Master CID (Pelanggan)</label>
                        <form hx-post="/api/import/tagihan" hx-encoding="multipart/form-data" hx-target="#status-cid">
                            <input type="file" name="file_cid" class="form-control mb-2 form-control-sm" required>
                            <button class="btn btn-primary btn-sm w-100 shadow-sm">Proses CID</button>
                        </form>
                        <div id="status-cid" class="mt-2 small"></div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="border p-3 rounded bg-light">
                        <label class="form-label fw-bold small text-uppercase">2. Master Cetak (Target MC)</label>
                        <form hx-post="/api/import/tagihan" hx-encoding="multipart/form-data" hx-target="#status-mc">
                            <input type="file" name="file_mc" class="form-control mb-2 form-control-sm" required>
                            <button class="btn btn-success btn-sm w-100 shadow-sm">Proses MC</button>
                        </form>
                        <div id="status-mc" class="mt-2 small"></div>
                    </div>
                </div>

                <div class="col-md-12">
                    <div class="border p-4 rounded bg-white shadow-sm border-primary border-opacity-25">
                        <label class="form-label fw-bold text-uppercase">3. Daily Payment (Koleksi Harian)</label>
                        <form hx-post="/api/import/tagihan" hx-encoding="multipart/form-data" hx-target="#status-daily">
                            <input type="file" name="file_daily" class="form-control mb-3" required>
                            <button class="btn btn-dark w-100 py-2 fw-bold">MULAI SINKRONISASI HARIAN</button>
                        </form>
                        <div id="status-daily" class="mt-3 text-center"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
