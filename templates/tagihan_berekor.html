{% extends "base.html" %}
{% block content %}
<div class="animate__animated animate__fadeIn">
    <div class="px-2 mb-4">
        <h4 class="fw-bold mb-1">Tagihan Berekor (Ardebt) 🐉</h4>
        <p class="text-muted small">Pelanggan dengan tunggakan > 1 bulan (Exclude MC)</p>
    </div>

    <div id="list-ardebt" class="px-2">
        </div>
</div>

<script>
async function loadArdebt() {
    const container = document.getElementById('list-ardebt');
    container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-danger"></div></div>';

    try {
        const res = await fetch('/api/belum-bayar/ardebt');
        const data = await res.json();
        
        if (data.length === 0) {
            container.innerHTML = '<p class="text-center">Tidak ada data tunggakan berekor.</p>';
            return;
        }

        container.innerHTML = data.map(item => `
            <div class="card border-0 shadow-sm rounded-4 mb-3 border-start border-danger border-4">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="badge bg-danger rounded-pill">${item.jumlah_ekor} BULAN (EKOR)</span>
                        <small class="text-muted">IDPEL: ${item.nomen}</small>
                    </div>
                    <h6 class="fw-bold mb-1">${item.nama || 'Pelanggan Ardebt'}</h6>
                    <p class="small text-muted mb-3"><i class="fas fa-route me-1"></i> Rute: ${item.pcez || '-'}</p>
                    
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <small class="d-block text-muted" style="font-size: 10px;">TOTAL TUNGGAKAN</small>
                            <span class="fw-bold text-danger h5">Rp ${Number(item.total_tunggakan).toLocaleString('id-ID')}</span>
                        </div>
                        <button class="btn btn-outline-danger btn-sm rounded-3">Detail</button>
                    </div>
                </div>
            </div>
        `).join('');
    } catch (err) {
        container.innerHTML = '<div class="alert alert-danger">Gagal memuat data.</div>';
    }
}

document.addEventListener('DOMContentLoaded', loadArdebt);
</script>
{% endblock %}
