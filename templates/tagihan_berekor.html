{% extends "base.html" %}
{% block content %}
<div class="animate__animated animate__fadeIn">
    <div class="px-2 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1 text-dark">Tunggakan Ardebt 🐉</h4>
            <p class="text-muted small mb-0">Prioritas Antrean Penagihan Berekor</p>
        </div>
        <div class="bg-danger text-white px-3 py-2 rounded-pill small fw-bold shadow-sm animate__animated animate__pulse animate__infinite" style="font-size: 0.6rem; letter-spacing: 1px;">
            ARDEBT MODE ACTIVE
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-3 mx-2 bg-white">
        <div class="card-body p-3">
            <div class="row g-2">
                <div class="col-8">
                    <label class="small fw-bold text-muted mb-1">Target Wilayah Petugas</label>
                    <select id="filter-petugas" class="form-select border-0 bg-light rounded-3 shadow-none fw-bold text-danger" onchange="loadArdebt()">
                        {% if session['role'] == 'petugas' %}
                            <option value="{{ session['petugas_id'] }}">{{ session['petugas_id'] }} (Saya)</option>
                        {% else %}
                            <option value="all">-- Semua Petugas --</option>
                        {% endif %}
                    </select>
                </div>
                <div class="col-4 d-flex align-items-end">
                    <button class="btn btn-danger rounded-3 w-100 fw-bold shadow-sm" onclick="loadArdebt()">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <div class="col-12 mt-2">
                    <div class="input-group bg-light rounded-3 px-2 border border-danger-subtle">
                        <span class="input-group-text border-0 bg-transparent text-muted"><i class="fas fa-search"></i></span>
                        <input type="text" id="searchBar" class="form-control border-0 bg-transparent py-2 shadow-none" 
                               placeholder="Cari Nama Pelanggan atau IDPEL..." onkeyup="liveSearch()">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="summary-area" class="px-2 mb-3"></div>

    <div id="list-container" class="px-2 pb-5">
        <div class="text-center py-5">
            <div class="spinner-border text-danger" role="status"></div>
            <p class="mt-2 text-muted small">Menganalisis antrean tunggakan...</p>
        </div>
    </div>
</div>

<div class="modal fade" id="modalKunjungan" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
            <form id="formKunjungan">
                <div class="modal-header border-0 bg-danger text-white p-3">
                    <h6 class="modal-title fw-bold"><i class="fas fa-dragon me-2"></i>Laporan Penagihan Ardebt</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modal-idpel" name="nomen">
                    <input type="hidden" id="modal-nominal-val" name="nominal_display">
                    <input type="hidden" id="modal-rayon-hidden" name="rayon">
                    
                    <div class="bg-danger-subtle p-3 rounded-4 mb-3 border border-danger-subtle">
                        <small class="text-danger fw-bold text-uppercase d-block mb-1">Target Penagihan Ardebt</small>
                        <h6 id="modal-nama" class="fw-bold mb-1 text-dark text-uppercase"></h6>
                        <div class="d-flex justify-content-between">
                            <small id="modal-sub-info" class="text-muted fw-bold"></small>
                            <small id="modal-sub-vol" class="text-muted fw-bold"></small>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-dark">Nomor Kontak Pelanggan *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-phone"></i></span>
                            <input type="tel" id="modal-no-hp" name="no_hp" class="form-control rounded-3" placeholder="0812..." required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-dark">Keputusan Hasil Lapangan *</label>
                        <select id="modal-hasil" name="hasil" class="form-select rounded-3 bg-light border-0 fw-bold" required onchange="toggleJanjiInput()">
                            <option value="">-- Pilih Hasil Kunjungan --</option>
                            <option value="Sudah Bayar">💰 Sudah Bayar (Lunas)</option>
                            <option value="Janji Bayar">🤝 Janji Bayar</option>
                            <option value="Rumah Kosong">🏠 Rumah Kosong / Tutup</option>
                            <option value="Tutup Bor">🚫 Tutup Bor / Cabut Meter</option>
                            <option value="Lainnya">⚠️ Kendala Teknis Lapangan</option>
                        </select>
                    </div>

                    <div class="mb-3 d-none animate__animated animate__headShake" id="group-janji">
                        <label class="form-label small fw-bold text-danger">Komitmen Tanggal Bayar</label>
                        <input type="date" id="modal-janji-dt" name="janji_bayar_dt" class="form-control rounded-3 border-danger-subtle bg-danger-subtle bg-opacity-10 text-danger fw-bold">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-dark">Catatan Khusus Ardebt</label>
                        <textarea id="modal-keterangan" name="catatan" class="form-control rounded-3 bg-light border-0" rows="2" placeholder="Tulis rincian kendala atau respon pelanggan..."></textarea>
                    </div>

                    <div class="mb-0">
                        <label class="form-label small fw-bold text-dark">Foto Bukti Fisik / Lokasi *</label>
                        <input type="file" id="modal-foto" name="foto" class="form-control rounded-3" accept="image/*" capture="camera" required>
                    </div>
                </div>
                <div class="modal-footer border-0 p-3 pt-0">
                    <button type="submit" class="btn btn-danger w-100 rounded-pill py-3 fw-bold shadow">
                        SIMPAN & SHARE LAPORAN <i class="fab fa-whatsapp ms-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    let modalKunjungan;
    const formatIDR = (n) => new Intl.NumberFormat('id-ID').format(n);
    const USER_ROLE = "{{ session['role'] }}";

    document.addEventListener('DOMContentLoaded', () => {
        modalKunjungan = new bootstrap.Modal(document.getElementById('modalKunjungan'));
        
        // Sinergi: Proteksi dropdown filter untuk petugas
        if (USER_ROLE === 'admin') {
            loadPetugasDropdown();
        } else {
            document.getElementById('filter-petugas').disabled = true;
        }

        loadArdebt();
        document.getElementById('formKunjungan').addEventListener('submit', async (e) => {
            e.preventDefault();
            await simpanLaporan();
        });
    });

    async function loadPetugasDropdown() {
        try {
            const res = await fetch('/api/belum-bayar/petugas-tabs');
            const list = await res.json();
            const select = document.getElementById('filter-petugas');
            list.forEach(n => {
                if (n && ![...select.options].some(o => o.value === n)) {
                    const opt = document.createElement('option');
                    opt.value = n; opt.innerText = n;
                    select.appendChild(opt);
                }
            });
        } catch(e) { console.error("Dropdown Petugas Error"); }
    }

    async function loadArdebt() {
        const petugas = document.getElementById('filter-petugas').value;
        const container = document.getElementById('list-container');
        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-danger border-width-2"></div><p class="small text-muted mt-2">Mencari data berekor...</p></div>';
        
        try {
            const res = await fetch(`/api/ardebt?petugas=${encodeURIComponent(petugas)}`);
            const data = await res.json();
            renderCards(data);
            updateSummary(data);
        } catch (err) {
            container.innerHTML = '<div class="alert alert-danger mx-2 rounded-4 small">❌ Kegagalan sinkronisasi database Ardebt.</div>';
        }
    }

    function renderCards(data) {
        const container = document.getElementById('list-container');
        if (!data || !data.length) {
            container.innerHTML = '<div class="text-center mt-5"><i class="fas fa-dragon fa-3x text-light mb-3 opacity-25"></i><p class="text-muted small">Antrean Ardebt bersih!<br>Tidak ada tunggakan berekor di rute ini.</p></div>';
            return;
        }

        container.innerHTML = data.map((item) => `
            <div class="card border-0 shadow-sm rounded-4 mb-3 customer-card animate__animated animate__fadeInUp bg-white">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 rounded-pill px-2 py-1" style="font-size: 9px;">🆔 ${item.nomen}</span>
                        <span class="badge bg-dark text-white rounded-pill px-2 py-1" style="font-size: 9px;">💧 ${item.volume || 0} m³</span>
                    </div>
                    <h6 class="fw-bold mb-1 text-dark text-uppercase" style="letter-spacing: 0.3px;">${item.nama || 'PELANGGAN ARDEBT'}</h6>
                    <div class="row g-0 small text-muted mb-3" style="font-size: 0.7rem;">
                        <div class="col-6"><i class="fas fa-map-marker-alt me-1 text-danger"></i>PCEZ: ${item.pcez || '-'}</div>
                        <div class="col-6 text-end"><i class="fas fa-calendar-alt me-1"></i>Bill: ${item.periode_bill}</div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center border-top pt-3">
                        <div>
                            <small class="d-block text-muted fw-bold" style="font-size: 8px;">TOTAL ARDEBT</small>
                            <span class="fw-bold text-danger" style="font-size: 1.1rem;">Rp ${Number(item.jumlah).toLocaleString('id-ID')}</span>
                        </div>
                        <button class="btn btn-danger rounded-pill px-4 fw-bold shadow-sm" 
                                onclick="openModal('${item.nomen}', '${item.nama.replace(/'/g, "\\'")}', '${item.jumlah}', '${item.periode_bill}', '${item.volume}', '${item.nomet}', '${item.rayon}')">
                            <i class="fas fa-file-signature me-1"></i> LAPOR
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function openModal(nomen, nama, nominal, periode, vol, nomet, rayon) {
        document.getElementById('modal-idpel').value = nomen;
        document.getElementById('modal-nama').innerText = nama || 'PELANGGAN';
        document.getElementById('modal-nominal-val').value = nominal;
        document.getElementById('modal-sub-info').innerText = `MET: ${nomet || '-'} | PERIODE: ${periode}`;
        document.getElementById('modal-sub-vol').innerText = `VOL: ${vol} m³`;
        document.getElementById('modal-rayon-hidden').value = rayon || '-';

        document.getElementById('formKunjungan').reset();
        toggleJanjiInput();
        modalKunjungan.show();
    }

    async function simpanLaporan() {
        Swal.fire({ title: 'Menyimpan Laporan Ardebt...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        const formData = new FormData(document.getElementById('formKunjungan'));
        formData.append('petugas_name', document.getElementById('filter-petugas').value);

        try {
            const res = await fetch('/api/history/simpan-kunjungan', { method: 'POST', body: formData });
            const result = await res.json();
            
            if (res.ok) {
                Swal.fire({
                    icon: 'success', title: 'Data Ardebt Masuk!',
                    text: 'Laporan kunjungan berekor telah disimpan.',
                    showConfirmButton: true,
                    confirmButtonText: 'Kirim WhatsApp'
                }).then(() => {
                    executeShareWA(result.wa_data);
                    modalKunjungan.hide();
                    loadArdebt();
                });
            } else {
                Swal.fire('Gagal', result.message || 'Coba lagi nanti', 'error');
            }
        } catch (err) { Swal.fire('Error', 'Gagal menghubungi server.', 'error'); }
    }

    function executeShareWA(wa) {
        const waktu = new Date().toLocaleString('id-ID');
        // Sinergi Pesan: Menegaskan bahwa ini adalah laporan ARDEBT
        const pesanShare = 
            `*[LAPORAN KUNJUNGAN ARDEBT]* 🐉%0A` +
            `-------------------------------------------%0A` +
            `👤 *Petugas:* ${wa.petugas}%0A` +
            `🏠 *Konsumen:* ${wa.nama}%0A` +
            `🆔 *IDPEL:* ${wa.nomen}%0A` +
            `📟 *NOMET:* ${wa.nomet}%0A%0A` +
            `*HASIL KUNJUNGAN:*%0A` +
            `📌 Status: *${wa.status}*%0A` +
            `📝 Catatan: ${wa.catatan}%0A%0A` +
            `*RINCIAN TUNGGAKAN:*%0A` +
            `🧾 Tagihan MC: Rp ${formatIDR(wa.mc)}%0A` +
            `💸 Ardebt (Berekor): Rp ${formatIDR(wa.ardebt)}%0A` +
            `💰 *TOTAL: Rp ${formatIDR(wa.total)}*%0A%0A` +
            `📸 *Foto Bukti:*%0A` +
            `${window.location.origin}/static/uploads/kunjungan/${wa.foto_path}%0A%0A` +
            `*Waktu Lapor:* ${waktu}`;

        window.open(`https://api.whatsapp.com/send?text=${pesanShare}`, '_blank');
    }

    function toggleJanjiInput() {
        const isJanji = document.getElementById('modal-hasil').value === 'Janji Bayar';
        const group = document.getElementById('group-janji');
        group.classList.toggle('d-none', !isJanji);
        document.getElementById('modal-janji-dt').required = isJanji;
    }

    function updateSummary(data) {
        const total = data.reduce((acc, curr) => acc + Number(curr.jumlah), 0);
        document.getElementById('summary-area').innerHTML = `
            <div class="bg-danger shadow-sm rounded-4 p-3 d-flex justify-content-between align-items-center mx-1 text-white">
                <div class="small">
                    <div class="opacity-75 mb-0" style="font-size: 0.65rem;">SISA ANTREAN</div>
                    <div class="fw-bold h5 mb-0">${data.length} <small style="font-size: 0.6rem;">Data</small></div>
                </div>
                <div class="text-end">
                    <div class="opacity-75 mb-0" style="font-size: 0.65rem;">TOTAL TUNGGAKAN</div>
                    <div class="fw-bold h5 mb-0">Rp ${total.toLocaleString('id-ID')}</div>
                </div>
            </div>
        `;
    }

    function liveSearch() {
        const q = document.getElementById('searchBar').value.toLowerCase();
        document.querySelectorAll('.customer-card').forEach(c => {
            c.style.display = c.dataset.search.toLowerCase().includes(q) ? 'block' : 'none';
        });
    }
</script>

<style>
    .bg-danger-subtle { background-color: #fee2e2 !important; }
    .border-danger-subtle { border-color: #fecaca !important; }
    .btn-danger { background: #dc3545; border: none; }
    .spinner-border.text-danger { color: #dc3545 !important; }
    .customer-card { transition: all 0.2s ease; cursor: pointer; border: 1px solid #f8d7da !important; }
    .customer-card:active { transform: scale(0.97); }
    .form-select:disabled { background-color: #f8f9fa; opacity: 1; color: #dc3545; font-weight: bold; }
</style>
{% endblock %}
