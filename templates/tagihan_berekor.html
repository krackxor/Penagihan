{% extends "base.html" %}

{% block content %}
<div class="animate__animated animate__fadeIn">
    <div class="px-2 mb-4 d-flex justify-content-between align-items-center mt-3">
        <div>
            <h4 class="fw-bold mb-1 text-dark">Tunggakan Ardebt 🐉</h4>
            <p class="text-muted small mb-0">Prioritas Antrean Penagihan Berekor</p>
        </div>
        <div class="bg-danger text-white px-3 py-2 rounded-pill small fw-bold shadow-sm animate__animated animate__pulse animate__infinite" style="font-size: 0.6rem; letter-spacing: 1px;">
            ARDEBT MODE ACTIVE
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-3 mx-2 bg-white">
        <div class="card-body p-3">
            <div class="row g-2">
                <div class="col-8">
                    <label class="small fw-bold text-muted mb-1">Target Wilayah Petugas</label>
                    <select id="filter-petugas" class="form-select border-0 bg-light rounded-3 shadow-none fw-bold text-danger" onchange="loadArdebt()">
                        {% if session['role'] == 'petugas' %}
                            <option value="{{ session['petugas_id'] }}">{{ session['petugas_id'] }} (Saya)</option>
                        {% else %}
                            <option value="all">-- Semua Petugas --</option>
                        {% endif %}
                    </select>
                </div>
                <div class="col-4 d-flex align-items-end">
                    <button class="btn btn-danger rounded-3 w-100 fw-bold shadow-sm" onclick="loadArdebt()">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <div class="col-12 mt-2">
                    <div class="input-group bg-light rounded-3 px-2 border border-danger-subtle">
                        <span class="input-group-text border-0 bg-transparent text-muted"><i class="fas fa-search"></i></span>
                        <input type="text" id="searchBar" class="form-control border-0 bg-transparent py-2 shadow-none" 
                               placeholder="Cari Nama atau IDPEL..." onkeyup="liveSearch()">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="summary-area" class="px-2 mb-3"></div>

    <div id="list-container" class="px-2 pb-5">
        <div class="text-center py-5">
            <div class="spinner-border text-danger" role="status"></div>
            <p class="mt-2 text-muted small">Menganalisis antrean tunggakan...</p>
        </div>
    </div>
</div>

<div class="modal fade" id="modalHistory" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header bg-dark text-white border-0">
                <h6 class="modal-title fw-bold"><i class="fas fa-history me-2"></i>Laporan Skakmat Riwayat</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body bg-light">
                <div id="boxAnalisis" class="alert d-none mb-3 shadow-sm border-start border-4 animate__animated animate__fadeIn">
                    <h6 class="fw-bold small mb-1"><i class="fas fa-robot me-1"></i>Analisis Sistem Sunter:</h6>
                    <p id="txtSaran" class="mb-1 small text-dark">-</p>
                    <hr class="my-1 opacity-10">
                    <div id="txtTren" class="fw-bold text-danger" style="font-size: 0.8rem;"></div>
                </div>

                <div class="table-responsive rounded-3 shadow-sm bg-white">
                    <table class="table table-sm table-hover mb-0" style="font-size: 0.75rem;">
                        <thead class="table-dark text-center">
                            <tr>
                                <th class="py-2 text-start ps-3">Periode</th>
                                <th class="py-2">Kubik</th>
                                <th class="py-2">Nominal</th>
                                <th class="py-2">Tarif</th>
                                <th class="py-2 pe-3">Status</th>
                            </tr>
                        </thead>
                        <tbody id="tableHistoryContent"></tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer bg-light border-0">
                <button type="button" class="btn btn-secondary w-100 rounded-pill fw-bold" data-bs-dismiss="modal">Tutup Laporan</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalKunjungan" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <form id="formKunjungan">
                <div class="modal-header border-0 bg-danger text-white p-3">
                    <h6 class="modal-title fw-bold"><i class="fas fa-dragon me-2"></i>Penagihan Lapangan</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modal-idpel" name="idpel">
                    <input type="hidden" id="modal-nominal-val" name="nominal_display">
                    
                    <div class="bg-danger-subtle p-3 rounded-4 mb-3 border border-danger-subtle">
                        <small class="text-danger fw-bold text-uppercase d-block mb-1" style="font-size: 0.6rem;">Target Tagihan</small>
                        <h6 id="modal-nama" class="fw-bold mb-1 text-dark text-uppercase"></h6>
                        <small id="modal-sub-info" class="text-muted fw-bold d-block" style="font-size: 0.7rem;"></small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">WhatsApp/No Telp Pelanggan *</label>
                        <input type="tel" id="modal-no-hp" name="no_hp" class="form-control rounded-3 shadow-none border-light-subtle" placeholder="0812..." required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Hasil Penagihan *</label>
                        <select id="modal-hasil" name="hasil" class="form-select rounded-3 fw-bold" required onchange="toggleJanjiInput()">
                            <option value="">-- Pilih Hasil --</option>
                            <option value="Sudah Bayar">💰 Sudah Bayar</option>
                            <option value="Janji Bayar">🤝 Janji Bayar</option>
                            <option value="Rumah Kosong">🏠 Rumah Kosong</option>
                            <option value="Tutup Bor">🚫 Tutup Bor / Segel</option>
                        </select>
                    </div>

                    <div class="mb-3 d-none animate__animated animate__shakeX" id="group-janji">
                        <label class="form-label small fw-bold text-danger">Komitmen Tanggal Bayar</label>
                        <input type="date" id="modal-janji-dt" name="janji_bayar_dt" class="form-control rounded-3 border-danger-subtle bg-danger-subtle">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Catatan Petugas</label>
                        <textarea id="modal-keterangan" name="keterangan" class="form-control rounded-3 shadow-none" rows="2" placeholder="Tulis kendala lapangan..."></textarea>
                    </div>

                    <div class="mb-0">
                        <label class="form-label small fw-bold">Foto Bukti Lapangan *</label>
                        <input type="file" id="modal-foto" name="foto" class="form-control rounded-3" accept="image/*" capture="camera" required>
                    </div>
                </div>
                <div class="modal-footer border-0 p-3 pt-0">
                    <button type="submit" class="btn btn-danger w-100 rounded-pill py-3 fw-bold shadow-lg">
                        SIMPAN & SHARE WA <i class="fab fa-whatsapp ms-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    let modalKunjungan, modalHistory;
    const formatIDR = (n) => new Intl.NumberFormat('id-ID').format(n);

    document.addEventListener('DOMContentLoaded', () => {
        modalKunjungan = new bootstrap.Modal(document.getElementById('modalKunjungan'));
        modalHistory = new bootstrap.Modal(document.getElementById('modalHistory'));
        loadArdebt();
        document.getElementById('formKunjungan').addEventListener('submit', (e) => { 
            e.preventDefault(); 
            simpanLaporan(); 
        });
    });

    /**
     * [FUNGSI DATA: loadArdebt]
     * Kegunaan: Merender Kartu Pelanggan dengan Style Visual yang Bapak sukai.
     */
    async function loadArdebt() {
        const petugas = document.getElementById('filter-petugas').value;
        const container = document.getElementById('list-container');
        try {
            const res = await fetch(`/api/ardebt?petugas=${encodeURIComponent(petugas)}`);
            const data = await res.json();
            if (data.length === 0) {
                container.innerHTML = '<div class="text-center mt-5 text-muted small">Antrean Ardebt Bersih! 🐉</div>';
                return;
            }
            container.innerHTML = data.map((item) => `
                <div class="card border-0 shadow-sm rounded-4 mb-3 customer-card bg-white animate__animated animate__fadeInUp" data-search="${item.nomen} ${item.nama}">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <span class="badge bg-danger bg-opacity-10 text-danger rounded-pill px-2 py-1" style="font-size: 9px;">🆔 ${item.nomen}</span>
                            <span class="badge bg-primary bg-opacity-10 text-primary rounded-pill px-2 py-1 fw-bold" style="font-size: 9px;">💧 ${item.pemakaian_air} m³</span>
                        </div>
                        <h6 class="fw-bold mb-1 text-dark text-uppercase">${item.nama}</h6>
                        <p class="text-muted mb-2" style="font-size: 0.65rem;"><i class="fas fa-map-marker-alt me-1"></i>${item.alamat}</p>
                        <div class="d-flex justify-content-between align-items-center border-top pt-3">
                            <div>
                                <small class="d-block text-muted fw-bold" style="font-size: 8px;">TOTAL TUNGGAKAN</small>
                                <span class="fw-bold text-danger" style="font-size: 1.1rem;">Rp ${formatIDR(item.nominal_mc + item.nominal_ardebt)}</span>
                            </div>
                            <div class="btn-group">
                                <button class="btn btn-outline-dark rounded-pill px-3 fw-bold me-1" style="font-size: 0.65rem;" onclick="showHistory('${item.nomen}', '${item.nama}')">RIWAYAT</button>
                                <button class="btn btn-danger rounded-pill px-3 fw-bold shadow-sm" style="font-size: 0.65rem;" onclick="openModal('${item.nomen}', '${item.nama}', '${item.nominal_mc + item.nominal_ardebt}', '${item.no_hp}')">TAGIH</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            updateSummary(data);
        } catch (err) { container.innerHTML = '<p class="text-center text-danger small">Gagal muat data.</p>'; }
    }

    /**
     * [FUNGSI RIWAYAT: showHistory]
     * Logic: Menampilkan J-Count (🚩 X Bulan Menunggak) dan Baris Merah Skakmat.
     */
    async function showHistory(nomen, nama) {
        document.querySelector('#tableHistoryContent').innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted small">Verifikasi data...</td></tr>';
        document.getElementById('boxAnalisis').classList.add('d-none');
        modalHistory.show();
        try {
            const res = await fetch(`/api/ardebt/history/${nomen}`);
            const resData = await res.json();
            if (resData.status === 'available') {
                const box = document.getElementById('boxAnalisis');
                box.classList.remove('d-none');
                box.className = `alert alert-${resData.analysis.level} mb-3 shadow-sm border-start border-4`;
                document.getElementById('txtSaran').innerText = resData.analysis.saran;
                document.getElementById('txtTren').innerHTML = `🚩 ${resData.analysis.count_nunggak} Bulan Menunggak`;
                let rows = '';
                resData.history.forEach(h => {
                    const isLunas = h.status_lunas == 1;
                    const rowClass = !isLunas ? 'table-danger text-danger fw-bold' : ''; 
                    rows += `<tr class="text-center align-middle ${rowClass}">
                        <td class="text-start ps-3">${h.periode}</td>
                        <td>${h.pemakaian_air} m³</td>
                        <td>Rp ${formatIDR(h.rupiah)}</td>
                        <td>${h.tarif}</td>
                        <td class="pe-3"><span class="badge ${isLunas ? 'bg-success' : 'bg-danger'}">${isLunas ? 'LUNAS' : 'PIUTANG'}</span></td>
                    </tr>`;
                });
                document.querySelector('#tableHistoryContent').innerHTML = rows;
            }
        } catch (e) { console.error(e); }
    }

    /**
     * [FUNGSI SIMPAN: simpanLaporan]
     * Kegunaan: Eksekusi simpan ke database dan kirim template detail ke WA Share.
     */
    async function simpanLaporan() {
        Swal.fire({ title: 'Mengirim Laporan...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});
        const form = document.getElementById('formKunjungan');
        const formData = new FormData(form);
        const petugasName = document.getElementById('filter-petugas').value;
        formData.append('petugas_name', petugasName);
        try {
            const res = await fetch('/api/history/simpan-kunjungan', { method: 'POST', body: formData });
            const result = await res.json();
            if (res.ok) {
                Swal.fire({ icon: 'success', title: 'Tersimpan!', text: 'Buka WhatsApp untuk lapor.' }).then(() => {
                    executeShareWA(result.wa_data);
                    modalKunjungan.hide();
                    loadArdebt();
                });
            } else { Swal.fire('Gagal!', result.message, 'error'); }
        } catch (err) { Swal.fire('Error!', 'Koneksi terputus.', 'error'); }
    }

    /**
     * [FUNGSI SHARE: executeShareWA]
     * Template: Laporan sangat detail untuk Grup (Universal Share).
     */
    function executeShareWA(wa) {
        const waktu = new Date().toLocaleString('id-ID');
        const pesanShare = 
            `*🚨 LAPORAN KUNJUNGAN LAPANGAN*%0A` +
            `*(ANTREAN ARDEBT - SUNTER PRO)*%0A` +
            `-------------------------------------------%0A` +
            `📅 *Waktu:* ${waktu}%0A` +
            `👤 *Petugas:* ${wa.petugas}%0A` +
            `-------------------------------------------%0A%0A` +
            `*DATA PELANGGAN:*%0A` +
            `👤 *Nama:* ${wa.nama}%0A` +
            `🆔 *IDPEL:* ${wa.nomen}%0A` +
            `📟 *No Seri Meter:* ${wa.nomet || '-'}%0A` +
            `📞 *No HP Pelanggan:* ${wa.no_hp || '-'}%0A%0A` +
            `*HASIL KUNJUNGAN:*%0A` +
            `🏁 *Status:* *${wa.status.toUpperCase()}*%0A` +
            `🚩 *Tunggakan:* ${wa.jcount} Bulan%0A` +
            `📝 *Catatan:* ${wa.catatan}%0A%0A` +
            `*RINCIAN TAGIHAN:*%0A` +
            `• Tagihan MC: Rp ${formatIDR(wa.mc)}%0A` +
            `• Piutang Ardebt: Rp ${formatIDR(wa.ardebt)}%0A` +
            `• *TOTAL WAJIB BAYAR: Rp ${formatIDR(wa.total)}*%0A%0A` +
            `*BUKTI OTENTIK (FOTO):*%0A` +
            `🖼️ Link Foto: ${window.location.origin}/static/uploads/kunjungan/${wa.foto_path}%0A%0A` +
            `-------------------------------------------%0A` +
            `_Laporan dikirim via Sunter Dashboard Pro_`;
        window.open(`https://api.whatsapp.com/send?text=${pesanShare}`, '_blank');
    }

    function liveSearch() {
        const q = document.getElementById('searchBar').value.toLowerCase();
        document.querySelectorAll('.customer-card').forEach(c => {
            c.style.display = c.dataset.search.toLowerCase().includes(q) ? 'block' : 'none';
        });
    }

    function openModal(nomen, nama, total, no_hp) {
        document.getElementById('modal-idpel').value = nomen;
        document.getElementById('modal-nama').innerText = nama;
        document.getElementById('modal-nominal-val').value = total;
        document.getElementById('modal-no-hp').value = no_hp || '';
        document.getElementById('modal-sub-info').innerText = `🆔 ${nomen} | 🧾 Rp ${formatIDR(total)}`;
        document.getElementById('formKunjungan').reset();
        modalKunjungan.show();
    }

    function toggleJanjiInput() {
        const isJanji = document.getElementById('modal-hasil').value === 'Janji Bayar';
        document.getElementById('group-janji').classList.toggle('d-none', !isJanji);
    }

    function updateSummary(data) {
        const total = data.reduce((acc, curr) => acc + (curr.nominal_mc + curr.nominal_ardebt), 0);
        document.getElementById('summary-area').innerHTML = `
            <div class="bg-danger shadow-sm rounded-4 p-3 d-flex justify-content-between align-items-center mx-1 text-white animate__animated animate__fadeIn">
                <div><div class="opacity-75" style="font-size: 0.65rem;">TOTAL TARGET ARDEBT</div><div class="fw-bold h5 mb-0">${data.length} <small style="font-size: 0.6rem;">NASABAH</small></div></div>
                <div class="text-end"><div class="opacity-75" style="font-size: 0.65rem;">NOMINAL PIUTANG</div><div class="fw-bold h5 mb-0">Rp ${formatIDR(total)}</div></div>
            </div>`;
    }
</script>

<style>
    .bg-danger-subtle { background-color: #fff5f5 !important; }
    .customer-card { border: 1px solid #fecaca !important; transition: transform 0.2s; }
    .customer-card:active { transform: scale(0.98); }
    .table-danger { --bs-table-bg: #ffebeb; --bs-table-color: #b30000; }
    .modal-dialog-scrollable .modal-body { max-height: 70vh; }
</style>
{% endblock %}
