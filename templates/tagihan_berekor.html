{% extends "base.html" %}
{% block content %}
<div class="animate__animated animate__fadeIn">
    <div class="px-2 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1 text-dark">Tagihan Berekor 🐉</h4>
            <p class="text-muted small mb-0">Prioritas 20 Data per Petugas (Ardebt)</p>
        </div>
        <div class="bg-danger text-white px-3 py-1 rounded-pill small fw-bold shadow-sm" style="font-size: 0.65rem;">
            ARDEBT MODE
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-3 mx-2">
        <div class="card-body p-3">
            <div class="row g-2">
                <div class="col-8">
                    <label class="small fw-bold text-muted mb-1">Petugas Lapangan</label>
                    <select id="filter-petugas" class="form-select border-0 bg-light rounded-3 shadow-none" onchange="loadArdebt()">
                        <option value="all">Semua Petugas</option>
                    </select>
                </div>
                <div class="col-4 d-flex align-items-end">
                    <button class="btn btn-danger rounded-3 w-100 fw-bold shadow-sm" onclick="loadArdebt()">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <div class="col-12 mt-2">
                    <div class="input-group bg-light rounded-3 px-2 border">
                        <span class="input-group-text border-0 bg-transparent"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" id="searchBar" class="form-control border-0 bg-transparent py-2 shadow-none" 
                               placeholder="Cari Nama/IDPEL untuk revisi..." onkeyup="liveSearch()">
                    </div>
                    <small class="text-muted mt-2 d-block" style="font-size: 10px; line-height: 1.2;">
                        * Menampilkan 20 data rute terlama. Data yang dilaporkan akan masuk kotak sementara (30 hari).
                    </small>
                </div>
            </div>
        </div>
    </div>

    <div id="summary-area" class="px-2 mb-3"></div>

    <div id="list-container" class="px-2 pb-5">
        <div class="text-center py-5">
            <div class="spinner-border text-danger" role="status"></div>
            <p class="mt-2 text-muted small">Menyusun antrean rute...</p>
        </div>
    </div>
</div>

<div class="modal fade" id="modalKunjungan" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <form id="formKunjungan">
                <div class="modal-header border-0 pb-0 bg-danger text-white p-3 rounded-top-4">
                    <h6 class="fw-bold mb-0"><i class="fas fa-camera me-2"></i>Laporan Lapangan Ardebt</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modal-idpel" name="idpel">
                    <input type="hidden" id="modal-nominal-val" name="nominal_display">
                    <input type="hidden" id="modal-nomet-hidden">
                    <input type="hidden" id="modal-vol-hidden">
                    <input type="hidden" id="modal-rayon-hidden">
                    <input type="hidden" id="modal-nama-hidden">
                    
                    <div class="bg-danger-subtle p-3 rounded-4 mb-3 border border-danger-subtle">
                        <h6 id="modal-nama" class="fw-bold mb-1 text-danger text-uppercase"></h6>
                        <div class="d-flex justify-content-between">
                            <small id="modal-sub-info" class="text-muted fw-bold"></small>
                            <small id="modal-sub-vol" class="text-muted fw-bold"></small>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Kontak Pelanggan (Catatan) *</label>
                        <input type="tel" id="modal-no-hp" name="no_hp" class="form-control rounded-3 border-danger-subtle" placeholder="0812..." required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Hasil Kunjungan *</label>
                        <select id="modal-hasil" name="hasil" class="form-select rounded-3 bg-light border-0" required onchange="toggleJanjiInput()">
                            <option value="">-- Pilih Hasil --</option>
                            <option value="Sudah Bayar">Sudah Bayar</option>
                            <option value="Janji Bayar">Janji Bayar</option>
                            <option value="Rumah Kosong">Rumah Kosong</option>
                            <option value="Tutup Bor">Tutup Bor / Segel</option>
                            <option value="Lainnya">Lainnya / Kendala</option>
                        </select>
                    </div>

                    <div class="mb-3 d-none" id="group-janji">
                        <label class="form-label small fw-bold text-danger">Tanggal Janji Bayar</label>
                        <input type="date" id="modal-janji-dt" name="janji_bayar_dt" class="form-control rounded-3 bg-light border-0">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Catatan Lapangan</label>
                        <textarea id="modal-keterangan" name="keterangan" class="form-control rounded-3 bg-light border-0" rows="2" placeholder="Tulis catatan tambahan..."></textarea>
                    </div>

                    <div class="mb-0">
                        <label class="form-label small fw-bold">Foto Bukti Kunjungan *</label>
                        <input type="file" id="modal-foto" name="foto" class="form-control rounded-3" accept="image/*" capture="camera" required>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="submit" class="btn btn-danger w-100 rounded-pill py-3 fw-bold shadow">
                        SIMPAN & BAGIKAN <i class="fab fa-whatsapp ms-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    let rawData = [];
    let modalKunjungan;
    const formatIDR = (n) => new Intl.NumberFormat('id-ID').format(n);

    document.addEventListener('DOMContentLoaded', () => {
        modalKunjungan = new bootstrap.Modal(document.getElementById('modalKunjungan'));
        loadPetugasDropdown();
        loadArdebt();

        document.getElementById('formKunjungan').addEventListener('submit', async (e) => {
            e.preventDefault();
            await simpanLaporan();
        });
    });

    function toggleJanjiInput() {
        const isJanji = document.getElementById('modal-hasil').value === 'Janji Bayar';
        document.getElementById('group-janji').classList.toggle('d-none', !isJanji);
        document.getElementById('modal-janji-dt').required = isJanji;
    }

    async function loadPetugasDropdown() {
        const res = await fetch('/api/belum-bayar/petugas-tabs');
        const list = await res.json();
        const select = document.getElementById('filter-petugas');
        list.forEach(n => {
            if(![...select.options].some(o => o.value === n)) {
                select.innerHTML += `<option value="${n}">${n}</option>`;
            }
        });
    }

    async function loadArdebt() {
        const petugas = document.getElementById('filter-petugas').value;
        const container = document.getElementById('list-container');
        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-danger"></div></div>';

        try {
            const res = await fetch(`/api/ardebt?petugas=${encodeURIComponent(petugas)}`);
            const responseData = await res.json();
            rawData = responseData || [];
            renderCards(rawData);
            updateSummary(rawData);
        } catch (err) {
            container.innerHTML = '<div class="alert alert-danger mx-2">Koneksi gagal.</div>';
        }
    }

    function renderCards(data) {
        const container = document.getElementById('list-container');
        if (data.length === 0) {
            container.innerHTML = '<div class="text-center mt-5"><i class="fas fa-tasks fa-3x text-muted mb-3"></i><p class="fw-bold text-muted">Antrean Ardebt sudah bersih!</p></div>';
            return;
        }

        container.innerHTML = data.map((item) => `
            <div class="card border-0 shadow-sm rounded-4 mb-3 customer-card animate__animated animate__fadeInUp" 
                 data-search="${item.nama} ${item.nomen} ${item.pcez} ${item.nomet}">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-light text-dark border rounded-pill px-2" style="font-size: 10px;">ID: ${item.nomen}</span>
                        <span class="badge bg-danger text-white rounded-pill px-2" style="font-size: 10px;">
                           <i class="fas fa-history me-1"></i> ${item.periode_bill}
                        </span>
                    </div>
                    <h6 class="fw-bold mb-1 text-dark text-uppercase">${item.nama || 'PELANGGAN ARDEBT'}</h6>
                    
                    <div class="row g-0 mt-2 mb-3 small text-muted">
                        <div class="col-6"><i class="fas fa-route me-1 text-danger"></i>Rute: ${item.pcez || '-'}</div>
                        <div class="col-6 text-end"><i class="fas fa-tint me-1 text-primary"></i>Vol: ${item.volume || 0} m³</div>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center border-top pt-3">
                        <div>
                            <small class="d-block text-muted" style="font-size: 9px;">TOTAL TUNGGAKAN</small>
                            <span class="fw-bold text-danger h6">Rp ${Number(item.jumlah).toLocaleString('id-ID')}</span>
                        </div>
                        <button class="btn btn-danger rounded-pill px-4 fw-bold shadow-sm btn-sm" 
                                onclick="openModal('${item.nomen}', '${item.nama}', '${item.jumlah}', '${item.periode_bill}', '${item.volume}', '${item.nomet}', '${item.rayon}')">
                            LAPOR
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function liveSearch() {
        const query = document.getElementById('searchBar').value.toLowerCase();
        document.querySelectorAll('.customer-card').forEach(card => {
            card.style.display = card.dataset.search.toLowerCase().includes(query) ? 'block' : 'none';
        });
    }

    function updateSummary(data) {
        const total = data.reduce((acc, curr) => acc + Number(curr.jumlah), 0);
        document.getElementById('summary-area').innerHTML = `
            <div class="bg-danger-subtle rounded-3 p-2 d-flex justify-content-between small px-3 mx-1 border border-danger-subtle">
                <span class="text-danger fw-bold">Kuota: ${data.length} Data</span>
                <span class="text-danger fw-bold">Rp ${total.toLocaleString('id-ID')}</span>
            </div>
        `;
    }

    function openModal(nomen, nama, nominal, periode, vol, nomet, rayon) {
        document.getElementById('modal-idpel').value = nomen;
        document.getElementById('modal-nama').innerText = nama || 'PELANGGAN';
        document.getElementById('modal-nominal-val').value = nominal;
        document.getElementById('modal-sub-info').innerText = `MET: ${nomet || '-'} | BILL: ${periode}`;
        document.getElementById('modal-sub-vol').innerText = `VOL: ${vol} m³`;
        
        document.getElementById('modal-nama-hidden').value = nama;
        document.getElementById('modal-nomet-hidden').value = nomet || '-';
        document.getElementById('modal-vol-hidden').value = vol;
        document.getElementById('modal-rayon-hidden').value = rayon || '-';

        document.getElementById('formKunjungan').reset();
        toggleJanjiInput();
        modalKunjungan.show();
    }

    async function simpanLaporan() {
        Swal.fire({ title: 'Memproses Laporan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        
        const formData = new FormData(document.getElementById('formKunjungan'));
        formData.append('petugas_name', document.getElementById('filter-petugas').value);
        formData.append('nama_pelanggan', document.getElementById('modal-nama').innerText);

        try {
            // Sinergi: Menggunakan API History agar foto tersimpan fisik
            const res = await fetch('/api/history/simpan-kunjungan', { method: 'POST', body: formData });
            const result = await res.json();

            if (res.ok) {
                Swal.fire('Berhasil', 'Menyiapkan Share WA...', 'success').then(() => {
                    executeShareWA(result.wa_data);
                    modalKunjungan.hide();
                    loadArdebt();
                });
            } else {
                Swal.fire('Gagal', result.
