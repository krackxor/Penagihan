{% extends "base.html" %}

{% block content %}
<div class="animate__animated animate__fadeIn">
    
    <div class="px-2 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1 text-dark">Tunggakan Ardebt 🐉</h4>
            <p class="text-muted small mb-0">Prioritas Antrean Penagihan Berekor</p>
        </div>
        <div class="bg-danger text-white px-3 py-2 rounded-pill small fw-bold shadow-sm animate__animated animate__pulse animate__infinite" style="font-size: 0.6rem; letter-spacing: 1px;">
            ARDEBT MODE ACTIVE
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-3 mx-2 bg-white">
        <div class="card-body p-3">
            <div class="row g-2">
                <div class="col-8">
                    <label class="small fw-bold text-muted mb-1">Target Wilayah Petugas</label>
                    <select id="filter-petugas" class="form-select border-0 bg-light rounded-3 shadow-none fw-bold text-danger" onchange="loadArdebt()">
                        {% if session['role'] == 'petugas' %}
                            <option value="{{ session['petugas_id'] }}">{{ session['petugas_id'] }} (Saya)</option>
                        {% else %}
                            <option value="all">-- Semua Petugas --</option>
                        {% endif %}
                    </select>
                </div>
                <div class="col-4 d-flex align-items-end">
                    <button class="btn btn-danger rounded-3 w-100 fw-bold shadow-sm" onclick="loadArdebt()">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
                <div class="col-12 mt-2">
                    <div class="input-group bg-light rounded-3 px-2 border border-danger-subtle">
                        <span class="input-group-text border-0 bg-transparent text-muted"><i class="fas fa-search"></i></span>
                        <input type="text" id="searchBar" class="form-control border-0 bg-transparent py-2 shadow-none" 
                               placeholder="Cari Nama atau IDPEL..." onkeyup="liveSearch()">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="summary-area" class="px-2 mb-3"></div>

    <div id="list-container" class="px-2 pb-5">
        <div class="text-center py-5">
            <div class="spinner-border text-danger" role="status"></div>
            <p class="mt-2 text-muted small">Menganalisis antrean tunggakan...</p>
        </div>
    </div>
</div>

<div class="modal fade" id="modalHistory" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header bg-dark text-white border-0">
                <h6 class="modal-title fw-bold"><i class="fas fa-history me-2"></i>Laporan Riwayat Cerdas</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body bg-light">
                <div id="boxAnalisis" class="alert d-none mb-3 shadow-sm border-start border-4 animate__animated animate__fadeIn">
                    <h6 class="fw-bold small mb-1"><i class="fas fa-robot me-1"></i>Analisis Sistem Sunter:</h6>
                    <p id="txtSaran" class="mb-1 small text-dark">-</p>
                    <hr class="my-1 opacity-10">
                    <small id="txtTren" class="fw-bold text-muted" style="font-size: 0.7rem;"></small>
                </div>

                <div class="table-responsive rounded-3 shadow-sm bg-white">
                    <table class="table table-sm table-hover mb-0" style="font-size: 0.75rem;">
                        <thead class="table-dark">
                            <tr>
                                <th class="py-2 ps-3">Periode</th>
                                <th class="py-2 text-center">Kubik</th>
                                <th class="py-2 text-center">Nominal</th>
                                <th class="py-2 text-center">Tarif</th>
                                <th class="py-2 text-center pe-3">Status</th>
                            </tr>
                        </thead>
                        <tbody id="tableHistoryContent"></tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer bg-light border-0">
                <button type="button" class="btn btn-secondary w-100 rounded-pill fw-bold" data-bs-dismiss="modal">Tutup Riwayat</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalKunjungan" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <form id="formKunjungan">
                <div class="modal-header border-0 bg-danger text-white p-3">
                    <h6 class="modal-title fw-bold"><i class="fas fa-dragon me-2"></i>Laporan Ardebt Lapangan</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modal-idpel" name="idpel">
                    <input type="hidden" id="modal-nominal-val" name="nominal_display">
                    <input type="hidden" id="modal-rayon-hidden" name="rayon">

                    <div class="bg-danger-subtle p-3 rounded-4 mb-3 border border-danger-subtle">
                        <small class="text-danger fw-bold text-uppercase d-block mb-1" style="font-size: 0.6rem;">Target Tagihan</small>
                        <h6 id="modal-nama" class="fw-bold mb-1 text-dark text-uppercase"></h6>
                        <small id="modal-sub-info" class="text-muted fw-bold d-block" style="font-size: 0.7rem;"></small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">WhatsApp Pelanggan *</label>
                        <input type="tel" id="modal-no-hp" name="no_hp" class="form-control rounded-3" placeholder="0812..." required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Hasil Kunjungan *</label>
                        <select id="modal-hasil" name="hasil" class="form-select rounded-3 fw-bold" required onchange="toggleJanjiInput()">
                            <option value="">-- Pilih Hasil --</option>
                            <option value="Sudah Bayar">💰 Sudah Bayar</option>
                            <option value="Janji Bayar">🤝 Janji Bayar</option>
                            <option value="Rumah Kosong">🏠 Rumah Kosong</option>
                            <option value="Tutup Bor">🚫 Tutup Bor / Segel</option>
                        </select>
                    </div>

                    <div class="mb-3 d-none" id="group-janji">
                        <label class="form-label small fw-bold text-danger">Tgl Janji Bayar</label>
                        <input type="date" id="modal-janji-dt" name="janji_bayar_dt" class="form-control rounded-3 border-danger-subtle bg-danger-subtle">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Catatan</label>
                        <textarea id="modal-keterangan" name="keterangan" class="form-control rounded-3" rows="2" placeholder="Catat kendala..."></textarea>
                    </div>

                    <div class="mb-0">
                        <label class="form-label small fw-bold">Bukti Foto *</label>
                        <input type="file" id="modal-foto" name="foto" class="form-control rounded-3" accept="image/*" capture="camera" required>
                    </div>
                </div>
                <div class="modal-footer border-0 p-3 pt-0">
                    <button type="submit" class="btn btn-danger w-100 rounded-pill py-3 fw-bold shadow">
                        SIMPAN & SHARE WA <i class="fab fa-whatsapp ms-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Global variables untuk akses modal bootstrap
    let modalKunjungan, modalHistory;
    const formatIDR = (n) => new Intl.NumberFormat('id-ID').format(n);

    /**
     * INIT: Dijalankan saat halaman pertama kali dimuat.
     * Menginisialisasi objek modal dan memicu penarikan data pertama.
     */
    document.addEventListener('DOMContentLoaded', () => {
        modalKunjungan = new bootstrap.Modal(document.getElementById('modalKunjungan'));
        modalHistory = new bootstrap.Modal(document.getElementById('modalHistory'));
        loadArdebt();

        // Listener untuk submit form kunjungan agar tidak reload halaman
        document.getElementById('formKunjungan').addEventListener('submit', function(e) {
            e.preventDefault();
            simpanLaporan();
        });
    });

    /**
     * FETCH API: loadArdebt()
     * Mengambil data berekor yang hanya memiliki pemakaian air > 0 (Active Users).
     */
    async function loadArdebt() {
        const petugas = document.getElementById('filter-petugas').value;
        const container = document.getElementById('list-container');
        
        try {
            const res = await fetch(`/api/ardebt?petugas=${encodeURIComponent(petugas)}`);
            const data = await res.json();
            
            if (data.length === 0) {
                container.innerHTML = '<div class="text-center mt-5 text-muted small">Antrean Ardebt Bersih! 🐉<br>Atau tidak ada tunggakan dengan kubikasi aktif.</div>';
                return;
            }

            // Mapping data ke dalam elemen kartu (card)
            container.innerHTML = data.map((item) => `
                <div class="card border-0 shadow-sm rounded-4 mb-3 customer-card animate__animated animate__fadeInUp bg-white" data-search="${item.nomen} ${item.nama}">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <span class="badge bg-danger bg-opacity-10 text-danger rounded-pill px-2 py-1" style="font-size: 9px;">🆔 ${item.nomen}</span>
                            <span class="badge bg-light text-dark border rounded-pill px-2 py-1" style="font-size: 9px;">📍 ${item.pcez}</span>
                        </div>
                        <h6 class="fw-bold mb-1 text-dark text-uppercase">${item.nama}</h6>
                        <p class="text-muted mb-2" style="font-size: 0.65rem;"><i class="fas fa-map-marker-alt me-1"></i>${item.alamat}</p>
                        
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <div class="p-2 bg-light rounded-3 text-center">
                                    <small class="d-block text-muted" style="font-size: 0.55rem;">SERI METER</small>
                                    <span class="fw-bold" style="font-size: 0.75rem;">${item.no_seri_meter || '-'}</span>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="p-2 bg-primary bg-opacity-10 rounded-3 text-center border border-primary border-opacity-10">
                                    <small class="d-block text-primary fw-bold" style="font-size: 0.55rem;">PEMAKAIAN AKTIF</small>
                                    <span class="fw-bold text-primary" style="font-size: 0.75rem;">${item.pemakaian_air} m³</span>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center border-top pt-3">
                            <div>
                                <small class="d-block text-muted fw-bold" style="font-size: 8px;">TOTAL TAGIHAN (INC. ARDEBT)</small>
                                <span class="fw-bold text-danger" style="font-size: 1.1rem;">Rp ${formatIDR(item.nominal_mc + item.nominal_ardebt)}</span>
                            </div>
                            <div class="btn-group">
                                <button class="btn btn-outline-dark rounded-pill px-3 fw-bold me-1" style="font-size: 0.65rem;" onclick="showHistory('${item.nomen}', '${item.nama}')">RIWAYAT</button>
                                <button class="btn btn-danger rounded-pill px-3 fw-bold shadow-sm" style="font-size: 0.65rem;" onclick="openModal('${item.nomen}', '${item.nama}', '${item.nominal_mc + item.nominal_ardebt}', '${item.rincian_periode}', '${item.pemakaian_air}', '${item.rayon}')">TAGIH</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            updateSummary(data);
        } catch (err) {
            container.innerHTML = '<p class="text-center text-danger small">Gagal memuat data ardebt. Cek koneksi server.</p>';
        }
    }

    /**
     * FETCH API: showHistory()
     * Mengambil seluruh riwayat pemakaian air (Unlimited History) dan analisis robot.
     */
    async function showHistory(nomen, nama) {
        document.querySelector('#tableHistoryContent').innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted small">Robot sedang menganalisis...</td></tr>';
        document.getElementById('boxAnalisis').classList.add('d-none');
        modalHistory.show();

        try {
            const res = await fetch(`/api/ardebt/history/${nomen}`);
            const resData = await res.json();

            if (resData.status === 'not_available') {
                document.querySelector('#tableHistoryContent').innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted small">${resData.message}</td></tr>`;
            } else {
                // Konfigurasi visual box analisis cerdas (Leak/Normal/Meter Stuck)
                const box = document.getElementById('boxAnalisis');
                box.classList.remove('d-none', 'alert-success', 'alert-danger', 'alert-warning', 'alert-info');
                box.classList.add(`alert-${resData.analysis.level}`);
                document.getElementById('txtSaran').innerText = resData.analysis.saran;
                document.getElementById('txtTren').innerText = `TREN PEMAKAIAN: ${resData.analysis.perubahan}`;

                // Render baris tabel sejarah (Tanpa batas limit)
                let rows = '';
                resData.history.forEach(h => {
                    const statusClass = h.status_lunas == 1 ? 'text-success' : 'text-danger';
                    const statusText = h.status_lunas == 1 ? 'LUNAS' : 'PIUTANG';
                    rows += `<tr class="text-center align-middle">
                        <td class="text-start ps-3 fw-bold">${h.periode}</td>
                        <td>${h.pemakaian_air} m³</td>
                        <td>Rp ${formatIDR(h.rupiah)}</td>
                        <td>${h.tarif}</td>
                        <td class="pe-3 fw-bold ${statusClass}">${statusText}</td>
                    </tr>`;
                });
                document.querySelector('#tableHistoryContent').innerHTML = rows;
            }
        } catch (e) {
            document.querySelector('#tableHistoryContent').innerHTML = '<tr><td colspan="5" class="text-center text-danger">Gagal memproses data riwayat.</td></tr>';
        }
    }

    /**
     * SEARCH: liveSearch()
     * Pencarian client-side instan berdasarkan dataset pada kartu.
     */
    function liveSearch() {
        const q = document.getElementById('searchBar').value.toLowerCase();
        document.querySelectorAll('.customer-card').forEach(c => {
            c.style.display = c.dataset.search.toLowerCase().includes(q) ? 'block' : 'none';
        });
    }

    /**
     * UI: openModal()
     * Menyiapkan form penagihan dengan data snapshot dari kartu yang diklik.
     */
    function openModal(nomen, nama, total, periode, vol, rayon) {
        document.getElementById('modal-idpel').value = nomen;
        document.getElementById('modal-nama').innerText = nama;
        document.getElementById('modal-nominal-val').value = total;
        document.getElementById('modal-sub-info').innerText = `🆔 ${nomen} | 🧾 TAGIHAN: Rp ${formatIDR(total)}`;
        document.getElementById('modal-rayon-hidden').value = rayon || '-';
        document.getElementById('formKunjungan').reset();
        modalKunjungan.show();
    }

    /**
     * UI: toggleJanjiInput()
     * Menampilkan input tanggal hanya jika hasil kunjungan adalah 'Janji Bayar'.
     */
    function toggleJanjiInput() {
        const isJanji = document.getElementById('modal-hasil').value === 'Janji Bayar';
        document.getElementById('group-janji').classList.toggle('d-none', !isJanji);
    }

    /**
     * SUMMARY: updateSummary()
     * Mengkalkulasi total uang yang "menggantung" di daftar yang tampil.
     */
    function updateSummary(data) {
        const total = data.reduce((acc, curr) => acc + (curr.nominal_mc + curr.nominal_ardebt), 0);
        document.getElementById('summary-area').innerHTML = `
            <div class="bg-danger shadow-sm rounded-4 p-3 d-flex justify-content-between align-items-center mx-1 text-white animate__animated animate__fadeIn">
                <div>
                    <div class="opacity-75 mb-0" style="font-size: 0.65rem;">TOTAL TARGET ARDEBT</div>
                    <div class="fw-bold h5 mb-0">${data.length} <small style="font-size: 0.6rem;">NASABAH</small></div>
                </div>
                <div class="text-end">
                    <div class="opacity-75 mb-0" style="font-size: 0.65rem;">NOMINAL PIUTANG</div>
                    <div class="fw-bold h5 mb-0">Rp ${formatIDR(total)}</div>
                </div>
            </div>
        `;
    }
</script>

<style>
    /* Styling khusus sinergi dashboard */
    .bg-danger-subtle { background-color: #fff5f5 !important; }
    .customer-card { border: 1px solid #fecaca !important; transition: transform 0.2s; }
    .customer-card:active { transform: scale(0.98); }
    /* Menyesuaikan scroll pada modal besar agar nyaman di HP */
    .modal-dialog-scrollable .modal-body { max-height: 65vh; }
</style>
{% endblock %}
