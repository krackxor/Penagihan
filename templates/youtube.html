{% extends "base.html" %}

{% block content %}
<div class="container py-4 animate__animated animate__fadeIn">
    
    <div class="mb-4">
        <h4 class="fw-bold text-dark mb-1">
            <i class="fab fa-youtube me-2 text-danger"></i>Media Edukasi & Informasi
        </h4>
        <p class="text-muted small">Kumpulan Informasi Resmi Pelayanan Air Minum Jakarta</p>
    </div>

    <div class="card border-0 shadow-sm rounded-5 overflow-hidden mb-4 text-white" style="background: linear-gradient(135deg, #cc0000 0%, #8b0000 100%);">
        <div class="card-body p-4">
            <div class="d-flex align-items-center flex-wrap gap-4">
                <div class="bg-white p-1 rounded-circle shadow-sm">
                    <img src="https://ui-avatars.com/api/?name=PAM+JAYA&background=fff&color=cc0000&bold=true" class="rounded-circle" style="width: 80px; height: 80px;">
                </div>
                <div class="flex-grow-1">
                    <h5 class="fw-bold mb-0">PAM JAYA DKI JAKARTA</h5>
                    <p class="small mb-3 opacity-75">Media Sosialisasi & Layanan Masyarakat</p>
                    <a href="https://www.youtube.com/@pamjaya_dki" target="_blank" class="btn btn-light btn-sm rounded-pill px-4 fw-bold text-danger shadow-sm">
                        <i class="fab fa-youtube me-2"></i>KUNJUNGI CHANNEL
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-7 col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 h-100 bg-white p-3">
                <h6 class="fw-bold mb-3 small text-uppercase" style="letter-spacing: 1px;"><i class="fas fa-play-circle me-2 text-danger"></i>Pemutar Video</h6>
                
                <div class="ratio ratio-16x9 rounded-4 overflow-hidden shadow-sm border bg-dark">
                    <iframe 
                        id="mainVideoPlayer"
                        src="https://www.youtube.com/embed/4WYqJ-mLx_I" 
                        title="YouTube Video Player" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen>
                    </iframe>
                </div>
                
                <div id="videoTitleDisplay" class="mt-3 px-2 fw-bold text-dark">
                    Memuat video utama...
                </div>
            </div>
        </div>

        <div class="col-md-5 col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 bg-white p-3 h-100">
                <h6 class="fw-bold mb-3 px-2 text-dark"><i class="fas fa-list me-2 text-primary"></i>Pilih Video</h6>
                
                <div class="overflow-auto" style="max-height: 450px;" id="playlistContainer">
                    </div>
            </div>
        </div>
    </div>
</div>

<style>
    .playlist-item { transition: all 0.2s ease; cursor: pointer; border: 1px solid transparent; }
    .playlist-item:hover { background-color: #f8fafc; border-color: #e2e8f0; }
    .playlist-item.active { background-color: #eff6ff; border-color: #3b82f6; }
    .thumb-preview { width: 100px; height: 60px; object-fit: cover; border-radius: 8px; }
</style>

<script>
    /**
     * [LOGIKA DINAMIS: YouTube Manager]
     * Mengelola daftar video dan aksi ganti video tanpa refresh halaman.
     */
    const videoList = [
        { id: '4WYqJ-mLx_I', title: 'Sosialisasi Pelayanan PAM JAYA' },
        { id: 'h2cgMDJ5iik', title: 'Informasi Infrastruktur Air Jakarta' },
        { id: 'PF9gjunpq2c', title: 'Edukasi Pembayaran & Layanan' },
        { id: 'AFs6jScrxgA', title: 'Update Proyek SPAM Jakarta' }
    ];

    /**
     * [FUNGSI: changeVideo]
     * Mengganti URL iframe dan mengupdate status visual playlist.
     */
    function changeVideo(videoId, title) {
        const player = document.getElementById('mainVideoPlayer');
        const titleDisplay = document.getElementById('videoTitleDisplay');
        
        // Update Player & Judul
        player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
        titleDisplay.innerText = title;

        // Update UI Active State
        document.querySelectorAll('.playlist-item').forEach(item => {
            item.classList.remove('active');
            if(item.getAttribute('onclick').includes(videoId)) item.classList.add('active');
        });

        // Scroll ke atas (Mobile)
        if(window.innerWidth < 768) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    /**
     * [FUNGSI: initPlaylist]
     * Membangun daftar playlist berdasarkan array videoList.
     */
    function initPlaylist() {
        const container = document.getElementById('playlistContainer');
        container.innerHTML = videoList.map((vid, index) => `
            <div class="playlist-item p-2 rounded-3 mb-2 d-flex gap-3 ${index === 0 ? 'active' : ''}" 
                 onclick="changeVideo('${vid.id}', '${vid.title}')">
                <img src="https://img.youtube.com/vi/${vid.id}/mqdefault.jpg" class="thumb-preview shadow-sm">
                <div class="flex-grow-1">
                    <div class="small fw-bold text-dark line-clamp-2">${vid.title}</div>
                    <small class="text-muted" style="font-size: 0.65rem;">Official Media</small>
                </div>
            </div>
        `).join('');

        // Set judul pertama
        document.getElementById('videoTitleDisplay').innerText = videoList[0].title;
    }

    // Jalankan inisialisasi saat DOM siap
    document.addEventListener('DOMContentLoaded', initPlaylist);
</script>
{% endblock %}
