{% extends "base.html" %}

{% block content %}
<style>
    :root {
        --primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    }
    
    .playlist-item {
        transition: all 0.2s ease;
        cursor: pointer;
        border: 1px solid transparent;
    }
    .playlist-item:hover {
        background-color: #f8fafc;
        transform: translateX(5px);
        border-color: #e2e8f0;
    }
    .playlist-item.active {
        background-color: #eff6ff !important;
        border-left: 4px solid #2563eb !important;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
    }
    .playlist-item.active .text-title { color: #2563eb !important; }
    
    .thumb-wrapper {
        position: relative;
        width: 100px;
        height: 60px;
        overflow: hidden;
        border-radius: 8px;
    }
    .thumb-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    
    .play-overlay {
        position: absolute; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.3);
        display: flex; align-items: center; justify-content: center;
        opacity: 0; transition: 0.2s;
    }
    .playlist-item:hover .play-overlay { opacity: 1; }
    
    .fw-800 { font-weight: 800; }
</style>

<div class="container py-4 animate__animated animate__fadeIn">
    
    <div class="mb-4 text-center text-md-start">
        <h4 class="fw-bold text-dark mb-1">
            <i class="fa-solid fa-photo-video me-2 text-primary"></i>Media Center
        </h4>
        <p class="text-muted small fw-semibold">Portal Informasi Visual & Edukasi Operasional</p>
    </div>

    <div class="card border-0 shadow-lg rounded-4 overflow-hidden mb-4 text-white animate__animated animate__zoomIn" 
         style="background: var(--primary-gradient);">
        <div class="card-body p-4">
            <div class="d-flex align-items-center flex-wrap gap-4">
                <div class="bg-white p-1 rounded-circle shadow-lg animate__animated animate__pulse animate__infinite">
                    <img src="https://ui-avatars.com/api/?name=PAM+JAYA&background=fff&color=2563eb&bold=true&size=128" 
                         class="rounded-circle" style="width: 64px; height: 64px;">
                </div>
                <div class="flex-grow-1">
                    <h5 class="fw-800 mb-1">PAM JAYA DKI JAKARTA</h5>
                    <p class="small mb-3 opacity-75 fw-semibold">Saluran Publikasi & Edukasi Stakeholder Terpadu</p>
                    <a href="https://www.youtube.com/@pamjaya_dki" target="_blank" 
                       class="btn btn-light btn-sm rounded-pill px-4 fw-bold text-primary shadow-sm">
                        <i class="fa-brands fa-youtube me-2"></i>SUBSCRIBE CHANNEL
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 h-100 bg-white p-1 border">
                <div class="card-body p-2">
                    <div class="d-flex justify-content-between align-items-center mb-3 px-2 pt-1">
                        <h6 class="fw-800 mb-0 small text-uppercase text-danger">
                            <i class="fa-solid fa-circle fa-fade me-2 small"></i>NOW PLAYING
                        </h6>
                    </div>
                    
                    <div class="ratio ratio-16x9 rounded-4 overflow-hidden shadow-sm bg-dark mb-3">
                        <iframe id="mainVideoPlayer" src="https://www.youtube.com/embed/4WYqJ-mLx_I?rel=0" 
                                title="YouTube video player" frameborder="0" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                allowfullscreen></iframe>
                    </div>
                    
                    <div class="px-2 pb-2">
                        <h5 class="fw-bold text-dark mb-1" id="videoTitleDisplay">Inisialisasi Video...</h5>
                        <small class="text-muted fw-semibold">Sumber: Dokumentasi Resmi Area Service</small>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 bg-white h-100 border">
                <div class="card-header bg-white border-0 pt-3 pb-2 px-3">
                    <h6 class="fw-800 mb-0 text-dark small text-uppercase">
                        <i class="fa-solid fa-list-ul me-2 text-primary"></i>Daftar Putar
                    </h6>
                </div>
                
                <div class="card-body p-2 overflow-auto custom-scrollbar" style="max-height: 500px;" id="playlistContainer">
                    </div>
            </div>
        </div>
    </div>
</div>

<script>
    const videoList = [
        { id: '4WYqJ-mLx_I', title: 'Optimalisasi Pelayanan Pelanggan Area Service' },
        { id: 'h2cgMDJ5iik', title: 'Pengembangan Infrastruktur Jaringan Air Jakarta' },
        { id: 'PF9gjunpq2c', title: 'Transformasi Digital Layanan & Penagihan' },
        { id: 'AFs6jScrxgA', title: 'Update Proyek Strategis SPAM Jakarta' }
    ];

    function changeVideo(videoId, title) {
        const player = document.getElementById('mainVideoPlayer');
        const titleDisplay = document.getElementById('videoTitleDisplay');
        
        player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
        titleDisplay.innerText = title;

        document.querySelectorAll('.playlist-item').forEach(item => {
            item.classList.remove('active');
            if(item.getAttribute('data-id') === videoId) item.classList.add('active');
        });

        if(window.innerWidth < 992) {
            player.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    function initPlaylist() {
        const container = document.getElementById('playlistContainer');
        
        // Set Initial Title
        if(videoList.length > 0) {
            document.getElementById('videoTitleDisplay').innerText = videoList[0].title;
        }

        container.innerHTML = videoList.map((vid, index) => `
            <div class="playlist-item p-2 rounded-3 mb-2 d-flex align-items-center gap-3 animate__animated animate__fadeInRight ${index === 0 ? 'active' : ''}" 
                 style="animation-delay: ${index * 0.1}s"
                 onclick="changeVideo('${vid.id}', '${vid.title}')"
                 data-id="${vid.id}">
                
                <div class="thumb-wrapper shadow-sm">
                    <img src="https://img.youtube.com/vi/${vid.id}/mqdefault.jpg" alt="thumbnail">
                    <div class="play-overlay">
                        <i class="fa-solid fa-play text-white"></i>
                    </div>
                </div>
                
                <div class="flex-grow-1 overflow-hidden">
                    <div class="small fw-bold text-dark text-truncate text-title mb-1" style="font-size: 0.75rem;">${vid.title}</div>
                    <span class="badge bg-light text-muted border rounded-pill" style="font-size: 0.55rem;">
                        <i class="fa-solid fa-check-circle me-1"></i>Official
                    </span>
                </div>
            </div>
        `).join('');
    }

    document.addEventListener('DOMContentLoaded', initPlaylist);
</script>
{% endblock %}
