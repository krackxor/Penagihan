{% extends "base.html" %}
{% block content %}
<div class="px-2 pb-5">
    <div class="pt-4 mb-4 text-center">
        <h4 class="fw-bold mb-0">Dashboard Sunter Pro 📊</h4>
        <p class="text-muted small" id="current-date"></p>
    </div>

    <div class="row g-2 mb-4">
        <div class="col-6">
            <div class="card p-3 border-0 shadow-sm bg-dark text-white rounded-4 text-center">
                <small class="opacity-75">NOMEN MC (INDUK)</small>
                <h4 class="fw-bold mb-0" id="g-nomen-mc">0</h4>
            </div>
        </div>
        <div class="col-6">
            <div class="card p-3 border-0 shadow-sm bg-dark text-white rounded-4 text-center">
                <small class="opacity-75">NOMINAL MC</small>
                <h6 class="fw-bold mb-0" id="g-nom-mc">Rp 0</h6>
            </div>
        </div>
    </div>

    <div class="card p-4 border-0 shadow-sm bg-primary text-white mb-4 rounded-4">
        <div class="d-flex justify-content-between">
            <div>
                <small class="opacity-75">Sisa Target Penagihan</small>
                <h1 class="fw-bold mb-0" id="stat-sisa">0</h1>
            </div>
            <i class="fas fa-wallet fa-2x opacity-25"></i>
        </div>
        <div class="progress my-3" style="height: 10px; background: rgba(255,255,255,0.2); border-radius: 10px;">
            <div id="prog-bar" class="progress-bar bg-white" style="width: 0%"></div>
        </div>
        <small id="stat-realisasi" class="opacity-75">0 Lunas dari 0 MC</small>
    </div>

    <h6 class="fw-bold mb-3 px-1">Leaderboard Petugas</h6>
    <div class="card border-0 shadow-sm mb-4 rounded-4 overflow-hidden">
        <table class="table mb-0" style="font-size: 0.85rem;">
            <thead class="bg-light">
                <tr><th class="ps-3">Petugas</th><th class="text-center">Minggu</th><th class="text-center">Bulan</th></tr>
            </thead>
            <tbody id="list-officers"></tbody>
        </table>
    </div>

    <h6 class="fw-bold mb-3 px-1">Riwayat Harian Detail</h6>
    <div id="list-history"></div>
</div>

<script>
    const toIDR = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);

    async function loadStats() {
        const res = await fetch('/api/performance/full-stats');
        const data = await res.json();
        const g = data.global;

        document.getElementById('g-nomen-mc').innerText = g.total_nomen_mc.toLocaleString();
        document.getElementById('g-nom-mc').innerText = toIDR(g.total_nominal_mc);
        document.getElementById('stat-sisa').innerText = g.sisa_target.toLocaleString();
        document.getElementById('stat-realisasi').innerText = `${g.total_lunas_mc} Lunas dari ${g.total_nomen_mc} MC`;
        
        const percent = g.total_nomen_mc > 0 ? (g.total_lunas_mc / g.total_nomen_mc * 100) : 0;
        document.getElementById('prog-bar').style.width = percent + '%';

        // Render Leaderboard & History
        document.getElementById('list-officers').innerHTML = data.officers.map(o => `
            <tr><td class="ps-3 py-3 fw-bold">${o.petugas}</td><td class="text-center">${o.mingguan}</td><td class="text-center"><span class="badge bg-primary">${o.bulanan}</span></td></tr>
        `).join('');

        document.getElementById('list-history').innerHTML = data.history.map(h => `
            <div class="card p-3 shadow-sm mb-2 rounded-4 border-0">
                <div class="d-flex justify-content-between border-bottom pb-2 mb-2">
                    <span class="fw-bold text-primary">${h.petugas}</span>
                    <small class="text-muted">${h.tanggal}</small>
                </div>
                <div class="row text-center g-1">
                    <div class="col-4 small bg-light p-1"><b>${h.jml_bayar}</b> Lunas<br>${toIDR(h.nom_bayar)}</div>
                    <div class="col-4 small bg-light p-1"><b>${h.jml_janji}</b> Janji<br>${toIDR(h.nom_janji)}</div>
                    <div class="col-4 small bg-light p-1"><b>${h.jml_rks}</b> RKS</div>
                </div>
            </div>
        `).join('');
    }
    document.addEventListener('DOMContentLoaded', loadStats);
</script>
{% endblock %}
