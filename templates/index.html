{% extends "base.html" %}
{% block content %}
<div class="animate__animated animate__fadeIn px-2 pb-5">
    <div class="pt-4 mb-4 text-center">
        <h4 class="fw-bold mb-0">Sunter Pro Dashboard 📊</h4>
        <p class="text-muted small" id="current-date"></p>
    </div>

    <div class="row g-2 mb-4">
        <div class="col-4">
            <div class="card p-2 border-0 shadow-sm text-center rounded-4 bg-primary text-white">
                <small class="opacity-75" style="font-size: 0.65rem;">HARI INI</small>
                <h4 class="fw-bold mb-0" id="g-hari">0</h4>
            </div>
        </div>
        <div class="col-4">
            <div class="card p-2 border-0 shadow-sm text-center rounded-4 border-primary border-1">
                <small class="text-muted" style="font-size: 0.65rem;">MINGGU INI</small>
                <h4 class="fw-bold mb-0 text-primary" id="g-minggu">0</h4>
            </div>
        </div>
        <div class="col-4">
            <div class="card p-2 border-0 shadow-sm text-center rounded-4 border-primary border-1">
                <small class="text-muted" style="font-size: 0.65rem;">BULAN INI</small>
                <h4 class="fw-bold mb-0 text-primary" id="g-bulan">0</h4>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-2 px-1">
        <h6 class="fw-bold mb-0"><i class="fas fa-trophy text-warning me-1"></i> Leaderboard Petugas</h6>
        <span class="small text-muted">Bulan Ini</span>
    </div>
    <div class="card border-0 shadow-sm mb-4 rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover mb-0" style="font-size: 0.8rem;">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-3 border-0">Nama</th>
                        <th class="text-center border-0">Minggu</th>
                        <th class="text-center border-0">Bulan</th>
                    </tr>
                </thead>
                <tbody id="list-officers">
                    </tbody>
            </table>
        </div>
    </div>

    <h6 class="fw-bold mb-3 px-1"><i class="fas fa-history text-primary me-1"></i> History Harian Detail</h6>
    <div id="list-history">
        </div>
</div>

<style>
    .card-h { border-radius: 18px; border: none; margin-bottom: 12px; }
    .stat-box { font-size: 0.65rem; padding: 6px; border-radius: 10px; }
    .val-cur { font-size: 0.6rem; display: block; opacity: 0.8; }
</style>

<script>
    const toIDR = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);

    async function refreshData() {
        try {
            const res = await fetch('/api/performance/full-stats');
            const data = await res.json();

            // Render Global
            document.getElementById('g-hari').innerText = data.global.tot_hari || 0;
            document.getElementById('g-minggu').innerText = data.global.tot_minggu || 0;
            document.getElementById('g-bulan').innerText = data.global.tot_bulan || 0;

            // Render Leaderboard
            document.getElementById('list-officers').innerHTML = data.officers.map((o, idx) => `
                <tr>
                    <td class="ps-3 py-3">
                        <span class="fw-bold">${idx + 1}. ${o.petugas}</span>
                    </td>
                    <td class="text-center py-3"><span class="badge bg-light text-dark rounded-pill">${o.mingguan}</span></td>
                    <td class="text-center py-3"><span class="badge bg-primary rounded-pill">${o.bulanan}</span></td>
                </tr>
            `).join('');

            // Render History Detail
            document.getElementById('list-history').innerHTML = data.history.map(h => `
                <div class="card card-h shadow-sm p-3 border-start border-primary border-4">
                    <div class="d-flex justify-content-between align-items-start mb-2 pb-2 border-bottom">
                        <div>
                            <h6 class="fw-bold mb-0 text-dark">${h.petugas}</h6>
                            <small class="text-muted"><i class="far fa-calendar-alt"></i> ${h.tanggal}</small>
                        </div>
                        <span class="badge bg-soft-primary text-primary border border-primary px-3">Total: ${h.total}</span>
                    </div>
                    <div class="row g-1 text-center">
                        <div class="col-4">
                            <div class="stat-box" style="background: #dcfce7; color: #166534;">
                                <b>${h.jml_bayar} BAYAR</b>
                                <span class="val-cur">${toIDR(h.nom_bayar)}</span>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="stat-box" style="background: #fef9c3; color: #854d0e;">
                                <b>${h.jml_janji} JANJI</b>
                                <span class="val-cur">${toIDR(h.nom_janji)}</span>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="stat-box" style="background: #fee2e2; color: #991b1b;">
                                <b>${h.jml_rks} RKS</b>
                                <span class="val-cur">Lain: ${h.jml_lain || 0}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

        } catch (e) { console.error("Refresh Error:", e); }
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        refreshData();
    });
</script>
{% endblock %}
