{% extends "base.html" %}

{% block content %}
<div class="px-2 pb-5 animate__animated animate__fadeIn">
    <div class="pt-4 mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h4 class="fw-bold mb-0 text-dark">Sunter Dashboard ⚡</h4>
                <p class="text-muted small mb-0" id="display-date"></p>
            </div>
            <div class="d-flex gap-2">
                <input type="month" id="filter-periode" 
                       class="form-control form-control-sm border-0 shadow-sm rounded-pill px-3" 
                       style="width: 160px; font-size: 0.75rem;" 
                       onchange="refreshDashboard()">
                
                <button class="btn btn-white shadow-sm rounded-circle p-2" onclick="refreshDashboard()" id="btn-refresh">
                    <i class="fas fa-sync-alt text-primary"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="row g-2 mb-3">
        <div class="col-6">
            <div class="card p-3 border-0 bg-dark text-white rounded-4 shadow-sm h-100 overflow-hidden position-relative">
                <div class="position-absolute top-0 end-0 opacity-10 mt-n2 me-n2">
                    <i class="fas fa-users fa-3x"></i>
                </div>
                <small class="opacity-75 d-block mb-1" style="font-size: 0.65rem;">TOTAL NOMEN MC</small>
                <h4 class="fw-bold mb-0" id="g-nomen-mc">0</h4>
            </div>
        </div>
        <div class="col-6">
            <div class="card p-3 border-0 bg-white text-dark rounded-4 shadow-sm h-100 border-start border-primary border-4">
                <small class="text-muted d-block mb-1" style="font-size: 0.65rem;">TOTAL NOMINAL MC</small>
                <h6 class="fw-bold mb-0 text-primary" id="g-nom-mc">Rp 0</h6>
            </div>
        </div>
    </div>

    <div class="card p-4 border-0 shadow-sm text-white mb-4 rounded-4" style="background: linear-gradient(135deg, #0d6efd 0%, #003d99 100%);">
        <div class="d-flex justify-content-between align-items-start mb-2">
            <div>
                <small class="opacity-75">Sisa Target Penagihan</small>
                <h1 class="fw-bold mb-0" id="stat-sisa">0</h1>
                <small id="label-periode-analisa" style="font-size: 0.65rem; border-radius: 4px;" class="bg-white bg-opacity-25 px-2 py-1 d-inline-block mt-1"></small>
            </div>
            <div class="bg-white bg-opacity-25 p-3 rounded-4 shadow-sm">
                <i class="fas fa-bullseye fa-lg"></i>
            </div>
        </div>
        
        <div class="progress my-3" style="height: 12px; background: rgba(255,255,255,0.15); border-radius: 20px;">
            <div id="prog-bar" class="progress-bar bg-white progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%; border-radius: 20px;"></div>
        </div>
        
        <div class="d-flex justify-content-between align-items-center small">
            <span id="stat-realisasi" class="bg-white bg-opacity-20 px-2 py-1 rounded-pill" style="font-size: 0.7rem;">0 Lunas / 0 MC</span>
            <div class="text-end">
                <span class="opacity-75 d-block" style="font-size: 0.6rem;">PENCAPAIAN</span>
                <span id="stat-percent" class="fw-bold h5 mb-0">0%</span>
            </div>
        </div>

        <div class="d-flex gap-2 mt-3 pt-2 border-top border-white border-opacity-10">
            <div class="flex-fill">
                <small class="opacity-75 d-block" style="font-size: 0.55rem;">LUNAS UNDUE (UANG)</small>
                <span class="fw-bold" id="nom-undue" style="font-size: 0.85rem;">Rp 0</span>
            </div>
            <div class="flex-fill border-start border-white border-opacity-10 ps-2">
                <small class="opacity-75 d-block" style="font-size: 0.55rem;">LUNAS CURRENT (UANG)</small>
                <span class="fw-bold" id="nom-current" style="font-size: 0.85rem;">Rp 0</span>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3 px-1">
        <h6 class="fw-bold mb-0"><i class="fas fa-trophy text-warning me-2"></i>Top Performance</h6>
        <span class="badge bg-primary-subtle text-primary rounded-pill">Bulan Ini</span>
    </div>
    <div class="card border-0 shadow-sm mb-4 rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover mb-0" style="font-size: 0.85rem;">
                <thead class="bg-light text-muted">
                    <tr>
                        <th class="ps-4 border-0 py-3">PETUGAS</th>
                        <th class="text-center border-0 py-3">HARIAN</th>
                        <th class="text-center border-0 py-3">TOTAL</th>
                    </tr>
                </thead>
                <tbody id="list-officers" class="border-0"></tbody>
            </table>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3 px-1">
        <h6 class="fw-bold mb-0">Log Aktivitas Tim</h6>
        <div class="dropdown">
            <button class="btn btn-sm btn-light border rounded-pill px-3 shadow-none" type="button" style="font-size: 0.7rem;">
                Live Feed <i class="fas fa-circle text-danger ms-1 animate__animated animate__flash animate__infinite"></i>
            </button>
        </div>
    </div>
    
    <div id="list-history" class="mb-5"></div>
</div>

<script>
    const toIDR = (n) => {
        return new Intl.NumberFormat('id-ID', { 
            style: 'currency', 
            currency: 'IDR', 
            maximumFractionDigits: 0 
        }).format(n);
    };

    function initCalendar() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        document.getElementById('filter-periode').value = `${year}-${month}`;
    }

    async function refreshDashboard() {
        const btn = document.getElementById('btn-refresh');
        const rawPeriode = document.getElementById('filter-periode').value; 
        
        if (!rawPeriode) return;
        btn.classList.add('fa-spin');
        
        const parts = rawPeriode.split('-');
        const periode = `${parts[1]}-${parts[0]}`; 

        try {
            const response = await fetch(`/api/performance/full-stats?periode=${periode}`);
            const data = await response.json();
            
            if (data.status === "error") throw new Error(data.message);

            const global = data.global;

            const bulanNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            const targetBulanIdx = parseInt(parts[1]) - 2; 
            const targetTahun = targetBulanIdx < 0 ? parseInt(parts[0]) - 1 : parts[0];
            const targetBulanName = bulanNames[targetBulanIdx < 0 ? 11 : targetBulanIdx];
            
            document.getElementById('label-periode-analisa').innerText = `Target MC ${targetBulanName} ${targetTahun} vs Bayar Bulan Ini`;

            document.getElementById('g-nomen-mc').innerText = (global.total_nomen_mc || 0).toLocaleString();
            document.getElementById('g-nom-mc').innerText = toIDR(global.total_nominal_mc || 0);
            document.getElementById('stat-sisa').innerText = (global.sisa_target || 0).toLocaleString();
            document.getElementById('stat-realisasi').innerText = `${global.total_lunas_mc || 0} Lunas / ${global.total_nomen_mc || 0} MC`;
            
            // Nominal Rincian
            document.getElementById('nom-undue').innerText = toIDR(global.total_nom_undue || 0);
            document.getElementById('nom-current').innerText = toIDR(global.total_nom_current || 0);

            const percent = global.total_nomen_mc > 0 
                ? Math.round((global.total_lunas_mc / global.total_nomen_mc) * 100) 
                : 0;
            
            const progressBar = document.getElementById('prog-bar');
            progressBar.style.width = percent + '%';
            document.getElementById('stat-percent').innerText = percent + '%';

            const officerList = document.getElementById('list-officers');
            officerList.innerHTML = data.officers.length > 0 
                ? data.officers.map((o, index) => `
                    <tr class="align-middle">
                        <td class="ps-4 py-3">
                            <div class="d-flex align-items-center">
                                <div class="bg-primary-subtle text-primary rounded-circle d-flex align-items-center justify-content-center me-3 fw-bold shadow-sm" style="width: 32px; height: 32px; font-size: 0.75rem;">
                                    ${index + 1}
                                </div>
                                <span class="fw-bold text-dark">${o.petugas || 'Petugas'}</span>
                            </div>
                        </td>
                        <td class="text-center py-3 text-muted">${o.harian || 0}</td>
                        <td class="text-center py-3">
                            <span class="badge bg-primary rounded-3 px-3 py-2 fw-bold shadow-sm" style="min-width: 45px;">${o.bulanan || 0}</span>
                        </td>
                    </tr>
                `).join('')
                : '<tr><td colspan="3" class="text-center py-5 text-muted small">Belum ada aktivitas</td></tr>';

            const historyList = document.getElementById('list-history');
            historyList.innerHTML = data.history.length > 0
                ? data.history.map((h, index) => `
                    <div class="card p-3 shadow-sm mb-3 rounded-4 border-0 animate__animated animate__fadeInUp" style="animation-delay: ${index * 0.1}s">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="d-flex align-items-center">
                                <div class="bg-light rounded-circle p-2 me-2">
                                    <i class="fas fa-user-check text-primary"></i>
                                </div>
                                <div>
                                    <span class="fw-bold d-block text-dark" style="font-size: 0.9rem;">${h.petugas || 'Petugas'}</span>
                                    <small class="text-muted" style="font-size: 0.7rem;">${h.tanggal}</small>
                                </div>
                            </div>
                            <span class="badge bg-light text-dark border" style="font-size: 0.6rem;">${h.total} Kunjungan</span>
                        </div>
                        <div class="row g-2 text-center">
                            <div class="col-4">
                                <div class="p-2 bg-success-subtle rounded-3 border border-success">
                                    <small class="text-success fw-bold d-block" style="font-size: 0.55rem;">LUNAS (MASUK)</small>
                                    <div class="fw-bold text-success" style="font-size: 0.75rem;">${h.jml_bayar || 0} Pel</div>
                                    <div class="small text-success opacity-75">${toIDR(h.nom_masuk || 0)}</div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="p-2 bg-warning-subtle rounded-3 border border-warning">
                                    <small class="text-warning fw-bold d-block" style="font-size: 0.55rem;">JANJI (POTENSI)</small>
                                    <div class="fw-bold text-warning" style="font-size: 0.75rem;">${h.jml_janji || 0} Pel</div>
                                    <div class="small text-warning opacity-75">${toIDR(h.nom_potensi || 0)}</div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="p-2 bg-danger-subtle rounded-3 border border-danger">
                                    <small class="text-danger fw-bold d-block" style="font-size: 0.55rem;">RKS/LL (HILANG)</small>
                                    <div class="fw-bold text-danger" style="font-size: 0.75rem;">${h.jml_rks || 0} Pel</div>
                                    <div class="small text-danger opacity-75">${toIDR(h.nom_hilang || 0)}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('')
                : '<div class="text-center py-5 text-muted small">Tidak ada riwayat untuk periode ini</div>';

        } catch (error) {
            console.error("Dashboard Error:", error);
        } finally {
            setTimeout(() => btn.classList.remove('fa-spin'), 1000);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('display-date').innerText = new Date().toLocaleDateString('id-ID', options);
        initCalendar();
        refreshDashboard();
    });
</script>

<style>
    .bg-primary-subtle { background-color: #e7f1ff; }
    .bg-success-subtle { background-color: #e1f7ec; }
    .bg-warning-subtle { background-color: #fff8e6; }
    .bg-danger-subtle { background-color: #ffeef0; }
    .text-success { color: #198754 !important; }
    .text-warning { color: #ffc107 !important; }
    .text-danger { color: #dc3545 !important; }
    input[type="month"]::-webkit-calendar-picker-indicator {
        cursor: pointer;
        filter: invert(33%) sepia(87%) saturate(1637%) hue-rotate(202deg) brightness(91%) contrast(101%);
    }
</style>
{% endblock %}
