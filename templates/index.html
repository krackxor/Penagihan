{% extends "base.html" %}
{% block content %}
<div class="animate__animated animate__fadeIn">
    <div class="px-2 mb-4">
        <h4 class="fw-bold mb-1">Halo, Petugas 👋</h4>
        <p class="text-muted small">Cek progres penagihanmu hari ini</p>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-6">
            <div class="card p-3" style="background: #e0e7ff;">
                <div class="d-flex align-items-center mb-2">
                    <div class="rounded-circle bg-white p-2 me-2" style="width:35px; height:35px; display:flex; align-items:center; justify-content:center;">
                        <i class="fas fa-bullseye text-primary small"></i>
                    </div>
                    <span class="small fw-bold text-primary">Sisa Target</span>
                </div>
                <h3 class="fw-bold mb-0" id="stat-kunjungan">0</h3>
            </div>
        </div>
        <div class="col-6">
            <div class="card p-3" style="background: #dcfce7;">
                <div class="d-flex align-items-center mb-2">
                    <div class="rounded-circle bg-white p-2 me-2" style="width:35px; height:35px; display:flex; align-items:center; justify-content:center;">
                        <i class="fas fa-check-circle text-success small"></i>
                    </div>
                    <span class="small fw-bold text-success">Closed</span>
                </div>
                <h3 class="fw-bold mb-0" id="stat-bayar">0</h3>
            </div>
        </div>
    </div>

    <h6 class="fw-bold px-2 mb-3">Aksi Cepat</h6>
    <div class="px-1">
        <a href="/belum-bayar" class="text-decoration-none">
            <div class="card p-3 mb-3 border-0 shadow-sm">
                <div class="d-flex align-items-center">
                    <div class="bg-primary text-white rounded-4 p-3 me-3">
                        <i class="fas fa-route fa-lg"></i>
                    </div>
                    <div>
                        <h6 class="fw-bold mb-0 text-dark">Rute Penagihan</h6>
                        <p class="small text-muted mb-0">Lihat pelanggan belum bayar</p>
                    </div>
                    <i class="fas fa-chevron-right ms-auto text-muted"></i>
                </div>
            </div>
        </a>
    </div>
</div>

<script>
    async function loadStats() {
        try {
            const res = await fetch('/api/performance/stats-global');
            const data = await res.json();
            document.getElementById('stat-kunjungan').innerText = data.total_pelanggan || 0;
            document.getElementById('stat-bayar').innerText = data.bayar_bulan_ini || 0;
        } catch (e) { console.error("Stats Error"); }
    }
    document.addEventListener('DOMContentLoaded', loadStats);
</script>
{% endblock %}
