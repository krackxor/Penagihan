{% extends "base.html" %}

{% block content %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<div class="animate__animated animate__fadeIn">
    <div class="px-3 pt-4 mb-4 d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
            <h4 class="fw-bold mb-1 text-dark">
                <i class="fa-solid fa-fire-flame-curved me-2 text-danger"></i>Pelanggan Ekstrem (Anomali)
            </h4>
            <p class="text-muted small mb-0 fw-semibold">
                Investigasi lonjakan >100% atau pemakaian >500m³. Wajib dianalisa!
            </p>
        </div>
        <div class="d-flex align-items-center gap-2">
            <input type="month" id="filter-periode" class="form-control form-control-sm border-0 shadow-sm fw-bold text-danger" 
                   style="width: 150px; cursor: pointer;" onchange="loadEkstrem()">
            <button class="btn btn-sm btn-success border shadow-sm rounded-circle p-2" onclick="downloadExcel()">
                <i class="fa-solid fa-file-excel"></i>
            </button>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mx-3 mb-5 bg-white border-top border-5 border-danger">
        <div class="card-body p-0">
            <div class="table-responsive" style="max-height: 70vh;">
                <table class="table table-hover align-middle mb-0" style="font-size: 0.8rem;">
                    <thead class="bg-danger text-white sticky-top">
                        <tr class="text-uppercase fw-800">
                            <th class="ps-4 py-3">Pelanggan</th>
                            <th class="text-center">Avg Normal</th>
                            <th class="text-center">Kubik Skrg</th>
                            <th class="text-center">Lonjakan</th>
                            <th>Analisa Penyebab</th>
                            <th class="text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-ekstrem">
                        <tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-danger"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalInvestigasi" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header border-0 bg-danger text-white">
                <h6 class="modal-title fw-800"><i class="fa-solid fa-magnifying-glass me-2"></i>Form Investigasi Ekstrem</h6>
                <button type="button" class="btn-close btn-close-white shadow-none" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <input type="hidden" id="modal-nomen">
                
                <div class="alert alert-light border border-danger border-opacity-25 d-flex align-items-center mb-3">
                    <i class="fa-solid fa-triangle-exclamation text-danger fs-4 me-3"></i>
                    <div>
                        <h6 class="fw-bold mb-0 text-dark" id="modal-nama">-</h6>
                        <small class="text-muted" id="modal-info">-</small>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">Dugaan Penyebab (Wajib)</label>
                    <select id="modal-penyebab" class="form-select shadow-none fw-bold">
                        <option value="" selected disabled>-- Pilih Penyebab --</option>
                        <option value="BOCOR_PERSIL">💧 Bocor Instalasi Dalam (Persil)</option>
                        <option value="PEMAKAIAN_AKTIF">🎉 Pemakaian Aktif (Pesta/Proyek)</option>
                        <option value="METER_RUSAK">⚙️ Meter Air Rusak/Loncat</option>
                        <option value="SALAH_BACA">👁️ Kesalahan Baca/Input Stan</option>
                        <option value="LAINNYA">❓ Lainnya</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">Tindak Lanjut / Keterangan</label>
                    <textarea id="modal-tindakan" class="form-control shadow-none" rows="3" placeholder="Contoh: Sudah dicek petugas Budi, ada kran bocor di taman..."></textarea>
                </div>

                <button onclick="saveInvestigasi()" class="btn btn-danger w-100 rounded-pill fw-bold py-2 shadow-sm">
                    SIMPAN HASIL INVESTIGASI
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let allData = [];
    const formatIDR = (n) => new Intl.NumberFormat('id-ID').format(n);
    let modalInvestigasi;

    document.addEventListener('DOMContentLoaded', () => {
        const el = document.getElementById('modalInvestigasi');
        if(typeof bootstrap !== 'undefined' && el) modalInvestigasi = new bootstrap.Modal(el);
        loadEkstrem();
    });

    async function loadEkstrem() {
        const picker = document.getElementById('filter-periode').value;
        let url = '/api/ekstrem/list';
        if (picker) url += `?periode=${picker}`;

        try {
            const res = await fetch(url);
            const result = await res.json();
            if(result.status === 'success') {
                allData = result.data;
                renderTable(allData);
            }
        } catch(e) { console.error(e); }
    }

    function renderTable(data) {
        const tbody = document.getElementById('tbody-ekstrem');
        if(data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-5 text-muted fw-bold">Aman! Tidak ada lonjakan ekstrem.</td></tr>`;
            return;
        }

        tbody.innerHTML = data.map((item, index) => {
            // Label Penyebab Visual
            let badgePenyebab = '<span class="badge bg-secondary bg-opacity-10 text-muted">Belum Dianalisa</span>';
            if(item.penyebab !== '-') {
                let color = 'secondary';
                if(item.penyebab === 'BOCOR_PERSIL') color = 'warning';
                if(item.penyebab === 'METER_RUSAK') color = 'danger';
                if(item.penyebab === 'PEMAKAIAN_AKTIF') color = 'success';
                badgePenyebab = `<span class="badge bg-${color}">${item.penyebab.replace('_', ' ')}</span>`;
            }

            return `
                <tr>
                    <td class="ps-4">
                        <div class="fw-800 text-dark">${item.nama}</div>
                        <div class="small text-muted font-monospace">${item.nomen}</div>
                        <div class="small text-truncate" style="max-width:200px">${item.alamat}</div>
                    </td>
                    <td class="text-center align-middle text-muted fw-bold">${item.avg_hist} m³</td>
                    <td class="text-center align-middle">
                        <div class="fs-5 fw-800 text-dark">${item.kubik}</div>
                    </td>
                    <td class="text-center align-middle">
                        <span class="badge bg-danger blink-me">
                            <i class="fa-solid fa-arrow-trend-up me-1"></i>+${item.persen_naik}%
                        </span>
                    </td>
                    <td class="align-middle">
                        ${badgePenyebab}
                        <div class="small text-muted fst-italic mt-1 text-truncate" style="max-width: 200px;">
                            ${item.tindakan !== '-' ? item.tindakan : ''}
                        </div>
                    </td>
                    <td class="text-center align-middle">
                        <button class="btn btn-sm btn-outline-danger rounded-circle p-2 shadow-sm"
                                onclick="openInvestigasi('${item.nomen}', '${item.nama.replace(/'/g, "\\'")}', ${item.kubik}, ${item.persen_naik}, '${item.penyebab}', '${item.tindakan.replace(/'/g, "\\'")}')">
                            <i class="fa-solid fa-file-pen"></i>
                        </button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function openInvestigasi(nomen, nama, kubik, persen, penyebab, tindakan) {
        document.getElementById('modal-nomen').value = nomen;
        document.getElementById('modal-nama').innerText = nama;
        document.getElementById('modal-info').innerText = `Kubik: ${kubik} m³ (Naik ${persen}%)`;
        
        document.getElementById('modal-penyebab').value = penyebab !== '-' ? penyebab : "";
        document.getElementById('modal-tindakan').value = tindakan !== '-' ? tindakan : "";
        
        modalInvestigasi.show();
    }

    async function saveInvestigasi() {
        const nomen = document.getElementById('modal-nomen').value;
        const penyebab = document.getElementById('modal-penyebab').value;
        const tindakan = document.getElementById('modal-tindakan').value;

        if(!penyebab) { Swal.fire('Error', 'Pilih penyebab lonjakan!', 'warning'); return; }

        const fd = new FormData();
        fd.append('nomen', nomen);
        fd.append('penyebab', penyebab);
        fd.append('tindakan', tindakan);

        try {
            await fetch('/api/ekstrem/update', {method:'POST', body:fd});
            modalInvestigasi.hide();
            Swal.fire({icon:'success', title:'Tersimpan', timer:1000, showConfirmButton:false});
            loadEkstrem();
        } catch(e) { Swal.fire('Error', 'Gagal simpan', 'error'); }
    }

    function downloadExcel() {
        if(allData.length === 0) return;
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.json_to_sheet(allData.map((d,i)=>({
            "No": i+1, "Nomen": d.nomen, "Nama": d.nama, "Rata-rata": d.avg_hist,
            "Kubik Skrg": d.kubik, "Kenaikan (%)": d.persen_naik, 
            "Analisa Penyebab": d.penyebab, "Keterangan": d.tindakan
        })));
        XLSX.utils.book_append_sheet(wb, ws, "Pelanggan Ekstrem");
        XLSX.writeFile(wb, "Analisa_Ekstrem.xlsx");
    }
</script>

<style>
    .blink-me { animation: blinker 1.5s linear infinite; }
    @keyframes blinker { 50% { opacity: 0.5; } }
</style>
{% endblock %}
