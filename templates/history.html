{% extends "base.html" %}

{% block content %}
<div class="px-2 pb-5">
    <div class="pt-4 mb-4 text-center">
        <h4 class="fw-bold mb-0">Log & Riwayat 📜</h4>
        <p class="text-muted small">Data Aktivitas Sunter Pro</p>
    </div>

    <ul class="nav nav-pills nav-fill bg-light p-1 rounded-4 mb-4" id="historyTab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active rounded-4 fw-bold small" id="kunjungan-tab" data-bs-toggle="tab" data-bs-target="#kunjungan-pane" type="button">KUNJUNGAN</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link rounded-4 fw-bold small" id="upload-tab" data-bs-toggle="tab" data-bs-target="#upload-pane" type="button">UPLOAD FILE</button>
        </li>
    </ul>

    <div class="tab-content" id="historyTabContent">
        
        <div class="tab-pane fade show active" id="kunjungan-pane" role="tabpanel">
            <div id="list-kunjungan">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary spinner-border-sm"></div>
                    <p class="text-muted small mt-2">Memuat laporan lapangan...</p>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="upload-pane" role="tabpanel">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <table class="table mb-0" style="font-size: 0.85rem;">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-3">File / Periode</th>
                            <th class="text-center">Status</th>
                            <th class="text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="list-upload">
                        </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<div class="modal fade" id="modalFoto" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-transparent border-0">
            <div class="modal-body p-0 text-center">
                <img src="" id="img-preview" class="img-fluid rounded-4 shadow-lg">
                <button type="button" class="btn btn-light rounded-circle mt-3" data-bs-dismiss="modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    const toIDR = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);

    // 1. Ambil Riwayat Kunjungan
    async function loadKunjungan() {
        const container = document.getElementById('list-kunjungan');
        try {
            const res = await fetch('/api/history/kunjungan');
            const data = await res.json();

            if (data.length === 0) {
                container.innerHTML = '<div class="text-center py-5 text-muted small">Belum ada laporan kunjungan hari ini.</div>';
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="card border-0 shadow-sm rounded-4 mb-3 p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div>
                            <span class="badge bg-light text-primary border mb-1">${item.petugas_name}</span>
                            <div class="fw-bold text-dark">${item.nama || 'Pelanggan'}</div>
                            <div class="small text-muted">Nomen: ${item.nomen}</div>
                        </div>
                        <div class="text-end">
                            <div class="small text-muted" style="font-size: 0.7rem;">${item.created_at}</div>
                            <span class="badge ${item.keterangan === 'Sudah Bayar' ? 'bg-success' : 'bg-warning'} mt-1">
                                ${item.keterangan}
                            </span>
                        </div>
                    </div>
                    
                    <div class="d-flex gap-2 mt-2">
                        <button class="btn btn-sm btn-outline-primary rounded-3 flex-grow-1" onclick="previewFoto('${item.foto_path}')">
                            <i class="fas fa-camera me-1"></i> Bukti Foto
                        </button>
                        <a href="https://www.google.com/maps?q=${item.latitude},${item.longitude}" target="_blank" class="btn btn-sm btn-outline-secondary rounded-3 px-3">
                            <i class="fas fa-map-marker-alt"></i>
                        </a>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            container.innerHTML = `<div class="alert alert-danger small">Gagal memuat data: ${e.message}</div>`;
        }
    }

    // 2. Ambil Riwayat Upload
    async function loadUpload() {
        const tbody = document.getElementById('list-upload');
        try {
            const res = await fetch('/api/history/list');
            const data = await res.json();

            tbody.innerHTML = data.map(u => `
                <tr>
                    <td class="ps-3 py-3">
                        <div class="fw-bold text-primary">${u.file_type}</div>
                        <div class="small text-muted">${u.filename}</div>
                        <div class="small text-muted" style="font-size: 0.7rem;">Periode: ${u.periode}</div>
                    </td>
                    <td class="text-center py-3">
                        <span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill">Berhasil</span>
                    </td>
                    <td class="text-center py-3">
                        <button class="btn btn-sm text-danger" onclick="deleteHistory(${u.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="3" class="text-center py-3">Gagal memuat data.</td></tr>';
        }
    }

    // 3. Hapus Riwayat Upload
    async function deleteHistory(id) {
        if (!confirm('Hapus log riwayat ini?')) return;
        const res = await fetch(`/api/history/delete-upload/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.status === 'success') loadUpload();
    }

    // 4. Preview Foto
    function previewFoto(path) {
        if (!path || path === 'None') {
            alert('Tidak ada foto bukti.');
            return;
        }
        document.getElementById('img-preview').src = `/uploads/kunjungan/${path}`;
        new bootstrap.Modal(document.getElementById('modalFoto')).show();
    }

    // Inisialisasi
    document.addEventListener('DOMContentLoaded', () => {
        loadKunjungan();
        // Load upload history hanya jika tab upload diklik (optimasi)
        document.getElementById('upload-tab').addEventListener('shown.bs.tab', loadUpload);
    });
</script>
{% endblock %}
