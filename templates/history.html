{% extends "base.html" %}

{% block content %}
<style>
    :root {
        --primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        --dark-gradient: linear-gradient(135deg, #0f172a 0%, #334155 100%);
    }
    
    .nav-pills-premium {
        background: white;
        padding: 0.5rem;
        border-radius: 1rem;
        border: 1px solid #f1f5f9;
        display: flex;
        gap: 0.5rem;
    }
    .nav-pills-premium .nav-link {
        flex: 1;
        border-radius: 0.75rem;
        color: #64748b;
        font-weight: 700;
        font-size: 0.8rem;
        padding: 0.75rem;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
    }
    .nav-pills-premium .nav-link:hover { background: #f8fafc; color: #2563eb; }
    .nav-pills-premium .nav-link.active {
        background: var(--primary-gradient);
        color: white;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    
    .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; cursor: pointer; }
    .card-hover:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); border-color: #2563eb !important; }
    
    .fw-800 { font-weight: 800; }
</style>

<div class="px-2 pb-5 animate__animated animate__fadeIn">
    
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1 text-dark">
                <i class="fa-solid fa-clock-rotate-left me-2 text-primary"></i>Audit Log
            </h4>
            <p class="text-muted small mb-0 fw-semibold">Jejak Aktivitas & Transaksi</p>
        </div>
        <button class="btn btn-white shadow-sm rounded-circle p-2 border" onclick="refreshLog()">
            <i class="fa-solid fa-arrows-rotate text-primary" id="sync-icon"></i>
        </button>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-4 bg-white border">
        <div class="card-body p-3">
            <label class="small fw-800 text-muted mb-2 text-uppercase">Periode Audit</label>
            <input type="month" id="filter-periode-log" class="form-control border-0 bg-light rounded-3 fw-bold text-primary shadow-none" 
                   value="{{ now_period }}" onchange="refreshLog()">
        </div>
    </div>

    <ul class="nav nav-pills-premium mb-4" id="logTab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-kunjungan" onclick="loadKunjunganLog()">
                <i class="fas fa-map-location-dot"></i> Aktivitas Lapangan
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-upload" onclick="loadUploadLog()">
                <i class="fas fa-file-shield"></i> Sinkronisasi Data
            </button>
        </li>
    </ul>

    <div class="tab-content">
        
        <div class="tab-pane fade show active" id="tab-kunjungan">
            <div class="card border-0 shadow-sm rounded-4 mb-3 bg-white border">
                <div class="card-body p-2">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-0 ps-3"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" id="searchKunjungan" class="form-control border-0 shadow-none fw-bold small" 
                               placeholder="Cari Petugas / IDPEL..." onkeyup="filterKunjungan()">
                    </div>
                </div>
            </div>
            
            <div id="container-kunjungan">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted small fw-bold">Memuat log...</p>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-upload">
            <div id="container-upload">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted small fw-bold">Memuat log...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalLogDetail" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow-lg overflow-hidden">
            <div id="log-detail-content">
                </div>
        </div>
    </div>
</div>

<script>
    let dataKunjungan = []; 
    const formatIDR = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);

    document.addEventListener('DOMContentLoaded', () => {
        if(!document.getElementById('filter-periode-log').value) {
            const now = new Date();
            const month = ("0" + (now.getMonth() + 1)).slice(-2);
            document.getElementById('filter-periode-log').value = `${now.getFullYear()}-${month}`;
        }
        loadKunjunganLog();
    });

    function refreshLog() {
        const icon = document.getElementById('sync-icon');
        icon.classList.add('fa-spin');
        
        const activeTab = document.querySelector('#logTab .nav-link.active').getAttribute('data-bs-target');
        if(activeTab === '#tab-kunjungan') loadKunjunganLog();
        else loadUploadLog();
        
        setTimeout(() => icon.classList.remove('fa-spin'), 800);
    }

    async function loadKunjunganLog() {
        const container = document.getElementById('container-kunjungan');
        const periodVal = document.getElementById('filter-periode-log').value;
        
        let apiPeriod = "";
        if(periodVal) {
            const p = periodVal.split('-');
            apiPeriod = `${p[1]}-${p[0]}`;
        }

        try {
            const res = await fetch(`/api/history/kunjungan?periode=${apiPeriod}`);
            const result = await res.json();
            dataKunjungan = result.data || [];
            renderKunjungan(dataKunjungan);
        } catch (e) {
            container.innerHTML = '<div class="alert alert-danger mx-2 small rounded-4 text-center">Gagal memuat data log.</div>';
        }
    }

    function renderKunjungan(data) {
        const container = document.getElementById('container-kunjungan');
        if(data.length === 0) {
            container.innerHTML = `
                <div class="text-center py-5 text-muted">
                    <i class="fa-regular fa-folder-open fa-3x mb-3 opacity-50"></i>
                    <p class="small fw-bold">Tidak ada aktivitas lapangan.</p>
                </div>`;
            return;
        }

        container.innerHTML = data.map((log) => {
            const isLunas = log.keterangan && log.keterangan.includes('Sudah');
            const badgeClass = isLunas ? 'bg-success text-white' : 'bg-warning text-dark';
            const totalVal = (Number(log.mc) || 0) + (Number(log.ardebt) || 0);
            
            return `
            <div class="card border-0 shadow-sm rounded-4 mb-3 bg-white card-hover border" onclick="showDetail('${log.id}')">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge bg-primary bg-opacity-10 text-primary fw-bold" style="font-size: 0.6rem;">${log.nomen}</span>
                        <small class="text-muted fw-bold" style="font-size: 0.6rem;">
                            <i class="fa-regular fa-clock me-1"></i>${log.waktu}
                        </small>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="fw-800 mb-0 text-dark small text-uppercase text-truncate" style="max-width: 150px;">${log.nama || 'Konsumen'}</h6>
                            <div class="d-flex align-items-center mt-1">
                                <i class="fa-solid fa-circle-user text-secondary me-1" style="font-size: 0.7rem;"></i>
                                <span class="text-muted fw-bold small" style="font-size: 0.65rem;">${log.petugas_name || 'System'}</span>
                            </div>
                        </div>
                        <div class="text-end">
                            <span class="badge ${badgeClass} rounded-pill mb-1 fw-bold" style="font-size: 0.6rem;">${(log.keterangan || 'N/A').toUpperCase()}</span>
                            <div class="fw-800 text-danger" style="font-size: 0.8rem;">${formatIDR(totalVal)}</div>
                        </div>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function filterKunjungan() {
        const q = document.getElementById('searchKunjungan').value.toLowerCase();
        const filtered = dataKunjungan.filter(i => 
            (i.nama && i.nama.toLowerCase().includes(q)) || 
            (i.nomen && i.nomen.includes(q)) || 
            (i.petugas_name && i.petugas_name.toLowerCase().includes(q))
        );
        renderKunjungan(filtered);
    }

    async function loadUploadLog() {
        const container = document.getElementById('container-upload');
        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';
        
        try {
            const res = await fetch('/api/history/list');
            const result = await res.json();
            const data = result.data || [];
            
            if(data.length === 0) {
                container.innerHTML = '<div class="text-center py-5 text-muted small fw-bold">Riwayat sinkronisasi kosong.</div>';
                return;
            }

            container.innerHTML = data.map(log => `
                <div class="card border-0 shadow-sm rounded-4 mb-2 bg-white border-start border-4 border-primary">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="fw-bold mb-0 small text-truncate pe-2 text-dark">
                                <i class="fa-solid fa-file-csv text-primary me-2"></i>${log.file_name}
                            </h6>
                            <span class="badge bg-success bg-opacity-10 text-success rounded-pill fw-bold" style="font-size: 0.55rem;">SUCCESS</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted fw-bold" style="font-size: 0.6rem;">${log.created_at}</small>
                            <small class="text-primary fw-bold" style="font-size: 0.65rem;">${log.row_count} Rows</small>
                        </div>
                    </div>
                </div>`).join('');
        } catch (e) {
            container.innerHTML = '<div class="alert alert-warning mx-2 small rounded-4 text-center">Akses terbatas untuk Administrator.</div>';
        }
    }

    function showDetail(id) {
        const log = dataKunjungan.find(l => l.id == id);
        if(!log) return;
        const totalVal = (Number(log.mc) || 0) + (Number(log.ardebt) || 0);

        document.getElementById('log-detail-content').innerHTML = `
            <div class="modal-header border-0 bg-dark text-white p-4">
                <h6 class="modal-title fw-bold small text-uppercase"><i class="fa-solid fa-eye me-2 text-info"></i>Detail Aktivitas</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div class="text-center mb-4">
                    <div class="bg-light rounded-circle d-inline-flex p-3 mb-2 border">
                        <i class="fa-solid fa-user-tag fa-2x text-dark"></i>
                    </div>
                    <h6 class="fw-800 text-dark mb-0 text-uppercase">${log.nama || 'Konsumen'}</h6>
                    <small class="text-muted fw-bold">${log.nomen}</small>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-6">
                        <div class="p-3 bg-light rounded-4 text-center">
                            <small class="text-muted d-block fw-bold" style="font-size: 0.6rem;">STATUS</small>
                            <span class="badge bg-primary rounded-pill mt-1 fw-bold">${(log.keterangan || 'N/A').toUpperCase()}</span>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="p-3 bg-light rounded-4 text-center">
                            <small class="text-muted d-block fw-bold" style="font-size: 0.6rem;">PETUGAS</small>
                            <span class="d-block fw-bold text-dark small mt-1 text-uppercase">${log.petugas_name || '-'}</span>
                        </div>
                    </div>
                </div>

                <div class="card border-0 bg-light rounded-4 p-3 mb-4">
                    <div class="d-flex justify-content-between mb-2 small">
                        <span class="text-muted">Tagihan Berjalan</span>
                        <span class="fw-bold">${formatIDR(log.mc || 0)}</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2 small">
                        <span class="text-muted">Tunggakan (Ardebt)</span>
                        <span class="fw-bold">${formatIDR(log.ardebt || 0)}</span>
                    </div>
                    ${log.janji_bayar_dt ? `
                    <div class="d-flex justify-content-between mb-2 text-danger small">
                        <span class="fw-bold">Janji Bayar</span>
                        <span class="fw-bold">${log.janji_bayar_dt}</span>
                    </div>` : ''}
                    <hr class="my-2 opacity-10">
                    <div class="d-flex justify-content-between fw-bold">
                        <span>Total</span>
                        <span class="text-primary">${formatIDR(totalVal)}</span>
                    </div>
                </div>

                <div class="mb-4">
                    <small class="text-muted fw-bold text-uppercase" style="font-size: 0.6rem;">Catatan Petugas</small>
                    <div class="p-3 bg-light rounded-4 border mt-1 small text-dark fst-italic">
                        "${log.catatan || 'Tidak ada catatan.'}"
                    </div>
                </div>

                ${log.foto_path && log.foto_path !== '-' ? `
                <div class="d-grid">
                    <a href="/static/uploads/kunjungan/${log.foto_path}" target="_blank" class="btn btn-dark rounded-pill fw-bold py-2 shadow-sm">
                        <i class="fa-solid fa-image me-2"></i>LIHAT FOTO BUKTI
                    </a>
                </div>` : ''}
            </div>`;
        
        new bootstrap.Modal(document.getElementById('modalLogDetail')).show();
    }
</script>
{% endblock %}
