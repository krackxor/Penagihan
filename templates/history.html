{% extends "base.html" %}
{% block content %}
<div class="px-2 pb-5 animate__animated animate__fadeIn">
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1 text-dark">Log Sistem 🖥️</h4>
            <p class="text-muted small mb-0">Audit jejak aktivitas operasional & sistem</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-white shadow-sm rounded-circle p-2" onclick="refreshLog()">
                <i class="fas fa-sync-alt text-primary"></i>
            </button>
        </div>
    </div>

    <ul class="nav nav-pills nav-fill bg-white p-2 shadow-sm rounded-4 mb-4" id="logTab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active rounded-3 small fw-bold" data-bs-toggle="tab" data-bs-target="#tab-kunjungan" onclick="loadKunjunganLog()">
                <i class="fas fa-walking me-1"></i> Lapangan
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link rounded-3 small fw-bold" data-bs-toggle="tab" data-bs-target="#tab-upload" onclick="loadUploadLog()">
                <i class="fas fa-cloud-upload-alt me-1"></i> Upload
            </button>
        </li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-kunjungan">
            <div class="card border-0 shadow-sm rounded-4 mb-3 bg-white">
                <div class="card-body p-3">
                    <div class="input-group bg-light rounded-3 px-2 border border-light">
                        <span class="input-group-text border-0 bg-transparent"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" id="searchKunjungan" class="form-control border-0 bg-transparent py-2 shadow-none" 
                               placeholder="Cari Petugas atau IDPEL..." onkeyup="filterKunjungan()">
                    </div>
                </div>
            </div>
            <div id="container-kunjungan">
                <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-upload">
            <div id="container-upload">
                <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalLogDetail" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow-lg">
            <div id="log-detail-content"></div>
        </div>
    </div>
</div>

<script>
    let dataKunjungan = [];
    const formatIDR = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);

    document.addEventListener('DOMContentLoaded', () => {
        loadKunjunganLog();
    });

    function refreshLog() {
        const activeTab = document.querySelector('.nav-link.active').getAttribute('data-bs-target');
        if(activeTab === '#tab-kunjungan') loadKunjunganLog();
        else loadUploadLog();
    }

    // --- LOGIKA LOG KUNJUNGAN ---
    async function loadKunjunganLog() {
        const container = document.getElementById('container-kunjungan');
        try {
            const res = await fetch('/api/history/kunjungan');
            const result = await res.json();
            dataKunjungan = result.data || [];
            renderKunjungan(dataKunjungan);
        } catch (e) {
            container.innerHTML = '<div class="alert alert-danger mx-2 small">Gagal memuat log lapangan.</div>';
        }
    }

    function renderKunjungan(data) {
        const container = document.getElementById('container-kunjungan');
        if(data.length === 0) {
            container.innerHTML = '<div class="text-center py-5 text-muted small">Belum ada jejak lapangan.</div>';
            return;
        }

        container.innerHTML = data.map((log) => `
            <div class="card border-0 shadow-sm rounded-4 mb-2 bg-white" onclick="showDetail('${log.id}')">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge bg-primary-subtle text-primary" style="font-size: 0.6rem;">${log.nomen}</span>
                        <small class="text-muted" style="font-size: 0.55rem;">${log.waktu}</small>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="fw-bold mb-0 text-dark small text-uppercase">${log.nama}</h6>
                            <small class="text-muted" style="font-size: 0.6rem;"><i class="fas fa-user-circle me-1"></i>${log.petugas_name}</small>
                        </div>
                        <div class="text-end">
                            <span class="badge ${log.keterangan === 'Sudah Bayar' ? 'bg-success' : 'bg-warning'} rounded-pill mb-1" style="font-size: 0.5rem;">${log.keterangan}</span>
                            <div class="fw-bold text-primary" style="font-size: 0.75rem;">${formatIDR(log.nominal || 0)}</div>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function filterKunjungan() {
        const q = document.getElementById('searchKunjungan').value.toLowerCase();
        const filtered = dataKunjungan.filter(i => i.nama.toLowerCase().includes(q) || i.nomen.includes(q) || i.petugas_name.toLowerCase().includes(q));
        renderKunjungan(filtered);
    }

    // --- LOGIKA LOG UPLOAD (SINERGI ADMIN) ---
    async function loadUploadLog() {
        const container = document.getElementById('container-upload');
        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary border-width-2"></div></div>';
        
        try {
            const res = await fetch('/api/upload/history');
            const data = await res.json();
            
            if(data.length === 0) {
                container.innerHTML = '<div class="text-center py-5 text-muted small">Belum ada riwayat sinkronisasi.</div>';
                return;
            }

            container.innerHTML = data.map(log => `
                <div class="card border-0 shadow-sm rounded-4 mb-2 bg-white border-start border-4 border-success">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <h6 class="fw-bold mb-0 small"><i class="fas fa-file-excel text-success me-2"></i>${log.file_name}</h6>
                            <small class="text-muted" style="font-size: 0.55rem;">${log.created_at}</small>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">Tipe: <b class="text-dark">${log.file_type}</b> | Baris: <b>${log.row_count}</b></small>
                            <span class="badge bg-success-subtle text-success rounded-pill" style="font-size: 0.55rem;">SUCCESS</span>
                        </div>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            container.innerHTML = '<div class="alert alert-warning mx-2 small">Akses terbatas untuk Admin.</div>';
        }
    }

    function showDetail(id) {
        const log = dataKunjungan.find(l => l.id == id);
        if(!log) return;

        document.getElementById('log-detail-content').innerHTML = `
            <div class="p-4">
                <h6 class="fw-bold border-bottom pb-2 mb-3">Audit Log Lapangan #${log.id}</h6>
                <div class="row g-3 mb-4">
                    <div class="col-6">
                        <small class="text-muted d-block">PELANGGAN</small>
                        <span class="fw-bold small">${log.nama}</span>
                    </div>
                    <div class="col-6">
                        <small class="text-muted d-block">PETUGAS</small>
                        <span class="fw-bold small">${log.petugas_name}</span>
                    </div>
                    <div class="col-6">
                        <small class="text-muted d-block">HASIL</small>
                        <span class="badge bg-primary rounded-pill">${log.keterangan}</span>
                    </div>
                    <div class="col-6">
                        <small class="text-muted d-block">NOMINAL</small>
                        <span class="fw-bold text-primary">${formatIDR(log.nominal)}</span>
                    </div>
                </div>
                <div class="mb-4">
                    <small class="text-muted d-block">CATATAN LAPANGAN</small>
                    <div class="bg-light p-3 rounded-3 small">${log.catatan || '- Tidak ada catatan -'}</div>
                </div>
                <button class="btn btn-dark w-100 rounded-pill py-2 fw-bold shadow-sm" data-bs-dismiss="modal">Tutup Audit</button>
            </div>
        `;
        new bootstrap.Modal(document.getElementById('modalLogDetail')).show();
    }
</script>

<style>
    .nav-pills .nav-link { color: #64748b; background: #fff; margin: 0 2px; }
    .nav-pills .nav-link.active { background: #0f172a !important; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .btn-white { background: white; border: none; }
    .card { transition: transform 0.1s; cursor: pointer; }
    .card:active { transform: scale(0.98); }
</style>
{% endblock %}
