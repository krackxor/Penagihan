{% extends "base.html" %}
{% block content %}
<div class="px-2 pb-5 animate__animated animate__fadeIn">
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1 text-dark">Log Sistem 🖥️</h4>
            <p class="text-muted small mb-0">Audit jejak operasional & sinkronisasi data</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-white shadow-sm rounded-circle p-2" onclick="refreshLog()">
                <i class="fas fa-sync-alt text-primary" id="sync-icon"></i>
            </button>
        </div>
    </div>

    <ul class="nav nav-pills nav-fill bg-white p-2 shadow-sm rounded-4 mb-4" id="logTab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active rounded-3 small fw-bold" data-bs-toggle="tab" data-bs-target="#tab-kunjungan" onclick="loadKunjunganLog()">
                <i class="fas fa-walking me-1"></i> Lapangan
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link rounded-3 small fw-bold" data-bs-toggle="tab" data-bs-target="#tab-upload" onclick="loadUploadLog()">
                <i class="fas fa-cloud-upload-alt me-1"></i> Upload
            </button>
        </li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-kunjungan">
            <div class="card border-0 shadow-sm rounded-4 mb-3 bg-white">
                <div class="card-body p-3">
                    <div class="input-group bg-light rounded-3 px-2 border border-light">
                        <span class="input-group-text border-0 bg-transparent"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" id="searchKunjungan" class="form-control border-0 bg-transparent py-2 shadow-none" 
                               placeholder="Cari Petugas, Nama, atau IDPEL..." onkeyup="filterKunjungan()">
                    </div>
                </div>
            </div>
            <div id="container-kunjungan">
                <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-upload">
            <div id="container-upload">
                <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalLogDetail" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow-lg overflow-hidden">
            <div id="log-detail-content"></div>
        </div>
    </div>
</div>

<script>
    let dataKunjungan = []; // Master state untuk filter offline
    const formatIDR = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);

    /**
     * INITIALIZER: Memuat log kunjungan secara default saat halaman dibuka.
     */
    document.addEventListener('DOMContentLoaded', () => {
        loadKunjunganLog();
    });

    /**
     * REFRESH LOG: Logika cerdas untuk memuat ulang data pada tab yang sedang aktif.
     */
    function refreshLog() {
        const icon = document.getElementById('sync-icon');
        icon.classList.add('fa-spin');
        
        const activeTab = document.querySelector('#logTab .nav-link.active').getAttribute('data-bs-target');
        if(activeTab === '#tab-kunjungan') loadKunjunganLog();
        else loadUploadLog();
        
        setTimeout(() => icon.classList.remove('fa-spin'), 800);
    }

    /**
     * LOAD KUNJUNGAN: Mengambil data aktivitas lapangan dari API History.
     * Sinergi: Menampilkan data snapshot nominal saat petugas melapor.
     */
    async function loadKunjunganLog() {
        const container = document.getElementById('container-kunjungan');
        try {
            const res = await fetch('/api/history/kunjungan');
            const result = await res.json();
            dataKunjungan = result.data || [];
            renderKunjungan(dataKunjungan);
        } catch (e) {
            container.innerHTML = '<div class="alert alert-danger mx-2 small">Gagal memuat log lapangan.</div>';
        }
    }

    /**
     * RENDER KUNJUNGAN: Membangun kartu log dengan layout mobile-friendly.
     */
    function renderKunjungan(data) {
        const container = document.getElementById('container-kunjungan');
        if(data.length === 0) {
            container.innerHTML = '<div class="text-center py-5 text-muted small">Belum ada jejak lapangan tersimpan.</div>';
            return;
        }

        container.innerHTML = data.map((log) => {
            // Logika Warna Badge: Sudah Bayar (Hijau), Janji/Lainnya (Kuning/Biru)
            const isLunas = log.keterangan.includes('Sudah');
            const badgeClass = isLunas ? 'bg-success' : 'bg-warning text-dark';
            
            return `
            <div class="card border-0 shadow-sm rounded-4 mb-2 bg-white animate__animated animate__fadeInUp" onclick="showDetail('${log.id}')">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge bg-primary-subtle text-primary" style="font-size: 0.6rem;">ID: ${log.nomen}</span>
                        <small class="text-muted font-monospace" style="font-size: 0.55rem;">${log.waktu}</small>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="fw-bold mb-0 text-dark small text-uppercase">${log.nama}</h6>
                            <small class="text-muted" style="font-size: 0.6rem;"><i class="fas fa-id-badge me-1"></i>Petugas: ${log.petugas_name}</small>
                        </div>
                        <div class="text-end">
                            <span class="badge ${badgeClass} rounded-pill mb-1" style="font-size: 0.5rem;">${log.keterangan}</span>
                            <div class="fw-bold text-primary" style="font-size: 0.75rem;">${formatIDR(Number(log.mc || 0) + Number(log.ardebt || 0))}</div>
                        </div>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    /**
     * FILTER: Menyaring log kunjungan secara instan tanpa request ke server.
     */
    function filterKunjungan() {
        const q = document.getElementById('searchKunjungan').value.toLowerCase();
        const filtered = dataKunjungan.filter(i => 
            i.nama.toLowerCase().includes(q) || 
            i.nomen.includes(q) || 
            i.petugas_name.toLowerCase().includes(q)
        );
        renderKunjungan(filtered);
    }

    /**
     * LOAD UPLOAD: Audit sinkronisasi master file oleh Admin.
     * Autopilot: Mendeteksi keberhasilan sinkronisasi baris data Excel.
     */
    async function loadUploadLog() {
        const container = document.getElementById('container-upload');
        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary border-width-2"></div></div>';
        
        try {
            const res = await fetch('/api/history/list');
            const result = await res.json();
            const data = result.data || [];
            
            if(data.length === 0) {
                container.innerHTML = '<div class="text-center py-5 text-muted small">Belum ada riwayat upload file master.</div>';
                return;
            }

            container.innerHTML = data.map(log => `
                <div class="card border-0 shadow-sm rounded-4 mb-2 bg-white border-start border-4 border-success">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <h6 class="fw-bold mb-0 small text-truncate pe-2"><i class="fas fa-file-excel text-success me-2"></i>${log.file_name}</h6>
                            <small class="text-muted" style="font-size: 0.55rem;">${log.created_at}</small>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">Tipe: <b class="text-dark">${log.file_type}</b> | Data: <b>${log.row_count} Baris</b></small>
                            <span class="badge bg-success-subtle text-success rounded-pill" style="font-size: 0.55rem;">SYNC SUCCESS</span>
                        </div>
                    </div>
                </div>`).join('');
        } catch (e) {
            container.innerHTML = '<div class="alert alert-warning mx-2 small">Akses Log Sinkronisasi terbatas untuk Administrator.</div>';
        }
    }

    /**
     * SHOW DETAIL: Menampilkan rincian audit kunjungan lapangan dalam modal.
     * Sinergi: Membedah nominal MC dan Ardebt secara transparan.
     */
    function showDetail(id) {
        const log = dataKunjungan.find(l => l.id == id);
        if(!log) return;

        const totalNominal = Number(log.mc || 0) + Number(log.ardebt || 0);

        document.getElementById('log-detail-content').innerHTML = `
            <div class="modal-header bg-dark text-white border-0 py-3">
                <h6 class="modal-title fw-bold small text-uppercase">Audit Jejak Lapangan #${log.id}</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div class="row g-3 mb-4">
                    <div class="col-12 bg-light p-3 rounded-4 mb-2">
                        <small class="text-muted d-block text-uppercase fw-bold" style="font-size: 0.55rem;">Nama Konsumen</small>
                        <span class="fw-bold text-dark">${log.nama}</span>
                    </div>
                    <div class="col-6">
                        <small class="text-muted d-block text-uppercase fw-bold" style="font-size: 0.55rem;">Petugas Pelapor</small>
                        <span class="fw-bold small text-dark">${log.petugas_name}</span>
                    </div>
                    <div class="col-6 text-end">
                        <small class="text-muted d-block text-uppercase fw-bold" style="font-size: 0.55rem;">Hasil Kunjungan</small>
                        <span class="badge bg-primary rounded-pill px-3">${log.keterangan}</span>
                    </div>
                    <div class="col-12 border-top pt-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <small class="text-muted small">Tagihan Berjalan (MC)</small>
                            <span class="small fw-bold">${formatIDR(log.mc || 0)}</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <small class="text-muted small">Tunggakan Berekor (Ardebt)</small>
                            <span class="small fw-bold">${formatIDR(log.ardebt || 0)}</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top border-2">
                            <span class="fw-bold text-dark">TOTAL TAGIHAN</span>
                            <span class="fw-bold text-primary h6 mb-0">${formatIDR(totalNominal)}</span>
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <small class="text-muted d-block text-uppercase fw-bold mb-2" style="font-size: 0.55rem;">Catatan Petugas Lapangan</small>
                    <div class="bg-light p-3 rounded-4 small text-muted border border-light italic">
                        "${log.catatan || 'Tidak ada catatan tambahan.'}"
                    </div>
                </div>
                ${log.foto_path ? `
                <div class="mb-0">
                    <small class="text-muted d-block text-uppercase fw-bold mb-2" style="font-size: 0.55rem;">Dokumentasi Foto</small>
                    <a href="/static/uploads/kunjungan/${log.foto_path}" target="_blank" class="btn btn-sm btn-outline-primary w-100 rounded-pill">
                        <i class="fas fa-external-link-alt me-2"></i>Lihat Foto Full-Res
                    </a>
                </div>` : ''}
            </div>`;
        
        new bootstrap.Modal(document.getElementById('modalLogDetail')).show();
    }
</script>

<style>
    /* SINERGI UI STYLING */
    .nav-pills .nav-link { color: #64748b; background: #fff; margin: 0 4px; border: 1px solid #f1f5f9; transition: 0.3s; }
    .nav-pills .nav-link.active { background: #0f172a !important; color: #fff; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2); border-color: #0f172a; }
    .btn-white { background: white; border: 1px solid #e2e8f0; }
    .card { transition: all 0.2s ease; cursor: pointer; border: 1px solid transparent !important; }
    .card:hover { border-color: #e2e8f0 !important; box-shadow: 0 8px 15px rgba(0,0,0,0.05) !important; }
    .card:active { transform: scale(0.98); }
    .bg-primary-subtle { background-color: #eef2ff !important; color: #4338ca !important; }
    .bg-success-subtle { background-color: #f0fdf4 !important; color: #166534 !important; }
</style>
{% endblock %}
