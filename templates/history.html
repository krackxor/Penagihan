{% extends "base.html" %}
{% block content %}
<div class="px-2 pb-5 animate__animated animate__fadeIn">
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1 text-dark">Log Sistem 🖥️</h4>
            <p class="text-muted small mb-0">Audit jejak operasional & sinkronisasi data</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-white shadow-sm rounded-circle p-2" onclick="refreshLog()">
                <i class="fas fa-sync-alt text-primary" id="sync-icon"></i>
            </button>
        </div>
    </div>

    <ul class="nav nav-pills nav-fill bg-white p-2 shadow-sm rounded-4 mb-4" id="logTab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active rounded-3 small fw-bold" data-bs-toggle="tab" data-bs-target="#tab-kunjungan" onclick="loadKunjunganLog()">
                <i class="fas fa-walking me-1"></i> Lapangan
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link rounded-3 small fw-bold" data-bs-toggle="tab" data-bs-target="#tab-upload" onclick="loadUploadLog()">
                <i class="fas fa-cloud-upload-alt me-1"></i> Upload
            </button>
        </li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-kunjungan">
            <div class="card border-0 shadow-sm rounded-4 mb-3 bg-white">
                <div class="card-body p-3">
                    <div class="input-group bg-light rounded-3 px-2 border border-light">
                        <span class="input-group-text border-0 bg-transparent"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" id="searchKunjungan" class="form-control border-0 bg-transparent py-2 shadow-none" 
                               placeholder="Cari Petugas, Nama, atau IDPEL..." onkeyup="filterKunjungan()">
                    </div>
                </div>
            </div>
            <div id="container-kunjungan">
                <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-upload">
            <div id="container-upload">
                <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalLogDetail" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow-lg overflow-hidden">
            <div id="log-detail-content"></div>
        </div>
    </div>
</div>

<script>
    let dataKunjungan = []; // Penampung data untuk pencarian cepat
    const formatIDR = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);

    /**
     * INITIALIZER: Menjalankan fungsi muat data pertama kali.
     */
    document.addEventListener('DOMContentLoaded', () => {
        loadKunjunganLog();
    });

    /**
     * REFRESH LOG: Logika cerdas untuk memuat ulang data sesuai konteks tab.
     */
    function refreshLog() {
        const icon = document.getElementById('sync-icon');
        icon.classList.add('fa-spin');
        
        const activeTab = document.querySelector('#logTab .nav-link.active').getAttribute('data-bs-target');
        if(activeTab === '#tab-kunjungan') loadKunjunganLog();
        else loadUploadLog();
        
        setTimeout(() => icon.classList.remove('fa-spin'), 800);
    }

    /**
     * LOAD KUNJUNGAN: Mengambil data riwayat kunjungan dari API.
     * Sinergi: Backend sekarang mengirimkan snapshot MC dan Ardebt secara terpisah.
     */
    async function loadKunjunganLog() {
        const container = document.getElementById('container-kunjungan');
        try {
            const res = await fetch('/api/history/kunjungan');
            const result = await res.json();
            dataKunjungan = result.data || [];
            renderKunjungan(dataKunjungan);
        } catch (e) {
            container.innerHTML = '<div class="alert alert-danger mx-2 small">❌ Gagal sinkronisasi jejak lapangan.</div>';
        }
    }

    /**
     * RENDER KUNJUNGAN: Menyusun kartu log yang informatif dan responsif.
     */
    function renderKunjungan(data) {
        const container = document.getElementById('container-kunjungan');
        if(data.length === 0) {
            container.innerHTML = '<div class="text-center py-5 text-muted small">Belum ada jejak lapangan tersimpan.</div>';
            return;
        }

        container.innerHTML = data.map((log) => {
            // Visual Status: Menggunakan warna berbeda untuk status kritis
            const isLunas = log.keterangan.includes('Sudah');
            const badgeClass = isLunas ? 'bg-success' : 'bg-warning text-dark';
            const totalVal = (Number(log.mc) || 0) + (Number(log.ardebt) || 0);
            
            return `
            <div class="card border-0 shadow-sm rounded-4 mb-2 bg-white animate__animated animate__fadeInUp" onclick="showDetail('${log.id}')">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge bg-primary-subtle text-primary" style="font-size: 0.6rem;">ID: ${log.nomen}</span>
                        <small class="text-muted font-monospace" style="font-size: 0.55rem;">${log.waktu}</small>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="fw-bold mb-0 text-dark small text-uppercase">${log.nama}</h6>
                            <small class="text-muted" style="font-size: 0.6rem;"><i class="fas fa-user-circle me-1"></i>${log.petugas_name}</small>
                        </div>
                        <div class="text-end">
                            <span class="badge ${badgeClass} rounded-pill mb-1" style="font-size: 0.5rem;">${log.keterangan}</span>
                            <div class="fw-bold text-primary" style="font-size: 0.75rem;">${formatIDR(totalVal)}</div>
                        </div>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    /**
     * FILTER: Logika autopilot pencarian client-side (Cepat & Hemat Data).
     */
    function filterKunjungan() {
        const q = document.getElementById('searchKunjungan').value.toLowerCase();
        const filtered = dataKunjungan.filter(i => 
            i.nama.toLowerCase().includes(q) || 
            i.nomen.includes(q) || 
            i.petugas_name.toLowerCase().includes(q)
        );
        renderKunjungan(filtered);
    }

    /**
     * LOAD UPLOAD: Audit riwayat pengunggahan file Excel oleh tim Admin.
     */
    async function loadUploadLog() {
        const container = document.getElementById('container-upload');
        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';
        
        try {
            const res = await fetch('/api/history/list');
            const result = await res.json();
            const data = result.data || [];
            
            if(data.length === 0) {
                container.innerHTML = '<div class="text-center py-5 text-muted small">Belum ada riwayat pengunggahan file.</div>';
                return;
            }

            container.innerHTML = data.map(log => `
                <div class="card border-0 shadow-sm rounded-4 mb-2 bg-white border-start border-4 border-success">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <h6 class="fw-bold mb-0 small text-truncate pe-2"><i class="fas fa-file-excel text-success me-2"></i>${log.file_name}</h6>
                            <small class="text-muted" style="font-size: 0.55rem;">${log.created_at}</small>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">Kategori: <b class="text-dark">${log.file_type}</b> | <b>${log.row_count} Baris</b></small>
                            <span class="badge bg-success-subtle text-success rounded-pill" style="font-size: 0.55rem;">SINKRON</span>
                        </div>
                    </div>
                </div>`).join('');
        } catch (e) {
            container.innerHTML = '<div class="alert alert-warning mx-2 small">Akses terbatas untuk Administrator.</div>';
        }
    }

    /**
     * SHOW DETAIL: Membedah rincian log termasuk perbandingan MC vs Ardebt.
     */
    function showDetail(id) {
        const log = dataKunjungan.find(l => l.id == id);
        if(!log) return;

        const mcVal = Number(log.mc) || 0;
        const ardebtVal = Number(log.ardebt) || 0;

        document.getElementById('log-detail-content').innerHTML = `
            <div class="modal-header bg-dark text-white border-0 py-3">
                <h6 class="modal-title fw-bold small text-uppercase">Detail Audit Lapangan #${log.id}</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div class="bg-light p-3 rounded-4 mb-4">
                    <small class="text-muted d-block text-uppercase fw-bold" style="font-size: 0.55rem;">Nama Pelanggan</small>
                    <h6 class="fw-bold text-dark mb-0">${log.nama}</h6>
                    <small class="text-muted">IDPEL: ${log.nomen}</small>
                </div>
                
                <div class="row g-3 mb-4">
                    <div class="col-6">
                        <small class="text-muted d-block fw-bold" style="font-size: 0.55rem;">STATUS</small>
                        <span class="badge bg-primary rounded-pill px-3">${log.keterangan}</span>
                    </div>
                    <div class="col-6 text-end">
                        <small class="text-muted d-block fw-bold" style="font-size: 0.55rem;">PETUGAS</small>
                        <span class="fw-bold small">${log.petugas_name}</span>
                    </div>
                </div>

                <div class="border-top border-bottom py-3 mb-4">
                    <div class="d-flex justify-content-between mb-2">
                        <small class="text-muted">Tagihan Berjalan (MC)</small>
                        <span class="small fw-bold">${formatIDR(mcVal)}</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <small class="text-muted">Tunggakan Lama (Ardebt)</small>
                        <span class="small fw-bold">${formatIDR(ardebtVal)}</span>
                    </div>
                    <div class="d-flex justify-content-between pt-2 border-top">
                        <span class="fw-bold">TOTAL TAGIHAN</span>
                        <span class="fw-bold text-primary">${formatIDR(mcVal + ardebtVal)}</span>
                    </div>
                </div>

                <div class="mb-4">
                    <small class="text-muted d-block fw-bold mb-2" style="font-size: 0.55rem;">CATATAN LAPANGAN</small>
                    <div class="bg-light p-3 rounded-3 small text-muted border-start border-3 border-primary">
                        "${log.catatan || 'Tidak ada catatan tambahan.'}"
                    </div>
                </div>

                ${log.foto_path ? `
                <div class="d-grid">
                    <a href="/static/uploads/kunjungan/${log.foto_path}" target="_blank" class="btn btn-outline-dark rounded-pill fw-bold small py-2">
                        <i class="fas fa-camera me-2"></i> LIHAT FOTO BUKTI
                    </a>
                </div>` : ''}
            </div>`;
        
        new bootstrap.Modal(document.getElementById('modalLogDetail')).show();
    }
</script>

<style>
    /* Styling Navigasi & Animasi */
    .nav-pills .nav-link { color: #64748b; background: #fff; margin: 0 4px; border: 1px solid #f1f5f9; transition: 0.3s; }
    .nav-pills .nav-link.active { background: #0f172a !important; color: #fff; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2); }
    .card { transition: all 0.2s ease; cursor: pointer; border: 1px solid transparent !important; }
    .card:hover { border-color: #e2e8f0 !important; box-shadow: 0 8px 15px rgba(0,0,0,0.05) !important; }
    .card:active { transform: scale(0.98); }
</style>
{% endblock %}
