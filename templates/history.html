{% extends "base.html" %}

{% block content %}
<div class="px-2 pb-5 animate__animated animate__fadeIn">
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1 text-dark"><i class="fas fa-database me-2 text-primary"></i>Audit Log Operasional</h4>
            <p class="text-muted small mb-0">Monitor jejak transaksi & integritas data Area Service</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-white shadow-sm rounded-circle p-2 border" onclick="refreshLog()">
                <i class="fas fa-sync-alt text-primary" id="sync-icon"></i>
            </button>
        </div>
    </div>

    <ul class="nav nav-pills nav-fill bg-white p-2 shadow-sm rounded-4 mb-4" id="logTab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active rounded-3 small fw-bold py-2" data-bs-toggle="tab" data-bs-target="#tab-kunjungan" onclick="loadKunjunganLog()">
                <i class="fas fa-map-marked-alt me-1"></i> Aktivitas Lapangan
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link rounded-3 small fw-bold py-2" data-bs-toggle="tab" data-bs-target="#tab-upload" onclick="loadUploadLog()">
                <i class="fas fa-file-import me-1"></i> Sinkronisasi File
            </button>
        </li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-kunjungan">
            <div class="card border-0 shadow-sm rounded-4 mb-3 bg-white">
                <div class="card-body p-3">
                    <div class="input-group bg-light rounded-3 px-2 border border-light">
                        <span class="input-group-text border-0 bg-transparent"><i class="fas fa-search text-muted"></i></span>
                        <input type="text" id="searchKunjungan" class="form-control border-0 bg-transparent py-2 shadow-none" 
                               placeholder="Cari Entitas Berdasarkan Petugas, Nama, atau IDPEL..." onkeyup="filterKunjungan()">
                    </div>
                </div>
            </div>
            <div id="container-kunjungan">
                <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-upload">
            <div id="container-upload">
                <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalLogDetail" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow-lg overflow-hidden">
            <div id="log-detail-content"></div>
        </div>
    </div>
</div>

<script>
    let dataKunjungan = []; 
    const formatIDR = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);

    document.addEventListener('DOMContentLoaded', () => {
        loadKunjunganLog();
    });

    function refreshLog() {
        const icon = document.getElementById('sync-icon');
        icon.classList.add('fa-spin');
        
        const activeTab = document.querySelector('#logTab .nav-link.active').getAttribute('data-bs-target');
        if(activeTab === '#tab-kunjungan') loadKunjunganLog();
        else loadUploadLog();
        
        setTimeout(() => icon.classList.remove('fa-spin'), 800);
    }

    /**
     * LOAD KUNJUNGAN: Mengambil data riwayat kunjungan dari API Area Service.
     */
    async function loadKunjunganLog() {
        const container = document.getElementById('container-kunjungan');
        try {
            const res = await fetch('/api/history/kunjungan');
            const result = await res.json();
            dataKunjungan = result.data || [];
            renderKunjungan(dataKunjungan);
        } catch (e) {
            container.innerHTML = '<div class="alert alert-danger mx-2 small">❌ Gagal melakukan sinkronisasi dengan server audit.</div>';
        }
    }

    function renderKunjungan(data) {
        const container = document.getElementById('container-kunjungan');
        if(data.length === 0) {
            container.innerHTML = '<div class="text-center py-5 text-muted small">Tidak ditemukan catatan aktivitas lapangan pada periode ini.</div>';
            return;
        }

        container.innerHTML = data.map((log) => {
            const isLunas = log.keterangan.includes('Sudah');
            const badgeClass = isLunas ? 'bg-success' : 'bg-warning text-dark';
            const totalVal = (Number(log.mc) || 0) + (Number(log.ardebt) || 0);
            
            return `
            <div class="card border-0 shadow-sm rounded-4 mb-2 bg-white animate__animated animate__fadeInUp" onclick="showDetail('${log.id}')">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge bg-primary-subtle text-primary fw-bold" style="font-size: 0.6rem;">IDPEL: ${log.nomen}</span>
                        <small class="text-muted font-monospace" style="font-size: 0.6rem;"><i class="far fa-clock me-1"></i>${log.waktu}</small>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="fw-bold mb-0 text-dark small text-uppercase" style="letter-spacing: 0.3px;">${log.nama}</h6>
                            <small class="text-muted" style="font-size: 0.65rem;"><i class="fas fa-id-badge me-1"></i>Petugas: ${log.petugas_name}</small>
                        </div>
                        <div class="text-end">
                            <span class="badge ${badgeClass} rounded-pill mb-1" style="font-size: 0.55rem; padding: 4px 10px;">${log.keterangan}</span>
                            <div class="fw-bold text-danger" style="font-size: 0.8rem;">${formatIDR(totalVal)}</div>
                        </div>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function filterKunjungan() {
        const q = document.getElementById('searchKunjungan').value.toLowerCase();
        const filtered = dataKunjungan.filter(i => 
            i.nama.toLowerCase().includes(q) || 
            i.nomen.includes(q) || 
            i.petugas_name.toLowerCase().includes(q)
        );
        renderKunjungan(filtered);
    }

    /**
     * LOAD UPLOAD: Monitor aktivitas sinkronisasi data eksternal (Excel).
     */
    async function loadUploadLog() {
        const container = document.getElementById('container-upload');
        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';
        
        try {
            const res = await fetch('/api/history/list');
            const result = await res.json();
            const data = result.data || [];
            
            if(data.length === 0) {
                container.innerHTML = '<div class="text-center py-5 text-muted small">Riwayat sinkronisasi data masih kosong.</div>';
                return;
            }

            container.innerHTML = data.map(log => `
                <div class="card border-0 shadow-sm rounded-4 mb-2 bg-white border-start border-4 border-primary">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <h6 class="fw-bold mb-0 small text-truncate pe-2"><i class="fas fa-file-csv text-primary me-2"></i>${log.file_name}</h6>
                            <small class="text-muted font-monospace" style="font-size: 0.55rem;">${log.created_at}</small>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">Kategori: <b class="text-dark">${log.file_type}</b> | <b>${log.row_count} Entri Data</b></small>
                            <span class="badge bg-success-subtle text-success rounded-pill" style="font-size: 0.55rem;">SUCCESS</span>
                        </div>
                    </div>
                </div>`).join('');
        } catch (e) {
            container.innerHTML = '<div class="alert alert-warning mx-2 small">Akses Terbatas: Hanya Administrator yang dapat mengakses modul ini.</div>';
        }
    }

    /**
     * SHOW DETAIL: Rincian komprehensif log aktivitas operasional.
     */
    function showDetail(id) {
        const log = dataKunjungan.find(l => l.id == id);
        if(!log) return;

        const mcVal = Number(log.mc) || 0;
        const ardebtVal = Number(log.ardebt) || 0;

        document.getElementById('log-detail-content').innerHTML = `
            <div class="modal-header bg-dark text-white border-0 py-3">
                <h6 class="modal-title fw-bold small text-uppercase"><i class="fas fa-search-dollar me-2"></i>Rincian Audit Lapangan</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div class="bg-light p-3 rounded-4 mb-4">
                    <small class="text-muted d-block text-uppercase fw-bold" style="font-size: 0.6rem; letter-spacing: 0.5px;">Entitas Konsumen</small>
                    <h6 class="fw-bold text-dark mb-0 mt-1">${log.nama}</h6>
                    <small class="text-muted">ID Pelanggan: ${log.nomen}</small>
                    ${log.nomet ? `<br><small class="text-muted">No. Meter: ${log.nomet}</small>` : ''}
                </div>
                
                <div class="row g-3 mb-4">
                    <div class="col-6">
                        <small class="text-muted d-block fw-bold" style="font-size: 0.6rem;">KLASIFIKASI HASIL</small>
                        <span class="badge bg-primary rounded-pill px-3 mt-1">${log.keterangan}</span>
                    </div>
                    <div class="col-6 text-end">
                        <small class="text-muted d-block fw-bold" style="font-size: 0.6rem;">PELAKSANA LAPANGAN</small>
                        <span class="fw-bold small mt-1 d-block">${log.petugas_name}</span>
                    </div>
                </div>

                <div class="border-top border-bottom py-3 mb-4">
                    <div class="d-flex justify-content-between mb-2">
                        <small class="text-muted">Tagihan Berjalan (MC)</small>
                        <span class="small fw-bold">${formatIDR(mcVal)}</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <small class="text-muted">Piutang Tertunggak (Ardebt)</small>
                        <span class="small fw-bold">${formatIDR(ardebtVal)}</span>
                    </div>
                    <div class="d-flex justify-content-between pt-2 border-top">
                        <span class="fw-bold small text-uppercase">Total Eksposur Piutang</span>
                        <span class="fw-bold text-danger">${formatIDR(mcVal + ardebtVal)}</span>
                    </div>
                </div>

                <div class="mb-4">
                    <small class="text-muted d-block fw-bold mb-2" style="font-size: 0.6rem;">NARASI TEMUAN LAPANGAN</small>
                    <div class="bg-light p-3 rounded-3 small text-muted border-start border-4 border-primary italic">
                        "${log.catatan || 'Petugas tidak menyertakan catatan tambahan.'}"
                    </div>
                </div>

                ${log.foto_path ? `
                <div class="d-grid">
                    <a href="/static/uploads/kunjungan/${log.foto_path}" target="_blank" class="btn btn-dark rounded-pill fw-bold small py-3 shadow-sm">
                        <i class="fas fa-image me-2 text-warning"></i> LIHAT BUKTI VISUAL LAPANGAN
                    </a>
                </div>` : ''}
            </div>`;
        
        new bootstrap.Modal(document.getElementById('modalLogDetail')).show();
    }
</script>

<style>
    /* Custom Styling for Area Service Audit Central */
    .nav-pills .nav-link { color: #64748b; background: #fff; margin: 0 4px; border: 1px solid #f1f5f9; transition: all 0.3s ease; }
    .nav-pills .nav-link.active { background: #0f172a !important; color: #fff; box-shadow: 0 4px 15px rgba(15, 23, 42, 0.2); border-color: #0f172a; }
    .card { transition: all 0.25s ease; cursor: pointer; border: 1px solid transparent !important; }
    .card:hover { border-color: #cbd5e1 !important; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.06) !important; }
    .card:active { transform: scale(0.98); }
</style>
{% endblock %}
