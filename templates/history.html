{% extends "base.html" %}

{% block content %}
<div class="px-2 pb-5 animate__animated animate__fadeIn">
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1 text-dark">
                <i class="fa-solid fa-database me-2 text-primary"></i>Audit Log Operasional
            </h4>
            <p class="text-muted small mb-0">Monitor jejak transaksi & integritas data Area Service</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-white shadow-sm rounded-circle p-2 border animate__animated animate__rotateIn" 
                    onclick="refreshLog()">
                <i class="fa-solid fa-arrows-rotate text-primary" id="sync-icon"></i>
            </button>
        </div>
    </div>

    <ul class="nav nav-pills nav-fill bg-white p-2 shadow-sm rounded-4 mb-4 border" id="logTab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active rounded-3 small fw-800 py-2" data-bs-toggle="tab" data-bs-target="#tab-kunjungan" onclick="loadKunjunganLog()">
                <i class="fa-solid fa-map-location-dot me-1"></i> Aktivitas Lapangan
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link rounded-3 small fw-800 py-2" data-bs-toggle="tab" data-bs-target="#tab-upload" onclick="loadUploadLog()">
                <i class="fa-solid fa-file-shield me-1"></i> Sinkronisasi Data
            </button>
        </li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-kunjungan">
            <div class="card border-0 shadow-sm rounded-4 mb-3 bg-white">
                <div class="card-body p-3">
                    <div class="input-group bg-light rounded-3 px-2 border border-light overflow-hidden">
                        <span class="input-group-text border-0 bg-transparent ps-3">
                            <i class="fa-solid fa-magnifying-glass text-muted small"></i>
                        </span>
                        <input type="text" id="searchKunjungan" class="form-control border-0 bg-transparent py-2 shadow-none small fw-semibold" 
                               placeholder="Cari Petugas, Nama, atau IDPEL..." onkeyup="filterKunjungan()">
                    </div>
                </div>
            </div>
            <div id="container-kunjungan">
                <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
            </div>
        </div>

        <div class="tab-pane fade" id="tab-upload">
            <div id="container-upload">
                <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalLogDetail" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow-lg overflow-hidden">
            <div id="log-detail-content"></div>
        </div>
    </div>
</div>

<script>
    let dataKunjungan = []; 
    const formatIDR = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);

    document.addEventListener('DOMContentLoaded', () => {
        loadKunjunganLog();
    });

    function refreshLog() {
        const icon = document.getElementById('sync-icon');
        icon.classList.add('fa-spin');
        
        const activeTab = document.querySelector('#logTab .nav-link.active').getAttribute('data-bs-target');
        if(activeTab === '#tab-kunjungan') loadKunjunganLog();
        else loadUploadLog();
        
        setTimeout(() => icon.classList.remove('fa-spin'), 800);
    }

    async function loadKunjunganLog() {
        const container = document.getElementById('container-kunjungan');
        try {
            const res = await fetch('/api/history/kunjungan');
            const result = await res.json();
            dataKunjungan = result.data || [];
            renderKunjungan(dataKunjungan);
        } catch (e) {
            container.innerHTML = '<div class="alert alert-danger mx-2 small rounded-4 text-center"><i class="fa-solid fa-triangle-exclamation me-2"></i>Gagal sinkronisasi pangkalan data audit.</div>';
        }
    }

    function renderKunjungan(data) {
        const container = document.getElementById('container-kunjungan');
        if(data.length === 0) {
            container.innerHTML = '<div class="text-center py-5 text-muted small fw-bold">Tidak ditemukan aktivitas lapangan pada periode ini.</div>';
            return;
        }

        container.innerHTML = data.map((log) => {
            const isLunas = log.keterangan.includes('Sudah');
            const badgeClass = isLunas ? 'bg-success bg-opacity-10 text-success' : 'bg-warning bg-opacity-10 text-dark';
            const totalVal = (Number(log.mc) || 0) + (Number(log.ardebt) || 0);
            
            return `
            <div class="card border-0 shadow-sm rounded-4 mb-2 bg-white animate__animated animate__fadeInUp" onclick="showDetail('${log.id}')">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <span class="badge bg-primary bg-opacity-10 text-primary fw-800" style="font-size: 0.6rem;">IDPEL: ${log.nomen}</span>
                        <small class="text-muted fw-bold" style="font-size: 0.6rem;"><i class="fa-regular fa-clock me-1"></i>${log.waktu}</small>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="fw-800 mb-0 text-dark small text-uppercase" style="letter-spacing: 0.2px;">${log.nama}</h6>
                            <small class="text-muted fw-bold" style="font-size: 0.65rem;"><i class="fa-solid fa-circle-user text-primary me-1"></i>${log.petugas_name}</small>
                        </div>
                        <div class="text-end">
                            <span class="badge ${badgeClass} rounded-pill mb-1 fw-800" style="font-size: 0.55rem;">${log.keterangan.toUpperCase()}</span>
                            <div class="fw-800 text-danger" style="font-size: 0.85rem;">${formatIDR(totalVal)}</div>
                        </div>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    function filterKunjungan() {
        const q = document.getElementById('searchKunjungan').value.toLowerCase();
        const filtered = dataKunjungan.filter(i => 
            i.nama.toLowerCase().includes(q) || 
            i.nomen.includes(q) || 
            i.petugas_name.toLowerCase().includes(q)
        );
        renderKunjungan(filtered);
    }

    async function loadUploadLog() {
        const container = document.getElementById('container-upload');
        container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';
        try {
            const res = await fetch('/api/history/list');
            const result = await res.json();
            const data = result.data || [];
            
            if(data.length === 0) {
                container.innerHTML = '<div class="text-center py-5 text-muted small fw-bold">Riwayat sinkronisasi data masih kosong.</div>';
                return;
            }

            container.innerHTML = data.map(log => `
                <div class="card border-0 shadow-sm rounded-4 mb-2 bg-white border-start border-4 border-primary">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <h6 class="fw-800 mb-0 small text-truncate pe-2 text-dark"><i class="fa-solid fa-file-csv text-primary me-2"></i>${log.file_name}</h6>
                            <small class="text-muted fw-bold" style="font-size: 0.55rem;">${log.created_at}</small>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <small class="text-muted fw-semibold">Tipe: <b class="text-primary">${log.file_type}</b> | <b>${log.row_count} Entri</b></small>
                            <span class="badge bg-success bg-opacity-10 text-success rounded-pill fw-800" style="font-size: 0.55rem;">VERIFIED</span>
                        </div>
                    </div>
                </div>`).join('');
        } catch (e) {
            container.innerHTML = '<div class="alert alert-warning mx-2 small rounded-4"><i class="fa-solid fa-lock me-2"></i>Hanya Administrator yang memiliki akses ke modul sinkronisasi.</div>';
        }
    }

    function showDetail(id) {
        const log = dataKunjungan.find(l => l.id == id);
        if(!log) return;
        const totalVal = (Number(log.mc) || 0) + (Number(log.ardebt) || 0);

        document.getElementById('log-detail-content').innerHTML = `
            <div class="modal-header bg-dark text-white border-0 py-3 px-4">
                <h6 class="modal-title fw-800 small text-uppercase"><i class="fa-solid fa-fingerprint me-2 text-info"></i>Audit Rincian Lapangan</h6>
                <button type="button" class="btn-close btn-close-white shadow-none" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div class="bg-light p-3 rounded-4 mb-4 border border-white">
                    <small class="text-muted d-block text-uppercase fw-800" style="font-size: 0.6rem; letter-spacing: 1px;">Entitas Pelanggan</small>
                    <h6 class="fw-800 text-dark mb-0 mt-1 text-uppercase">${log.nama}</h6>
                    <div class="mt-1">
                        <span class="badge bg-white text-primary border fw-bold" style="font-size: 0.65rem;">IDPEL: ${log.nomen}</span>
                        ${log.nomet ? `<span class="badge bg-white text-muted border fw-bold" style="font-size: 0.65rem;">METER: ${log.nomet}</span>` : ''}
                    </div>
                </div>
                
                <div class="row g-3 mb-4">
                    <div class="col-6">
                        <small class="text-muted d-block fw-800" style="font-size: 0.6rem;">KLASIFIKASI HASIL</small>
                        <span class="badge bg-primary rounded-pill px-3 mt-1 fw-800 shadow-sm">${log.keterangan.toUpperCase()}</span>
                    </div>
                    <div class="col-6 text-end">
                        <small class="text-muted d-block fw-800" style="font-size: 0.6rem;">PELAKSANA</small>
                        <span class="fw-800 small mt-1 d-block text-dark text-uppercase"><i class="fa-solid fa-user-check text-success me-1"></i>${log.petugas_name}</span>
                    </div>
                </div>

                <div class="card border-0 bg-light rounded-4 p-3 mb-4">
                    <div class="d-flex justify-content-between mb-2">
                        <small class="text-muted fw-bold">Tagihan Berjalan</small>
                        <span class="small fw-800 text-dark">${formatIDR(log.mc)}</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <small class="text-muted fw-bold">Tunggakan (Ardebt)</small>
                        <span class="small fw-800 text-dark">${formatIDR(log.ardebt)}</span>
                    </div>
                    <hr class="my-2 opacity-10">
                    <div class="d-flex justify-content-between">
                        <span class="fw-800 small text-uppercase">Total Eksposur</span>
                        <span class="fw-800 text-danger" style="font-size: 1.1rem;">${formatIDR(totalVal)}</span>
                    </div>
                </div>

                <div class="mb-4">
                    <small class="text-muted d-block fw-800 mb-2" style="font-size: 0.6rem; letter-spacing: 1px;">NARASI TEMUAN</small>
                    <div class="bg-white p-3 rounded-4 small text-muted border-start border-4 border-primary shadow-sm italic">
                        "${log.catatan || 'Tidak ada catatan tambahan.'}"
                    </div>
                </div>

                ${log.foto_path && log.foto_path !== '-' ? `
                <div class="d-grid">
                    <a href="/static/uploads/kunjungan/${log.foto_path}" target="_blank" class="btn btn-dark rounded-pill fw-800 small py-3 shadow">
                        <i class="fa-solid fa-image-user me-2 text-info"></i>LIHAT BUKTI VISUAL
                    </a>
                </div>` : ''}
            </div>`;
        
        new bootstrap.Modal(document.getElementById('modalLogDetail')).show();
    }
</script>

<style>
    .fw-800 { font-weight: 800; }
    .nav-pills .nav-link { color: #64748b; background: transparent; transition: 0.3s; border: 1px solid transparent; }
    .nav-pills .nav-link.active { background: #0f172a !important; color: #fff !important; box-shadow: 0 8px 20px rgba(15, 23, 42, 0.2); }
    .card { transition: all 0.25s ease; cursor: pointer; border: 1px solid transparent !important; }
    .card:hover { border-color: #2563eb !important; transform: translateY(-3px); box-shadow: 0 10px 25px rgba(37, 99, 235, 0.1) !important; }
    .bg-primary-subtle { background-color: #eff6ff !important; }
</style>
{% endblock %}
