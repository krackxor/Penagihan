{% extends "base.html" %}

{% block content %}
<style>
    .filter-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid #e2e8f0; font-weight: 700; font-size: 0.7rem; }
    .filter-btn:hover { transform: translateY(-2px); }
    .filter-btn.active { background-color: #0f172a; color: white; border-color: #0f172a; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.3); }
    
    .table-premium thead th { 
        background: #1e293b; color: white; border: none; font-weight: 800; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px; vertical-align: middle;
    }
    .hover-row:hover { background-color: #f8fafc !important; }
    
    .badge-soft { padding: 0.35em 0.65em; font-size: 0.6rem; font-weight: 700; border-radius: 50rem; }
    .bg-soft-primary { background-color: #eff6ff; color: #2563eb; border: 1px solid #dbeafe; }
    .bg-soft-success { background-color: #f0fdf4; color: #166534; border: 1px solid #dcfce7; }
    .bg-soft-warning { background-color: #fefce8; color: #854d0e; border: 1px solid #fef9c3; }
    .bg-soft-danger { background-color: #fef2f2; color: #991b1b; border: 1px solid #fee2e2; }
    
    .btn-action { width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s; border: 1px solid #e2e8f0; background: white; }
    .btn-action:hover { background: #f1f5f9; transform: scale(1.1); border-color: #cbd5e1; }
    
    .fw-800 { font-weight: 800; }
</style>

<div class="px-2 pb-5 animate__animated animate__fadeIn">
    
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
            <h4 class="fw-bold mb-0 text-dark">
                <i class="fa-solid fa-clock-rotate-left me-2 text-primary"></i>Audit Riwayat
            </h4>
            <p class="text-muted small mb-0 fw-semibold">Rekam Jejak Aktivitas Lapangan</p>
        </div>
        <div class="d-flex gap-2 align-items-center bg-white p-1 rounded-pill shadow-sm border">
            <input type="month" id="filter-periode" 
                   class="form-control form-control-sm border-0 bg-transparent fw-bold text-primary ps-3" 
                   style="width: 140px; cursor: pointer;" onchange="loadHistory()">
            <button class="btn btn-sm btn-light rounded-circle shadow-none" onclick="loadHistory()">
                <i class="fas fa-rotate text-secondary"></i>
            </button>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div class="d-flex gap-2 overflow-auto pb-1" style="scrollbar-width: none;">
            <button class="btn filter-btn active rounded-pill px-3" onclick="applyFilter('ALL', this)">SEMUA</button>
            <button class="btn filter-btn bg-white text-secondary rounded-pill px-3" onclick="applyFilter('JANJI', this)">JANJI BAYAR</button>
            <button class="btn filter-btn bg-white text-secondary rounded-pill px-3" onclick="applyFilter('RKS', this)">RKS / SEGEL</button>
            <button class="btn filter-btn bg-white text-secondary rounded-pill px-3" onclick="applyFilter('BAYAR', this)">LUNAS</button>
        </div>
        <div class="text-end">
            <span class="badge bg-white text-dark border rounded-pill px-3 py-2 shadow-sm fw-bold" id="filter-count" style="font-size: 0.65rem;">
                <i class="fa-solid fa-list-check me-1 text-primary"></i> -- DATA
            </span>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden border">
        <div class="table-responsive" style="max-height: 75vh;">
            <table class="table table-hover align-middle mb-0 bg-white table-premium">
                <thead class="sticky-top shadow-sm">
                    <tr>
                        <th class="ps-4 py-3 border-0">Waktu & Petugas</th>
                        <th class="border-0">Identitas Pelanggan</th>
                        <th class="border-0">Lokasi Audit</th>
                        <th class="border-0 text-center">Tagihan</th>
                        <th class="text-center border-0">Hasil Kunjungan</th>
                        <th class="text-center pe-4 border-0">Aksi</th>
                    </tr>
                </thead>
                <tbody id="history-body">
                    <tr>
                        <td colspan="6" class="text-center py-5">
                            <div class="spinner-border text-primary spinner-border-sm me-2"></div>
                            <span class="fw-bold text-muted small">SINKRONISASI DATA...</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>

<script>
    let rawHistoryData = []; 
    const toIDR = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);

    document.addEventListener('DOMContentLoaded', () => {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        document.getElementById('filter-periode').value = `${year}-${month}`;
        loadHistory();
    });

    async function loadHistory() {
        const picker = document.getElementById('filter-periode').value;
        if (!picker) return;

        document.getElementById('history-body').innerHTML = `<tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-primary spinner-border-sm me-2"></div><span class="fw-bold text-muted small">MEMUAT DATA...</span></td></tr>`;

        const parts = picker.split('-');
        const formattedPeriod = `${parts[1]}-${parts[0]}`;

        try {
            const res = await fetch(`/api/history/kunjungan?periode=${formattedPeriod}`);
            const result = await res.json();
            
            if (result.status === 'success') {
                rawHistoryData = result.data || [];
                applyFilter('ALL', document.querySelector('.filter-btn.active'));
            } else {
                document.getElementById('history-body').innerHTML = `<tr><td colspan="6" class="text-center py-5 text-danger fw-bold">Gagal memuat data.</td></tr>`;
            }
        } catch (e) {
            console.error(e);
            Swal.fire('Error System', 'Gagal koneksi server.', 'error');
        }
    }

    function applyFilter(criteria, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => {
            b.classList.remove('active');
            b.classList.add('bg-white', 'text-secondary');
        });
        btn.classList.add('active');
        btn.classList.remove('bg-white', 'text-secondary');

        let filtered = rawHistoryData;
        if (criteria !== 'ALL') {
            filtered = rawHistoryData.filter(item => {
                const ket = (item.keterangan || '').toUpperCase();
                if (criteria === 'JANJI') return ket.includes('JANJI');
                if (criteria === 'RKS') return ket.includes('RKS') || ket.includes('SEGEL') || ket.includes('TUTUP');
                if (criteria === 'BAYAR') return ket.includes('BAYAR') || ket.includes('LUNAS') || ket.includes('SUDAH');
                return false;
            });
        }

        document.getElementById('filter-count').innerHTML = `<i class="fa-solid fa-list-ul me-1 text-primary"></i> ${filtered.length} RECORD`;
        renderTable(filtered);
    }

    function renderTable(data) {
        const body = document.getElementById('history-body');
        if (data.length === 0) {
            body.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted small fw-bold italic">TIDAK ADA DATA KUNJUNGAN.</td></tr>';
            return;
        }

        body.innerHTML = data.map(item => {
            let statusBadge = 'badge-soft bg-soft-primary';
            const ket = (item.keterangan || '').toUpperCase();
            
            if (ket.includes('JANJI')) statusBadge = 'badge-soft bg-soft-warning';
            else if (ket.includes('BAYAR') || ket.includes('LUNAS')) statusBadge = 'badge-soft bg-soft-success';
            else if (ket.includes('RKS') || ket.includes('SEGEL') || ket.includes('TUTUP')) statusBadge = 'badge-soft bg-soft-danger';

            const mapsLink = `https://www.google.com/maps/search/?api=1&query=${item.latitude},${item.longitude}`;
            const totalTagihan = (item.mc || 0) + (item.ardebt || 0);

            return `
            <tr class="border-bottom hover-row transition-row">
                <td class="ps-4">
                    <div class="fw-bold text-dark" style="font-size: 0.75rem;">${moment(item.waktu).format('DD MMM YYYY')}</div>
                    <div class="text-muted small mb-1" style="font-size: 0.65rem;">${moment(item.waktu).format('HH:mm')} WIB</div>
                    <span class="badge bg-light text-dark border rounded-pill px-2 py-1" style="font-size: 0.55rem;">
                        <i class="fa-solid fa-user me-1 text-secondary"></i>${item.petugas_name}
                    </span>
                </td>
                <td>
                    <div class="fw-bold text-dark text-uppercase small">${item.nama || 'Tanpa Nama'}</div>
                    <span class="badge bg-light text-primary border font-monospace mt-1" style="font-size: 0.6rem;">ID: ${item.nomen}</span>
                </td>
                <td style="max-width: 200px;">
                    <div class="text-muted fw-semibold text-truncate small" title="${item.alamat}">
                        <i class="fa-solid fa-location-dot text-danger me-1"></i>${item.alamat || '-'}
                    </div>
                </td>
                <td class="text-center">
                    <span class="fw-800 text-dark small d-block">${toIDR(totalTagihan)}</span>
                    <small class="text-muted" style="font-size: 0.6rem;">Total Kewajiban</small>
                </td>
                <td class="text-center">
                    <span class="${statusBadge} mb-1 d-inline-block">${item.keterangan}</span>
                    <div class="text-muted fst-italic text-truncate small mx-auto" style="max-width: 150px;" title="${item.catatan}">
                        "${item.catatan || '-'}"
                    </div>
                </td>
                <td class="text-center pe-4">
                    <div class="d-flex justify-content-center gap-2">
                        <button class="btn-action text-primary" onclick="viewPhoto('${item.foto_path}')" title="Lihat Foto">
                            <i class="fa-solid fa-camera"></i>
                        </button>
                        <a href="${mapsLink}" target="_blank" class="btn-action text-success" title="Cek Lokasi">
                            <i class="fa-solid fa-map-location-dot"></i>
                        </a>
                    </div>
                </td>
            </tr>`;
        }).join('');
    }

    function viewPhoto(path) {
        if(!path || path === 'None' || path === '-') {
            Swal.fire({ icon: 'info', title: 'Tidak Ada Foto', text: 'Dokumentasi visual tidak tersedia.', confirmButtonColor: '#0f172a' });
            return;
        }
        Swal.fire({
            imageUrl: `/static/uploads/kunjungan/${path}`,
            imageAlt: 'Bukti Kunjungan',
            showCloseButton: true,
            showConfirmButton: false,
            background: '#fff',
            padding: 0,
            customClass: { popup: 'rounded-4 border-0 shadow-lg overflow-hidden', image: 'm-0 w-100' }
        });
    }
</script>
{% endblock %}
