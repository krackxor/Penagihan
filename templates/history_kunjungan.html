{% extends "base.html" %}

{% block content %}
<div class="px-2 pb-5 animate__animated animate__fadeIn" style="background: #f1f5f9; min-height: 100vh;">
    
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
            <h4 class="fw-bold mb-0 text-dark">
                <i class="fas fa-history me-2 text-primary"></i>Audit Riwayat Kunjungan
            </h4>
            <p class="text-muted small mb-0">Verifikasi Snapshot Data & Lokasi Geospasial Petugas</p>
        </div>
        <div class="d-flex gap-2 align-items-center">
            <label class="small fw-bold text-muted d-none d-md-block">Periode Audit:</label>
            <input type="month" id="filter-periode" 
                   class="form-control form-control-sm border-0 shadow-sm rounded-pill px-3 fw-bold" 
                   style="width: 170px;" onchange="loadHistory()">
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div class="btn-group btn-group-sm shadow-sm p-1 bg-white rounded-pill">
            <button class="btn btn-dark rounded-pill px-3 filter-btn active" onclick="applyFilter('ALL', this)">Semua</button>
            <button class="btn btn-outline-warning rounded-pill px-3 filter-btn" onclick="applyFilter('JANJI', this)">Janji Bayar</button>
            <button class="btn btn-outline-danger rounded-pill px-3 filter-btn" onclick="applyFilter('RKS', this)">RKS/Segel</button>
            <button class="btn btn-outline-success rounded-pill px-3 filter-btn" onclick="applyFilter('BAYAR', this)">Lunas/Bayar</button>
        </div>
        <div class="text-end">
            <span class="badge bg-white text-dark border rounded-pill px-3 py-2 shadow-sm small" id="filter-count">
                Menghubungkan ke pangkalan data...
            </span>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive" style="max-height: 75vh;">
            <table class="table table-hover align-middle mb-0 bg-white">
                <thead class="bg-dark text-white">
                    <tr style="font-size: 0.7rem; letter-spacing: 0.5px; text-transform: uppercase;">
                        <th class="ps-3 py-3">Waktu & Petugas</th>
                        <th>Pelanggan (Snapshot)</th>
                        <th>Alamat Audit</th>
                        <th>Tugas (Curr/Rec)</th>
                        <th class="text-center">Hasil / Catatan</th>
                        <th class="text-end pe-3">Aksi</th>
                    </tr>
                </thead>
                <tbody id="history-body">
                    <tr>
                        <td colspan="6" class="text-center py-5">
                            <div class="spinner-border text-primary spinner-border-sm me-2"></div>
                            Sinkronisasi data audit...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    let rawHistoryData = []; 
    const toIDR = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);

    // [1] LOAD DATA DARI API
    async function loadHistory() {
        const picker = document.getElementById('filter-periode').value;
        if (!picker) return;

        try {
            const res = await fetch(`/api/history/kunjungan?periode=${picker}`);
            const result = await res.json();
            
            if (result.status === 'success') {
                rawHistoryData = result.data;
                applyFilter('ALL', document.querySelector('.filter-btn.active'));
            }
        } catch (e) {
            Swal.fire('Error', 'Gagal sinkronisasi data riwayat.', 'error');
        }
    }

    // [2] LOGIKA FILTER INSTAN
    function applyFilter(criteria, btn) {
        document.querySelectorAll('.filter-btn').forEach(b => {
            b.classList.remove('btn-dark', 'active');
            b.classList.add('btn-outline-secondary');
        });
        btn.classList.add('btn-dark', 'active');
        btn.classList.remove('btn-outline-secondary');

        let filtered = rawHistoryData;
        if (criteria !== 'ALL') {
            filtered = rawHistoryData.filter(item => {
                const ket = (item.keterangan || '').toUpperCase();
                if (criteria === 'JANJI') return ket.includes('JANJI');
                if (criteria === 'RKS') return ket.includes('RKS') || ket.includes('SEGEL');
                if (criteria === 'BAYAR') return ket.includes('BAYAR') || ket.includes('LUNAS');
                return false;
            });
        }

        document.getElementById('filter-count').innerText = `Total: ${filtered.length} Record`;
        renderTable(filtered);
    }

    // [3] RENDER TABEL DINAMIS
    function renderTable(data) {
        const body = document.getElementById('history-body');
        if (data.length === 0) {
            body.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted small italic">Tidak ada data kunjungan ditemukan untuk filter ini.</td></tr>';
            return;
        }

        body.innerHTML = data.map(item => {
            let statusBadge = 'bg-secondary';
            const ket = (item.keterangan || '').toUpperCase();
            if (ket.includes('JANJI')) statusBadge = 'bg-warning text-dark';
            else if (ket.includes('BAYAR') || ket.includes('LUNAS')) statusBadge = 'bg-success';
            else if (ket.includes('RKS') || ket.includes('SEGEL')) statusBadge = 'bg-danger';

            return `
            <tr class="border-bottom">
                <td class="ps-3">
                    <div class="fw-bold text-dark" style="font-size: 0.8rem;">${moment(item.waktu).format('DD/MM/YYYY')}</div>
                    <div class="text-primary small fw-bold">${moment(item.waktu).format('HH:mm')} WIB</div>
                    <div class="mt-1 small text-muted text-uppercase fw-bold" style="font-size: 0.6rem;">
                        <i class="fas fa-user-ninja me-1"></i>${item.petugas_name}
                    </div>
                </td>
                <td>
                    <div class="fw-bold text-dark text-uppercase" style="font-size: 0.75rem;">${item.nama || 'Entitas Konsumen'}</div>
                    <div class="badge bg-light text-dark border mt-1" style="font-size: 0.6rem;">ID: ${item.nomen}</div>
                </td>
                <td style="max-width: 250px;">
                    <div class="text-muted small" style="font-size: 0.65rem; line-height: 1.2;">
                        <i class="fas fa-map-marker-alt text-danger me-1"></i>${item.alamat || '-'}
                    </div>
                </td>
                <td>
                    <div class="small d-flex justify-content-between mb-1">
                        <span class="text-muted">Current:</span> 
                        <span class="fw-bold">${(item.mc || 0).toLocaleString()}</span>
                    </div>
                    <div class="small d-flex justify-content-between text-danger">
                        <span>Ardebt:</span> 
                        <span class="fw-bold">${(item.ardebt || 0).toLocaleString()}</span>
                    </div>
                </td>
                <td class="text-center">
                    <span class="badge ${statusBadge} px-2 py-1 text-uppercase mb-1" style="font-size: 0.6rem;">${item.keterangan}</span>
                    <div class="text-muted italic" style="font-size: 0.6rem;">"${item.catatan || '-'}"</div>
                </td>
                <td class="text-end pe-3">
                    <div class="btn-group shadow-sm">
                        <button class="btn btn-sm btn-light border" onclick="viewPhoto('${item.foto_path}')" title="Bukti Foto">
                            <i class="fas fa-camera text-primary"></i>
                        </button>
                        <a href="https://www.google.com/maps?q=${item.latitude},${item.longitude}" 
                           target="_blank" class="btn btn-sm btn-light border" title="Lokasi GPS">
                            <i class="fas fa-map-marked-alt text-success"></i>
                        </a>
                    </div>
                </td>
            </tr>`;
        }).join('');
    }

    function viewPhoto(path) {
        if(!path || path === 'None') return Swal.fire('Info', 'Foto dokumentasi tidak tersedia.', 'info');
        Swal.fire({
            imageUrl: `/static/uploads/kunjungan/${path}`,
            imageAlt: 'Bukti Audit Lapangan',
            confirmButtonText: 'Tutup',
            customClass: { popup: 'rounded-4' }
        });
    }

    // Inisialisasi Periode Saat Ini
    document.addEventListener('DOMContentLoaded', () => {
        const now = new Date();
        const currentPeriod = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        document.getElementById('filter-periode').value = currentPeriod;
        loadHistory();
    });
</script>
{% endblock %}
