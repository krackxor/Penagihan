{% extends "base.html" %}

{% block content %}
<style>
    :root {
        --primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        --danger-gradient: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
    }
    
    .nav-pills-premium {
        background: white;
        padding: 0.5rem;
        border-radius: 1rem;
        border: 1px solid #f1f5f9;
        display: flex;
        gap: 0.5rem;
    }
    .nav-pills-premium .nav-link {
        flex: 1;
        border-radius: 0.75rem;
        color: #64748b;
        font-weight: 700;
        font-size: 0.8rem;
        padding: 0.75rem;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        border: 1px solid transparent;
    }
    .nav-pills-premium .nav-link:hover { background: #f8fafc; color: #2563eb; }
    .nav-pills-premium .nav-link.active {
        background: var(--primary-gradient);
        color: white;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    /* Risk Tab Special Style */
    .nav-pills-premium .nav-link.risk-tab.active {
        background: var(--danger-gradient);
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .card-hover:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05) !important; border-color: #2563eb !important; }
    
    .risk-alert {
        background: #fef2f2;
        border-left: 5px solid #ef4444;
        border-radius: 1rem;
        padding: 1.5rem;
    }

    .fw-800 { font-weight: 800; }
</style>

<div class="px-2 pb-5 animate__animated animate__fadeIn">
    
    <div class="pt-4 mb-4 text-center">
        <h4 class="fw-bold mb-1 text-dark">
            <i class="fa-solid fa-chart-pie me-2 text-primary"></i>Analisis Pelunasan
        </h4>
        <p class="text-muted small fw-semibold">Audit Tren Likuiditas & Risiko Piutang</p>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-4 mx-1 bg-white border">
        <div class="card-body p-2">
            <div class="input-group">
                <span class="input-group-text bg-white border-0 ps-3"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                <input type="text" id="globalSearch" class="form-control border-0 shadow-none fw-bold small" 
                       placeholder="Cari IDPEL atau Nama..." onkeyup="smartFilter()">
            </div>
        </div>
    </div>

    <ul class="nav nav-pills-premium mb-4 mx-1" id="historyTab" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" id="undue-tab" data-bs-toggle="tab" data-bs-target="#undue-pane">
                <i class="fa-solid fa-building-columns"></i> BANK
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" id="current-tab" data-bs-toggle="tab" data-bs-target="#current-pane">
                <i class="fa-solid fa-user-check"></i> SERVICE
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link risk-tab text-danger" id="macet-tab" data-bs-toggle="tab" data-bs-target="#macet-pane">
                <i class="fa-solid fa-triangle-exclamation"></i> RISK
            </button>
        </li>
    </ul>

    <div class="tab-content" id="historyTabContent">
        
        <div class="tab-pane fade show active" id="undue-pane">
            <div id="list-undue" class="pane-container">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary"></div>
                    <p class="mt-2 text-muted small fw-bold">Memuat data bank...</p>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="current-pane">
            <div id="list-current" class="pane-container">
                <div class="text-center py-5">
                    <div class="spinner-border text-warning"></div>
                    <p class="mt-2 text-muted small fw-bold">Memuat data lapangan...</p>
                </div>
            </div>
        </div>

        <div class="tab-pane fade" id="macet-pane">
            <div class="risk-alert mb-4 shadow-sm animate__animated animate__fadeIn">
                <div class="d-flex align-items-center">
                    <div class="bg-white p-2 rounded-circle shadow-sm me-3 border border-danger border-opacity-25">
                        <i class="fa-solid fa-radiation text-danger fa-lg animate__animated animate__pulse animate__infinite"></i>
                    </div>
                    <div>
                        <h6 class="fw-bold text-danger mb-0 text-uppercase" style="font-size: 0.8rem;">Prioritas Penindakan</h6>
                        <small class="text-dark fw-bold opacity-75" style="font-size: 0.65rem;">Konsumen dengan eksposur tunggakan kritis (> 2 bulan).</small>
                    </div>
                </div>
            </div>
            
            <div id="list-macet" class="pane-container">
                <div class="text-center py-5">
                    <div class="spinner-border text-danger"></div>
                    <p class="mt-2 text-muted small fw-bold">Menganalisis risiko...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const toIDR = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);

    function smartFilter() {
        const q = document.getElementById('globalSearch').value.toLowerCase();
        const cards = document.querySelectorAll('.pane-container .card');
        cards.forEach(card => {
            const text = card.getAttribute('data-search').toLowerCase();
            card.style.display = text.includes(q) ? 'block' : 'none';
        });
    }

    async function loadHistoryAnalysis() {
        try {
            const res = await fetch('/api/history/analisis-bayar');
            const result = await res.json();
            const data = result.data || [];
            
            const undueData = data.filter(d => d.tipe_pembayaran === 'Undue');
            const currentData = data.filter(d => d.tipe_pembayaran === 'Current');

            renderCards(undueData, 'list-undue', 'border-primary', 'SETTLED BANK', 'text-primary', 'bg-primary');
            renderCards(currentData, 'list-current', 'border-warning', 'FIELD COLLECT', 'text-warning', 'bg-warning');
        } catch (e) {
            console.error("Gagal sinkronisasi data audit.");
        }
    }

    function renderCards(data, elementId, borderClass, sourceLabel, textClass, bgClass) {
        const container = document.getElementById(elementId);
        if (!data.length) {
            container.innerHTML = `
                <div class="text-center py-5 text-muted">
                    <i class="fa-solid fa-box-open fa-3x mb-3 opacity-25"></i>
                    <p class="small fw-bold">Tidak ada transaksi tercatat.</p>
                </div>`;
            return;
        }

        container.innerHTML = data.map(item => `
            <div class="card border-0 shadow-sm rounded-4 mb-3 mx-1 bg-white card-hover border-start border-4 ${borderClass} animate__animated animate__fadeInUp" 
                 data-search="${item.nomen} ${item.nama || ''} ${item.periode}">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div>
                            <span class="badge ${bgClass} bg-opacity-10 ${textClass} fw-bold rounded-pill px-2 py-1" style="font-size: 0.6rem;">${sourceLabel}</span>
                        </div>
                        <small class="text-muted fw-bold font-monospace" style="font-size: 0.65rem;">${item.periode}</small>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="fw-800 mb-0 text-dark small">IDPEL: ${item.nomen}</h6>
                            <small class="text-muted" style="font-size: 0.6rem;">${item.tgl_bayar}</small>
                        </div>
                        <div class="text-end">
                            <span class="d-block fw-800 text-success" style="font-size: 0.9rem;">${toIDR(item.nominal || 0)}</span>
                        </div>
                    </div>
                </div>
            </div>`).join('');
    }

    async function loadRadarMacet() {
        const container = document.getElementById('list-macet');
        try {
            const res = await fetch('/api/history/nomen-macet');
            const result = await res.json();
            const data = result.data || [];

            if (!data.length) {
                container.innerHTML = `
                    <div class="text-center py-5 text-success">
                        <i class="fa-solid fa-circle-check fa-3x mb-3"></i>
                        <h6 class="fw-bold">STATUS AMAN</h6>
                        <p class="small">Tidak ada risiko piutang kritis.</p>
                    </div>`;
                return;
            }

            container.innerHTML = data.map(item => `
                <div class="card border-0 shadow-sm rounded-4 mb-3 mx-1 border-start border-4 border-danger bg-white card-hover animate__animated animate__fadeInUp"
                     data-search="${item.nomen} ${item.nama}">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <span class="badge bg-danger bg-opacity-10 text-danger rounded-pill fw-bold px-2 py-1" style="font-size: 0.6rem;">
                                <i class="fa-solid fa-clock me-1"></i>MACET ${item.record_bulan_macet} BLN
                            </span>
                            <small class="text-muted fw-bold font-monospace" style="font-size: 0.65rem;">ID: ${item.nomen}</small>
                        </div>
                        
                        <h6 class="fw-800 mb-2 text-dark text-uppercase text-truncate" style="font-size: 0.85rem;">${item.nama}</h6>
                        
                        <div class="bg-light rounded-3 p-2 d-flex justify-content-between align-items-center border border-light">
                            <div>
                                <small class="text-muted d-block fw-bold" style="font-size: 0.55rem;">BILL TERAKHIR</small>
                                <span class="fw-800 text-dark small">${toIDR(item.nominal_terakhir)}</span>
                            </div>
                            <div class="text-end">
                                <small class="text-danger d-block fw-bold" style="font-size: 0.55rem;">TOTAL PIUTANG</small>
                                <span class="fw-800 text-danger small">${toIDR(item.total_tunggakan_akumulasi)}</span>
                            </div>
                        </div>
                    </div>
                </div>`).join('');
        } catch (e) {
            container.innerHTML = '<div class="text-center py-5 text-danger small fw-bold">Gagal memuat data risiko.</div>';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadHistoryAnalysis(); 
        
        // Lazy load risk tab
        document.getElementById('macet-tab').addEventListener('shown.bs.tab', () => {
            if (document.getElementById('list-macet').innerHTML.includes('spinner')) {
                loadRadarMacet();
            }
        });
    });
</script>
{% endblock %}
