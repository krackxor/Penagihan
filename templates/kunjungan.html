{% extends "base.html" %}

{% block title %}Lapor Kunjungan Lapangan - Sinergi Mobile{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 500px; margin: auto;">
    <div class="card border-0 shadow-lg" style="border-radius: 15px; overflow: hidden;">
        <div class="card-header bg-primary text-white p-3 text-center border-0">
            <h5 class="mb-0 fw-bold"><i class="fas fa-camera me-2"></i>Laporan Kunjungan</h5>
            <small class="text-white-50">Sistem Sinergi Lapangan V16.6</small>
        </div>

        <div class="card-body p-4 bg-white">
            <form id="formKunjungan" enctype="multipart/form-data">
                
                <div class="mb-3">
                    <label class="form-label fw-bold text-muted small">NOMEN PELANGGAN</label>
                    <div class="input-group input-group-lg shadow-sm">
                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-hashtag text-primary"></i></span>
                        <input type="number" class="form-control border-start-0 fw-bold text-primary" id="nomen" name="nomen" placeholder="Contoh: 60313566" required readonly>
                    </div>
                    <div class="form-text mt-1 text-info small"><i class="fas fa-lock"></i> Nomen otomatis terkunci dari daftar Belum Bayar.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-muted small">NAMA PETUGAS</label>
                    <input type="text" class="form-control shadow-sm" name="auditor_name" value="{{ session.get('username', 'Tim Lapangan') }}" placeholder="Nama Anda" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-muted small">HASIL KUNJUNGAN</label>
                    <select class="form-select form-select-lg shadow-sm fw-semibold" id="hasil" name="hasil_kunjungan" required onchange="toggleJanjiBayar()">
                        <option value="" disabled selected>-- Pilih Status di Lapangan --</option>
                        <option value="Janji Bayar" class="text-success fw-bold">✔️ Janji Bayar</option>
                        <option value="Rumah Kosong">🏠 Rumah Kosong / Digembok</option>
                        <option value="Alamat Tidak Ditemukan">❓ Alamat Tidak Ditemukan</option>
                        <option value="Meter Dicabut / Rusak">🔧 Meter Dicabut / Rusak</option>
                        <option value="Tutup Bak Berat">🪨 Tutup Bak Berat / Cor</option>
                        <option value="Menolak Bayar">❌ Menolak Bayar</option>
                        <option value="Lainnya">Lainnya (Tulis di keterangan)</option>
                    </select>
                </div>

                <div class="mb-3 p-3 bg-success-subtle rounded-3 d-none border border-success" id="divJanjiBayar">
                    <label class="form-label fw-bold text-success small"><i class="fas fa-calendar-check me-1"></i>TANGGAL JANJI BAYAR</label>
                    <input type="date" class="form-control form-control-lg shadow-sm text-success fw-bold" name="tgl_janji_bayar" id="tgl_janji_bayar">
                </div>

                <div class="mb-3 p-3 bg-light rounded-3 border border-secondary border-dashed">
                    <label class="form-label fw-bold text-dark small"><i class="fas fa-image me-1"></i>FOTO LOKASI / METERAN</label>
                    <input type="file" class="form-control form-control-lg shadow-sm" name="foto" id="foto" accept="image/*" capture="environment" required>
                    <div class="form-text mt-2 text-muted small"><i class="fas fa-info-circle"></i> Gunakan kamera HP langsung agar lokasi tersimpan akurat.</div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-muted small">KETERANGAN TAMBAHAN</label>
                    <textarea class="form-control shadow-sm" name="keterangan" rows="3" placeholder="Contoh: Rumah sepi, pagar digembok, meteran di dalam..."></textarea>
                </div>

                <input type="hidden" name="lat" id="lat">
                <input type="hidden" name="lng" id="lng">

                <button type="submit" id="btnSubmit" class="btn btn-primary btn-lg w-100 fw-bold shadow">
                    <i class="fas fa-cloud-upload-alt me-2"></i>Kirim Laporan ke Server
                </button>
            </form>

            <div id="alertBox" class="mt-4 d-none text-center p-3 rounded-3"></div>
        </div>
    </div>
</div>

<script>
    // 1. Ambil Nomen dari URL param (Contoh: /kunjungan?nomen=60313566)
    const urlParams = new URLSearchParams(window.location.search);
    const nomenParam = urlParams.get('nomen');
    if(nomenParam) {
        document.getElementById('nomen').value = nomenParam;
    } else {
        // Jika dibuka manual tanpa nomen, biarkan input bisa diedit
        document.getElementById('nomen').readOnly = false;
    }

    // 2. Logic memunculkan input Tanggal Janji Bayar
    function toggleJanjiBayar() {
        const hasil = document.getElementById('hasil').value;
        const divJanji = document.getElementById('divJanjiBayar');
        const inputJanji = document.getElementById('tgl_janji_bayar');
        
        if(hasil === 'Janji Bayar') {
            divJanji.classList.remove('d-none');
            inputJanji.required = true;
            // Set minimal tanggal hari ini
            const today = new Date().toISOString().split('T')[0];
            inputJanji.setAttribute('min', today);
        } else {
            divJanji.classList.add('d-none');
            inputJanji.required = false;
            inputJanji.value = '';
        }
    }

    // 3. Auto GPS - Ambil titik kordinat saat halaman dibuka
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                document.getElementById('lat').value = position.coords.latitude;
                document.getElementById('lng').value = position.coords.longitude;
            },
            (error) => {
                console.warn("GPS Tidak Diizinkan oleh User HP.");
            },
            { enableHighAccuracy: true } // Minta akurasi tinggi
        );
    }

    // 4. Submit via AJAX (Tidak me-refresh halaman)
    document.getElementById('formKunjungan').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('btnSubmit');
        const alertBox = document.getElementById('alertBox');
        
        // Ubah tombol jadi loading state
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Mengirim...';
        btn.disabled = true;
        alertBox.classList.add('d-none');

        const formData = new FormData(this);

        try {
            const res = await fetch('/api/kunjungan/submit', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            
            alertBox.className = `mt-4 p-3 rounded-3 fw-bold shadow-sm alert alert-${data.status === 'success' ? 'success' : 'danger'}`;
            alertBox.innerHTML = `<i class="fas fa-${data.status === 'success' ? 'check-circle' : 'exclamation-triangle'} fs-4 mb-2 d-block"></i>${data.message}`;
            alertBox.classList.remove('d-none');

            if(data.status === 'success') {
                this.reset(); 
                document.getElementById('divJanjiBayar').classList.add('d-none');
                
                // Jika tadi nomen di-lock dari URL, kembalikan isinya
                if(nomenParam) document.getElementById('nomen').value = nomenParam;
                
                // Beri opsi kembali ke halaman Belum Bayar
                alertBox.innerHTML += `<br><a href="/belum-bayar" class="btn btn-sm btn-outline-success mt-3"><i class="fas fa-arrow-left me-1"></i> Kembali ke Daftar Tagihan</a>`;
            }
        } catch (err) {
            alertBox.className = 'mt-4 p-3 rounded-3 fw-bold shadow-sm alert alert-danger';
            alertBox.innerHTML = '<i class="fas fa-wifi fs-4 mb-2 d-block"></i>Koneksi terputus. Pastikan sinyal internet HP stabil lalu coba lagi.';
            alertBox.classList.remove('d-none');
        } finally {
            // Kembalikan kondisi tombol
            btn.innerHTML = '<i class="fas fa-cloud-upload-alt me-2"></i>Kirim Laporan ke Server';
            btn.disabled = false;
        }
    });
</script>

<style>
    /* Styling khusus agar tampil cantik di HP */
    body { background-color: #f8f9fa; }
    .border-dashed { border-style: dashed !important; border-width: 2px !important; }
    .form-control-lg, .form-select-lg { font-size: 1rem; border-radius: 10px; }
    .input-group-text { border-radius: 10px 0 0 10px; }
    .btn-lg { border-radius: 10px; padding: 12px; }
    .bg-success-subtle { background-color: #d1e7dd !important; }
</style>
{% endblock %}
