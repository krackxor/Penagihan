{% extends "base.html" %}

{% block content %}
<div class="animate__animated animate__fadeIn px-2 pb-5" style="background: #f4f7fa; min-height: 100vh;">
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-1 text-dark">Executive Analytics 💎</h4>
            <p class="text-muted small mb-0" id="current-period-label">Memproses data...</p>
        </div>
        <div class="dropdown">
            <button class="btn btn-white shadow-sm rounded-4 px-3 dropdown-toggle" type="button" data-bs-toggle="dropdown">
                <i class="fas fa-filter text-primary me-2"></i>Filter
            </button>
            <ul class="dropdown-menu border-0 shadow-lg rounded-4">
                <li><a class="dropdown-item" href="#" onclick="loadDashboardData('nomen')">Urut Nomen</a></li>
                <li><a class="dropdown-item" href="#" onclick="loadDashboardData('nominal')">Urut Rupiah</a></li>
            </ul>
        </div>
    </div>

    <div class="card border-0 shadow-lg mb-4 rounded-5 bg-primary text-white overflow-hidden">
        <div class="card-body p-4 position-relative">
            <div class="row align-items-center position-relative z-1">
                <div class="col-7">
                    <h6 class="text-white-50 small text-uppercase fw-bold mb-1">Efficiency Index</h6>
                    <h1 class="fw-bold mb-0" id="stat-efektivitas" style="font-size: 3.5rem;">0%</h1>
                    <div id="stat-trend" class="small mt-2">
                        <span class="badge bg-white bg-opacity-25 rounded-pill px-3">Tracking Live Data</span>
                    </div>
                </div>
                <div class="col-5 text-end">
                    <canvas id="miniChart" style="max-height: 80px;"></canvas>
                </div>
            </div>
            <div class="mt-4 p-3 bg-white bg-opacity-10 rounded-4">
                <div class="d-flex justify-content-between small mb-2">
                    <span class="opacity-75">Recovery Rate (Nominal)</span>
                    <span class="fw-bold" id="stat-recovery">0%</span>
                </div>
                <div class="progress bg-white bg-opacity-20" style="height: 6px;">
                    <div id="progress-recovery" class="progress-bar bg-white" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-body p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-bold mb-0"><i class="fas fa-chart-line me-2 text-primary"></i>Tren Produktivitas</h6>
                <div class="btn-group btn-group-sm">
                    <input type="radio" class="btn-check" name="v-mode" id="v-nomen" checked onchange="updateMainChart('nomen')">
                    <label class="btn btn-outline-primary px-3" for="v-nomen">Pelanggan</label>
                    <input type="radio" class="btn-check" name="v-mode" id="v-nominal" onchange="updateMainChart('nominal')">
                    <label class="btn btn-outline-primary px-3" for="v-nominal">Rupiah</label>
                </div>
            </div>
            <div style="height: 250px;">
                <canvas id="mainChart"></canvas>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3 px-2">
        <h6 class="fw-bold mb-0">Star Performers ✨</h6>
        <span class="text-muted small" id="total-officers-count">0 Petugas</span>
    </div>
    
    <div id="table-leaderboard" class="mb-5">
        </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
let mainChartObj, miniChartObj;
let rawData = [];

async function loadDashboardData() {
    try {
        const res = await fetch('/api/performance/full-stats');
        const data = await res.json();
        rawData = data;
        const g = data.global;
        const leaders = data.history_tim;

        // 1. Update Global Card
        const effNomen = g.total_nomen_mc > 0 ? ((g.total_lunas_nomen / g.total_nomen_mc) * 100).toFixed(1) : 0;
        const effNominal = g.total_nominal_mc > 0 ? (( (g.nom_undue + g.nom_current) / g.total_nominal_mc) * 100).toFixed(1) : 0;
        
        document.getElementById('stat-efektivitas').innerText = effNomen + '%';
        document.getElementById('stat-recovery').innerText = effNominal + '%';
        document.getElementById('progress-recovery').style.width = effNominal + '%';
        document.getElementById('current-period-label').innerText = `Target Periode: ${data.target_mc_period}`;
        document.getElementById('total-officers-count').innerText = `${leaders.length} Petugas Terdeteksi`;

        // 2. Mini Trend Chart
        renderMiniChart(leaders);

        // 3. Main Productivity Chart
        updateMainChart('nomen');

        // 4. Leaderboard with Achievement Badges
        renderLeaderboard(leaders);

    } catch (e) {
        console.error("Dashboard Error:", e);
    }
}

function renderMiniChart(leaders) {
    const ctx = document.getElementById('miniChart').getContext('2d');
    if(miniChartObj) miniChartObj.destroy();
    miniChartObj = new Chart(ctx, {
        type: 'line',
        data: {
            labels: leaders.map(l => l.petugas),
            datasets: [{
                data: leaders.map(l => l.jml_lunas),
                borderColor: 'rgba(255,255,255,0.8)',
                borderWidth: 2,
                tension: 0.4,
                pointRadius: 0,
                fill: true,
                backgroundColor: 'rgba(255,255,255,0.1)'
            }]
        },
        options: { plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } }, maintainAspectRatio: false }
    });
}

function updateMainChart(mode) {
    const ctx = document.getElementById('mainChart').getContext('2d');
    const leaders = rawData.history_tim;
    if(mainChartObj) mainChartObj.destroy();

    const dataSet = mode === 'nomen' ? leaders.map(l => l.jml_lunas) : leaders.map(l => l.nom_lunas);
    const label = mode === 'nomen' ? 'Total Lunas (Pel)' : 'Total Lunas (Rp)';

    mainChartObj = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: leaders.map(l => l.petugas),
            datasets: [{
                label: label,
                data: dataSet,
                backgroundColor: '#0d6efd',
                borderRadius: 10,
                barThickness: 12
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, grid: { color: '#f0f0f0' }, ticks: { font: { size: 10 } } },
                x: { grid: { display: false }, ticks: { font: { size: 9, weight: 'bold' } } }
            }
        }
    });
}

function renderLeaderboard(leaders) {
    const container = document.getElementById('table-leaderboard');
    const toIDR = (n) => new Intl.NumberFormat('id-ID').format(n);

    // Sort by Lunas
    const sorted = [...leaders].sort((a,b) => b.jml_lunas - a.jml_lunas);

    container.innerHTML = sorted.map((l, index) => {
        // Achievement Badge Logic
        let badge = '';
        if (index === 0) badge = '<span class="badge bg-warning text-dark ms-2" style="font-size:0.5rem;"><i class="fas fa-crown me-1"></i>TOP NOMEN</span>';
        if (l.nom_lunas > 5000000) badge += '<span class="badge bg-info text-white ms-1" style="font-size:0.5rem;"><i class="fas fa-money-bill-wave me-1"></i>BIG REVENUE</span>';
        if (l.jml_rks > 5) badge += '<span class="badge bg-secondary text-white ms-1" style="font-size:0.5rem;"><i class="fas fa-home me-1"></i>RKS DETECTOR</span>';

        return `
            <div class="card mb-3 border-0 shadow-sm rounded-4 overflow-hidden animate__animated animate__fadeInUp" style="animation-delay: ${index * 0.1}s">
                <div class="card-body p-3">
                    <div class="d-flex align-items-center mb-3">
                        <div class="bg-primary text-white rounded-circle me-3 fw-bold d-flex align-items-center justify-content-center" style="width:40px; height:40px; font-size:0.9rem;">
                            ${index + 1}
                        </div>
                        <div class="flex-grow-1">
                            <div class="d-flex align-items-center">
                                <h6 class="fw-bold mb-0 text-dark" style="font-size:0.9rem;">${l.petugas}</h6>
                                ${badge}
                            </div>
                            <small class="text-muted" style="font-size:0.7rem;">Wilayah Operasional Sunter</small>
                        </div>
                        <div class="text-end">
                            <h6 class="fw-bold text-primary mb-0">${((l.jml_lunas/(l.jml_lunas+l.jml_janji+l.jml_rks)*100)||0).toFixed(0)}%</h6>
                            <small class="text-muted" style="font-size:0.6rem;">Success Rate</small>
                        </div>
                    </div>
                    
                    <div class="row g-2">
                        <div class="col-4">
                            <div class="p-2 bg-light rounded-3 text-center">
                                <small class="text-muted d-block" style="font-size:0.55rem;">LUNAS</small>
                                <span class="fw-bold text-dark small">${l.jml_lunas}</span>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="p-2 bg-light rounded-3 text-center">
                                <small class="text-muted d-block" style="font-size:0.55rem;">NOMINAL</small>
                                <span class="fw-bold text-dark small">Rp ${toIDR(l.nom_lunas)}</span>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="p-2 bg-light rounded-3 text-center">
                                <small class="text-muted d-block" style="font-size:0.55rem;">JANJI/RKS</small>
                                <span class="fw-bold text-dark small">${l.jml_janji + l.jml_rks}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

document.addEventListener('DOMContentLoaded', loadDashboardData);
</script>

<style>
    .btn-check:checked + .btn-outline-primary { background-color: #0d6efd; color: white; }
    .card { transition: all 0.3s ease; }
    .card:hover { transform: translateY(-3px); }
</style>
{% endblock %}
