{% extends "base.html" %}

{% block content %}
<div class="animate__animated animate__fadeIn px-2 pb-5" style="background: #f8f9fa; min-height: 100vh;">
    <div class="pt-4 mb-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h4 class="fw-bold mb-0 text-dark">Performance Tracker ⚡</h4>
            <span class="badge bg-primary-subtle text-primary rounded-pill px-3">
                <i class="fas fa-calendar-alt me-1"></i> <span id="current-period-label">...</span>
            </span>
        </div>
        <div class="input-group input-group-sm shadow-sm rounded-4 overflow-hidden border-0">
            <span class="input-group-text bg-white border-0"><i class="fas fa-search text-muted"></i></span>
            <input type="text" id="searchPetugas" class="form-control border-0 py-2" placeholder="Cari nama petugas..." onkeyup="filterLeaderboard()">
        </div>
    </div>

    <div class="row g-2 mb-4" id="podium-highlights"></div>

    <div class="card border-0 shadow-sm rounded-4 mb-4">
        <div class="card-body p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-bold mb-0 small"><i class="fas fa-chart-line me-2 text-primary"></i>Output Analysis</h6>
                <div class="btn-group btn-group-sm shadow-sm" style="border-radius: 8px; overflow: hidden;">
                    <input type="radio" class="btn-check" name="v-mode" id="v-nomen" checked onchange="updateMainChart('nomen')">
                    <label class="btn btn-white px-3 border-0" for="v-nomen">Data</label>
                    <input type="radio" class="btn-check" name="v-mode" id="v-nominal" onchange="updateMainChart('nominal')">
                    <label class="btn btn-white px-3 border-0" for="v-nominal">Rupiah</label>
                </div>
            </div>
            <div style="height: 180px;">
                <canvas id="mainChart"></canvas>
            </div>
        </div>
    </div>

    <div class="px-1 mb-3 d-flex justify-content-between align-items-center">
        <h6 class="fw-bold mb-0">Petugas Ranking</h6>
        <div class="dropdown">
            <button class="btn btn-sm btn-white rounded-pill px-3 dropdown-toggle shadow-sm border-0" type="button" data-bs-toggle="dropdown">
                <i class="fas fa-sort-amount-down me-1"></i> Filter
            </button>
            <ul class="dropdown-menu border-0 shadow-lg rounded-4">
                <li><a class="dropdown-item small" href="#" onclick="renderLeaderboard('jml_lunas')">Banyak Lunas</a></li>
                <li><a class="dropdown-item small" href="#" onclick="renderLeaderboard('nom_lunas')">Rupiah Tertinggi</a></li>
                <li><a class="dropdown-item small" href="#" onclick="renderLeaderboard('success_rate')">Success Rate</a></li>
            </ul>
        </div>
    </div>
    
    <div id="table-leaderboard" class="mb-5"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
let mainChartObj;
let rawOfficers = [];

async function loadDashboardData() {
    try {
        const res = await fetch('/api/performance/full-stats');
        const data = await res.json();
        
        rawOfficers = data.history_tim.map(off => ({
            ...off,
            success_rate: ((off.jml_lunas / (off.jml_lunas + off.jml_janji + off.jml_rks)) * 100) || 0
        }));

        document.getElementById('current-period-label').innerText = data.target_mc_period;
        updateMainChart('nomen');
        renderPodium(rawOfficers);
        renderLeaderboard('jml_lunas');

    } catch (e) { console.error(e); }
}

function renderPodium(data) {
    const sorted = [...data].sort((a, b) => b.jml_lunas - a.jml_lunas).slice(0, 3);
    const podiumContainer = document.getElementById('podium-highlights');
    const meta = [
        { color: '#FFD700', icon: 'fa-crown', label: '1st' },
        { color: '#95a5a6', icon: 'fa-medal', label: '2nd' },
        { color: '#d35400', icon: 'fa-award', label: '3rd' }
    ];

    podiumContainer.innerHTML = sorted.map((p, i) => `
        <div class="col-4">
            <div class="card border-0 shadow-sm rounded-4 text-center p-2 h-100 bg-white">
                <div class="position-absolute top-0 start-50 translate-middle-x mt-n2">
                    <span class="badge rounded-pill shadow-sm" style="background:${meta[i].color}; font-size:0.5rem;">${meta[i].label}</span>
                </div>
                <div class="mx-auto mt-2 mb-1 d-flex align-items-center justify-content-center rounded-circle" 
                     style="width: 40px; height: 40px; background: ${meta[i].color}20; color: ${meta[i].color}">
                    <i class="fas ${meta[i].icon}"></i>
                </div>
                <h6 class="fw-bold mb-0 small text-truncate" style="font-size:0.7rem;">${p.petugas}</h6>
                <p class="fw-bold text-dark mb-0" style="font-size: 0.8rem;">${p.jml_lunas}</p>
            </div>
        </div>
    `).join('');
}

function updateMainChart(mode) {
    const ctx = document.getElementById('mainChart').getContext('2d');
    if(mainChartObj) mainChartObj.destroy();
    const dataSet = mode === 'nomen' ? rawOfficers.map(l => l.jml_lunas) : rawOfficers.map(l => l.nom_lunas);
    
    mainChartObj = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: rawOfficers.map(l => l.petugas.split(' ')[0]),
            datasets: [{
                data: dataSet,
                backgroundColor: '#0d6efd',
                borderRadius: 5,
                barThickness: 15
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, grid:{drawBorder:false, color:'#f0f0f0'} }, x: { grid: { display: false } } }
        }
    });
}

function getGelar(l, index, sortBy) {
    if (index === 0 && sortBy === 'jml_lunas') return '<span class="badge bg-warning-subtle text-warning ms-1" style="font-size:0.5rem;">The Closer</span>';
    if (l.nom_lunas > 10000000) return '<span class="badge bg-success-subtle text-success ms-1" style="font-size:0.5rem;">Big Earner</span>';
    if (l.success_rate > 80) return '<span class="badge bg-info-subtle text-info ms-1" style="font-size:0.5rem;">Sniper</span>';
    return '';
}

function renderLeaderboard(sortBy) {
    const container = document.getElementById('table-leaderboard');
    const toIDR = (n) => new Intl.NumberFormat('id-ID').format(n);
    const sorted = [...rawOfficers].sort((a, b) => b[sortBy] - a[sortBy]);

    container.innerHTML = sorted.map((l, index) => `
        <div class="card mb-2 border-0 shadow-sm rounded-4 petugas-item animate__animated animate__fadeInUp">
            <div class="card-body p-3">
                <div class="d-flex align-items-center">
                    <div class="fw-bold text-muted me-3" style="width: 20px; font-size:0.8rem;">${index + 1}</div>
                    <div class="flex-grow-1">
                        <div class="d-flex align-items-center">
                            <h6 class="fw-bold mb-0 text-nama" style="font-size: 0.85rem;">${l.petugas}</h6>
                            ${getGelar(l, index, sortBy)}
                        </div>
                        <div class="progress mt-2" style="height: 4px; width: 70%;">
                            <div class="progress-bar rounded-pill" style="width: ${l.success_rate}%"></div>
                        </div>
                    </div>
                    <div class="text-end">
                        <span class="d-block fw-bold text-dark" style="font-size: 0.8rem;">${l.jml_lunas} <small class="text-muted">Pel</small></span>
                        <span class="text-primary fw-bold" style="font-size: 0.7rem;">Rp ${toIDR(l.nom_lunas)}</span>
                    </div>
                </div>
                <div class="d-flex justify-content-between mt-2 pt-2 border-top border-light" style="font-size: 0.6rem;">
                    <div class="text-muted">Efficiency: <b class="text-dark">${l.success_rate.toFixed(1)}%</b></div>
                    <div class="text-muted">Kunjungan: <b class="text-dark">${l.jml_lunas + l.jml_janji + l.jml_rks}</b></div>
                </div>
            </div>
        </div>
    `).join('');
}

function filterLeaderboard() {
    let input = document.getElementById('searchPetugas').value.toLowerCase();
    let items = document.getElementsByClassName('petugas-item');
    for (let item of items) {
        let name = item.querySelector('.text-nama').innerText.toLowerCase();
        item.style.display = name.includes(input) ? "" : "none";
    }
}

document.addEventListener('DOMContentLoaded', loadDashboardData);
</script>

<style>
    .bg-primary-subtle { background-color: #e7f1ff; }
    .bg-warning-subtle { background-color: #fff3cd; }
    .bg-success-subtle { background-color: #d1e7dd; }
    .bg-info-subtle { background-color: #cff4fc; }
    .btn-white { background: white; color: #444; }
    .btn-check:checked + .btn-white { background: #0d6efd; color: white; }
    .mt-n2 { margin-top: -10px; }
</style>
{% endblock %}
