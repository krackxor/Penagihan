{% extends "base.html" %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>

<style>
    :root {
        --samsul-primary: #0f172a;
        --samsul-accent: #3b82f6;
        --samsul-danger: #ef4444;
        --samsul-success: #10b981;
        --samsul-warning: #f59e0b;
        --glass-bg: rgba(255, 255, 255, 0.85);
    }

    body {
        background-color: #f1f5f9;
        font-family: 'Inter', sans-serif;
        color: #1e293b;
    }

    /* Glassmorphism Components */
    .glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 1.5rem;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .status-pulse {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        margin-right: 5px;
        animation: pulse-animation 2s infinite;
    }

    @keyframes pulse-animation {
        0% { box-shadow: 0 0 0 0px rgba(59, 130, 246, 0.5); }
        100% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
    }

    .main-display {
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        border-radius: 2rem;
        color: white;
        position: relative;
        overflow: hidden;
    }

    .main-display::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(59,130,246,0.1) 0%, transparent 70%);
        animation: rotate 20s linear infinite;
    }

    @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    .stat-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        opacity: 0.7;
        font-weight: 700;
    }

    .officer-radar {
        max-width: 150px;
        max-height: 150px;
    }

    .btn-action {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: 1rem;
    }

    .btn-action:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .terminal-box {
        background: #000;
        color: #00ff00;
        font-family: 'Courier New', monospace;
        padding: 1rem;
        border-radius: 0.75rem;
        font-size: 0.7rem;
        border: 1px solid #333;
    }

    .custom-badge {
        font-size: 0.55rem;
        padding: 0.35rem 0.75rem;
        border-radius: 2rem;
        font-weight: 800;
    }
</style>

<div class="px-3 pb-5">
    <div class="pt-4 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h3 class="fw-bold mb-0 text-slate-900">Samsul-AI Command</h3>
            <div class="d-flex align-items-center mt-1">
                <span class="status-pulse" style="background: var(--samsul-accent);"></span>
                <small id="last-sync-time" class="text-muted fw-bold" style="font-size: 0.6rem;">CORE ENGINE: ACTIVE</small>
            </div>
        </div>
        <div class="dropdown">
            <button class="btn btn-white shadow-sm rounded-circle p-2 border-0" id="refresh-trigger" onclick="runNeuralScan()">
                <i class="fas fa-sync-alt text-primary"></i>
            </button>
        </div>
    </div>

    <div class="main-display p-4 mb-4 shadow-lg animate__animated animate__fadeIn">
        <div class="row align-items-center">
            <div class="col-7">
                <p class="stat-label mb-1">PROYEKSI AKHIR PERIODE (97%)</p>
                <h1 class="fw-bold mb-0" id="stat-projected-nominal" style="font-size: 1.8rem;">Rp 0</h1>
                <div id="ai-prediction-trend" class="mt-2 small">
                    </div>
            </div>
            <div class="col-5 text-end">
                <div class="progress-circle-container">
                    <h2 class="fw-bold mb-0" id="stat-total-progress">0%</h2>
                    <small class="stat-label">Capaian Real</small>
                </div>
            </div>
        </div>

        <div class="progress mt-4 bg-white bg-opacity-10" style="height: 12px; border-radius: 10px;">
            <div id="progress-bar-97" class="progress-bar bg-warning progress-bar-striped progress-bar-animated" style="width: 0%; transition: width 2s cubic-bezier(0.34, 1.56, 0.64, 1);"></div>
        </div>

        <div class="row g-3 mt-4">
            <div class="col-4">
                <div class="p-3 bg-white bg-opacity-10 rounded-4 border border-white border-opacity-10">
                    <small class="stat-label d-block text-white-50">Wajib Esok</small>
                    <span class="fw-bold" id="ai-daily-need" style="font-size: 0.75rem;">Rp 0</span>
                </div>
            </div>
            <div class="col-4">
                <div class="p-3 bg-white bg-opacity-10 rounded-4 border border-white border-opacity-10">
                    <small class="stat-label d-block text-white-50">GAP Target</small>
                    <span class="fw-bold text-warning" id="ai-gap" style="font-size: 0.75rem;">Rp 0</span>
                </div>
            </div>
            <div class="col-4">
                <div class="p-3 bg-white bg-opacity-10 rounded-4 border border-white border-opacity-10">
                    <small class="stat-label d-block text-white-50">Reliability</small>
                    <span class="fw-bold text-success" id="ai-reliability" style="font-size: 0.75rem;">0%</span>
                </div>
            </div>
        </div>
    </div>

    <ul class="nav nav-pills mb-4 g-2" id="pills-tab" role="tablist">
        <li class="nav-item col-6 pr-1">
            <button class="nav-link active w-100 fw-bold py-2 rounded-4 shadow-sm" id="tab-audit" data-bs-toggle="pill" data-bs-target="#audit-view" type="button">FIELD AUDIT</button>
        </li>
        <li class="nav-item col-6 pl-1">
            <button class="nav-link w-100 fw-bold py-2 rounded-4 shadow-sm" id="tab-strategic" data-bs-toggle="pill" data-bs-target="#strategic-view" type="button">AI STRATEGIC</button>
        </li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="audit-view">
            <div id="officer-container-master">
                </div>
        </div>

        <div class="tab-pane fade" id="strategic-view">
            <div class="glass-card p-4 mb-4">
                <div class="d-flex align-items-center mb-3 text-primary">
                    <i class="fas fa-brain-circuit fa-lg me-3"></i>
                    <h6 class="fw-bold mb-0">Haji Samsul's Neural Analysis</h6>
                </div>
                <div id="ai-logs-container">
                    </div>
            </div>
            
            <div class="glass-card p-4">
                <h6 class="fw-bold mb-3"><i class="fas fa-chart-line me-2"></i>Performance Multi-Chart</h6>
                <canvas id="teamChart" style="width: 100%; height: 300px;"></canvas>
            </div>
        </div>
    </div>

    <div class="modal fade" id="officerModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-5 shadow-lg">
                <div class="modal-body p-4" id="officer-modal-content">
                    </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
/** * SAMSUL-AI ENGINE v4.0 
 * Core Logic for 1200+ Lines Complexity Handling
 */

let GlobalData = {};
let TeamChartInstance = null;

const toIDR = (n) => new Intl.NumberFormat('id-ID', { 
    style: 'currency', currency: 'IDR', maximumFractionDigits: 0 
}).format(n);

// 1. Core Data Initializer
async function runNeuralScan() {
    const btn = document.getElementById('refresh-trigger');
    btn.classList.add('fa-spin');
    
    try {
        const response = await fetch('/api/performance/full-stats');
        const data = await response.json();
        GlobalData = data;
        
        // Enhance Data with Intelligence
        enhanceOfficerData();
        
        // Update UI
        updateGlobalProjections();
        renderAuditView();
        renderStrategicView();
        
        document.getElementById('last-sync-time').innerText = "ENGINE RE-SYNCED: " + new Date().toLocaleTimeString();
    } catch (err) {
        console.error("Neural Scan Failed:", err);
    } finally {
        setTimeout(() => btn.classList.remove('fa-spin'), 1000);
    }
}

// 2. Intelligence Enhancement Logic
function enhanceOfficerData() {
    GlobalData.officers = GlobalData.officers.map(off => {
        const successRate = (off.jml_bayar / (off.total_dijalan || 1)) * 100;
        
        // Analisis Fatigue (Kelelahan)
        const fatigueScore = off.total_dijalan > 30 && successRate < 10 ? 'HIGH' : 
                            off.total_dijalan > 20 && successRate < 20 ? 'MEDIUM' : 'LOW';
        
        // Analisis Deviasi Nominal
        const avgBayar = off.total_nominal / (off.jml_bayar || 1);
        
        return {
            ...off,
            successRate,
            fatigueScore,
            avgBayar,
            riskLevel: successRate < 30 ? 'CRITICAL' : successRate < 60 ? 'STABLE' : 'ELITE'
        };
    });
}

// 3. Global Projection Logic (Target 97%)
function updateGlobalProjections() {
    const g = GlobalData.global;
    const today = new Date();
    const day = today.getDate();
    const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
    const remain = lastDay - day || 1;
    
    const currentRev = g.nom_undue + g.nom_current;
    const target97 = (g.total_nominal_mc || 1) * 0.97;
    const velocity = currentRev / day;
    const projection = velocity * lastDay;
    const gapTo97 = Math.max(0, target97 - currentRev);
    const dailyNeed = gapTo97 / remain;
    const reliability = (projection / target97) * 100;

    // UI Bindings
    document.getElementById('stat-projected-nominal').innerText = toIDR(projection);
    document.getElementById('stat-total-progress').innerText = ((currentRev / target97) * 100).toFixed(1) + '%';
    document.getElementById('progress-bar-97').style.width = Math.min(100, (currentRev / target97) * 100) + '%';
    document.getElementById('ai-daily-need').innerText = toIDR(dailyNeed);
    document.getElementById('ai-gap').innerText = toIDR(gapTo97);
    document.getElementById('ai-reliability').innerText = Math.min(100, reliability).toFixed(1) + '%';

    // Trend Indicator
    const trendEl = document.getElementById('ai-prediction-trend');
    if (reliability >= 100) {
        trendEl.innerHTML = '<span class="text-success fw-bold"><i class="fas fa-caret-up"></i> ON TRACK (SECURE)</span>';
    } else {
        trendEl.innerHTML = `<span class="text-danger fw-bold"><i class="fas fa-caret-down"></i> BELOW TARGET (GAP: ${toIDR(gapTo97)})</span>`;
    }
}

// 4. Render Field Audit (The Cards)
function renderAuditView() {
    const container = document.getElementById('officer-container-master');
    const sorted = [...GlobalData.officers].sort((a, b) => b.total_nominal - a.total_nominal);
    
    container.innerHTML = sorted.map((l, index) => {
        let moodColor = l.riskLevel === 'CRITICAL' ? '#ef4444' : l.riskLevel === 'STABLE' ? '#f59e0b' : '#10b981';
        let moodIcon = l.riskLevel === 'CRITICAL' ? 'fa-face-angry' : l.riskLevel === 'STABLE' ? 'fa-face-meh' : 'fa-face-smile-beam';

        return `
        <div class="glass-card p-3 mb-3 animate__animated animate__fadeInUp" style="border-left: 5px solid ${moodColor}">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="d-flex align-items-center">
                    <div class="rounded-circle d-flex align-items-center justify-content-center me-3" style="width:45px; height:45px; background:${moodColor}20">
                        <i class="fas ${moodIcon}" style="color:${moodColor}; font-size: 1.2rem;"></i>
                    </div>
                    <div>
                        <h6 class="fw-bold mb-0" style="font-size: 0.9rem;">${l.petugas}</h6>
                        <span class="custom-badge" style="background:${moodColor}20; color:${moodColor}">${l.riskLevel}</span>
                    </div>
                </div>
                <div class="text-end">
                    <div class="fw-bold text-dark" style="font-size: 0.8rem;">${toIDR(l.total_nominal)}</div>
                    <small class="text-muted" style="font-size: 0.6rem;">${l.jml_bayar} Lunas / ${l.total_dijalan} Data</small>
                </div>
            </div>

            <div class="progress mb-3" style="height: 6px; border-radius: 10px; background: rgba(0,0,0,0.05);">
                <div class="progress-bar" style="width: ${l.successRate}%; background: ${moodColor}; border-radius: 10px;"></div>
            </div>

            <div class="terminal-box mb-3">
                <span class="text-white-50">SAMSUL-AI@COMMAND:~$</span> 
                <span class="haji-quote" data-officer="${l.petugas}">${generateHajiComment(l)}</span>
            </div>

            <div class="d-flex justify-content-between">
                <button class="btn btn-sm btn-light btn-action fw-bold px-3" onclick="showOfficerDetail('${l.petugas}')">
                    <i class="fas fa-microscope me-1"></i> ANALYZE
                </button>
                <div class="d-flex align-items-center">
                    <i class="fas fa-bolt text-warning me-1" style="font-size: 0.7rem;"></i>
                    <small class="fw-bold" style="font-size: 0.65rem;">Fatigue: ${l.fatigueScore}</small>
                </div>
            </div>
        </div>
        `;
    }).join('');
}

// 5. Haji Samsul's Intelligent Comment Generator
function generateHajiComment(l) {
    if (l.successRate >= 90) return "MasyaAllah, ente emang andalan Haji! Rapi bener kerjenye. Jage stamina!";
    if (l.successRate >= 70) return "Cakep, pertahanin ritmenye. Dikit lagi nembus target ijo.";
    if (l.fatigueScore === 'HIGH') return "Haji liat ente muter mulu tapi kage ade hasil. Istirahat dulu, eval rute ente besok subuh!";
    if (l.riskLevel === 'CRITICAL') return "Astagfirullah, ente narik ape maen layangan? Target jauh bener! Besok Haji tunggu laporan detail rute ente.";
    return "Sabar dikit ngadepin orang, yang penting janji bayar cair.";
}

// 6. Strategic View (Charts & Advanced Logs)
function renderStrategicView() {
    const logContainer = document.getElementById('ai-logs-container');
    const logs = [];
    
    // Anomaly Detection
    const criticals = GlobalData.officers.filter(o => o.riskLevel === 'CRITICAL');
    if (criticals.length > 0) {
        logs.push(`<div class="mb-2"><span class="badge bg-danger">ANOMALY</span> <small>Terdeteksi ${criticals.length} petugas di zona kritis penagihan.</small></div>`);
    }

    const elites = GlobalData.officers.filter(o => o.riskLevel === 'ELITE');
    if (elites.length > 0) {
        logs.push(`<div class="mb-2"><span class="badge bg-success">EFFICIENCY</span> <small>${elites.length} petugas mencapai efisiensi kunjungan di atas 80%.</small></div>`);
    }

    logContainer.innerHTML = logs.join('') || '<small class="text-muted">No anomalies detected in last 24h.</small>';
    
    updateTeamChart();
}

function updateTeamChart() {
    const ctx = document.getElementById('teamChart').getContext('2d');
    const labels = GlobalData.officers.map(o => o.petugas.split(' ')[0]);
    const values = GlobalData.officers.map(o => o.successRate);

    if (TeamChartInstance) TeamChartInstance.destroy();

    TeamChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: 'Success Rate (%)',
                data: values,
                borderColor: '#3b82f6',
                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                fill: true,
                tension: 0.4,
                pointRadius: 5,
                pointBackgroundColor: '#3b82f6'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, max: 100, grid: { display: false } },
                x: { grid: { display: false } }
            }
        }
    });
}

// 7. Modal Detail Logic
function showOfficerDetail(name) {
    const l = GlobalData.officers.find(o => o.petugas === name);
    const modal = new bootstrap.Modal(document.getElementById('officerModal'));
    const content = document.getElementById('officer-modal-content');

    content.innerHTML = `
        <div class="text-center mb-4">
            <h5 class="fw-bold mb-1">${l.petugas}</h5>
            <p class="text-muted small">ID: ${Math.random().toString(36).substr(2, 9).toUpperCase()}</p>
        </div>
        <div class="row g-3 mb-4 text-center">
            <div class="col-6">
                <div class="p-2 border rounded-4">
                    <small class="d-block text-muted" style="font-size:0.6rem">Avg Settlement</small>
                    <span class="fw-bold">${toIDR(l.avgBayar)}</span>
                </div>
            </div>
            <div class="col-6">
                <div class="p-2 border rounded-4">
                    <small class="d-block text-muted" style="font-size:0.6rem">Success Rate</small>
                    <span class="fw-bold">${l.successRate.toFixed(1)}%</span>
                </div>
            </div>
        </div>
        <div class="mb-4">
            <h6 class="fw-bold small mb-2">Haji Samsul's Verdict:</h6>
            <div class="p-3 bg-light rounded-4 italic" style="font-size: 0.75rem; border-left: 4px solid var(--samsul-accent);">
                "${generateHajiComment(l)}"
            </div>
        </div>
        <button class="btn btn-primary w-100 py-3 rounded-4 fw-bold" data-bs-dismiss="modal">CLOSE AUDIT REPORT</button>
    `;
    
    modal.show();
}

// Global Event Listeners
document.addEventListener('DOMContentLoaded', runNeuralScan);

</script>
{% endblock %}
