{% extends "base.html" %}

{% block content %}
<div class="animate__animated animate__fadeIn px-2 pb-5" style="background: #f0f3f7; min-height: 100vh;">
    <div class="pt-4 mb-3 d-flex justify-content-between align-items-center">
        <div>
            <h4 class="fw-bold mb-0 text-dark">Pusat Komando H. Samsul 🎖️</h4>
            <div id="haji-mood-status" class="small fw-bold"></div>
        </div>
        <button onclick="loadDashboardData()" class="btn btn-white shadow-sm rounded-circle p-2 border-0">
            <i class="fas fa-sync-alt text-primary" id="sync-icon"></i>
        </button>
    </div>

    <div class="card border-0 shadow-lg mb-4 rounded-5 overflow-hidden text-white shadow-primary" id="main-panel-bg" style="transition: all 0.5s ease;">
        <div class="card-body p-4 text-center">
            <small class="text-white-50 fw-bold text-uppercase" style="letter-spacing: 2px;">Estimasi Capaian Akhir Bulan</small>
            <h1 class="fw-bold mb-0" id="stat-projected-nominal" style="font-size: 2.2rem;">Rp 0</h1>
            
            <div class="progress my-3 bg-white bg-opacity-10" style="height: 15px; border-radius: 30px;">
                <div id="progress-bar-97" class="progress-bar bg-warning progress-bar-striped progress-bar-animated" style="width: 0%"></div>
            </div>
            
            <div class="d-flex justify-content-between small px-1 fw-bold">
                <span>Capaian: <span id="stat-total-progress" class="text-warning">0%</span></span>
                <span>TARGET MUTLAK: 97%</span>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 mb-4 bg-white">
        <div class="card-body p-3">
            <div class="d-flex align-items-center mb-3">
                <div class="bg-dark p-2 rounded-3 me-3"><i class="fas fa-scroll text-warning"></i></div>
                <h6 class="fw-bold mb-0">Planing & Misi Haji Samsul</h6>
            </div>
            <div class="row g-2">
                <div class="col-12 mb-2">
                    <div class="p-3 bg-light rounded-4 border-start border-danger border-4">
                        <small class="fw-bold d-block text-danger mb-1" style="font-size: 0.6rem;"><i class="fas fa-bolt me-1"></i> MISI HARIAN (BESOK):</small>
                        <p id="haji-plan-besok" class="mb-0 text-dark fw-bold" style="font-size: 0.75rem; line-height: 1.3;"></p>
                    </div>
                </div>
                <div class="col-12">
                    <div class="p-3 bg-light rounded-4 border-start border-primary border-4">
                        <small class="fw-bold d-block text-primary mb-1" style="font-size: 0.6rem;"><i class="fas fa-calendar-alt me-1"></i> MISI MINGGUAN (SIKAT GAP):</small>
                        <p id="haji-plan-minggu" class="mb-0 text-dark" style="font-size: 0.75rem; line-height: 1.3;"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <h6 class="fw-bold mb-3 px-1 text-dark">Instruksi Khusus Per Anak Buah 🏆</h6>
    <div id="table-leaderboard" class="mb-5"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
let rawOfficers = [];
const toIDR = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(n);

async function loadDashboardData() {
    const icon = document.getElementById('sync-icon');
    icon.classList.add('fa-spin');
    try {
        const res = await fetch('/api/performance/full-stats');
        const data = await res.json();
        rawOfficers = data.officers.map(off => ({
            ...off,
            success_rate: ((off.jml_bayar / off.total_dijalan) * 100) || 0
        }));
        
        processSamsulLogic(data);
        renderLeaderboard();
    } catch (e) { console.error("Samsul Logic Error:", e); }
    finally { setTimeout(() => icon.classList.remove('fa-spin'), 600); }
}

function processSamsulLogic(data) {
    const g = data.global;
    const today = new Date();
    const day = today.getDate();
    const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
    const remain = (lastDay - day) || 1;
    
    const currentRev = g.nom_undue + g.nom_current;
    const target97 = (g.total_nominal_mc || 1) * 0.97;
    const velocity = currentRev / day;
    const projection = velocity * lastDay;
    const prob97 = (projection / target97) * 100;
    const gapTo97 = Math.max(0, target97 - currentRev);
    const dailyNeed = gapTo97 / remain;

    // UI Updates
    document.getElementById('stat-projected-nominal').innerText = toIDR(projection);
    document.getElementById('stat-total-progress').innerText = ((currentRev / target97) * 100).toFixed(1) + '%';
    document.getElementById('progress-bar-97').style.width = ((currentRev / target97) * 100) + '%';

    // Logika Mood & Panel
    const moodEl = document.getElementById('haji-mood-status');
    const panelBg = document.getElementById('main-panel-bg');
    const planBesok = document.getElementById('haji-plan-besok');
    const planMinggu = document.getElementById('haji-plan-minggu');

    if (prob97 < 90) {
        moodEl.innerHTML = '<i class="fas fa-angry"></i> Mood: HAJI LAGI MURKA!';
        moodEl.className = "small fw-bold text-danger animate__animated animate__flash animate__infinite";
        panelBg.style.background = "linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%)";
        planBesok.innerHTML = `"Gawat! Besok kaga ada alasan, semua kudu setor minimal <b>${toIDR(dailyNeed)}</b>. Yang punya janji bayar tongkrongin ampe cair, jangan banyakan udud!"`;
        planMinggu.innerHTML = `"Minggu ini kita lagi 'Darurat 97%'. Sisa gap <b>${toIDR(gapTo97)}</b> kudu dikebut. Kalo kaga tembus, Haji kaga mau tau, bonus bulan ini wassalam!"`;
    } else {
        moodEl.innerHTML = '<i class="fas fa-smile-beam"></i> Mood: HAJI LAGI ADEM';
        moodEl.className = "small fw-bold text-success";
        panelBg.style.background = "linear-gradient(135deg, #1e293b 0%, #0f172a 100%)";
        planBesok.innerHTML = `"Besok santai tapi pasti, target harian tim <b>${toIDR(dailyNeed)}</b> biar aman ampe garis finish. Jaga ritme, jangan ampe kendor!"`;
        planMinggu.innerHTML = `"Minggu ini rapihin data sisa <b>${toIDR(gapTo97)}</b>. Fokus ke pelanggan nominal gede biar misi 97% cepet beres!"`;
    }
}

function renderLeaderboard() {
    const container = document.getElementById('table-leaderboard');
    const sorted = [...rawOfficers].sort((a, b) => b.jml_bayar - a.jml_bayar);

    container.innerHTML = sorted.map((l, index) => {
        let pToday = "", pBesok = "", pMingguan = "", moodColor = "bg-primary", wejangan = "", stratIndividu = "";

        if (l.success_rate >= 80) {
            pToday = "Amanin setoran cair."; pBesok = "Sikat nominal gede."; pMingguan = "Backup rute loyo.";
            wejangan = "Cakep! Ente emang anak emas Haji.";
            stratIndividu = "Pertahanin pola kunjungan pagi, itu kunci ente dapet lunas banyak. Besok bantu wilayah temen lo yang macet.";
            moodColor = "bg-success";
        } else if (l.success_rate >= 45) {
            pToday = "Kejar janji bayar."; pBesok = "Revisit rumah kosong."; pMingguan = "Target 50 lunas.";
            wejangan = "Nanggung bener! Dikit lagi ijo ini.";
            stratIndividu = "Coba ubah jam kunjungan ke sore hari pas orang baru balik kerja. Sisa data Janji Bayar sikat besok pagi!";
            moodColor = "bg-warning text-dark";
        } else {
            pToday = "Lapor ke Haji!"; pBesok = "Mapping rute ulang."; pMingguan = "Evaluasi total.";
            wejangan = "Busyet, kerja ape maen layangan?!";
            stratIndividu = "Haji curiga ente cuma lewat doang kaga ngetok pintu. Besok Haji mau bukti foto depan rumah pelanggan!";
            moodColor = "bg-danger";
        }

        return `
        <div class="card mb-3 border-0 shadow-sm rounded-4 bg-white overflow-hidden animate__animated animate__fadeInUp">
            <div class="card-body p-3">
                <div class="d-flex align-items-center mb-3">
                    <div class="${moodColor} text-white rounded-circle me-3 fw-bold d-flex align-items-center justify-content-center shadow-sm" style="min-width:35px; height:35px; font-size:0.9rem;">
                        ${index + 1}
                    </div>
                    <div class="flex-grow-1">
                        <h6 class="fw-bold mb-0 small">${l.petugas}</h6>
                        <small class="text-muted" style="font-size: 0.6rem;">Rate: <b>${l.success_rate.toFixed(1)}%</b></small>
                    </div>
                    <div class="text-end">
                        <div class="fw-bold text-dark small">${l.jml_bayar} <small class="text-muted">Lns</small></div>
                        <div class="text-primary fw-bold" style="font-size: 0.65rem;">${toIDR(l.total_nominal)}</div>
                    </div>
                </div>

                <div class="row g-1 mb-2">
                    <div class="col-4">
                        <div class="p-2 bg-light rounded-3 h-100 border-top border-primary border-3">
                            <small class="fw-bold d-block text-primary" style="font-size: 0.5rem;">HARI INI:</small>
                            <p class="mb-0 text-dark" style="font-size: 0.55rem; line-height: 1.1;">${pToday}</p>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="p-2 bg-light rounded-3 h-100 border-top border-danger border-3">
                            <small class="fw-bold d-block text-danger" style="font-size: 0.5rem;">BESOK:</small>
                            <p class="mb-0 text-dark" style="font-size: 0.55rem; line-height: 1.1;">${pBesok}</p>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="p-2 bg-light rounded-3 h-100 border-top border-info border-3">
                            <small class="fw-bold d-block text-info" style="font-size: 0.5rem;">MINGGUAN:</small>
                            <p class="mb-0 text-dark" style="font-size: 0.55rem; line-height: 1.1;">${pMingguan}</p>
                        </div>
                    </div>
                </div>

                <div class="p-2 bg-dark rounded-3 border-start border-warning border-3 mb-1">
                    <small class="d-block text-warning fw-bold mb-1" style="font-size: 0.5rem;">ARAHAN TAKTIS HAJI SAMSUL:</small>
                    <p class="mb-0 text-white" style="font-size: 0.65rem; line-height: 1.2; font-style: italic;">"${stratIndividu}"</p>
                </div>
                <div class="text-end px-1">
                    <small class="text-muted" style="font-size: 0.6rem; font-style: italic;">"${wejangan}"</small>
                </div>
            </div>
        </div>
    `}).join('');
}

document.addEventListener('DOMContentLoaded', loadDashboardData);
</script>

<style>
    body { font-family: 'Inter', sans-serif; background: #f0f3f7; }
    .rounded-5 { border-radius: 1.5rem !important; }
    .progress-bar { transition: width 1s ease; }
    .card { border: none !important; }
</style>
{% endblock %}
