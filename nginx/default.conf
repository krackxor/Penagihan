server {
    listen 80;
    # Gunakan '_' agar Nginx menerima koneksi dari IP VPS mana pun
    server_name _; 

    # 1. Jalur Tanpa Batas: Mendukung upload 1 Juta Pelanggan (1GB+)
    client_max_body_size 0; 

    # 2. Nafas Panjang: Menghindari '504 Gateway Timeout' saat memproses data besar
    proxy_read_timeout 1800;
    proxy_connect_timeout 1800;
    proxy_send_timeout 1800;

    location / {
        proxy_pass http://sinergi-app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mencegah Nginx memutus koneksi saat Bos sedang streaming upload 1GB
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 3. Akses Foto Kunjungan: Langsung dari disk tanpa membebani Flask
    location /static/uploads/ {
        alias /app/static/uploads/;
        # Cache foto di HP petugas selama 30 hari agar kuota hemat dan loading cepat
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
