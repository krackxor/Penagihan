server {
    listen 80;
    client_max_body_size 1G; # Batas upload besar [cite: 1705]

    location / {
        proxy_pass http://sinergi-app:5000;
        proxy_set_header Host $host;
        proxy_read_timeout 1800; # Tunggu hingga 30 menit
        proxy_connect_timeout 1800;
    }

    # Amankan file statis
    location /static/ {
        alias /app/static/;
    }
}
