version: '3.8'

services:
  # 1. DATABASE POSTGRESQL (Arsitektur V18 - JSONB Optimized)
  db:
    image: postgres:15-alpine
    container_name: sinergi_v18_db
    environment:
      - POSTGRES_USER=admin_sinergi
      - POSTGRES_PASSWORD=pamjaya2026
      - POSTGRES_DB=sinergi_db
    volumes:
      # Data tetap aman di folder lokal meskipun docker di-reset
      - ./postgres_data:/var/lib/postgresql/data
    restart: always

  # 2. KONTAYNER APLIKASI (Flask Engine V18)
  sinergi-app:
    build: .
    container_name: sinergi_v18_app
    # =================================================================
    # PROTOKOL ANTI COLD START & 502: Tambahkan --preload
    # Memaksa server memuat memori & database sebelum siap menerima file
    # =================================================================
    command: gunicorn --bind 0.0.0.0:5000 app:app --timeout 1800 --workers 3 --preload
    expose:
      - "5000"
    volumes:
      - .:/app 
      - ./instance:/app/instance
      - ./static/uploads:/app/static/uploads
    environment:
      - FLASK_ENV=development 
      - PYTHONUNBUFFERED=1
      # Koneksi internal antar kontainer (menggunakan nama service 'db')
      - DATABASE_URL=postgresql://admin_sinergi:pamjaya2026@db:5432/sinergi_db
    depends_on:
      - db
    restart: always

  # 3. NGINX (Gerbang Utama Sinergi)
  nginx-proxy:
    image: nginx:alpine
    container_name: sinergi_v18_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static/uploads:/app/static/uploads:ro
    depends_on:
      - sinergi-app
    restart: always

  # 4. ADMINER (Visual Database Manager) - AKSES VIA PORT 8080
  adminer:
    image: adminer
    container_name: sinergi_v18_adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Menghubungkan Adminer langsung ke kontainer 'db' secara default
      - ADMINER_DEFAULT_SERVER=db
    depends_on:
      - db
