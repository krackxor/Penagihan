version: '3.8'

services:
  # 1. DATABASE POSTGRESQL (Gratis & Tangguh untuk 1 Juta Data)
  db:
    image: postgres:15-alpine
    container_name: sinergi_v16_db
    environment:
      - POSTGRES_USER=admin_sinergi
      - POSTGRES_PASSWORD=pamjaya2026
      - POSTGRES_DB=sinergi_db
    volumes:
      # Data database disimpan di folder ini agar tidak hilang saat Docker mati
      - ./postgres_data:/var/lib/postgresql/data
    restart: always

  # 2. KONTAYNER APLIKASI (Flask)
  sinergi-app:
    build: .
    container_name: sinergi_v16_app
    # =================================================================
    # INI OBAT ANTI 502: Beri waktu 30 menit (1800s) untuk baca file MC
    # =================================================================
    command: gunicorn --bind 0.0.0.0:5000 app:app --timeout 1800 --workers 3
    expose:
      - "5000"
    volumes:
      - .:/app 
      - ./instance:/app/instance
      - ./static/uploads:/app/static/uploads
    environment:
      - FLASK_ENV=development 
      - PYTHONUNBUFFERED=1
      # ALAMAT KONEKSI: Menyambungkan Flask ke kontainer 'db' di atas
      - DATABASE_URL=postgresql://admin_sinergi:pamjaya2026@db:5432/sinergi_db
    depends_on:
      - db
    restart: always

  # 3. NGINX (Pintu Depan)
  nginx-proxy:
    image: nginx:alpine
    container_name: sinergi_v16_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static/uploads:/app/static/uploads:ro
    depends_on:
      - sinergi-app
    restart: always
