version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_PASSWORD=pamjaya2026
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine

  sinergi-app:
    build: .
    environment:
      - DATABASE_URL=postgresql://postgres:pamjaya2026@db:5432/postgres
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A app.celery worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:pamjaya2026@db:5432/postgres
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis

  nginx-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sinergi-app
